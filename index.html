async function updateServerStatuses(rows) {
  if (!rows || !rows.length) return;
  const promises = rows.map(async (s) => {
    try {
      const d = await api(`/servers/${s.id}/status`);
      const status = d.status?.status || "unknown";
      s.status = status;
      s.uptime = d.status?.uptime || 0;
      const el = $(`#server-status-${s.id}`);
      if (el) {
        if (s.is_suspended) {
          el.innerHTML = `<i class="dot suspended"></i><span style="color:#f59e0b;font-weight:700">Suspended</span>`;
        } else {
          const isRunning = status === "running";
          const isStopped = status === "stopped";
          const dotClass = isRunning ? "running" : (isStopped ? "stopped" : "");
          const statusText = isRunning ? "Running" : (isStopped ? "Stopped" : status);
          const statusColor = isRunning ? "var(--green)" : (isStopped ? "var(--red)" : "var(--muted)");
          el.innerHTML = `<i class="dot ${dotClass}"></i><span style="color:${statusColor};font-weight:600;text-transform:capitalize">${statusText}</span>`;
        }
      }
    } catch {}
  });
  await Promise.all(promises);
}

function filterServers(servers) {
  return servers.filter(s => {
    if (state.vpsFilterType === "running" && (s.status !== "running" || s.is_suspended)) return false;
    if (state.vpsFilterType === "stopped" && s.status !== "stopped") return false;
    if (state.vpsFilterType === "suspended" && !s.is_suspended) return false;
    if (state.vpsFilterType === "expired" && (!s.is_expired && (!s.expires_at || new Date(s.expires_at).getTime() > Date.now()))) return false;
    if (state.vpsFilterType === "qemu" && s.type !== "qemu") return false;
    if (state.vpsFilterType === "lxc" && s.type !== "lxc") return false;
    if (state.vpsSearchQuery) {
      const q = state.vpsSearchQuery.toLowerCase();
      const matchName = (s.name || "").toLowerCase().includes(q);
      const matchVmid = String(s.vmid || "").includes(q);
      const matchNode = (s.pve_node || s.node_name || "").toLowerCase().includes(q);
      const matchOwner = (s.username || "").toLowerCase().includes(q);
      if (!matchName && !matchVmid && !matchNode && !matchOwner) return false;
    }
    return true;
  });
}

function setupVpsFilterEvents(allServers) {
  const searchInput = $("#vpsSearchInput");
  const chips = $("#vpsFilterChips");
  const container = $("#serverCardsContainer");
  const apply = () => {
    const filtered = filterServers(allServers);
    if (container) container.innerHTML = serverCards(filtered);
    updateServerStatuses(filtered);
  };
  if (searchInput) {
    searchInput.oninput = () => {
      state.vpsSearchQuery = searchInput.value.trim();
      apply();
    };
  }
  if (chips) {
    chips.querySelectorAll("[data-vps-filter]").forEach(btn => {
      btn.onclick = () => {
        state.vpsFilterType = btn.dataset.vpsFilter;
        chips.querySelectorAll("[data-vps-filter]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        apply();
      };
    });
  }
}

async function serversPage(c) {
  const d = await api("/dashboard");
  state.servers = d.servers;
  const suspendedCount = d.servers.filter(x => x.is_suspended).length;
  c.innerHTML = `<div class="page-head"><div><h1>Virtual servers</h1><p>All VPS instances assigned to ${state.user.role === "admin" ? "your platform" : "your account"}.</p></div><div style="display:flex;gap:8px">${state.user.role === "admin" ? `<button class="btn primary" data-page="create-vps">${ico("zap")} Create VPS</button>` : ''}<button class="btn ghost" data-action="refresh">${ico("refresh")} Refresh</button></div></div><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px"><div style="display:flex;align-items:center;gap:10px;flex:1;min-width:260px"><input type="text" id="vpsSearchInput" value="${esc(state.vpsSearchQuery)}" placeholder="Search servers by name, VMID, node, or owner…" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:#fff;font-size:13px;width:100%"></div><div id="vpsFilterChips" style="display:flex;gap:6px;flex-wrap:wrap"><button class="preset-chip ${state.vpsFilterType === 'all' ? 'active' : ''}" data-vps-filter="all">All (${d.servers.length})</button><button class="preset-chip ${state.vpsFilterType === 'running' ? 'active' : ''}" data-vps-filter="running">${ico("statusDot", "sm", "color:var(--green)")} Running</button><button class="preset-chip ${state.vpsFilterType === 'stopped' ? 'active' : ''}" data-vps-filter="stopped">${ico("statusDot", "sm", "color:var(--red)")} Stopped</button><button class="preset-chip ${state.vpsFilterType === 'suspended' ? 'active' : ''}" data-vps-filter="suspended">${ico("lock", "sm", "color:#f59e0b")} Suspended (${suspendedCount})</button><button class="preset-chip ${state.vpsFilterType === 'expired' ? 'active' : ''}" data-vps-filter="expired">${ico("clock", "sm", "color:#ef4444")} Expired (${d.servers.filter(x => x.is_expired || (x.expires_at && new Date(x.expires_at).getTime() <= Date.now())).length})</button><button class="preset-chip ${state.vpsFilterType === 'qemu' ? 'active' : ''}" data-vps-filter="qemu">${ico("kvm", "sm")} KVM</button><button class="preset-chip ${state.vpsFilterType === 'lxc' ? 'active' : ''}" data-vps-filter="lxc">${ico("lxc", "sm")} LXC</button></div></div><div id="serverCardsContainer">${serverCards(filterServers(d.servers))}</div>`;
  updateServerStatuses(d.servers);
  setupVpsFilterEvents(d.servers);
}

async function openServer(id) {
  state.currentServerId = id;
  state.page = "vps";
  state.vpsTab = state.vpsTab || "specs";
  if (liveSocket) {
    liveSocket.emit("subscribe_vps", { id });
  }
  await renderPage();
}

async function vpsDashboardPage(c) {
  const id = state.currentServerId;
  let s = (state.servers || []).find(x => x.id === id);
  if (!s) {
    try { const d = await api("/dashboard"); state.servers = d.servers; s = (state.servers || []).find(x => x.id === id); } catch {}
  }
  if (!s) {
    c.innerHTML = `<div class="panel"><div class="empty">VPS #${id} not found. <br><br><button class="btn" data-action="back-servers">${ico("arrowLeft")} Back to servers</button></div></div>`;
    return;
  }
  c.innerHTML = `
    <div style="margin-bottom:18px"><button class="btn ghost small" data-action="back-servers">${ico("arrowLeft")} Back to Virtual servers</button></div>
    <div class="panel" style="background:var(--panel2);padding:50px 24px;text-align:center;border-radius:14px;border:1px solid var(--line);box-shadow:0 8px 32px rgba(0,0,0,0.25)">
      <div style="width:52px;height:52px;border-radius:14px;background:rgba(99,102,241,0.14);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px">
        ${ico("refresh", "spin lg")}
      </div>
      <h3 style="margin:0 0 8px;font-size:18px;font-weight:700;color:#fff">Connecting to Proxmox VE Hypervisor…</h3>
      <p class="muted small" style="margin:0 auto 20px;max-width:520px;line-height:1.6">Fetching real-time CPU, RAM, storage disk metrics, and configuration for <b>${esc(s.name)}</b> (VMID ${s.vmid}) directly from cluster node…</p>
      <div class="progress" style="height:4px;max-width:320px;margin:0 auto;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden">
        <div class="progress-bar" style="width:75%;animation:pulse-width 1.5s ease-in-out infinite"></div>
      </div>
    </div>
  `;
  try {
    const [st, cfg, snaps, rrdData] = await Promise.all([
      api(`/servers/${id}/status`),
      api(`/servers/${id}/config`),
      api(`/servers/${id}/snapshots`),
      api(`/servers/${id}/rrd?timeframe=hour`).catch(() => ({ rrd: [] }))
    ]);
    const status = st.status || {}, cData = cfg.config || {}, snapshots = snaps.snapshots || [], rrd = rrdData.rrd || [];
    const isSuspended = !!s.is_suspended;
    const isRunning = !isSuspended && status.status === "running", isStopped = isSuspended || status.status === "stopped", statusText = isSuspended ? "Suspended" : (isRunning ? "Running" : (isStopped ? "Stopped" : (status.status || "Unknown")));
    const cpuPct = status.cpu != null ? (status.cpu * 100).toFixed(1) : "0.0";
    const cpuCores = status.cpus || cData.cores || 1, cpuSockets = cData.sockets || 1, cpuModel = cData.cpu || "host / default";
    const memUsed = status.mem || 0, memMax = status.maxmem || (cData.memory ? cData.memory * 1024 * 1024 : 1);
    const memPct = memMax > 0 ? ((memUsed / memMax) * 100).toFixed(1) : "0.0";
    const memFree = status.freemem || Math.max(0, memMax - memUsed);
    let diskMax = status.maxdisk || 0;
    let primaryDiskKey = s.type === "lxc" ? "rootfs" : "scsi0", primaryDiskVal = "";
    if (s.type === "lxc") {
      primaryDiskVal = cData.rootfs || "";
    } else {
      for (let i = 0; i < 16; i++) {
        for (const p of ["scsi", "sata", "virtio", "ide"]) {
          const v = cData[`${p}${i}`];
          if (v && typeof v === "string" && !v.includes("media=cdrom") && !v.includes("cloudinit") && !v.includes("none")) {
            primaryDiskKey = `${p}${i}`; primaryDiskVal = v; break;
          }
        }
        if (primaryDiskVal) break;
      }
    }
    if (!diskMax && primaryDiskVal) {
      const m = primaryDiskVal.match(/size=([0-9.]+)([GMKT])/i);
      if (m) {
        const n = parseFloat(m[1]), u = m[2].toUpperCase();
        diskMax = u === "M" ? n * 1024 * 1024 : (u === "T" ? n * 1024 * 1024 * 1024 * 1024 : n * 1024 * 1024 * 1024);
      }
    }
    const diskRead = status.diskread || 0, diskWrite = status.diskwrite || 0;
    const netRx = status.netin || 0, netTx = status.netout || 0, nicName = Object.keys(status.nics || {})[0] || `tap${s.vmid}i0`;

    c.innerHTML = `
      <div style="margin-bottom:18px"><button class="btn ghost small" data-action="back-servers">${ico("arrowLeft")} Back to Virtual servers</button></div>
      <div class="vps-head">
        <div class="vps-title-wrap">

            <span class="badge ${isRunning ? 'running' : 'stopped'}" id="vpsTitleStatus" style="${isSuspended ? 'background:rgba(245,158,11,0.2);color:#f59e0b;border:1px solid rgba(245,158,11,0.4);font-weight:700' : ''}">
              ${isSuspended ? ico("lock", "sm") : ico("statusDot", "sm")} ${statusText}
            </span>
            ${isSuspended ? `<span class="badge" style="background:rgba(245,158,11,0.18);color:#f59e0b;border:1px solid rgba(245,158,11,0.4);font-weight:700;padding:3px 10px">${ico("lock", "sm")} SUSPENDED</span>` : ''}
          </div>
          <div class="vps-badges">
            <span class="badge" style="color:var(--accent);font-weight:700">${esc(s.type.toUpperCase())}</span>
            <span class="badge">VMID ${s.vmid}</span>
            <span class="badge">Node: ${esc(s.pve_node || s.node_name)}</span>
            ${!isSuspended ? `<span class="badge" id="vpsLiveUptime">${ico("clock", "sm")} Up ${formatUptime(status.uptime)}</span>` : ''}
            ${cData.ostype ? `<span class="badge">OS: ${esc(cData.ostype)}</span>` : ""}
          </div>
        </div>
        <div class="actions" id="vpsHeaderActions">
          <button class="btn ghost" data-action="vps-refresh" data-id="${id}">${ico("refresh")} Refresh</button>
          ${!isSuspended || state.user.role === "admin" ? `<button class="btn" data-action="console-vps" data-id="${id}" style="background:rgba(56,189,248,0.1);color:var(--blue);border:1px solid rgba(56,189,248,0.2);font-weight:600">${ico("monitor")} Console & SSH</button>` : ''}
          ${state.user.role === "admin" ? `<button class="btn" data-action="renew-vps" data-id="${id}" data-name="${esc(s.name)}" style="background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.35);font-weight:700">${ico("refresh")} Renew Plan</button>` : ""}
          ${state.user.role === "admin" ? `<button class="btn" data-action="clone-vps" data-id="${id}" style="background:rgba(168,85,247,0.1);color:var(--purple);border:1px solid rgba(168,85,247,0.2);font-weight:600">${ico("clone")} Clone VPS</button>` : ""}
          ${!isSuspended || state.user.role === "admin" ? `<button class="btn" data-action="edit-vps" data-id="${id}" style="background:rgba(99,102,241,0.1);color:var(--accent);border:1px solid rgba(99,102,241,0.2);font-weight:600">${ico("edit")} Edit VPS</button>` : ''}
          ${!isSuspended ? `<button class="btn danger" data-action="reinstall-vps" data-id="${id}" style="border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.1);color:#fca5a5">${ico("disc")} Reinstall OS</button>` : ''}
          ${state.user.role === "admin" ? `<button class="btn danger" data-action="unassign" data-id="${id}" data-name="${esc(s.name)}" data-vmid="${s.vmid}" style="border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.1);color:#fca5a5" title="Remove assignment from user (keeps Proxmox VM safe)">${ico("ban")} Unassign VPS</button>` : ""}
          ${state.user.role === "admin" ? `<button class="btn danger" data-action="delete-vps" data-id="${id}" data-name="${esc(s.name)}" data-vmid="${s.vmid}" data-node="${esc(s.pve_node || s.node_name)}" data-type="${esc(s.type)}" style="border:1px solid rgba(239,68,68,0.45);background:rgba(239,68,68,0.2);color:#ef4444;font-weight:700" title="Permanently Destroy VM and Purge from Proxmox VE">${ico("trash")} Delete VPS</button>` : ""}
          ${state.user.role === "admin" ? (isSuspended ? `<button class="btn success" data-action="unsuspend-vps" data-id="${id}" data-name="${esc(s.name)}" style="background:rgba(34,197,94,0.18);color:var(--green);border:1px solid rgba(34,197,94,0.4);font-weight:700" title="One-click Unsuspend VPS">${ico("check")} Unsuspend VPS</button>` : `<button class="btn warning" data-action="suspend-vps" data-id="${id}" data-name="${esc(s.name)}" style="background:rgba(245,158,11,0.15);color:#f59e0b;border:1px solid rgba(245,158,11,0.35);font-weight:700" title="One-click Suspend (Powers off VM & locks access)">${ico("lock", "sm")} Suspend VPS</button>`) : (isSuspended ? `<span class="badge" style="background:rgba(245,158,11,0.12);color:#f59e0b;border:1px solid rgba(245,158,11,0.25);font-size:12px;padding:4px 10px">${ico("lock", "sm")} Suspended by Administration</span>` : '')}
          ${!isSuspended ? (isRunning ? `<button class="btn danger" data-action="power" data-id="${id}" data-power="stop">${ico("stop")} Stop</button><button class="btn" data-action="power" data-id="${id}" data-power="shutdown">${ico("pause")} Shutdown</button><button class="btn" data-action="power" data-id="${id}" data-power="reboot">${ico("refresh")} Reboot</button><button class="btn danger" data-action="power" data-id="${id}" data-power="reset">${ico("zap")} Reset</button>` : `<button class="btn success" data-action="power" data-id="${id}" data-power="start">${ico("play")} Start VPS</button>`) : ''}
        </div>
      </div>
      ${isSuspended ? `
        <div style="background:rgba(245,158,11,0.08);border:1.5px solid rgba(245,158,11,0.35);border-radius:12px;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 4px 16px rgba(0,0,0,0.25)">
          <div style="display:flex;align-items:center;gap:14px">
            <div style="width:40px;height:40px;border-radius:10px;background:rgba(245,158,11,0.18);color:#f59e0b;display:flex;align-items:center;justify-content:center;flex-shrink:0">
              ${ico("lock", "lg")}
            </div>
            <div>
              <div style="font-weight:700;color:#fff;font-size:14.5px">Virtual Server is Suspended</div>
              <div class="small muted" style="color:#fcd34d;margin-top:2px;font-size:12px">
                This VPS was suspended by administration${s.suspended_at ? ` on ${new Date(s.suspended_at).toLocaleString()}` : ''}${s.suspend_reason ? ` — <i>"${esc(s.suspend_reason)}"</i>` : ''}. All regular power actions and terminal sessions are locked.
              </div>
            </div>
          </div>
          ${state.user.role === "admin" ? `
            <button class="btn success" data-action="unsuspend-vps" data-id="${id}" data-name="${esc(s.name)}" style="background:rgba(34,197,94,0.18);color:var(--green);border:1px solid rgba(34,197,94,0.4);font-weight:700;flex-shrink:0">
              ${ico("check")} One-Click Unsuspend
            </button>
          ` : ''}
        </div>
      ` : ''}<div class="metric-grid"><div class="metric-card" id="metricCardCpu"><div class="metric-top"><span>CPU LOAD</span><span id="metricCpuTop" style="color:${cpuPct > 80 ? 'var(--red)' : 'var(--accent)'}">${cpuPct}%</span></div><div class="metric-val" id="metricCpuVal">${cpuPct}%</div><div class="metric-sub" id="metricCpuSub">${cpuCores} vCPU (${cpuSockets} socket · ${esc(cpuModel)})</div><div class="progress"><div class="progress-bar" id="metricCpuBar" style="width:${Math.min(100, Math.max(1, cpuPct))}%"></div></div></div><div class="metric-card" id="metricCardRam"><div class="metric-top"><span>MEMORY (RAM)</span><span id="metricRamTop">${memPct}%</span></div><div class="metric-val" id="metricRamVal">${formatBytes(memUsed)}</div><div class="metric-sub" id="metricRamSub">of ${formatBytes(memMax)} (${formatBytes(memFree)} free)</div><div class="progress"><div class="progress-bar green" id="metricRamBar" style="width:${Math.min(100, Math.max(1, memPct))}%"></div></div></div><div class="metric-card" id="metricCardDisk"><div class="metric-top"><span>STORAGE (DISK I/O)</span><span>${formatBytes(diskMax)}</span></div><div class="metric-val" id="metricDiskVal">${formatBytes(diskRead + diskWrite)}</div><div class="metric-sub" id="metricDiskSub">Read: ${formatBytes(diskRead)} · Write: ${formatBytes(diskWrite)}</div><div class="progress"><div class="progress-bar blue" style="width:100%"></div></div></div><div class="metric-card" id="metricCardNet"><div class="metric-top"><span>NETWORK TRAFFIC</span><span>${nicName}</span></div><div class="metric-val" id="metricNetVal">${formatBytes(netRx + netTx)}</div><div class="metric-sub" id="metricNetSub">RX: ${formatBytes(netRx)} · TX: ${formatBytes(netTx)}</div><div class="progress"><div class="progress-bar purple" style="width:100%"></div></div></div></div><div class="tab-nav"><button class="tab-btn ${state.vpsTab === 'specs' ? 'active' : ''}" data-action="vps-tab" data-tab="specs">${ico("monitor")} Hardware & Specs</button><button class="tab-btn ${state.vpsTab === 'edit' ? 'active' : ''}" data-action="vps-tab" data-tab="edit">${ico("edit")} Edit VPS Specs</button><button class="tab-btn ${state.vpsTab === 'backups' ? 'active' : ''}" data-action="vps-tab" data-tab="backups">${ico("backup")} Backups</button><button class="tab-btn ${state.vpsTab === 'performance' ? 'active' : ''}" data-action="vps-tab" data-tab="performance">${ico("chart")} Performance & Live Graphs</button><button class="tab-btn ${state.vpsTab === 'reinstall' ? 'active' : ''}" data-action="vps-tab" data-tab="reinstall">${ico("disc")} Reinstall OS</button><button class="tab-btn ${state.vpsTab === 'snapshots' ? 'active' : ''}" data-action="vps-tab" data-tab="snapshots">${ico("camera")} Snapshots (${snapshots.length})</button><button class="tab-btn ${state.vpsTab === 'config' ? 'active' : ''}" data-action="vps-tab" data-tab="config">${ico("gear")} Proxmox Raw Config</button></div><div id="vpsTabContent">${renderVpsTabContent(s, status, cData, snapshots, rrd)}</div>`;

    c.innerHTML = `<div class="panel"><div class="empty">Error loading VPS details: ${esc(err.message)} <br><br><button class="btn" data-action="back-servers">Go back</button></div></div>`;
    toast(err.message, "error");
  }
}

function renderVpsTabContent(s, status, cData, snapshots, rrd) {
  if (state.vpsTab === "edit") {
    // Use requestAnimationFrame to wait for DOM
    requestAnimationFrame(() => loadEditVpsTab(s.id));
    return `<div class="panel" id="editVpsTabWrap"><div class="empty">Loading current configuration for ${esc(s.name)} (VMID ${s.vmid})…</div></div>`;
  }
  if (state.vpsTab === "backups") {
    requestAnimationFrame(() => loadBackupsTab(s.id));
    return `<div class="panel" id="backupsTabWrap"><div class="empty">Loading Proxmox VZDump backups…</div></div>`;
  }
  if (state.vpsTab === "reinstall") {
    requestAnimationFrame(() => loadReinstallTab(s.id));
    return `<div class="panel" id="reinstallTabWrap"><div class="empty">Loading OS templates and reinstallation options…</div></div>`;
  }
  if (state.vpsTab === "performance") {
    const cpuPts = rrd.map(x => (x.cpu || 0) * 100);
    const memPts = rrd.map(x => ((x.mem || 0) / (x.maxmem || 1)) * 100);
    const netRxPts = rrd.map(x => (x.netin || 0) / 1024);
    const diskWrPts = rrd.map(x => (x.diskwrite || 0) / 1024);
    return `<div class="chart-grid"><div class="chart-box"><div class="chart-header"><h4>CPU Load History (%)</h4><span class="small muted">Past hour · Cores: ${status.cpus || cData.cores || 1}</span></div>${sparklineSVG(cpuPts, 480, 110, "#6366f1")}</div><div class="chart-box"><div class="chart-header"><h4>Memory Usage History (%)</h4><span class="small muted">Total: ${formatBytes(status.maxmem)}</span></div>${sparklineSVG(memPts, 480, 110, "#22c55e")}</div><div class="chart-box"><div class="chart-header"><h4>Network Traffic Rate (KB/s)</h4><span class="small muted">RX (Inbound) rate</span></div>${sparklineSVG(netRxPts, 480, 110, "#38bdf8")}</div><div class="chart-box"><div class="chart-header"><h4>Disk Write Throughput (KB/s)</h4><span class="small muted">Storage writes</span></div>${sparklineSVG(diskWrPts, 480, 110, "#a855f7")}</div></div>`;
  }
  if (state.vpsTab === "snapshots") {
    return `<div class="panel"><div class="panel-title"><h3>VPS Snapshots</h3><button class="btn primary small" data-action="snapshot" data-id="${s.id}">${ico("plus")} Create Snapshot</button></div><div class="table-wrap"><table><thead><tr><th>NAME</th><th>DESCRIPTION</th><th>DATE & TIME</th><th>STATUS</th><th>ACTIONS</th></tr></thead><tbody>${snapshots.map(x => `<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.description || "—")}</td><td>${x.snaptime ? new Date(x.snaptime * 1000).toLocaleString() : "—"}</td><td>${x.running ? '<span style="color:var(--green)">Live RAM</span>' : 'Disk only'}</td><td>${x.name !== "current" ? `<button class="btn small" data-action="snapshot-rollback" data-id="${s.id}" data-snap="${esc(x.name)}">Rollback</button>` : '<span class="muted small">—</span>'}</td></tr>`).join("") || '<tr><td colspan="5" class="empty">No snapshots found for this VPS.</td></tr>'}</tbody></table></div></div>`;
  }
  if (state.vpsTab === "config") {
    const entries = Object.entries(cData);
    // Use requestAnimationFrame for the search listener
    requestAnimationFrame(() => {
      const searchInput = $("#configSearchInput");
      if (searchInput) {
        searchInput.oninput = () => {
          const q = searchInput.value.toLowerCase().trim();
          $$(".config-row").forEach(r => {
            const k = r.dataset.key || "";
            r.style.display = k.includes(q) ? "" : "none";
          });
        };
      }
    });
    return `<div class="panel"><div class="panel-title"><div><h3>All Proxmox Configuration Parameters</h3><p class="muted small" style="margin:2px 0 0">${entries.length} raw configuration key-value pairs</p></div><input type="text" id="configSearchInput" placeholder="Filter keys (e.g. net, cpu, scsi)…" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 14px;color:#fff;font-size:12px;width:260px"></div><div class="table-wrap"><table><thead><tr><th>PARAMETER / KEY</th><th>VALUE</th></tr></thead><tbody id="configTableBody">${entries.map(([k, v]) => `<tr class="config-row" data-key="${esc(k.toLowerCase())}"><td style="font-family:'Space Grotesk',monospace;color:var(--accent)">${esc(k)}</td><td style="font-family:'Space Grotesk',monospace;font-weight:600">${esc(typeof v === "object" ? JSON.stringify(v) : v)}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  const primaryDiskKey = s.type === "lxc" ? "rootfs" : "scsi0";
  const blockscsi = status.blockstat?.[primaryDiskKey] || status.blockstat?.scsi0 || status.blockstat?.sata0 || status.blockstat?.virtio0 || {};
  let primaryDiskVal = s.type === "lxc" ? (cData.rootfs || "") : (cData.scsi0 || "");

}</span></div></div><div class="spec-box"><h4>${ico("backup")} Storage & Disks</h4><div class="spec-row"><span class="k">Boot Drive (${esc(primaryDiskKey)})</span><span class="v" style="font-family:'Space Grotesk',monospace;font-size:12px">${esc(primaryDiskVal || "—")}</span></div><div class="spec-row"><span class="k">Disk Controller</span><span class="v">${esc(cData.scsihw || "virtio-scsi-single")}</span></div><div class="spec-row"><span class="k">Boot Sequence</span><span class="v">${esc(cData.boot || "scsi0; net0")}</span></div><div class="spec-row"><span class="k">Total Provisioned Disk</span><span class="v">${status.maxdisk ? formatBytes(status.maxdisk) : "—"}</span></div><div class="spec-row"><span class="k">Total Disk Read</span><span class="v">${formatBytes(status.diskread)}</span></div><div class="spec-row"><span class="k">Total Disk Written</span><span class="v">${formatBytes(status.diskwrite)}</span></div><div class="spec-row"><span class="k">Read Operations (IOPS)</span><span class="v">${blockscsi.rd_operations ? blockscsi.rd_operations.toLocaleString() : "—"}</span></div><div class="spec-row"><span class="k">Write Operations (IOPS)</span><span class="v">${blockscsi.wr_operations ? blockscsi.wr_operations.toLocaleString() : "—"}</span></div></div><div class="spec-box"><h4>${ico("network")} Network & Identity</h4><div class="spec-row"><span class="k">Network Adapter (net0)</span><span class="v" style="font-family:'Space Grotesk',monospace;font-size:12px">${esc(cData.net0 || "—")}</span></div><div class="spec-row"><span class="k">Hardware MAC Address</span><span class="v" style="font-family:'Space Grotesk',monospace">${cData.net0 ? (cData.net0.match(/(?:virtio|hwaddr|macaddr)=([A-Fa-f0-9:]+)/)?.[1] || "—") : "—"}</span></div><div class="spec-row"><span class="k">Virtual Bridge</span><span class="v">${cData.net0 ? (cData.net0.match(/bridge=([^,]+)/)?.[1] || "—") : "—"}</span></div><div class="spec-row"><span class="k">Host Interface</span><span class="v">${Object.keys(status.nics || {}).join(", ") || `tap${s.vmid}i0`}</span></div><div class="spec-row"><span class="k">Total Received (RX)</span><span class="v" style="color:var(--blue)">${formatBytes(status.netin)}</span></div><div class="spec-row"><span class="k">Total Transmitted (TX)</span><span class="v" style="color:var(--accent)">${formatBytes(status.netout)}</span></div><div class="spec-row"><span class="k">Proxmox PVE Node</span><span class="v">${esc(s.pve_node || s.node_name)}</span></div><div class="spec-row"><span class="k">SMBIOS UUID</span><span class="v" style="font-size:11px;font-family:'Space Grotesk',monospace">${esc(cData.smbios1 ? cData.smbios1.replace("uuid=", "") : "—")}</span></div></div></div>`;

async function serverAction(id, action) {
  const s = (state.servers || []).find(x => x.id === id) || { id, name: "VPS", vmid: "" };
  const act = String(action).toLowerCase();
  const isDestructive = act === "stop" || act === "reset";
  const actIcons = {
    start: "play",
    stop: "stop",
    shutdown: "stop",
    reboot: "refresh",
    reset: "refresh"
  };
  const actColors = {
    start: "primary",
    shutdown: "warning",
    stop: "danger",
    reboot: "warning",
    reset: "danger"
  };
  const ok = await modalConfirm({
    title: `${action.toUpperCase()} Virtual Machine`,
    subtitle: `Target: ${s.name} (VMID ${s.vmid || id})`,
    message: isDestructive
      ? `Are you sure you want to forcefully ${action} this virtual machine? Any unsaved data in the guest operating system might be lost.`
      : `Are you sure you want to send a ${action} signal to "${s.name}"?`,
    confirmText: `${action.charAt(0).toUpperCase() + action.slice(1)} VPS`,
    type: actColors[act] || "warning",
    icon: actIcons[act] || "zap"
  });
  if (!ok) return;
  try {
    await api(`/servers/${id}/action`, { method: "POST", body: JSON.stringify({ action }) });
    toast(`Power action "${action}" submitted successfully.`);
    if (state.page === "vps") await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function renewVpsModal(id, name) {
  let s = (state.servers || []).find(x => x.id == id);
  if (!s) {
    try {
      const d = await api("/dashboard");
      state.servers = d.servers;
      s = (state.servers || []).find(x => x.id == id);
    } catch {}
  }
  if (!s) return toast("Virtual server not found.", "error");

  const hasExpiry = Boolean(s.expires_at);
  const currentExp = hasExpiry ? new Date(s.expires_at).toLocaleString() : "Lifetime (Never expires)";
  const isSusp = Boolean(s.is_suspended);

  showModal(`
    <div class="modal-head">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:42px;height:42px;border-radius:10px;background:rgba(34,197,94,0.15);color:var(--green);display:flex;align-items:center;justify-content:center">
          ${ico("refresh", "md")}
        </div>
        <div>
          <h3 style="margin:0;font-size:18px;color:#fff">${hasExpiry ? 'Renew & Extend VPS Plan' : 'Set VPS Expiration Period'}</h3>
          <p class="muted small" style="margin:3px 0 0">Instance: <b>${esc(name || s.name)}</b> (VMID ${s.vmid}) · Node: <b>${esc(s.pve_node || s.node_name)}</b></p>
        </div>
      </div>
      <button type="button" class="close" data-close>&times;</button>
    </div>

    <div style="background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:18px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:12px;font-size:12.5px">
        <div><span class="muted">Current Expiration:</span><br><b style="color:#fff">${esc(currentExp)}</b></div>
        <div><span class="muted">Plan Status:</span><br>${formatExpiryBadge(s)}</div>
        <div><span class="muted">Suspension:</span><br>${isSusp ? `<span style="color:#f59e0b;font-weight:700">${ico("lock", "sm")} Suspended</span>` : `<span style="color:var(--green);font-weight:700">${ico("check", "sm")} Active</span>`}</div>
        <div><span class="muted">Assigned Owner:</span><br><b style="color:#fff">${esc(s.username || 'Unassigned')}</b></div>
      </div>
    </div>

    <form id="renewVpsForm" style="display:flex;flex-direction:column;gap:18px">
      <div class="field">
        <label style="display:flex;align-items:center;justify-content:space-between">
          <span>Choose Renewal Period / Extension Duration</span>
          <span class="small muted">${hasExpiry ? 'Extends active time' : 'Sets initial expiration'}</span>
        </label>
        <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(105px, 1fr));gap:8px;margin-top:6px">
          <button type="button" class="btn ghost renew-preset-btn active" data-val="30" style="padding:10px 4px;text-align:center;flex-direction:column;gap:3px;border-color:var(--accent);background:rgba(99,102,241,0.12);cursor:pointer">
            <span style="font-size:14px;font-weight:700;color:#fff">+30 Days</span>
            <span class="muted small" style="font-size:10.5px">1 Month</span>
          </button>
          <button type="button" class="btn ghost renew-preset-btn" data-val="7" style="padding:10px 4px;text-align:center;flex-direction:column;gap:3px;cursor:pointer">
            <span style="font-size:14px;font-weight:700;color:#fff">+7 Days</span>
            <span class="muted small" style="font-size:10.5px">1 Week</span>
          </button>
          <button type="button" class="btn ghost renew-preset-btn" data-val="90" style="padding:10px 4px;text-align:center;flex-direction:column;gap:3px;cursor:pointer">
            <span style="font-size:14px;font-weight:700;color:#fff">+90 Days</span>
            <span class="muted small" style="font-size:10.5px">3 Months</span>
          </button>
          <button type="button" class="btn ghost renew-preset-btn" data-val="180" style="padding:10px 4px;text-align:center;flex-direction:column;gap:3px;cursor:pointer">
            <span style="font-size:14px;font-weight:700;color:#fff">+180 Days</span>
            <span class="muted small" style="font-size:10.5px">6 Months</span>
          </button>
          <button type="button" class="btn ghost renew-preset-btn" data-val="365" style="padding:10px 4px;text-align:center;flex-direction:column;gap:3px;cursor:pointer">
            <span style="font-size:14px;font-weight:700;color:#fff">+365 Days</span>
            <span class="muted small" style="font-size:10.5px">1 Year</span>
          </button>
          <button type="button" class="btn ghost renew-preset-btn" data-val="lifetime" style="padding:10px 4px;text-align:center;flex-direction:column;gap:3px;cursor:pointer">
            <span style="font-size:14px;font-weight:700;color:#818cf8">Lifetime</span>
            <span class="muted small" style="font-size:10.5px">No Expiry</span>
          </button>
          <button type="button" class="btn ghost renew-preset-btn" data-val="custom" style="padding:10px 4px;text-align:center;flex-direction:column;gap:3px;cursor:pointer">
            <span style="font-size:14px;font-weight:700;color:#cbd5e1">Custom</span>
            <span class="muted small" style="font-size:10.5px">Specify Days</span>
          </button>
        </div>
      </div>

      <div class="field" id="renewCustomDaysWrap" style="display:none">
        <label>Enter Custom Number of Days (e.g. 14, 45, 60)</label>
        <input type="number" id="renewCustomDaysInput" min="1" max="3650" placeholder="e.g. 45" style="background:#09090b;border:1px solid var(--accent);color:#fff">
        <span class="small muted">Specify the exact number of days to extend this virtual server.</span>
      </div>

      <div class="field">
        <label style="display:flex;align-items:center;justify-content:space-between">
          <span>Or Set Specific Future Expiration Date / Time</span>
          <span class="small muted">Exact timestamp override</span>
        </label>
        <input type="datetime-local" id="renewSpecificDateInput" style="background:#09090b;color:#fff">
        <span class="small muted">If a specific date is selected, it takes priority over the preset duration buttons.</span>
      </div>

      <div style="background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);border-radius:10px;padding:12px 16px">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:#86efac;margin:0">
          <input type="checkbox" id="renewAutoUnsuspendCheck" checked style="width:auto;cursor:pointer">
          <div>
            <b>Automatically Unsuspend VPS & Restore User Access</b>
            <div class="small muted" style="color:#cbd5e1;margin-top:2px">If the VPS is currently suspended, renewing will automatically clear the suspension lock so the user and admin can power it back on immediately.</div>
          </div>
        </label>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px;padding-top:14px;border-top:1px solid var(--line)">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="renewConfirmBtn" style="background:#22c55e;border-color:#16a34a;padding:11px 28px;font-size:13.5px;font-weight:700">
          ${ico("check")} ${hasExpiry ? 'Confirm & Apply Renewal' : 'Confirm & Set Expiration'}
        </button>
      </div>
    </form>
  `);

  let selectedPreset = "30";
  const customWrap = $("#renewCustomDaysWrap");
  const customInput = $("#renewCustomDaysInput");
  const dateInput = $("#renewSpecificDateInput");
  const presetBtns = $$(".renew-preset-btn");

  presetBtns.forEach(btn => {
    btn.onclick = () => {
      presetBtns.forEach(b => {
        b.classList.remove("active");
        b.style.borderColor = "";
        b.style.background = "";
      });
      btn.classList.add("active");
      btn.style.borderColor = "var(--accent)";
      btn.style.background = "rgba(99,102,241,0.12)";
      selectedPreset = btn.dataset.val;

      // Clear specific date override when user clicks a duration preset button
      if (dateInput) dateInput.value = "";

      if (customWrap) {
        if (selectedPreset === "custom") {
          customWrap.style.display = "block";
          if (customInput) { customInput.focus(); }
        } else {
          customWrap.style.display = "none";
        }
      }
    };
  });

  if (dateInput) {
    dateInput.oninput = () => {
      if (dateInput.value) {
        presetBtns.forEach(b => {
          b.classList.remove("active");
          b.style.borderColor = "";
          b.style.background = "";
        });
        if (customWrap) customWrap.style.display = "none";
      }
    };
  }

  const form = $("#renewVpsForm");
  if (form) {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const submitBtn = $("#renewConfirmBtn");
      submitBtn.disabled = true;
      submitBtn.innerHTML = `${ico("spinner", "spin")} Processing...`;

      const specificDate = dateInput ? dateInput.value : "";
      const autoUnsuspend = $("#renewAutoUnsuspendCheck") ? $("#renewAutoUnsuspendCheck").checked : true;

      const payload = { auto_unsuspend: autoUnsuspend };

      if (specificDate) {
        payload.expires_at = new Date(specificDate).toISOString();
      } else if (selectedPreset === "lifetime") {
        payload.lifetime = true;
      } else if (selectedPreset === "custom") {
        const customDays = Number(customInput?.value || 0);
        if (!customDays || customDays <= 0) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `${ico("check")} ${hasExpiry ? 'Confirm & Apply Renewal' : 'Confirm & Set Expiration'}`;
          return toast("Please enter a valid number of custom days (e.g. 45).", "error");
        }
        payload.days = customDays;
      } else {
        payload.days = Number(selectedPreset || 30);
      }

      try {
        const res = await api(`/servers/${id}/renew`, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        toast(res.message || "VPS renewed successfully!", "success");
        closeModal();
        await renderPage();
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `${ico("check")} ${hasExpiry ? 'Confirm & Apply Renewal' : 'Confirm & Set Expiration'}`;
        toast(`Renewal failed: ${err.message}`, "error");
      }
    };
  }
}

async function suspendVps(id, name) {
  const s = (state.servers || []).find(x => x.id === id) || { id, name: name || "VPS" };
  const ok = await modalConfirm({
    title: "Suspend Virtual Server",
    subtitle: `Target: ${s.name} (VMID ${s.vmid || id})`,
    message: `Are you sure you want to suspend "${s.name}"? This will immediately power off the virtual machine and lock user access until unsuspended.`,
    confirmText: "Suspend VPS Now",
    type: "warning",
    icon: "lock"
  });
  if (!ok) return;
  toast(`Suspending VPS "${s.name}"...`, "warning");
  try {
    const res = await api(`/servers/${id}/suspend`, { method: "POST", body: "{}" });
    toast(res.message || `VPS "${s.name}" suspended successfully.`, "warning");
    if (s) { s.is_suspended = 1; s.suspended_at = new Date().toISOString(); s.status = "stopped"; }
    await renderPage();
  } catch (e) {
    toast(`Failed to suspend VPS: ${e.message}`, "error");
  }
}

async function unsuspendVps(id, name) {
  const s = (state.servers || []).find(x => x.id === id) || { id, name: name || "VPS" };
  const ok = await modalConfirm({
    title: "Unsuspend Virtual Server",
    subtitle: `Target: ${s.name} (VMID ${s.vmid || id})`,
    message: `Restore access for "${s.name}"? The user will regain full control to start, restart, and manage their virtual machine.`,
    confirmText: "Unsuspend VPS",
    type: "success",
    icon: "check"
  });
  if (!ok) return;
  toast(`Unsuspending VPS "${s.name}"...`, "info");
  try {
    const res = await api(`/servers/${id}/unsuspend`, { method: "POST", body: "{}" });

  } catch (e) {

  }
}

async function createSnapshot(id) {
  const s = (state.servers || []).find(x => x.id === id) || { id, name: "VPS", vmid: "" };
  const defaultSnapName = `snap-${new Date().toISOString().slice(0, 10).replace(/-/g, "")}`;
  const name = await modalPrompt({
    title: "Create Proxmox Snapshot",
    subtitle: `Target: ${s.name} (VMID ${s.vmid || id})`,
    message: "Capture the current state and disk data of this virtual machine. You can rollback to this snapshot at any time.",
    inputLabel: "Snapshot Identifier / Name",
    placeholder: "e.g. backup-before-upgrade",
    defaultValue: defaultSnapName,
    confirmText: "Create Snapshot",
    icon: "camera",
    validator: (val) => {
      if (!val) return "Snapshot name is required.";
      if (!/^[a-zA-Z0-9_\-]+$/.test(val)) return "Only letters, numbers, hyphens (-) and underscores (_) are allowed.";
      return null;
    }
  });
  if (!name) return;
  try {
    await api(`/servers/${id}/snapshots`, { method: "POST", body: JSON.stringify({ name }) });
    toast("Snapshot task submitted.");
    if (state.page === "vps") await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function rollbackSnapshot(id, name) {
  const s = (state.servers || []).find(x => x.id === id) || { id, name: "VPS", vmid: "" };
  const ok = await modalConfirm({
    title: "Rollback Snapshot",
    subtitle: `Target: ${s.name} (VMID ${s.vmid || id})`,
    message: `Rollback virtual machine to snapshot "${name}"?`,
    details: [
      "Current guest operating system state will be permanently replaced.",
      "Any disk modifications made since this snapshot was created will be lost.",
      "The VM may briefly reboot during the rollback process."
    ],
    confirmText: "Rollback Snapshot",
    type: "danger",
    icon: "restore"
  });
  if (!ok) return;
  try {
    await api(`/servers/${id}/snapshots/${encodeURIComponent(name)}/rollback`, { method: "POST", body: "{}" });
    toast(`Rollback to snapshot "${name}" submitted.`);
    await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

togglePassTabBtn" class="toggle-pwd-btn" data-target="reinstallTabPassword" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;color:#888;padding:4px 8px;font-size:13px;border:none;cursor:pointer" title="Show/Hide Password">${ico("eye")}</button></div></div><div class="field"><label>Hostname (optional)</label><input name="hostname" value="${esc(server.name)}" placeholder="${esc(server.name)}"></div><div class="field"><label>SSH Public Key (optional, for passwordless root SSH)</label><textarea name="sshKey" rows="2" placeholder="ssh-ed25519 AAAAC3... or ssh-rsa AAAAB3..." style="background:#0d0d0d;border:1px solid #303030;border-radius:8px;padding:9px;color:white;width:100%;font-size:11px;font-family:'Space Grotesk',monospace;resize:vertical"></textarea></div><div style="margin:18px 0;display:flex;align-items:flex-start;gap:9px"><input type="checkbox" id="reinstallTabConfirmCheck" style="margin-top:3px;cursor:pointer"><label for="reinstallTabConfirmCheck" style="font-size:12px;color:#ddd;cursor:pointer;line-height:1.4">I confirm that I want to wipe this VPS and reinstall with the selected operating system.</label></div><button type="submit" class="btn danger" id="reinstallTabSubmitBtn" disabled style="padding:12px 24px;font-weight:700">${ico("alert")} Wipe and Reinstall OS</button></form>`;
    const passInput = $("#reinstallTabPassword"), toggleBtn = $("#togglePassTabBtn"), genBtn = $("#genPassTabBtn"), check = $("#reinstallTabConfirmCheck"), submitBtn = $("#reinstallTabSubmitBtn");
    if (genBtn && passInput) genBtn.onclick = () => {
      const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*";
      let generated = "";
      for (let i = 0; i < 16; i++) generated += chars.charAt(Math.floor(Math.random() * chars.length));
      passInput.value = generated;
      revealPasswordInput(passInput, toggleBtn);
      try { navigator.clipboard.writeText(generated); toast("Generated password copied to clipboard!"); } catch {}
      if (check) check.dispatchEvent(new Event("change"));
    };
    if (toggleBtn && passInput) {
      toggleBtn.onclick = (e) => {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        togglePasswordVisibility(passInput, toggleBtn);
      };
    }
    if (check && submitBtn) {
      const validate = () => { submitBtn.disabled = !check.checked || (passInput && passInput.value.length < 8); };
      check.onchange = validate;
      if (passInput) passInput.oninput = validate;
    }
    $("#reinstallTabForm").onsubmit = async e => {
      e.preventDefault();
      if (!check.checked) return toast("Please check the confirmation box.", "error");
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd);
      submitBtn.disabled = true;
      submitBtn.innerHTML = `${ico("spinner", "spin")} Reinstalling OS… Stopping VPS & cloning template…`;
      toast("Reinstallation started! This may take 30-45 seconds…");
      try {
        const res = await api(`/servers/${id}/reinstall`, { method: "POST", body: JSON.stringify(data) });
        toast(res.message || "VPS reinstalled successfully!");
        state.vpsTab = "specs";
        await renderPage();
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `${ico("alert")} Wipe and Reinstall OS`;
        toast(err.message, "error");
      }
    };
  } catch (err) { wrap.innerHTML = `<div class="empty">Error loading reinstallation options: ${esc(err.message)}</div>`; }
}

ard PC)</option><option value="q35" ${machine === 'q35' ? 'selected' : ''}>q35 (Modern PCIe Architecture)</option></select></div><div class="field" style="display:flex;align-items:center;padding-top:24px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" name="qemuAgent" id="editAgentCheck" ${agent ? 'checked' : ''} style="width:auto;cursor:pointer"><span><b>Enable QEMU Guest Agent</b> <span class="muted small">(required for live IP & memory reporting)</span></span></label></div></div>` : `<div class="form-grid"><div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" name="nesting" id="editNestingCheck" ${nesting ? 'checked' : ''} style="width:auto;cursor:pointer"><span><b>Enable Nesting</b> <span class="muted small">(Allows Docker / LXD inside container)</span></span></label></div><div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" name="keyctl" id="editKeyctlCheck" ${keyctl ? 'checked' : ''} style="width:auto;cursor:pointer"><span><b>Enable Keyctl</b> <span class="muted small">(Systemd keyring support)</span></span></label></div></div><div class="form-grid" style="margin-top:8px"><div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" name="fuse" id="editFuseCheck" ${fuse ? 'checked' : ''} style="width:auto;cursor:pointer"><span><b>Enable FUSE</b> <span class="muted small">(FUSE filesystems)</span></span></label></div><div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" name="mknod" id="editMknodCheck" ${mknod ? 'checked' : ''} style="width:auto;cursor:pointer"><span><b>Enable Mknod</b> <span class="muted small">(Device node creation)</span></span></label></div></div>`}</div>` : `<div style="display:flex;flex-direction:column;gap:10px">${isLxc ? `<div style="display:flex;align-items:center;gap:8px"><span class="tag">${nesting ? 'Nesting Active' : 'Nesting Disabled'}</span><span class="muted small">Docker & nested container virtualization support</span></div>` : ''}${isQemu ? `<div style="display:flex;align-items:center;gap:8px"><span class="tag">${agent ? 'Guest Agent Active' : 'Agent Inactive'}</span><span class="muted small">Live hypervisor guest communication</span></div>` : ''}</div>`}</div><div class="panel" style="background:var(--panel2)"><div class="panel-title"><h4>9. ${ico("rocket")} Startup, Boot Sequence & Autostart Policies</h4></div><div class="form-grid"><div class="field" style="display:flex;align-items:center;padding-top:16px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" name="onboot" id="editOnbootCheck" ${onboot ? 'checked' : ''} style="width:auto;cursor:pointer"><span><b>Start at Host Boot (onboot)</b><br><span class="muted small">Automatically power on this VPS when physical host boots</span></span></label></div>${isAdmin ? `<div class="field"><label>Startup Order Priority <span class="muted small">(order=1..99)</span></label><input name="startupOrder" type="number" min="0" max="99" value="${esc(startupOrder)}" placeholder="e.g. 1 (lower starts first)"></div>` : `<div class="field"><label>Startup Policy</label><input value="${onboot ? 'Automatic on host boot' : 'Manual start'}" disabled style="opacity:.7;cursor:not-allowed"></div>`}</div>${isAdmin ? `<div class="form-grid" style="margin-top:12px"><div class="field"><label>Boot Up Delay (Seconds) <span class="muted small">(up delay)</span></label><input name="startupUp" type="number" min="0" max="3600" value="${esc(startupUp)}" placeholder="e.g. 30"></div><div class="field"><label>Shutdown Delay (Seconds) <span class="muted small">(down delay)</span></label><input name="startupDown" type="number" min="0" max="3600" value="${esc(startupDown)}" placeholder="e.g. 30"></div></div>` : ''}${isQemu && isAdmin ? `<div class="field" style="margin-top:12px"><label>Boot Device Order <span class="muted small">(e.g. <code>order=scsi0;net0</code> or <code>order=sata0;ide2</code>)</span></label><input name="boot" value="${esc(cfg.boot || 'order=scsi0;net0')}" placeholder="order=scsi0;net0"><span class="small muted">Configures QEMU BIOS boot device priorities</span></div>` : ''}</div><div style="display:flex;gap:12px;align-items:center;margin-top:6px"><button type="submit" class="btn primary" id="editVpsSubmitBtn" style="padding:13px 34px;font-size:14px;font-weight:700">${ico("backup")} Save & Apply Changes</button><button type="button" class="btn ghost" data-action="vps-tab" data-tab="specs" style="padding:13px 20px">Cancel</button></div><div id="editProgressNotice" class="hidden notice" style="border-color:rgba(34,197,94,0.2);background:rgba(34,197,94,0.05);color:#86efac;padding:16px;border-radius:12px"><div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px"><span>${ico("spinner", "spin")}</span> Applying configuration updates to Proxmox VE…</div><div style="font-size:12px;margin-top:6px;line-height:1.5">Sending hardware resize and network commands to node. Please do not close this window (takes approximately 5-15 seconds).</div></div></form>`;

function setupEditVpsEvents(id, d) {
  const isAdmin = state.user.role === "admin";
  const isQemu = d.server?.type === "qemu";
  const isLxc = d.server?.type === "lxc";
  if (isAdmin) {
    const lifetimeCheck = $("#editLifetimeCheck");
    const expInput = $("#editExpiresAtInput");
    if (lifetimeCheck && expInput) {
      lifetimeCheck.onchange = () => {
        if (lifetimeCheck.checked) {
          expInput.value = "";
          expInput.style.opacity = "0.5";
        } else {
          expInput.style.opacity = "1";
          if (!expInput.value) {
            const d = new Date(Date.now() + 30 * 86400000);
            expInput.value = d.toISOString().slice(0, 16);
          }
        }
      };
      if (expInput) {
        expInput.oninput = () => {
          if (expInput.value) {
            lifetimeCheck.checked = false;
            expInput.style.opacity = "1";
          }
        };
      }
    }

    document.querySelectorAll(".quick-set-exp").forEach(btn => {
      btn.onclick = () => {
        const val = btn.dataset.days;
        if (val === "lifetime") {
          if (lifetimeCheck) lifetimeCheck.checked = true;
          if (expInput) { expInput.value = ""; expInput.style.opacity = "0.5"; }
        } else {
          if (lifetimeCheck) lifetimeCheck.checked = false;
          if (expInput) {
            expInput.style.opacity = "1";
            const days = Number(val);
            const now = Date.now();
            let baseTime = now;
            if (expInput.value) {
              const t = new Date(expInput.value).getTime();
              if (!isNaN(t) && t > now) baseTime = t;
            }
            const target = new Date(baseTime + days * 86400000);
            expInput.value = target.toISOString().slice(0, 16);
          }
        }
      };
    });
    const btnDhcp = $("#editBtnIp4Dhcp");
    const btnStatic = $("#editBtnIp4Static");
    const ip4Fields = $("#editIp4StaticFields");
    if (btnDhcp && btnStatic) {
      btnDhcp.onclick = () => {
        state.editVpsState.ip4Type = "dhcp"; btnDhcp.className = "btn primary"; btnStatic.className = "btn ghost";
        if (ip4Fields) ip4Fields.classList.add("hidden");
      };
      btnStatic.onclick = () => {
        state.editVpsState.ip4Type = "static"; btnDhcp.className = "btn ghost"; btnStatic.className = "btn primary";
        if (ip4Fields) { ip4Fields.classList.remove("hidden"); const ipInp = $("#editIp4AddressInput"); if (ipInp) ipInp.focus(); }
      };
    }
    const ip6Select = $("#editIp6Select");
    const ip6Fields = $("#editIp6StaticFields");
    if (ip6Select && ip6Fields) {
      ip6Select.onchange = () => {
        state.editVpsState.ip6Type = ip6Select.value;
        if (ip6Select.value === "static") { ip6Fields.classList.remove("hidden"); const ip6Inp = $("#editIp6AddressInput"); if (ip6Inp) ip6Inp.focus(); }
        else { ip6Fields.classList.add("hidden"); }
      };
    }
    document.querySelectorAll(".quick-edit-rate").forEach(a => {
      a.onclick = () => {
        const inp = $("#editNetRateInput");

function showModal(html, extraClass = "") {
  if (window._activeConsoleCleanup) {
    try { window._activeConsoleCleanup(); } catch(e){}
    window._activeConsoleCleanup = null;
  }
  const modalClass = extraClass ? `modal ${extraClass}` : "modal";
  $("#modalRoot").innerHTML = `<div class="modal-backdrop"><div class="${modalClass}">${html}</div></div>`;
  const closeModal = () => {
    if (window._activeConsoleCleanup) {
      try { window._activeConsoleCleanup(); } catch(e){}
      window._activeConsoleCleanup = null;
    }
    $("#modalRoot").innerHTML = "";
  };
  window.closeModal = closeModal;

function modalConfirm({
  title = "Confirm Action",
  subtitle = "",
  message = "Are you sure you want to proceed?",
  details = null,
  confirmText = "Confirm",
  cancelText = "Cancel",
  type = "warning",
  icon = null
} = {}) {
  return new Promise(resolve => {
    const root = $("#confirmRoot");
    if (!root) {
      resolve(window.confirm(message));
      return;
    }

    const defaultIcons = {
      danger: "alert",
      warning: "alert",
      info: "lightbulb",
      primary: "zap",
      success: "check"
    };
    const iconName = icon || defaultIcons[type] || "alert";
    const iconSvg = ico(iconName, "lg");
    const btnClass = type === "danger" ? "danger" : "primary";
    const actionIco = type === "danger" ? "trash" : (icon || "check");

    let detailsHtml = "";
    if (details) {
      if (Array.isArray(details)) {
        detailsHtml = `<div class="confirm-details-box ${esc(type)}">
          <ul class="confirm-bullets">
            ${details.map(d => `<li>${esc(d)}</li>`).join("")}
          </ul>
        </div>`;
      } else {
        detailsHtml = `<div class="confirm-details-box ${esc(type)}">
          <div style="font-family:'Space Grotesk',monospace;word-break:break-all">${esc(details)}</div>
        </div>`;
      }
    }

    root.innerHTML = `<div class="confirm-backdrop" data-confirm-backdrop>
      <div class="confirm-modal confirm-type-${esc(type)}" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="confirm-header">
          <div class="confirm-icon-badge ${esc(type)}">
            ${iconSvg}
          </div>
          <div class="confirm-titles">
            <h3 id="confirmTitle" class="confirm-title">${esc(title)}</h3>
            ${subtitle ? `<p class="confirm-subtitle">${esc(subtitle)}</p>` : ""}
          </div>
          <button class="confirm-close-btn" data-confirm-btn="cancel" aria-label="Close dialog">
            <svg class="svg-ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div class="confirm-body">
          <div class="confirm-msg">${esc(message).replace(/\n/g, "<br>")}</div>
          ${detailsHtml}
        </div>
        <div class="confirm-actions">
          <button type="button" class="btn ghost" data-confirm-btn="cancel">${esc(cancelText)}</button>
          <button type="button" class="btn ${btnClass}" data-confirm-btn="ok" id="confirmOkBtn">
            ${ico(actionIco, "sm")} ${esc(confirmText)}
          </button>
        </div>
      </div>
    </div>`;

    function cleanup(result) {
      window.removeEventListener("keydown", onKeyDown);
      root.innerHTML = "";
      resolve(result);
    }

    function onKeyDown(e) {
      if (e.key === "Escape") {
        e.preventDefault();
        cleanup(false);
      } else if (e.key === "Enter") {
        e.preventDefault();
        cleanup(true);
      }
    }

    window.addEventListener("keydown", onKeyDown);

    const okBtn = root.querySelector('[data-confirm-btn="ok"]');
    const cancelBtns = root.querySelectorAll('[data-confirm-btn="cancel"]');
    const backdrop = root.querySelector("[data-confirm-backdrop]");

    if (okBtn) {
      okBtn.onclick = () => cleanup(true);
      setTimeout(() => okBtn.focus(), 40);
    }

    cancelBtns.forEach(btn => {
      btn.onclick = () => cleanup(false);
    });

    if (backdrop) {
      backdrop.onclick = e => {
        if (e.target === backdrop) cleanup(false);
      };
    }
  });
}

function modalPrompt({
  title = "Enter Information",
  subtitle = "",
  message = "",
  inputLabel = "",
  placeholder = "",
  defaultValue = "",
  confirmText = "Submit",
  cancelText = "Cancel",
  type = "primary",
  icon = "edit",
  validator = null
} = {}) {
  return new Promise(resolve => {
    const root = $("#confirmRoot");
    if (!root) {
      resolve(window.prompt(message, defaultValue));
      return;
    }

    const iconSvg = ico(icon || "edit", "lg");
    const btnClass = type === "danger" ? "danger" : "primary";

    root.innerHTML = `<div class="confirm-backdrop" data-confirm-backdrop>
      <div class="confirm-modal confirm-type-${esc(type)}" role="dialog" aria-modal="true" aria-labelledby="promptTitle">
        <div class="confirm-header">
          <div class="confirm-icon-badge ${esc(type)}">
            ${iconSvg}
          </div>
          <div class="confirm-titles">
            <h3 id="promptTitle" class="confirm-title">${esc(title)}</h3>
            ${subtitle ? `<p class="confirm-subtitle">${esc(subtitle)}</p>` : ""}
          </div>
          <button class="confirm-close-btn" data-confirm-btn="cancel" aria-label="Close dialog">
            <svg class="svg-ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <form id="confirmPromptForm" class="confirm-body" onsubmit="return false;">
          ${message ? `<div class="confirm-msg">${esc(message).replace(/\n/g, "<br>")}</div>` : ""}
          <div class="confirm-input-wrap">
            ${inputLabel ? `<label for="confirmPromptInput">${esc(inputLabel)}</label>` : ""}
            <input type="text" id="confirmPromptInput" class="confirm-input" placeholder="${esc(placeholder)}" value="${esc(defaultValue)}" autocomplete="off" spellcheck="false" />
            <div id="confirmPromptError" class="confirm-error hidden"></div>
          </div>
          <div class="confirm-actions">
            <button type="button" class="btn ghost" data-confirm-btn="cancel">${esc(cancelText)}</button>
            <button type="submit" class="btn ${btnClass}" data-confirm-btn="ok" id="confirmPromptOkBtn">
              ${ico(icon || "check", "sm")} ${esc(confirmText)}
            </button>
          </div>
        </form>
      </div>
    </div>`;

    const input = root.querySelector("#confirmPromptInput");
    const errorEl = root.querySelector("#confirmPromptError");
    const form = root.querySelector("#confirmPromptForm");
    const cancelBtns = root.querySelectorAll('[data-confirm-btn="cancel"]');
    const backdrop = root.querySelector("[data-confirm-backdrop]");

    function cleanup(result) {
      window.removeEventListener("keydown", onKeyDown);
      root.innerHTML = "";
      resolve(result);
    }

    function submitValue() {
      const val = (input ? input.value : "").trim();
      if (validator) {
        const err = validator(val);
        if (err) {
          if (errorEl) {
            errorEl.textContent = err;
            errorEl.classList.remove("hidden");
          }
          if (input) input.focus();
          return;
        }
      }
      cleanup(val);
    }

    function onKeyDown(e) {
      if (e.key === "Escape") {
        e.preventDefault();
        cleanup(null);
      }
    }

    window.addEventListener("keydown", onKeyDown);

    if (form) {
      form.onsubmit = e => {
        e.preventDefault();
        submitValue();
      };
    }

    cancelBtns.forEach(btn => {
      btn.onclick = () => cleanup(null);
    });

    if (backdrop) {
      backdrop.onclick = e => {
        if (e.target === backdrop) cleanup(null);
      };
    }

    if (input) {
      setTimeout(() => {
        input.focus();
        input.select();
      }, 50);
      input.oninput = () => {
        if (errorEl) errorEl.classList.add("hidden");
      };
    }
  });
}
