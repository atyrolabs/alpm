      <!-- 3. Hardware Sizing (CPU & Memory) -->
      <div class="panel">
        <div class="panel-title"><h3>3. Hardware Sizing & Compute Architecture</h3></div>
        <div class="form-grid">
          <div class="field">
            <label style="display:flex;justify-content:space-between">
              <span>vCPU Cores</span>
              <span style="display:flex;gap:4px">
                <span class="preset-chip quick-core" data-val="1">1C</span>
                <span class="preset-chip quick-core" data-val="2">2C</span>
                <span class="preset-chip quick-core" data-val="4">4C</span>
                <span class="preset-chip quick-core" data-val="8">8C</span>
                <span class="preset-chip quick-core" data-val="16">16C</span>
              </span>
            </label>
            <input name="cores" id="createCoresInput" type="number" min="1" max="128" value="2" required>
          </div>
          <div class="field">
            <label style="display:flex;justify-content:space-between">
              <span>Memory (RAM in MB)</span>
              <span style="display:flex;gap:4px">
                <span class="preset-chip quick-ram" data-val="1024">1GB</span>
                <span class="preset-chip quick-ram" data-val="2048">2GB</span>
                <span class="preset-chip quick-ram" data-val="4096">4GB</span>
                <span class="preset-chip quick-ram" data-val="8192">8GB</span>
                <span class="preset-chip quick-ram" data-val="16384">16GB</span>
              </span>
            </label>
            <input name="memory" id="createMemoryInput" type="number" min="256" step="128" value="2048" required>
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label>CPU Sockets</label>
            <select name="sockets">
              <option value="1" selected>1 Socket</option>
              <option value="2">2 Sockets</option>
              <option value="4">4 Sockets</option>
            </select>
          </div>

          ${isQemu ? `
            <div class="field">
              <label>CPU Type / Architecture</label>
              <select name="cpu">
                <option value="host" selected>host (Host CPU passthrough - Maximum performance & AES-NI)</option>
                <option value="x86-64-v2-AES">x86-64-v2-AES (Recommended for cluster migration)</option>
                <option value="x86-64-v3">x86-64-v3 (AVX, AVX2, modern instructions)</option>
                <option value="kvm64">kvm64 (Proxmox standard universal compatibility)</option>
                <option value="qemu64">qemu64 (QEMU default)</option>
                <option value="max">max (All features supported by host)</option>
              </select>
            </div>
          ` : `
            <div class="field">
              <label style="display:flex;justify-content:space-between">
                <span>Swap Memory (MB)</span>
                <span style="display:flex;gap:4px">
                  <span class="preset-chip quick-swap" data-val="0">0MB</span>
                  <span class="preset-chip quick-swap" data-val="512">512M</span>
                  <span class="preset-chip quick-swap" data-val="1024">1G</span>
                  <span class="preset-chip quick-swap" data-val="2048">2G</span>
                </span>
              </label>
              <input name="swap" id="createSwapInput" type="number" min="0" step="128" value="512">
            </div>
          `}
        </div>

        ${isQemu ? `
          <div class="form-grid">
            <div class="field">
              <label>Minimum RAM / Memory Ballooning (MB, optional)</label>
              <input name="balloon" type="number" min="0" step="128" placeholder="0 or leave blank to disable ballooning">
              <span class="small muted">Dynamically shares unused memory back to Proxmox host.</span>
            </div>
            <div class="field" style="display:flex;align-items:center;padding-top:22px">
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#ddd;cursor:pointer">
                <input type="checkbox" name="numa" id="numaCheck" style="width:auto;cursor:pointer">
                <b>Enable NUMA</b> (Non-Uniform Memory Access optimization)
              </label>
            </div>
          </div>
        ` : ''}
      </div>

      <!-- 4. Storage & Virtual Disks -->
      <div class="panel">
        <div class="panel-title">
          <div>
            <h3>4. ${ico('hdd', 'sm')} Storage & Virtual Disks</h3>
            <p class="muted small" style="margin:4px 0 0">Configure storage pool allocation, virtual disk size, controller bus, cache, and SSD flags.</p>
          </div>
        </div>
        <div class="form-grid">
          <div class="field">
            <label style="display:flex;justify-content:space-between">
              <span>Disk Size (GB)</span>
              <span style="display:flex;gap:4px">
                <span class="preset-chip quick-disk" data-val="20">20G</span>
                <span class="preset-chip quick-disk" data-val="30">30G</span>
                <span class="preset-chip quick-disk" data-val="50">50G</span>
                <span class="preset-chip quick-disk" data-val="100">100G</span>
                <span class="preset-chip quick-disk" data-val="200">200G</span>
              </span>
            </label>
            <input name="disk" id="createDiskInput" type="number" min="5" max="50000" value="25" required>
          </div>
          <div class="field">
            <label>Target Storage Pool</label>
            <select name="storage" required>${storagesHtml}</select>
          </div>
        </div>

        ${isQemu ? `
          <div class="form-grid" style="margin-top:10px">
            <div class="field">
              <label>Disk Bus Controller</label>
              <select name="diskBus">
                <option value="scsi" selected>SCSI (VirtIO SCSI - Recommended)</option>
                <option value="virtio">VirtIO Block (virtio)</option>
                <option value="sata">SATA</option>
                <option value="ide">IDE</option>
              </select>
            </div>
            <div class="field">
              <label>SCSI Controller Type</label>
              <select name="scsihw">
                <option value="virtio-scsi-single" selected>VirtIO SCSI Single (Best Performance & Queuing)</option>
                <option value="virtio-scsi">VirtIO SCSI</option>
                <option value="lsi">LSI 53C895A</option>
                <option value="megaraid">MegaRAID SAS 8708EM2</option>
                <option value="pvscsi">VMware PVSCSI</option>
              </select>
            </div>
          </div>

          <div class="form-grid" style="margin-top:10px">
            <div class="field">
              <label>Disk Cache Mode</label>
              <select name="diskCache">
                <option value="none" selected>Default (No Cache / O_DIRECT)</option>
                <option value="writeback">Write Back (Unsafe / Maximum IOPS)</option>
                <option value="writethrough">Write Through (Safe)</option>
                <option value="directsync">Direct Sync</option>
              </select>
            </div>
            <div class="field">
              <label>Disk Hardware Optimizations</label>
              <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
                <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#ddd;cursor:pointer">
                  <input type="checkbox" name="discard" checked style="width:auto;cursor:pointer">
                  <b>Discard / TRIM (<code>discard=on</code>)</b>: Automatically returns deleted space to storage
                </label>
                <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#ddd;cursor:pointer">
                  <input type="checkbox" name="ssd" checked style="width:auto;cursor:pointer">
                  <b>SSD Emulation (<code>ssd=1</code>)</b>: Informs guest OS that virtual drive is solid-state
                </label>
                <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#ddd;cursor:pointer">
                  <input type="checkbox" name="iothread" checked style="width:auto;cursor:pointer">
                  <b>IOThread (<code>iothread=1</code>)</b>: Assigns dedicated I/O thread for NVMe performance
                </label>
              </div>
            </div>
          </div>
        ` : ''}
      </div>

      <!-- 5. System & Firmware (QEMU Only) -->
      ${isQemu ? `
        <div class="panel">
          <div class="panel-title">
            <div>
              <h3>5. ${ico('sliders', 'sm')} System Architecture & BIOS Firmware</h3>
              <p class="muted small" style="margin:4px 0 0">Configure motherboard chipset, UEFI/MBR BIOS firmware, and virtual graphics adapter.</p>
            </div>
          </div>
          <div class="form-grid">
            <div class="field">
              <label>Machine Type (Motherboard Chipset)</label>
              <select name="machine">
                <option value="q35" selected>q35 (Modern PCIe Architecture - Recommended)</option>
                <option value="i440fx">i440fx (Legacy Intel PC Architecture)</option>
              </select>
            </div>
            <div class="field">
              <label>BIOS / Firmware</label>
              <select name="bios">
                <option value="seabios" selected>SeaBIOS (Default legacy MBR BIOS)</option>
                <option value="ovmf">OVMF / UEFI (UEFI BIOS for Windows 11 & Modern OS)</option>
              </select>
            </div>
          </div>
          <div class="form-grid" style="margin-top:10px">
            <div class="field">
              <label>Display / Graphic Card</label>
              <select name="vga">
                <option value="std" selected>Standard VGA (std - Default)</option>
                <option value="virtio">VirtIO GPU (virtio - High 2D performance)</option>
                <option value="serial0">Serial Terminal (serial0 - Headless Linux)</option>
                <option value="qxl">SPICE (qxl - Enhanced remote desktop)</option>
              </select>
            </div>
          </div>
        </div>
      ` : ''}

      <!-- 6. Network Interface & IP Configuration -->
      <div class="panel">
        <div class="panel-title">
          <div>
            <h3>6. ${ico('network', 'sm')} Network Interface & IP Configuration (net0)</h3>
            <p class="muted small" style="margin:4px 0 0">
              ${isQemu && isTemplate ? 'Proxmox Cloud-Init injects IP configuration directly into the guest OS.' : 'Live network bridge with full IP subnet, gateway, VLAN, and rate limit control.'}
            </p>
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label>Proxmox Network Bridge (Virtual Switch)</label>
            <select name="bridge" id="createBridgeSelect" required>${bridgesHtml}</select>
          </div>

          ${isQemu ? `
            <div class="field">
              <label>Network Adapter Model</label>
              <select name="netModel">
                <option value="virtio" selected>VirtIO (paravirtualized - High Performance)</option>
                <option value="e1000">Intel E1000 (Universal Compatibility)</option>
                <option value="vmxnet3">VMware VMXNET3</option>
                <option value="rtl8139">Realtek RTL8139 (Legacy 100M)</option>
              </select>
            </div>
          ` : `
            <div class="field">
              <label>LXC Network Interface Name</label>
              <input name="netifName" value="eth0" required placeholder="eth0">
            </div>
          `}
        </div>

        <!-- Live Bridge Detailed Info Box -->
        <div id="bridgeInfoBox" style="background:var(--bg);padding:10px 14px;border-radius:8px;border:1px solid var(--line);margin:10px 0 14px;font-size:12px"></div>

        <div style="margin:14px 0 8px">
          <label style="display:block;font-size:12px;color:#aaa;margin-bottom:8px">IPv4 Address Assignment:</label>
          <div style="display:flex;gap:10px">
            <button type="button" id="btnIp4Dhcp" class="btn ${state.createVpsState.ip4Type === 'dhcp' ? 'primary' : 'ghost'}" style="flex:1;padding:9px;font-size:12px">
              ${ico("statusDot", "sm")} DHCP (Automatic)
            </button>
            <button type="button" id="btnIp4Static" class="btn ${state.createVpsState.ip4Type === 'static' ? 'primary' : 'ghost'}" style="flex:1;padding:9px;font-size:12px">
              ${ico("statusDot", "sm")} Static IPv4 (CIDR / Gateway)
            </button>
          </div>
        </div>

        <div id="ip4StaticFields" class="${state.createVpsState.ip4Type === 'static' ? '' : 'hidden'} form-grid" style="margin-top:10px;background:var(--bg);padding:14px;border-radius:10px;border:1px solid var(--line)">
          <div class="field">
            <label>IPv4 Address / CIDR (e.g. <code>192.168.1.150/24</code> or <code>8.243.208.40/28</code>)</label>
            <input name="ip4Address" id="ip4AddressInput" placeholder="192.168.1.150/24">
          </div>
          <div class="field">
            <label>IPv4 Gateway (e.g. <code>192.168.1.1</code> or <code>8.243.208.37</code>)</label>
            <input name="ip4Gateway" id="ip4GatewayInput" placeholder="192.168.1.1">
          </div>
        </div>

        <div style="margin:16px 0 8px">
          <div class="field">
            <label>IPv6 Address Assignment</label>
            <select name="ip6Type" id="createIp6Select">
              <option value="disabled" ${state.createVpsState.ip6Type === 'disabled' ? 'selected' : ''}>Disabled / None (Standard IPv4 only)</option>
              <option value="auto" ${state.createVpsState.ip6Type === 'auto' ? 'selected' : ''}>SLAAC / Auto-Configuration (ip6=auto)</option>
              <option value="dhcp" ${state.createVpsState.ip6Type === 'dhcp' ? 'selected' : ''}>DHCPv6 (ip6=dhcp)</option>
              <option value="static" ${state.createVpsState.ip6Type === 'static' ? 'selected' : ''}>Static IPv6 (ip6=static)</option>
            </select>
          </div>
        </div>

        <div id="ip6StaticFields" class="${state.createVpsState.ip6Type === 'static' ? '' : 'hidden'} form-grid" style="margin-top:10px;background:var(--bg);padding:14px;border-radius:10px;border:1px solid var(--line)">
          <div class="field">
            <label>IPv6 Address / CIDR (e.g. <code>2001:db8::10/64</code>)</label>
            <input name="ip6Address" id="ip6AddressInput" placeholder="2001:db8::10/64">
          </div>
          <div class="field">
            <label>IPv6 Gateway (e.g. <code>2001:db8::1</code>)</label>
            <input name="ip6Gateway" id="ip6GatewayInput" placeholder="2001:db8::1">
          </div>
        </div>

        <div class="form-grid" style="margin-top:14px">
          <div class="field">
            <label>VLAN Tag <span class="muted small">(optional, 1-4094)</span></label>
            <input name="vlan" type="number" min="1" max="4094" placeholder="None / untagged">
          </div>
          <div class="field">
            <label>MAC Address <span class="muted small">(optional, leave blank for auto)</span></label>
            <input name="mac" placeholder="e.g. BC:24:11:xx:xx:xx">
          </div>
          <div class="field">
            <label>Rate Limit (MB/s) <span class="muted small">(optional bandwidth cap)</span></label>
            <input name="rateLimit" type="number" min="1" max="10000" placeholder="e.g. 100 for 100MB/s">
          </div>
        </div>

        <div style="margin:10px 0 4px;display:flex;align-items:center;gap:8px">
          <input type="checkbox" name="firewall" id="netFirewallCheck" checked style="width:auto;cursor:pointer">
          <label for="netFirewallCheck" style="font-size:12px;color:#ddd;cursor:pointer">
            <b>${ico("shield", "sm", "color:var(--accent)")} Enable Proxmox VE Firewall</b> on virtual network adapter
          </label>
        </div>
      </div>

      <!-- 7. DNS Configuration -->
      <div class="panel">
        <div class="panel-title">
          <div>
            <h3>7. ${ico('globe', 'sm')} DNS Configuration</h3>
            <p class="muted small" style="margin:4px 0 0">Configure custom DNS nameservers and search domain (leave blank to inherit from node host / DHCP).</p>
          </div>
        </div>
        <div class="form-grid">
          <div class="field">
            <label>DNS Search Domain <span class="muted small">(optional)</span></label>
            <input name="searchDomain" placeholder="e.g. myvps.lan or company.local">
          </div>
          <div class="field">
            <label>DNS Nameservers <span class="muted small">(optional, space-separated)</span></label>
            <input name="nameServers" placeholder="e.g. 1.1.1.1 8.8.8.8">
          </div>
        </div>
      </div>

      <!-- 8. Credentials & Access Authentication -->
      ${(isTemplate || isLxc) ? `
        <div class="panel">
          <div class="panel-title">
            <div>
              <h3>8. ${isQemu ? `${ico('cloud', 'sm')} Cloud-Init User Credentials & Access` : `${ico('lock', 'sm')} Container Root Credentials & Access`}</h3>
              <p class="muted small" style="margin:4px 0 0">
                ${isQemu ? 'Injected into the virtual machine by Proxmox Cloud-Init on first boot.' : 'Root user credentials and SSH authentication for the container.'}
              </p>
            </div>
          </div>
          <div class="form-grid">
            ${isQemu ? `
              <div class="field">
                <label>Cloud-Init User (Username)</label>
                <input name="ciUser" value="root" required placeholder="root or ubuntu">
                <span class="small muted">Default user configured in Cloud-Init.</span>
              </div>
            ` : ''}
            <div class="field" style="${isLxc ? 'grid-column:span 2' : ''}">
              <label style="display:flex;justify-content:space-between">
                <span>Root / User Password (min 8 characters)</span>
                <a href="javascript:void(0)" id="createGenPassBtn" style="color:var(--accent);font-size:11px;font-weight:600">
                  ${ico("dice", "sm")} Generate Strong Password
                </a>
              </label>
              <div style="position:relative">
                <input name="password" id="createPassInput" type="password" minlength="8" required placeholder="Set strong root password" style="padding-right:45px">
                <button type="button" id="createTogglePassBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;color:#888;padding:4px 8px;font-size:13px">
                  ${ico("eye")}
                </button>
              </div>
            </div>
          </div>
          <div class="field" style="margin-top:10px">
            <label>SSH Public Key(s) <span class="muted small">(optional, for passwordless root SSH)</span></label>
            <textarea name="sshKey" rows="3" placeholder="ssh-ed25519 AAAAC3... or ssh-rsa AAAAB3..." style="background:#0d0d0d;border:1px solid #303030;border-radius:8px;padding:9px;color:white;width:100%;font-size:11px;font-family:'Space Grotesk',monospace;resize:vertical"></textarea>
          </div>
        </div>
      ` : ''}

      <!-- 9. LXC Advanced Security & Capabilities -->
      ${isLxc ? `
        <div class="panel">
          <div class="panel-title">
            <div>
              <h3>9. ${ico('shield', 'sm')} Container Security & Capabilities</h3>
              <p class="muted small" style="margin:4px 0 0">Control LXC container isolation, nested virtualization, and kernel security features.</p>
            </div>
          </div>
          <div class="form-grid" style="gap:14px">
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#ddd;cursor:pointer">
              <input type="checkbox" name="unprivileged" id="unprivilegedCheck" checked style="width:auto;cursor:pointer">
              <span><b>Unprivileged container</b> (Recommended for security)</span>
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#ddd;cursor:pointer">
              <input type="checkbox" name="nesting" id="nestingCheck" checked style="width:auto;cursor:pointer">
              <span><b>Enable Nesting (<code>nesting=1</code>)</b> (Allows Docker & Systemd inside LXC)</span>
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#ddd;cursor:pointer">
              <input type="checkbox" name="keyctl" id="keyctlCheck" checked style="width:auto;cursor:pointer">
              <span><b>Enable Keyctl (<code>keyctl=1</code>)</b> (Kernel keyring management for modern containers)</span>
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#ddd;cursor:pointer">
              <input type="checkbox" name="fuse" id="fuseCheck" style="width:auto;cursor:pointer">
              <span><b>Enable FUSE (<code>fuse=1</code>)</b> (Filesystem in Userspace)</span>
            </label>
          </div>
        </div>
      ` : ''}

      <!-- 10. Startup, Agent & Lifecycle -->
      <div class="panel">
        <div class="panel-title"><h3>${isLxc ? '10' : (isTemplate ? '9' : '8')}. Startup, Agent & Lifecycle</h3></div>
        <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:8px">
            <input type="checkbox" name="onboot" id="onbootCheck" checked style="width:auto;cursor:pointer">
            <label for="onbootCheck" style="font-size:13px;color:#eee;cursor:pointer">
              <b>Start at host boot (<code>onboot=1</code>)</b>: Automatically start this virtual server when physical Proxmox host reboots
            </label>
          </div>

          ${isQemu && isTemplate ? `
            <div style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" name="ciUpgrade" id="ciUpgradeCheck" style="width:auto;cursor:pointer">
              <label for="ciUpgradeCheck" style="font-size:13px;color:#eee;cursor:pointer">
                Upgrade packages on first boot (<code>ciupgrade=1</code> via Cloud-Init)
              </label>
            </div>
          ` : ''}

          ${isQemu ? `
            <div style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" name="qemuAgent" id="qemuAgentCheck" checked style="width:auto;cursor:pointer">
              <label for="qemuAgentCheck" style="font-size:13px;color:#eee;cursor:pointer">
                Enable QEMU Guest Agent (<code>agent=1</code>) for live memory, disk and IP metric monitoring
              </label>
            </div>
          ` : ''}

          <div style="display:flex;align-items:center;gap:8px">
            <input type="checkbox" name="start" id="createStartCheck" checked style="width:auto;cursor:pointer">
            <label for="createStartCheck" style="font-size:13px;color:#eee;cursor:pointer">
              ${ico("rocket", "sm")} <b>Power on virtual server immediately</b> after creation completes
            </label>
          </div>
        </div>
      </div>

      <!-- Execution Submit -->
      <div style="display:flex;gap:12px;align-items:center;margin-top:4px">
        <button type="submit" class="btn primary" id="createSubmitBtn" style="padding:13px 34px;font-size:14px;font-weight:700">
          ${ico("zap")} Deploy ${isQemu ? 'Virtual Machine' : 'LXC Container'}
        </button>
        <button type="button" class="btn ghost" data-page="servers" style="padding:13px 20px">Cancel</button>
      </div>

      <div id="createProgressNotice" class="hidden notice" style="border-color:rgba(34,197,94,0.2);background:rgba(34,197,94,0.05);color:#86efac;padding:16px;border-radius:12px">
        <div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px">
          <span>${ico("spinner", "spin")}</span> Deployment in progress…
        </div>
        <div style="font-size:12px;margin-top:6px;line-height:1.5">
          Proxmox is allocating disk storage, configuring Cloud-Init/container network and DNS settings, and deploying the instance. Please wait 25-50 seconds…
        </div>
      </div>
    </form>
  `;

  setupCreateVpsEvents(c, d);
}

function setupCreateVpsEvents(c, d) {
  const selQemu = $("#selectTypeQemu");
  const selLxc = $("#selectTypeLxc");
  if (selQemu) selQemu.onclick = () => { state.createVpsState.type = "qemu"; renderCreateVpsForm(c, d); };
  if (selLxc) selLxc.onclick = () => { state.createVpsState.type = "lxc"; state.createVpsState.source = "template"; renderCreateVpsForm(c, d); };

  const btnTemplate = $("#btnSourceTemplate");
  const btnIso = $("#btnSourceIso");
  if (btnTemplate) btnTemplate.onclick = () => { state.createVpsState.source = "template"; renderCreateVpsForm(c, d); };
  if (btnIso) btnIso.onclick = () => { state.createVpsState.source = "iso"; renderCreateVpsForm(c, d); };

  // Live bridge details box updater
  const bridgeSelect = $("#createBridgeSelect");
  const updateBridgeInfo = () => {
    const box = $("#bridgeInfoBox");
    if (!box || !bridgeSelect) return;
    const bridgeVal = bridgeSelect.value;
    const found = (d.bridges || []).find(b => (typeof b === "object" ? b.iface : b) === bridgeVal);
    if (!found || typeof found !== "object") {
      box.innerHTML = `<span style="color:#aaa">${ico("network", "sm")} Selected Bridge: <b>${esc(bridgeVal)}</b></span>`;
      return;
    }
    box.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="display:inline-flex;color:var(--accent)">${ico("network", "sm")}</span>
        <b style="color:white">${esc(found.iface)}</b>

        ${found.ports ? `<span class="tag" style="background:rgba(255,255,255,0.06);color:#bbb">Physical Port: <b>${esc(found.ports)}</b></span>` : ''}
        ${found.cidr ? `<span class="tag" style="background:rgba(99,102,241,0.12);color:var(--accent)">Subnet: <b>${esc(found.cidr)}</b></span>` : ''}
        ${found.gateway ? `<span class="tag" style="background:rgba(234,179,8,0.12);color:#fbbf24">Default Gateway: <b>${esc(found.gateway)}</b></span>` : ''}
        ${found.comment ? `<span class="small muted">(${esc(found.comment)})</span>` : ''}
      </div>
    `;
  };
  if (bridgeSelect) {
    bridgeSelect.onchange = updateBridgeInfo;
    updateBridgeInfo();
  }

  const btnIp4Dhcp = $("#btnIp4Dhcp");
  const btnIp4Static = $("#btnIp4Static");
  const ip4StaticFields = $("#ip4StaticFields");
  if (btnIp4Dhcp && btnIp4Static) {
    btnIp4Dhcp.onclick = () => {
      state.createVpsState.ip4Type = "dhcp";
      btnIp4Dhcp.className = "btn primary";
      btnIp4Static.className = "btn ghost";
      if (ip4StaticFields) ip4StaticFields.classList.add("hidden");
    };
    btnIp4Static.onclick = () => {
      state.createVpsState.ip4Type = "static";
      btnIp4Dhcp.className = "btn ghost";
      btnIp4Static.className = "btn primary";
      if (ip4StaticFields) {
        ip4StaticFields.classList.remove("hidden");
        const ipInp = $("#ip4AddressInput");
        if (ipInp) ipInp.focus();
      }
    };
  }

  const ip6Select = $("#createIp6Select");
  const ip6StaticFields = $("#ip6StaticFields");
  if (ip6Select && ip6StaticFields) {
    ip6Select.onchange = () => {
      state.createVpsState.ip6Type = ip6Select.value;
      if (ip6Select.value === "static") {
        ip6StaticFields.classList.remove("hidden");
        const ip6Inp = $("#ip6AddressInput");
        if (ip6Inp) ip6Inp.focus();
      } else {
        ip6StaticFields.classList.add("hidden");
      }
    };
  }

  const isoSelect = $("#createIsoSelect");
  const customIsoField = $("#customIsoField");
  const customIsoInput = $("#createCustomIsoInput");
  if (isoSelect && customIsoField) {
    isoSelect.onchange = () => {
      if (isoSelect.value === "__custom__") {
        customIsoField.classList.remove("hidden");
        if (customIsoInput) customIsoInput.focus();
      } else {
        customIsoField.classList.add("hidden");
        if (customIsoInput) customIsoInput.value = isoSelect.value;
      }
    };
  }

  const nodeSelect = $("#createNodeSelect");
  if (nodeSelect) {
    nodeSelect.onchange = () => {
      state.createVpsState.nodeId = Number(nodeSelect.value);
      createVpsPage(c, state.createVpsState.nodeId);
    };
  }

  const refreshBtn = $("#createVpsRefreshBtn");
  if (refreshBtn) {
    refreshBtn.onclick = () => createVpsPage(c, state.createVpsState.nodeId);
  }

  document.querySelectorAll(".quick-core").forEach(a => {
    a.onclick = () => {
      const inp = $("#createCoresInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-core").forEach(el => el.classList.remove("active"));
      a.classList.add("active");
    };
  });

  document.querySelectorAll(".quick-ram").forEach(a => {
    a.onclick = () => {
      const inp = $("#createMemoryInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-ram").forEach(el => el.classList.remove("active"));
      a.classList.add("active");
    };
  });

  document.querySelectorAll(".quick-disk").forEach(a => {
    a.onclick = () => {
      const inp = $("#createDiskInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-disk").forEach(el => el.classList.remove("active"));
      a.classList.add("active");
    };
  });

  document.querySelectorAll(".quick-swap").forEach(a => {
    a.onclick = () => {
      const inp = $("#createSwapInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-swap").forEach(el => el.classList.remove("active"));
      a.classList.add("active");
    };
  });

  const passInput = $("#createPassInput");
  const genBtn = $("#createGenPassBtn");
  const toggleBtn = $("#createTogglePassBtn");
  if (toggleBtn && passInput) {
    toggleBtn.onclick = () => {
      passInput.type = passInput.type === "password" ? "text" : "password";
    };
  }
  if (genBtn && passInput) {
    genBtn.onclick = () => {
      const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*";
      let generated = "";
      for (let i = 0; i < 16; i++) generated += chars.charAt(Math.floor(Math.random() * chars.length));
      passInput.value = generated;
      passInput.type = "text";
      try {
        navigator.clipboard.writeText(generated);
        toast("Strong password generated and copied to clipboard!");
      } catch {}
    };
  }

  const form = $("#createVpsForm");
  if (form) {
    form.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(form);
      const isQemu = state.createVpsState.type === "qemu";
      const isIso = isQemu && state.createVpsState.source === "iso";
      const isTemplate = !isIso;

      let isoVal = "";
      if (isIso) {
        const isoSel = fd.get("isoSelect");
        isoVal = (isoSel === "__custom__" || !isoSel) ? (fd.get("customIso") || "").trim() : isoSel;
        if (!isoVal) {
          toast("Please enter or select a bootable ISO volume ID.", "error");
          return;
        }
      }

      const payload = {
        nodeId: Number(fd.get("nodeId")),
        userId: Number(fd.get("userId")),
        type: state.createVpsState.type,
        source: state.createVpsState.source,
        vmid: Number(fd.get("vmid")),
        name: (fd.get("name") || "").trim(),
        cores: Number(fd.get("cores")),
        sockets: Number(fd.get("sockets") || 1),
        cpu: fd.get("cpu") || "host",
        numa: fd.get("numa") === "on" || fd.get("numa") === true,
        memory: Number(fd.get("memory")),
        balloon: fd.get("balloon") ? Number(fd.get("balloon")) : null,
        swap: Number(fd.get("swap") || 512),
        disk: Number(fd.get("disk")),
        storage: fd.get("storage"),
        diskBus: fd.get("diskBus") || "scsi",
        scsihw: fd.get("scsihw") || "virtio-scsi-single",
        diskCache: fd.get("diskCache") || "none",
        discard: fd.get("discard") === "on" || fd.get("discard") === true,
        ssd: fd.get("ssd") === "on" || fd.get("ssd") === true,
        iothread: fd.get("iothread") === "on" || fd.get("iothread") === true,
        machine: fd.get("machine") || "q35",
        bios: fd.get("bios") || "seabios",
        vga: fd.get("vga") || "std",
        bridge: fd.get("bridge"),
        netModel: fd.get("netModel") || "virtio",
        netifName: (fd.get("netifName") || "eth0").trim(),
        vlan: fd.get("vlan") ? Number(fd.get("vlan")) : null,
        mac: (fd.get("mac") || "").trim(),
        rateLimit: fd.get("rateLimit") ? Number(fd.get("rateLimit")) : null,
        firewall: fd.get("firewall") === "on" || fd.get("firewall") === true,
        ip4Type: state.createVpsState.ip4Type,
        ip4Address: (fd.get("ip4Address") || "").trim(),
        ip4Gateway: (fd.get("ip4Gateway") || "").trim(),
        ip6Type: state.createVpsState.ip6Type,
        ip6Address: (fd.get("ip6Address") || "").trim(),
        ip6Gateway: (fd.get("ip6Gateway") || "").trim(),
        searchDomain: (fd.get("searchDomain") || "").trim(),
        nameServers: (fd.get("nameServers") || "").trim(),
        ciUser: (fd.get("ciUser") || "root").trim(),
        password: (fd.get("password") || "").trim(),
        sshKey: (fd.get("sshKey") || "").trim(),
        unprivileged: fd.get("unprivileged") === "on" || fd.get("unprivileged") === true,
        nesting: fd.get("nesting") === "on" || fd.get("nesting") === true,
        keyctl: fd.get("keyctl") === "on" || fd.get("keyctl") === true,
        fuse: fd.get("fuse") === "on" || fd.get("fuse") === true,
        onboot: fd.get("onboot") === "on" || fd.get("onboot") === true,
        ciUpgrade: fd.get("ciUpgrade") === "on" || fd.get("ciUpgrade") === true,
        qemuAgent: fd.get("qemuAgent") === "on" || fd.get("qemuAgent") === true,
        start: fd.get("start") === "on" || fd.get("start") === true,
        templateId: fd.get("templateId"),
        iso: isoVal,
        osType: fd.get("osType") || "l26"
      };

      if (isTemplate && (!payload.password || payload.password.length < 8)) {
        toast("Root password must be at least 8 characters.", "error");
        return;
      }
      if (state.createVpsState.ip4Type === "static" && !payload.ip4Address) {
        toast("Please enter static IPv4 address and CIDR (e.g. 192.168.1.50/24).", "error");
        return;
      }
      if (state.createVpsState.ip6Type === "static") {
        if (!payload.ip6Address) {
          toast("Please enter static IPv6 address and CIDR (e.g. 2001:db8::50/64).", "error");
          return;
        }
        if (payload.ip6Address.includes(".") && !payload.ip6Address.includes(":")) {
          toast("Invalid IPv6 Address! You entered an IPv4 address in IPv6 field. Please use IPv4 section above.", "error");
          return;
        }
        if (payload.ip6Gateway && payload.ip6Gateway.includes(".") && !payload.ip6Gateway.includes(":")) {
          toast("Invalid IPv6 Gateway! You entered an IPv4 gateway in IPv6 Gateway field. Please use IPv4 section above.", "error");
          return;
        }
      }

      const submitBtn = $("#createSubmitBtn");
      const notice = $("#createProgressNotice");
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `${ico("spinner", "spin")} Deploying VPS in Proxmox…`;
      }
      if (notice) {
        notice.classList.remove("hidden");
        notice.scrollIntoView({ behavior: "smooth" });
      }

      toast("Deploying virtual server! This takes 30-50 seconds…");
      try {
        const res = await api("/admin/servers/create", { method: "POST", body: JSON.stringify(payload) });
        toast(res.message || `Virtual server "${res.name}" (VMID ${res.vmid}) created successfully!`);
        state.currentServerId = res.id;
        state.page = "vps";
        state.vpsTab = "specs";
        await renderPage();
      } catch (err) {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `${ico("zap")} Deploy ${isQemu ? 'Virtual Machine' : 'LXC Container'}`;
        }
        if (notice) {
          notice.classList.add("hidden");
        }
        toast(err.message, "error");
      }
    };
  }
}

async function assignModal() {
  try {
    const [u, n] = await Promise.all([api("/admin/users"), api("/admin/nodes")]);
    const enabledNodes = n.nodes.filter(x => x.enabled);
    if (!enabledNodes.length) {
      toast("No enabled Proxmox nodes found. Please add or enable a node first.", "error");
      return;
    }
    showModal(`<div class="modal-head"><h3>Assign existing VPS</h3><button class="close" data-close>×</button></div><form id="assignForm"><div class="field"><label>Panel user</label><select name="userId" required>${u.users.filter(x => x.active).map(x => `<option value="${x.id}">${esc(x.username)} (${esc(x.email)})</option>`).join("")}</select></div><div class="field"><label>Proxmox node</label><select name="nodeId" id="assignNodeSelect" required>${enabledNodes.map(x => `<option value="${x.id}">${esc(x.name)} · ${esc(x.host)}</option>`).join("")}</select></div><div id="discoveredVmsWrap" class="small muted" style="margin-bottom:12px"></div><div class="form-grid"><div class="field"><label>VMID</label><input name="vmid" id="assignVmid" type="number" min="100" required></div><div class="field"><label>Type</label><select name="type" id="assignType"><option value="qemu">KVM / QEMU</option><option value="lxc">LXC</option></select></div></div><div class="field"><label>Display name</label><input name="name" id="assignName" required></div><button class="btn primary" style="width:100%;margin-top:10px">Verify and assign</button></form>`);
    const loadResources = async () => {
      const selNodeId = $("#assignNodeSelect")?.value;
      const wrap = $("#discoveredVmsWrap");
      if (!selNodeId || !wrap) return;
      wrap.textContent = "Scanning node for available VMs/containers…";
      try {
        const r = await api(`/admin/proxmox/nodes/${selNodeId}/resources`);
        if (r.resources && r.resources.length) {
          wrap.innerHTML = `<label style="display:block;margin-bottom:6px;color:#aaa">Detected on node (click to select):</label><div style="display:flex;gap:6px;flex-wrap:wrap">${r.resources.map(vm => `<button type="button" class="btn small" style="padding:4px 8px;font-size:11px" data-pick-vmid="${vm.vmid}" data-pick-type="${vm.type}" data-pick-name="${esc(vm.name || ('VM ' + vm.vmid))}">${vm.type.toUpperCase()} ${vm.vmid} (${esc(vm.name || 'unnamed')})</button>`).join("")}</div>`;
          wrap.querySelectorAll("[data-pick-vmid]").forEach(btn => {
            btn.onclick = () => {
              if ($("#assignVmid")) $("#assignVmid").value = btn.dataset.pickVmid;
              if ($("#assignType")) $("#assignType").value = btn.dataset.pickType;
              if ($("#assignName")) $("#assignName").value = btn.dataset.pickName;
            };
          });
        } else {
          wrap.textContent = "No VMs/containers detected on this node (or token lacks cluster audit permissions). You can enter the VMID manually below.";
        }
      } catch (e) {
        wrap.textContent = "Could not auto-list VMs: " + e.message + ". You can enter VMID manually below.";
      }
    };
    const nodeSel = $("#assignNodeSelect");
    if (nodeSel) { nodeSel.onchange = loadResources; loadResources(); }
    $("#assignForm").onsubmit = async e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(e.target));
      d.userId = Number(d.userId);
      d.nodeId = Number(d.nodeId);
      d.vmid = Number(d.vmid);
      try {
        await api("/admin/servers/assign", { method: "POST", body: JSON.stringify(d) });
        $("#modalRoot").innerHTML = "";
        toast("VPS assigned successfully.");
        state.page = "servers";
        await renderPage();
      } catch (err) { toast(err.message, "error"); }
    };
  } catch (e) { toast(e.message, "error"); }
}

async function unassign(id, name, vmid) {
  const s = (state.servers || []).find(x => x.id === id);
  const sName = name || (s ? s.name : `VPS #${id}`);
  const sVmid = vmid || (s ? s.vmid : "");
  const label = sVmid ? `"${sName}" (VMID ${sVmid})` : `"${sName}"`;
  const ok = await modalConfirm({
    title: "Remove VPS Assignment",
    subtitle: label,
    message: `Are you sure you want to remove user assignment for ${label}?`,
    details: [
      "The VPS will be unlinked from the user in this panel.",
      "The Proxmox VE VM/container will NOT be deleted or stopped.",
      'You can re-assign it at any time from the "Assign VPS" page.'
    ],
    confirmText: "Remove Assignment",
    type: "warning",
    icon: "ban"
  });
  if (!ok) return;
  try {
    const res = await api(`/admin/servers/${id}/assignment`, { method: "DELETE", body: "{}" });
    toast(`Assignment removed for ${label}.`);
    if (state.page === "vps") {
      state.page = "servers";
    }
    await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

      <!-- RIGHT COLUMN: PASSWORD & SECURITY -->

            </div>

              <div class="resource-head">
                <span>CSRF Token Verification</span>

              </div>

function initProfileControllers() {
  const inpUsername = $("#profile_username_input");
  const inpEmail = $("#profile_email_input");
  const inpAvatarUrl = $("#profile_avatar_url_input");
  const inpCurrentPwd = $("#profile_current_password");
  const inpNewPwd = $("#profile_new_password");
  const inpConfirmPwd = $("#profile_confirm_password");
  const clearAvatarBtn = $("#clearAvatarBtn");
  const avatarThumbBox = $("#avatarThumbBox");
  const avatarStatusText = $("#avatarStatusText");
  const avatarUrlPreview = $("#avatarUrlPreview");
  const heroAvatar = $("#profileHeroAvatar");
  const saveBtn = $("#saveProfileBtn");

  // Sync avatar previews
  const updateAvatarPreview = (url) => {
    const trimmed = (url || "").trim();
    const username = inpUsername?.value?.trim() || state.user?.username || "U";
    const initial = username[0].toUpperCase();

    if (trimmed) {
      if (avatarThumbBox) {
        avatarThumbBox.innerHTML = `<img src="${esc(trimmed)}" alt="Avatar" style="width:100%;height:100%;object-fit:cover" onerror="this.outerHTML='<span class=\\'brand-mark\\' style=\\'width:48px;height:48px;font-size:18px\\'>${esc(initial)}</span>'">`;
      }
      if (heroAvatar) {
        heroAvatar.innerHTML = `<img src="${esc(trimmed)}" class="profile-avatar-large" alt="Avatar" onerror="this.outerHTML='<span class=\\'profile-avatar-large\\'>${esc(initial)}</span>'">`;
      }
      if (avatarStatusText) avatarStatusText.textContent = "Custom Avatar Set";
      if (avatarUrlPreview) avatarUrlPreview.textContent = trimmed;
      if (clearAvatarBtn) clearAvatarBtn.style.display = "inline-flex";
    } else {
      if (avatarThumbBox) {
        avatarThumbBox.innerHTML = `<span class="brand-mark" style="width:48px;height:48px;font-size:18px">${esc(initial)}</span>`;
      }
      if (heroAvatar) {
        heroAvatar.innerHTML = `<span>${esc(initial)}</span>`;
      }
      if (avatarStatusText) avatarStatusText.textContent = "Default Monogram Active";
      if (avatarUrlPreview) avatarUrlPreview.textContent = "Shows user initial monogram letter when empty.";
      if (clearAvatarBtn) clearAvatarBtn.style.display = "none";
    }
  };

  // URL Input listener
  if (inpAvatarUrl) {
    inpAvatarUrl.addEventListener("input", () => {
      updateAvatarPreview(inpAvatarUrl.value);
    });
  }

  // Clear avatar button
  if (clearAvatarBtn) {
    clearAvatarBtn.onclick = () => {
      if (inpAvatarUrl) inpAvatarUrl.value = "";
      updateAvatarPreview("");
      toast("Custom avatar cleared. Monogram restored.", "info");
    };
  }

  // Avatar mode tabs (URL vs Upload)
  $$("#avatarModeTabs .image-mode-btn").forEach(btn => {
    btn.onclick = () => {
      $$("#avatarModeTabs .image-mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const mode = btn.dataset.mode;
      const urlBox = $("#mode_avatar_url");
      const uploadBox = $("#mode_avatar_upload");
      if (urlBox) urlBox.style.display = mode === "url" ? "block" : "none";
      if (uploadBox) uploadBox.style.display = mode === "upload" ? "block" : "none";
    };
  });

  // Dropzone and file upload
  const dropzone = $("#dropzone_avatar");
  const fileInp = $("#file_avatar_input");

  const handleAvatarUpload = async (file) => {
    if (!file) return;
    if (!file.type.match(/^image\/(png|jpeg|jpg|webp|svg\+xml)$/i)) {
      return toast("Please upload a PNG, JPG, WEBP, or SVG image file.", "error");
    }
    if (file.size > 5 * 1024 * 1024) {
      return toast("Image size exceeds maximum limit of 5MB.", "error");
    }

    const origText = dropzone?.querySelector(".dropzone-text")?.textContent;
    if (dropzone) {
      dropzone.classList.add("uploading");
      const dt = dropzone.querySelector(".dropzone-text");
      if (dt) dt.innerHTML = `${ico("spinner", "spin sm")} Uploading avatar…`;
    }

    try {
      const reader = new FileReader();
      const base64Promise = new Promise((resolve, reject) => {
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
      });
      reader.readAsDataURL(file);
      const dataUrl = await base64Promise;

      const res = await api("/user/avatar/upload", {
        method: "POST",
        body: JSON.stringify({ data: dataUrl })
      });

      if (!res.url) throw new Error("Upload did not return image URL");

      if (inpAvatarUrl) inpAvatarUrl.value = res.url;
      updateAvatarPreview(res.url);

      // Update state and active DOM elements immediately
      state.user.avatar_url = res.url;
      updateDomAvatars(res.url);

      toast("Avatar uploaded and updated successfully!", "success");
    } catch (err) {
      toast(err.message || "Avatar upload failed.", "error");
    } finally {
      if (dropzone) {
        dropzone.classList.remove("uploading");
        const dt = dropzone.querySelector(".dropzone-text");
        if (dt && origText) dt.textContent = origText;
      }
    }
  };

  if (dropzone && fileInp) {
    dropzone.onclick = () => fileInp.click();
    fileInp.onchange = (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) handleAvatarUpload(file);
    };
    dropzone.ondragover = (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    };
    dropzone.ondragleave = () => dropzone.classList.remove("dragover");
    dropzone.ondrop = (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) handleAvatarUpload(file);
    };
  }

  // Password Show/Hide Eye Toggles
  $$(".toggle-pwd-btn").forEach(btn => {
    btn.onclick = () => {
      const targetId = btn.dataset.target;
      const inp = $(`#${targetId}`);
      if (!inp) return;
      const isPwd = inp.type === "password";
      inp.type = isPwd ? "text" : "password";
      btn.innerHTML = ico(isPwd ? "eyeOff" : "eye", "sm");
    };
  });

  // Password Generator
  const genBtn = $("#generateProfilePwdBtn");
  if (genBtn) {
    genBtn.onclick = () => {
      const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*+?";
      let pwd = "";
      const randArr = new Uint32Array(16);
      window.crypto.getRandomValues(randArr);
      for (let i = 0; i < 16; i++) {
        pwd += chars[randArr[i] % chars.length];
      }
      if (inpNewPwd) {
        inpNewPwd.value = pwd;
        inpNewPwd.type = "text";
      }
      if (inpConfirmPwd) {
        inpConfirmPwd.value = pwd;
        inpConfirmPwd.type = "text";
      }
      $$(".toggle-pwd-btn[data-target='profile_new_password'], .toggle-pwd-btn[data-target='profile_confirm_password']").forEach(b => {
        b.innerHTML = ico("eyeOff", "sm");
      });
      toast("Generated strong random password!", "info");
    };
  }

  // End Session button in Card 5
  const logoutBtn = $("#profileLogoutBtn");
  if (logoutBtn) {
    logoutBtn.onclick = logout;
  }

  // Helper to update topbar and sidebar avatars in real time
  function updateDomAvatars(avatarUrl) {
    const topbarAvatarBtn = $("#topbarAvatarBtn");
    if (topbarAvatarBtn) {
      topbarAvatarBtn.innerHTML = renderUserAvatar({ ...state.user, avatar_url: avatarUrl }, "avatar");
    }
    const sideAvatar = $(".sidebar .user-mini .avatar");
    if (sideAvatar) {
      sideAvatar.outerHTML = renderUserAvatar({ ...state.user, avatar_url: avatarUrl }, "avatar");
    }
    const sideUsername = $("#sidebarUsername");
    if (sideUsername && inpUsername?.value) {
      sideUsername.textContent = inpUsername.value.trim();
    }
  }

  // Save Profile Changes
  if (saveBtn) {
    saveBtn.onclick = async () => {
      const username = inpUsername?.value?.trim() || "";
      const email = inpEmail?.value?.trim() || "";
      const avatar_url = inpAvatarUrl?.value?.trim() || "";
      const current_password = inpCurrentPwd?.value || "";
      const new_password = inpNewPwd?.value || "";
      const confirm_password = inpConfirmPwd?.value || "";

      if (!username || username.length < 3 || username.length > 32) {
        return toast("Username must be between 3 and 32 characters.", "error");
      }
      if (!email || !email.includes("@")) {
        return toast("Please provide a valid email address.", "error");
      }

      // Password change validation
      if (new_password || confirm_password || current_password) {
        if (!current_password) {
          inpCurrentPwd?.focus();
          return toast("Please enter your Current Password to authorize a password change.", "error");
        }
        if (!new_password || new_password.length < 6) {
          inpNewPwd?.focus();
          return toast("New password must be at least 6 characters long.", "error");
        }
        if (new_password !== confirm_password) {
          inpConfirmPwd?.focus();
          return toast("New password and Confirm password do not match.", "error");
        }
      }

      saveBtn.disabled = true;
      const origHtml = saveBtn.innerHTML;
      saveBtn.innerHTML = `${ico("spinner", "spin sm")} Saving Changes…`;

      try {
        const payload = {
          username,
          email,
          avatar_url
        };
        if (new_password && current_password) {
          payload.current_password = current_password;
          payload.new_password = new_password;
        }

        const res = await api("/user/profile", {
          method: "PATCH",
          body: JSON.stringify(payload)
        });

        state.user = res.user;

        // Clear password fields
        if (inpCurrentPwd) inpCurrentPwd.value = "";
        if (inpNewPwd) {
          inpNewPwd.value = "";
          inpNewPwd.type = "password";
        }
        if (inpConfirmPwd) {
          inpConfirmPwd.value = "";
          inpConfirmPwd.type = "password";
        }
        $$(".toggle-pwd-btn").forEach(b => {
          b.innerHTML = ico("eye", "sm");
        });

        // Update DOM elements in sidebar, topbar, and hero
        updateDomAvatars(res.user.avatar_url);
        const heroU = $("#heroUsername");
        if (heroU) heroU.textContent = res.user.username;
        const heroE = $("#heroEmail");
        if (heroE) heroE.textContent = res.user.email || "No email registered";

        toast("Profile settings saved successfully!", "success");
      } catch (err) {
        toast(err.message, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = origHtml;
      }
    };
  }
}
