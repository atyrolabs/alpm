        </div>
      </div>

      <!-- 10. Startup, Agent & Lifecycle -->
      <div class="panel">
        <div class="panel-title"><h3>${isLxc ? '10' : (isTemplate ? '9' : '8')}. Startup, Agent & Lifecycle</h3></div>
        <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:8px">
            <input type="checkbox" name="onboot" id="onbootCheck" checked style="width:auto;cursor:pointer">
            <label for="onbootCheck" style="font-size:13px;color:#eee;cursor:pointer">
              <b>Start at host boot (<code>onboot=1</code>)</b>: Automatically start this virtual server when physical Proxmox host reboots
            </label>
          </div>

          ${isQemu && isTemplate ? `
            <div style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" name="ciUpgrade" id="ciUpgradeCheck" style="width:auto;cursor:pointer">
              <label for="ciUpgradeCheck" style="font-size:13px;color:#eee;cursor:pointer">
                Upgrade packages on first boot (<code>ciupgrade=1</code> via Cloud-Init)
              </label>
            </div>
          ` : ''}

          ${isQemu ? `
            <div style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" name="qemuAgent" id="qemuAgentCheck" checked style="width:auto;cursor:pointer">
              <label for="qemuAgentCheck" style="font-size:13px;color:#eee;cursor:pointer">
                Enable QEMU Guest Agent (<code>agent=1</code>) for live memory, disk and IP metric monitoring
              </label>
            </div>
          ` : ''}

          <div style="display:flex;align-items:center;gap:8px">
            <input type="checkbox" name="start" id="createStartCheck" checked style="width:auto;cursor:pointer">
            <label for="createStartCheck" style="font-size:13px;color:#eee;cursor:pointer">
              ${ico("rocket", "sm")} <b>Power on virtual server immediately</b> after creation completes
            </label>
          </div>
        </div>
      </div>

      <!-- Execution Submit -->
      <div style="display:flex;gap:12px;align-items:center;margin-top:4px">
        <button type="submit" class="btn primary" id="createSubmitBtn" style="padding:13px 34px;font-size:14px;font-weight:700">
          ${ico("zap")} Deploy ${isQemu ? 'Virtual Machine' : 'LXC Container'}
        </button>
        <button type="button" class="btn ghost" data-page="servers" style="padding:13px 20px">Cancel</button>
      </div>

      <div id="createProgressNotice" class="hidden notice" style="border-color:rgba(34,197,94,0.2);background:rgba(34,197,94,0.05);color:#86efac;padding:16px;border-radius:12px">
        <div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px">
          <span>${ico("spinner", "spin")}</span> Deployment in progress…
        </div>
        <div style="font-size:12px;margin-top:6px;line-height:1.5">
          Proxmox is allocating disk storage, configuring Cloud-Init/container network and DNS settings, and deploying the instance. Please wait 25-50 seconds…
        </div>
      </div>
    </form>
  `;

  setupCreateVpsEvents(c, d);
}

function setupCreateVpsEvents(c, d) {
  // Duration dropdown change (Custom Days toggle)
  const createDurSel = $("#createDurationSelect");
  if (createDurSel) {
    createDurSel.onchange = () => {
      const wrap = $("#createCustomDurationWrap");
      if (wrap) {
        wrap.style.display = createDurSel.value === "custom" ? "block" : "none";
        if (createDurSel.value === "custom") {
          const inp = $("#createCustomDays");
          if (inp) inp.focus();
        }
      }
    };
  }

  const selQemu = $("#selectTypeQemu");
  const selLxc = $("#selectTypeLxc");
  if (selQemu) selQemu.onclick = () => { state.createVpsState.type = "qemu"; renderCreateVpsForm(c, d); };
  if (selLxc) selLxc.onclick = () => { state.createVpsState.type = "lxc"; state.createVpsState.source = "template"; renderCreateVpsForm(c, d); };

  const btnTemplate = $("#btnSourceTemplate");
  const btnIso = $("#btnSourceIso");
  if (btnTemplate) btnTemplate.onclick = () => { state.createVpsState.source = "template"; renderCreateVpsForm(c, d); };
  if (btnIso) btnIso.onclick = () => { state.createVpsState.source = "iso"; renderCreateVpsForm(c, d); };

  // Live bridge details box updater
  const bridgeSelect = $("#createBridgeSelect");
  const updateBridgeInfo = () => {
    const box = $("#bridgeInfoBox");
    if (!box || !bridgeSelect) return;
    const bridgeVal = bridgeSelect.value;
    const found = (d.bridges || []).find(b => (typeof b === "object" ? b.iface : b) === bridgeVal);
    if (!found || typeof found !== "object") {
      box.innerHTML = `<span style="color:#aaa">${ico("network", "sm")} Selected Bridge: <b>${esc(bridgeVal)}</b></span>`;
      return;
    }
    box.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="display:inline-flex;color:var(--accent)">${ico("network", "sm")}</span>
        <b style="color:white">${esc(found.iface)}</b>
        <span class="tag" style="background:rgba(34,197,94,0.15);color:#4ade80;border-color:rgba(34,197,94,0.3)">${found.active ? 'Active' : 'Configured'}</span>
        ${found.ports ? `<span class="tag" style="background:rgba(255,255,255,0.06);color:#bbb">Physical Port: <b>${esc(found.ports)}</b></span>` : ''}
        ${found.cidr ? `<span class="tag" style="background:rgba(99,102,241,0.12);color:var(--accent)">Subnet: <b>${esc(found.cidr)}</b></span>` : ''}
        ${found.gateway ? `<span class="tag" style="background:rgba(234,179,8,0.12);color:#fbbf24">Default Gateway: <b>${esc(found.gateway)}</b></span>` : ''}
        ${found.comment ? `<span class="small muted">(${esc(found.comment)})</span>` : ''}
      </div>
    `;
  };
  if (bridgeSelect) {
    bridgeSelect.onchange = updateBridgeInfo;
    updateBridgeInfo();
  }

  const btnIp4Dhcp = $("#btnIp4Dhcp");
  const btnIp4Static = $("#btnIp4Static");
  const ip4StaticFields = $("#ip4StaticFields");
  if (btnIp4Dhcp && btnIp4Static) {
    btnIp4Dhcp.onclick = () => {
      state.createVpsState.ip4Type = "dhcp";
      btnIp4Dhcp.className = "btn primary";
      btnIp4Static.className = "btn ghost";
      if (ip4StaticFields) ip4StaticFields.classList.add("hidden");
    };
    btnIp4Static.onclick = () => {
      state.createVpsState.ip4Type = "static";
      btnIp4Dhcp.className = "btn ghost";
      btnIp4Static.className = "btn primary";
      if (ip4StaticFields) {
        ip4StaticFields.classList.remove("hidden");
        const ipInp = $("#ip4AddressInput");
        if (ipInp) ipInp.focus();
      }
    };
  }

  const ip6Select = $("#createIp6Select");
  const ip6StaticFields = $("#ip6StaticFields");
  if (ip6Select && ip6StaticFields) {
    ip6Select.onchange = () => {
      state.createVpsState.ip6Type = ip6Select.value;
      if (ip6Select.value === "static") {
        ip6StaticFields.classList.remove("hidden");
        const ip6Inp = $("#ip6AddressInput");
        if (ip6Inp) ip6Inp.focus();
      } else {
        ip6StaticFields.classList.add("hidden");
      }
    };
  }

  const isoSelect = $("#createIsoSelect");
  const customIsoField = $("#customIsoField");
  const customIsoInput = $("#createCustomIsoInput");
  if (isoSelect && customIsoField) {
    isoSelect.onchange = () => {
      if (isoSelect.value === "__custom__") {
        customIsoField.classList.remove("hidden");
        if (customIsoInput) customIsoInput.focus();
      } else {
        customIsoField.classList.add("hidden");
        if (customIsoInput) customIsoInput.value = isoSelect.value;
      }
    };
  }

  const nodeSelect = $("#createNodeSelect");
  if (nodeSelect) {
    nodeSelect.onchange = () => {
      state.createVpsState.nodeId = Number(nodeSelect.value);
      createVpsPage(c, state.createVpsState.nodeId);
    };
  }

  const refreshBtn = $("#createVpsRefreshBtn");
  if (refreshBtn) {
    refreshBtn.onclick = () => createVpsPage(c, state.createVpsState.nodeId);
  }

  document.querySelectorAll(".quick-core").forEach(a => {
    a.onclick = () => {
      const inp = $("#createCoresInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-core").forEach(el => el.classList.remove("active"));
      a.classList.add("active");
    };
  });

  document.querySelectorAll(".quick-ram").forEach(a => {
    a.onclick = () => {
      const inp = $("#createMemoryInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-ram").forEach(el => el.classList.remove("active"));
      a.classList.add("active");
    };
  });

  document.querySelectorAll(".quick-disk").forEach(a => {
    a.onclick = () => {
      const inp = $("#createDiskInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-disk").forEach(el => el.classList.remove("active"));
      a.classList.add("active");
    };
  });

  document.querySelectorAll(".quick-swap").forEach(a => {
    a.onclick = () => {
      const inp = $("#createSwapInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-swap").forEach(el => el.classList.remove("active"));
      a.classList.add("active");
    };
  });

  const passInput = $("#createPassInput");
  const genBtn = $("#createGenPassBtn");
  const toggleBtn = $("#createTogglePassBtn");
  if (genBtn && passInput) {
    genBtn.onclick = () => {
      const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*";
      let generated = "";
      for (let i = 0; i < 16; i++) generated += chars.charAt(Math.floor(Math.random() * chars.length));
      passInput.value = generated;
      revealPasswordInput(passInput, toggleBtn);
      try {
        navigator.clipboard.writeText(generated);
        toast("Strong password generated and copied to clipboard!");
      } catch {}
    };
  }

  const form = $("#createVpsForm");
  if (form) {
    form.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(form);
      const isQemu = state.createVpsState.type === "qemu";
      const isIso = isQemu && state.createVpsState.source === "iso";
      const isTemplate = !isIso;

      let isoVal = "";
      if (isIso) {
        const isoSel = fd.get("isoSelect");
        isoVal = (isoSel === "__custom__" || !isoSel) ? (fd.get("customIso") || "").trim() : isoSel;
        if (!isoVal) {
          toast("Please enter or select a bootable ISO volume ID.", "error");
          return;
        }
      }

      let createDurationDaysVal = fd.get("duration_days");
      if (createDurationDaysVal === "custom") {
        createDurationDaysVal = Number($("#createCustomDays")?.value || 0);
      } else {
        createDurationDaysVal = Number(createDurationDaysVal || 0);
      }

      const payload = {
        nodeId: Number(fd.get("nodeId")),
        userId: Number(fd.get("userId")),
        type: state.createVpsState.type,
        duration_days: createDurationDaysVal,
        source: state.createVpsState.source,
        vmid: Number(fd.get("vmid")),
        name: (fd.get("name") || "").trim(),
        cores: Number(fd.get("cores")),
        sockets: Number(fd.get("sockets") || 1),
        cpu: fd.get("cpu") || "host",
        numa: fd.get("numa") === "on" || fd.get("numa") === true,
        memory: Number(fd.get("memory")),
        balloon: fd.get("balloon") ? Number(fd.get("balloon")) : null,
        swap: Number(fd.get("swap") || 512),
        disk: Number(fd.get("disk")),
        storage: fd.get("storage"),
        diskBus: fd.get("diskBus") || "scsi",
        scsihw: fd.get("scsihw") || "virtio-scsi-single",
        diskCache: fd.get("diskCache") || "none",
        discard: fd.get("discard") === "on" || fd.get("discard") === true,
        ssd: fd.get("ssd") === "on" || fd.get("ssd") === true,
        iothread: fd.get("iothread") === "on" || fd.get("iothread") === true,
        machine: fd.get("machine") || "q35",
        bios: fd.get("bios") || "seabios",
        vga: fd.get("vga") || "std",
        bridge: fd.get("bridge"),
        netModel: fd.get("netModel") || "virtio",
        netifName: (fd.get("netifName") || "eth0").trim(),
        vlan: fd.get("vlan") ? Number(fd.get("vlan")) : null,
        mac: (fd.get("mac") || "").trim(),
        rateLimit: fd.get("rateLimit") ? Number(fd.get("rateLimit")) : null,
        firewall: fd.get("firewall") === "on" || fd.get("firewall") === true,
        ip4Type: state.createVpsState.ip4Type,
        ip4Address: (fd.get("ip4Address") || "").trim(),
        ip4Gateway: (fd.get("ip4Gateway") || "").trim(),
        ip6Type: state.createVpsState.ip6Type,
        ip6Address: (fd.get("ip6Address") || "").trim(),
        ip6Gateway: (fd.get("ip6Gateway") || "").trim(),
        searchDomain: (fd.get("searchDomain") || "").trim(),
        nameServers: (fd.get("nameServers") || "").trim(),
        ciUser: (fd.get("ciUser") || "root").trim(),
        password: (fd.get("password") || "").trim(),
        sshKey: (fd.get("sshKey") || "").trim(),
        unprivileged: fd.get("unprivileged") === "on" || fd.get("unprivileged") === true,
        nesting: fd.get("nesting") === "on" || fd.get("nesting") === true,
        keyctl: fd.get("keyctl") === "on" || fd.get("keyctl") === true,
        fuse: fd.get("fuse") === "on" || fd.get("fuse") === true,
        onboot: fd.get("onboot") === "on" || fd.get("onboot") === true,
        ciUpgrade: fd.get("ciUpgrade") === "on" || fd.get("ciUpgrade") === true,
        qemuAgent: fd.get("qemuAgent") === "on" || fd.get("qemuAgent") === true,
        start: fd.get("start") === "on" || fd.get("start") === true,
        templateId: fd.get("templateId"),
        iso: isoVal,
        osType: fd.get("osType") || "l26"
      };

      if (isTemplate && (!payload.password || payload.password.length < 8)) {
        toast("Root password must be at least 8 characters.", "error");
        return;
      }
      if (state.createVpsState.ip4Type === "static" && !payload.ip4Address) {
        toast("Please enter static IPv4 address and CIDR (e.g. 192.168.1.50/24).", "error");
        return;
      }
      if (state.createVpsState.ip6Type === "static") {
        if (!payload.ip6Address) {
          toast("Please enter static IPv6 address and CIDR (e.g. 2001:db8::50/64).", "error");
          return;
        }
        if (payload.ip6Address.includes(".") && !payload.ip6Address.includes(":")) {
          toast("Invalid IPv6 Address! You entered an IPv4 address in IPv6 field. Please use IPv4 section above.", "error");
          return;
        }
        if (payload.ip6Gateway && payload.ip6Gateway.includes(".") && !payload.ip6Gateway.includes(":")) {
          toast("Invalid IPv6 Gateway! You entered an IPv4 gateway in IPv6 Gateway field. Please use IPv4 section above.", "error");
          return;
        }
      }

      const submitBtn = $("#createSubmitBtn");
      const notice = $("#createProgressNotice");
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `${ico("spinner", "spin")} Deploying VPS in Proxmox…`;
      }
      if (notice) {
        notice.classList.remove("hidden");
        notice.scrollIntoView({ behavior: "smooth" });
      }

      toast("Deploying virtual server! This takes 30-50 seconds…");
      try {
        const res = await api("/admin/servers/create", { method: "POST", body: JSON.stringify(payload) });
        toast(res.message || `Virtual server "${res.name}" (VMID ${res.vmid}) created successfully!`);
        state.currentServerId = res.id;
        state.page = "vps";
        state.vpsTab = "specs";
        await renderPage();
      } catch (err) {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `${ico("zap")} Deploy ${isQemu ? 'Virtual Machine' : 'LXC Container'}`;
        }
        if (notice) {
          notice.classList.add("hidden");
        }
        toast(err.message, "error");
      }
    };
  }
}

// --- VM Templates Management System ---

async function templatesPage(c) {
  try {
    const d = await api("/admin/templates");
    const templates = d.templates || [];
    renderTemplatesList(c, templates);
  } catch (err) {
    c.innerHTML = `<div class="panel"><div class="empty">Error loading VM templates: ${esc(err.message)}<br><br><button class="btn ghost" data-action="refresh">${ico("refresh")} Try again</button></div></div>`;
    toast(err.message, "error");
  }
}

function renderTemplatesList(c, templates) {
  const lxcCount = templates.filter(t => t.type === "lxc").length;
  const qemuCount = templates.filter(t => t.type === "qemu").length;
  const totalIps = templates.reduce((acc, t) => acc + (t.total_ips || 0), 0);
  const availIps = templates.reduce((acc, t) => acc + (t.available_ips || 0), 0);
  const usedIps = templates.reduce((acc, t) => acc + (t.used_ips || 0), 0);

  const filterType = state.templateFilterType || "all";
  const search = (state.templateSearchQuery || "").toLowerCase().trim();

  let filtered = templates;
  if (filterType === "lxc") filtered = filtered.filter(t => t.type === "lxc");
  else if (filterType === "qemu") filtered = filtered.filter(t => t.type === "qemu");

  if (search) {
    filtered = filtered.filter(t =>
      (t.name || "").toLowerCase().includes(search) ||
      (t.description || "").toLowerCase().includes(search) ||
      (t.template_source || "").toLowerCase().includes(search) ||
      (t.node_name || "").toLowerCase().includes(search) ||
      (t.next_ip || "").toLowerCase().includes(search)
    );
  }

  c.innerHTML = `
    <div class="page-head">
      <div>
        <h1>${ico("layers")} VM Templates Management</h1>
        <p>Create, configure, and manage standardized LXC and QEMU virtual machine configurations with real-time Proxmox resources and dedicated IP pools.</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn primary" data-action="create-template">${ico("plus")} Create Template</button>
        <button class="btn ghost" data-action="refresh">${ico("refresh")} Refresh</button>
      </div>
    </div>

    <div class="grid stats" style="margin-bottom:20px">
      <div class="stat">
        <div class="stat-top">Total Templates <span class="stat-icon" style="color:var(--accent)">${ico("layers")}</span></div>
        <div class="stat-value">${templates.length}</div>
        <div class="small muted" style="margin-top:4px">Standard configurations</div>
      </div>
      <div class="stat">
        <div class="stat-top">LXC Containers <span class="stat-icon" style="color:var(--blue)">${ico("lxc")}</span></div>
        <div class="stat-value">${lxcCount}</div>
        <div class="small muted" style="margin-top:4px">Linux OS containers</div>
      </div>
      <div class="stat">
        <div class="stat-top">QEMU Virtual Machines <span class="stat-icon" style="color:var(--purple)">${ico("kvm")}</span></div>
        <div class="stat-value">${qemuCount}</div>
        <div class="small muted" style="margin-top:4px">Full KVM virtualization</div>
      </div>
      <div class="stat">
        <div class="stat-top">Dedicated IP Pools <span class="stat-icon" style="color:var(--green)">${ico("network")}</span></div>
        <div class="stat-value" style="font-size:22px;display:flex;gap:10px;align-items:baseline">
          <span style="color:#4ade80">${availIps} <span class="small" style="font-size:12px;color:var(--muted)">Avail</span></span>
          <span style="color:#fbbf24">${usedIps} <span class="small" style="font-size:12px;color:var(--muted)">Used</span></span>
        </div>
        <div class="small muted" style="margin-top:4px">${totalIps} total pooled IPs</div>
      </div>
    </div>

    <!-- Search & Filter Bar -->
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:260px">
        <input type="text" id="templateSearchInput" value="${esc(state.templateSearchQuery || '')}" placeholder="Search templates by name, OS, node, or IP..." style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:#fff;font-size:13px;width:100%">
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="preset-chip ${filterType === 'all' ? 'active' : ''}" data-tmpl-filter="all">All (${templates.length})</button>
        <button class="preset-chip ${filterType === 'lxc' ? 'active' : ''}" data-tmpl-filter="lxc">${ico("lxc", "sm")} LXC Containers (${lxcCount})</button>
        <button class="preset-chip ${filterType === 'qemu' ? 'active' : ''}" data-tmpl-filter="qemu">${ico("kvm", "sm")} QEMU Virtual Machines (${qemuCount})</button>
      </div>
    </div>

    <!-- Templates Grid -->
    ${filtered.length === 0 ? `
      <div class="panel">
        <div class="empty">
          ${search ? `No templates matched your search "<b>${esc(search)}</b>".` : 'No VM templates configured in this category.'}
          <br><br>
          <button class="btn primary" data-action="create-template">${ico("plus")} Create New Template</button>
        </div>
      </div>
    ` : `
      <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(360px, 1fr));gap:18px">
        ${filtered.map(t => {
          const isLxc = t.type === "lxc";
          const typeBadge = isLxc
            ? `<span class="tag" style="background:rgba(56,189,248,0.14);color:#38bdf8;border:1px solid rgba(56,189,248,0.3)">${ico("lxc", "sm")} LXC Container</span>`
            : `<span class="tag" style="background:rgba(168,85,247,0.14);color:#c084fc;border:1px solid rgba(168,85,247,0.3)">${ico("kvm", "sm")} QEMU VM</span>`;
          const nodeBadge = `<span class="badge" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)">${ico("nodes", "sm")} ${esc(t.node_name || 'Node ' + t.node_id)}</span>`;
          const availPct = t.total_ips > 0 ? Math.round((t.available_ips / t.total_ips) * 100) : 0;
          const usedPct = t.total_ips > 0 ? Math.round((t.used_ips / t.total_ips) * 100) : 0;

          return `
            <div class="template-card">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
                <div style="display:flex;align-items:center;gap:8px">
                  ${typeBadge}
                  ${nodeBadge}
                </div>
                <div class="small muted">ID: ${t.id}</div>
              </div>

              <h3 style="margin:0 0 6px;font-size:17px;font-weight:700;color:#fff">${esc(t.name)}</h3>
              <p class="muted small" style="margin:0 0 14px;min-height:36px;line-height:1.45">${esc(t.description || 'Pre-configured virtual server template.')}</p>

              <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:8px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.05);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12px">
                <div><span class="muted">CPU:</span> <b>${t.cores} Core(s)</b> <span class="small muted">(${esc(t.cpu)})</span></div>
                <div><span class="muted">RAM:</span> <b>${formatBytes(t.memory * 1024 * 1024)}</b></div>
                <div><span class="muted">Disk:</span> <b>${t.disk_size} GB</b> <span class="small muted">(${esc(t.storage)})</span></div>
                <div><span class="muted">Net Bridge:</span> <b>${esc(t.bridge)}</b></div>
                <div><span class="muted">Gateway:</span> <b>${esc(t.gateway || 'None')}</b></div>
                <div style="grid-column:1/-1;display:flex;align-items:center;gap:6px;overflow:hidden">
                  <span class="muted">Image/Source:</span>
                  ${(t.os_mode === 'custom' || t.template_source === 'custom') ? `
                    <span class="tag" style="background:rgba(234,179,8,0.15);color:#facc15;border:1px solid rgba(234,179,8,0.3);font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;display:inline-flex;align-items:center;gap:4px">
                      ${ico("sparkles", "sm")} Custom (Select on Deploy)
                    </span>
                  ` : `
                    <code style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.template_source)}</code>
                  `}
                </div>
              </div>

              <!-- Dedicated IP Pool Widget -->
              <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px 14px;margin-bottom:16px">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                  <div style="font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px">
                    <span style="color:var(--accent)">${ico("network", "sm")}</span> Dedicated IP Pool
                  </div>
                  <div style="display:flex;gap:6px">
                    <span class="ip-badge-avail">${ico("check", "sm")} ${t.available_ips} Available</span>
                    <span class="ip-badge-used">${ico("dot", "sm")} ${t.used_ips} Used</span>
                  </div>
                </div>

                <div style="height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;display:flex;margin-bottom:8px">
                  <div style="width:${availPct}%;background:#22c55e" title="${t.available_ips} Available"></div>
                  <div style="width:${usedPct}%;background:#f59e0b" title="${t.used_ips} Used"></div>
                </div>

                <div style="font-size:12px;display:flex;align-items:center;justify-content:space-between">
                  <span class="muted">Next auto-allocation:</span>
                  ${t.next_ip ? `
                    <span style="color:#a5b4fc;font-weight:600;display:inline-flex;align-items:center;gap:4px">
                      <code style="color:#fff;background:rgba(99,102,241,0.2);padding:1px 6px;border-radius:4px;border:1px solid rgba(99,102,241,0.3)">${esc(t.next_ip)}/${t.cidr || '24'}</code>
                    </span>
                  ` : `
                    <span style="color:#ef4444;font-weight:600;display:inline-flex;align-items:center;gap:4px">
                      Pool Depleted
                    </span>
                  `}
                </div>
              </div>

              <!-- Action Buttons -->
              <div style="display:flex;gap:8px;align-items:center;margin-top:auto">
                <button class="btn primary small" style="flex:1" data-action="deploy-template" data-id="${t.id}" ${t.available_ips === 0 ? 'title="Add IPs to pool first"' : ''}>
                  ${ico("zap", "sm")} Deploy VPS
                </button>
                <button class="btn small" style="background:rgba(255,255,255,0.06)" data-action="edit-template" data-id="${t.id}">
                  ${ico("edit", "sm")} Manage IPs & Specs
                </button>
                <button class="btn small ghost danger" data-action="delete-template" data-id="${t.id}" data-name="${esc(t.name)}" title="Delete Template">
                  ${ico("trash", "sm")}
                </button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `}
  `;

  const searchInput = $("#templateSearchInput");
  if (searchInput) {
    searchInput.oninput = () => {
      state.templateSearchQuery = searchInput.value;
      renderTemplatesList(c, templates);
      const newInp = $("#templateSearchInput");
      if (newInp) { newInp.focus(); newInp.selectionStart = newInp.selectionEnd = newInp.value.length; }
    };
  }

  $$("[data-tmpl-filter]").forEach(b => {
    b.onclick = () => {
      state.templateFilterType = b.dataset.tmplFilter;
      renderTemplatesList(c, templates);
    };
  });
}

async function templateModal(templateId = null, initialTab = "specs") {
  let template = null;
  let ips = [];
  let stats = { total: 0, available: 0, used: 0 };

  if (templateId) {
    showModal(`
      <div style="padding:48px 24px;text-align:center">
        <div style="width:52px;height:52px;border-radius:14px;background:rgba(99,102,241,0.14);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px">
          ${ico("refresh", "spin lg")}
        </div>
        <h3 style="margin:0 0 6px;color:#fff;font-size:17px;font-weight:700">Loading Template Specifications…</h3>
        <p class="muted small" style="margin:0">Fetching configuration from Proxmox VE…</p>
      </div>
    `);
    const detail = await api(`/admin/templates/${templateId}`);
    template = detail.template;
    ips = detail.ips || [];
    stats = detail.stats || { total: ips.length, available: ips.filter(x => x.status === "available").length, used: ips.filter(x => x.status === "used").length };
  }

  let activeTab = initialTab || "specs";
  let currentType = template ? template.type : "lxc";
  let currentNodeId = template ? template.node_id : (state.selectedTemplateNodeId || 2);
  let currentOsMode = template ? (template.os_mode || (template.template_source === "custom" ? "custom" : "fixed")) : "fixed";

  // Fetch real Proxmox options for the selected node
  let opts = await api(`/admin/templates/options?nodeId=${currentNodeId}`);
  if (!opts.nodes || !opts.nodes.length) {
    opts.nodes = [{ id: currentNodeId, name: "Proxmox Node", host: "localhost" }];
  }
  if (!currentNodeId && opts.nodes[0]) {
    currentNodeId = opts.nodes[0].id;
  }

  function renderModalContent() {
    const isEdit = !!template;
    const isLxc = currentType === "lxc";

    // 1. Build OS / Image Source options from live Proxmox
    let osOptionsHtml = "";
    if (isLxc) {
      const locals = (opts.lxcTemplates || []).filter(t => t.isLocal);
      const appliances = (opts.lxcTemplates || []).filter(t => !t.isLocal);
      let lHtml = "";
      if (locals.length > 0) {
        lHtml += '<optgroup label="Downloaded Local Templates (Instant Deployment)">';
        lHtml += locals.map(t => {
          const val = t.volid;
          const sz = t.size ? ` (${formatBytes(t.size)})` : "";
          const isSel = template ? (template.template_source === val || template.template_source === t.name) : false;
          return `<option value="${esc(val)}" ${isSel ? "selected" : ""}>${esc(t.name)}${sz} [Downloaded - Instant]</option>`;
        }).join("");
        lHtml += '</optgroup>';
      }
      if (appliances.length > 0) {
        lHtml += '<optgroup label="Official Proxmox Appliance Repository">';
        lHtml += appliances.map(t => {
          const val = t.volid;
          const sec = t.section ? ` [${t.section}]` : "";
          const isSel = template ? (template.template_source === val || template.template_source === t.package) : false;
          return `<option value="${esc(val)}" ${isSel ? "selected" : ""}>${esc(t.name)}${sec} [Official Appliance]</option>`;
        }).join("");
        lHtml += '</optgroup>';
      }
      osOptionsHtml = lHtml || (opts.lxcTemplates && opts.lxcTemplates.length ? opts.lxcTemplates.map(t => `<option value="${esc(t.volid)}">${esc(t.name || t.volid)}</option>`).join("") : `<option value="" disabled selected>No LXC templates found on this node. Please download a template in Proxmox storage.</option>`);
    } else {
      if (opts.qemuTemplates && opts.qemuTemplates.length) {
        osOptionsHtml = opts.qemuTemplates.map(t => {
          const isSel = template && String(template.template_source) === String(t.vmid);
          const sz = t.disk ? ` · ${formatBytes(t.disk)} Disk` : "";
          const nodeStr = t.node ? ` · Node: ${t.node}` : "";
          return `<option value="${t.vmid}" ${isSel ? "selected" : ""}>${esc(t.name)} (VMID ${t.vmid})${sz}${nodeStr} · Cloud-Init</option>`;
        }).join("");
      } else {
        osOptionsHtml = `<option value="" disabled selected>No QEMU Cloud-Init templates found on this node. Please convert a VM to template in Proxmox.</option>`;
      }
    }

    // 2. Real Proxmox Nodes
    const nodesHtml = (opts.nodes || []).map(n => `<option value="${n.id}" ${n.id === currentNodeId ? "selected" : ""}>${esc(n.name)} (${esc(n.host)})</option>`).join("");

    // 3. Real Proxmox Storages with free space (Filtered by type: images for QEMU, rootdir for LXC)
    let rawTmplStorages = [];
    if (isLxc) {
      rawTmplStorages = (opts.ctStorages && opts.ctStorages.length) ? opts.ctStorages : (opts.storages || []).filter(s => (s.content || "").includes("rootdir"));
    } else {
      rawTmplStorages = (opts.vmStorages && opts.vmStorages.length) ? opts.vmStorages : (opts.storages || []).filter(s => (s.content || "").includes("images"));
    }
    if (!rawTmplStorages.length && opts.storages && opts.storages.length) {
      rawTmplStorages = opts.storages;
    }
    let storageHtml = "";
    if (rawTmplStorages.length > 0) {
      storageHtml = rawTmplStorages.map((s, idx) => {
        const name = typeof s === "object" ? s.storage : s;
        const isSel = template ? template.storage === name : (idx === 0);
        const freeStr = typeof s === "object" && s.avail ? ` — ${formatBytes(s.avail)} free (${s.type || 'storage'})` : "";
        return `<option value="${esc(name)}" ${isSel ? "selected" : ""}>${esc(name)}${esc(freeStr)}</option>`;
      }).join("");
    } else {
      storageHtml = `<option value="" disabled selected>No storage pool supporting ${isLxc ? 'LXC rootdir' : 'VM images'} found on this node</option>`;
    }

    // 4. Real Proxmox Network Bridges
    const bridgeList = (opts.bridges && opts.bridges.length ? opts.bridges : [{ iface: "vmbr0", active: true }]);
    const bridgeHtml = bridgeList.map((b, idx) => {
      const iface = typeof b === "object" ? b.iface : b;
      const isSel = template ? template.bridge === iface : idx === 0;
      let desc = [];
      if (typeof b === "object") {
        if (b.cidr) desc.push(b.cidr);
        if (b.gateway) desc.push(`GW: ${b.gateway}`);
        if (b.active) desc.push("Active");
      }
      const descStr = desc.length ? ` — [${desc.join(" · ")}]` : "";
      return `<option value="${esc(iface)}" data-cidr="${esc(b.cidr || '')}" data-gw="${esc(b.gateway || '')}" ${isSel ? "selected" : ""}>${esc(iface)}${esc(descStr)}</option>`;
    }).join("") + `<option value="__custom__">Custom Network Bridge...</option>`;

    // Initial source value
    let initialSource = template?.template_source || "";
    if (!initialSource) {
      if (isLxc) {
        initialSource = opts.lxcTemplates?.[0]?.volid || "";
      } else {
        initialSource = opts.qemuTemplates?.[0]?.vmid ? String(opts.qemuTemplates[0].vmid) : "";
      }
    }

    const html = `
      <div class="modal-head">
        <div>
          <h3 style="display:flex;align-items:center;gap:8px">
            <span style="color:var(--accent)">${ico("layers", "md")}</span> ${isEdit ? `Edit Template: ${esc(template.name)}` : 'Create New VM Template'}
          </h3>
          <p class="small muted" style="margin:4px 0 0">${isEdit ? `Template ID #${template.id} · ${template.type.toUpperCase()}` : 'Configure reusable hardware and network specifications with real Proxmox VE resources and a dedicated IP pool.'}</p>
        </div>
        <button type="button" class="close" data-close>&times;</button>
      </div>

      ${isEdit ? `
        <div class="tab-nav" style="margin-bottom:20px">
          <button type="button" class="tab-btn ${activeTab === 'specs' ? 'active' : ''}" id="tabBtnSpecs">${ico("gear", "sm")} Specifications</button>
          <button type="button" class="tab-btn ${activeTab === 'ips' ? 'active' : ''}" id="tabBtnIps">${ico("network", "sm")} Dedicated IP Pool (${stats.total} IPs · <span style="color:#4ade80">${stats.available} Available</span>)</button>
        </div>
      ` : ''}

      <!-- TAB 1: Template Specifications -->
      <div id="tabSpecsContent" style="${activeTab === 'specs' ? '' : 'display:none'}">
        <form id="templateSpecsForm" style="display:flex;flex-direction:column;gap:14px">
          <!-- Category Selector -->
          <div class="field">
            <label>Template Category (Type) *</label>
            <div style="display:flex;gap:10px">
              <button type="button" class="btn ${currentType === 'lxc' ? 'primary' : 'ghost'}" id="typeBtnLxc" style="flex:1;justify-content:center;padding:12px">
                ${ico("lxc", "sm")} LXC Linux Container
              </button>
              <button type="button" class="btn ${currentType === 'qemu' ? 'primary' : 'ghost'}" id="typeBtnQemu" style="flex:1;justify-content:center;padding:12px">
                ${ico("kvm", "sm")} QEMU KVM Virtual Machine
              </button>
            </div>
          </div>

          <!-- Section 1: Basic Information -->
          <div class="form-section">
            <div class="form-section-title">
              <span class="form-section-icon">${ico("server")}</span> General Information & Proxmox Node
            </div>
            <div class="form-grid">
              <div class="field">
                <label>Template Name *</label>
                <input type="text" name="name" required value="${esc(template?.name || (isLxc ? 'Ubuntu 24.04 Standard LXC' : 'Ubuntu 24.04 Cloud QEMU'))}" placeholder="e.g. Ubuntu 24.04 Production LXC">
              </div>
              <div class="field">
                <label>Proxmox VE Node * <span id="nodeLoadingSpinner" style="display:none;color:var(--accent);margin-left:6px">${ico("spinner")} Loading Proxmox data...</span></label>
                <select name="node_id" id="tmplNodeSelect">${nodesHtml}</select>
              </div>
            </div>
            <div class="field" style="margin-bottom:0">
              <label>Description / Notes</label>
              <input type="text" name="description" value="${esc(template?.description || '')}" placeholder="Optional details (e.g. Standard 2-Core LXC with Docker support)">
            </div>
          </div>

          <!-- Section 2: Operating System & Image Source -->
          <div class="form-section">
            <div class="form-section-title">
              <span class="form-section-icon">${ico("disc")}</span> Operating System & Image Source (Live Proxmox)
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
              <label id="osModeFixedLabel" style="border:1px solid ${currentOsMode === 'fixed' ? 'var(--accent)' : 'var(--line)'};background:${currentOsMode === 'fixed' ? 'rgba(99,102,241,0.12)' : 'var(--panel2)'};border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start">
                <input type="radio" name="os_mode" value="fixed" ${currentOsMode === 'fixed' ? 'checked' : ''} style="margin-top:3px">
                <div>
                  <div style="font-weight:700;color:#fff;font-size:13px">Fixed Operating System</div>
                  <div class="small muted" style="margin-top:2px">Preset image. Every VPS deployed will use this pre-configured OS template.</div>
                </div>
              </label>

              <label id="osModeCustomLabel" style="border:1px solid ${currentOsMode === 'custom' ? 'var(--accent)' : 'var(--line)'};background:${currentOsMode === 'custom' ? 'rgba(99,102,241,0.12)' : 'var(--panel2)'};border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start">
                <input type="radio" name="os_mode" value="custom" ${currentOsMode === 'custom' ? 'checked' : ''} style="margin-top:3px">
                <div>
                  <div style="font-weight:700;color:#fff;font-size:13px;display:flex;align-items:center;gap:6px">
                    Custom (Choose During Deploy) <span class="tag" style="background:rgba(234,179,8,0.2);color:#facc15;font-size:10px;padding:1px 6px">Dynamic</span>
                  </div>
                  <div class="small muted" style="margin-top:2px">Dynamic OS. When deploying, admin selects any live Proxmox OS image.</div>
                </div>
              </label>
            </div>

            <!-- Fixed OS Configuration Container -->
            <div id="fixedOsContainer" style="${currentOsMode === 'custom' ? 'display:none' : ''}">
              <div class="form-grid">
                <div class="field">
                  <label>${isLxc ? 'Select Container Appliance Template (vztmpl)' : 'Select Cloud-Init QEMU Base Template'}</label>
                  <select id="tmplSourceSelect">${osOptionsHtml}</select>
                </div>
                <div class="field">
                  <label>Template Image Path / VMID *</label>
                  <input type="text" name="template_source" id="tmplSourceInput" value="${esc(initialSource)}" placeholder="Custom source or volid">
                </div>
              </div>
            </div>

            <!-- Custom OS Notice Box -->
            <div id="customOsNotice" style="${currentOsMode === 'custom' ? '' : 'display:none'};background:rgba(234,179,8,0.08);border:1px solid rgba(234,179,8,0.25);border-radius:8px;padding:12px 14px;font-size:12.5px;color:#fde047">
              <div style="display:flex;align-items:center;gap:8px;font-weight:600">
                ${ico("sparkles", "sm")} Custom OS Selection Enabled for Deployment
              </div>
              <div class="small muted" style="margin-top:4px;color:rgba(255,255,255,0.75)">
                When deploying a VPS from this template, the deploy modal will query Proxmox VE node <b>${esc(opts.nodes?.find(n => n.id === currentNodeId)?.name || 'Proxmox')}</b> and allow the administrator to select from all available live ${isLxc ? 'container templates/appliances' : 'Cloud-Init VM templates'}.
              </div>
            </div>

            ${!isLxc ? `
              <div class="form-grid" style="margin-top:8px">
                <div class="field" style="margin-bottom:0">
                  <label>OS Architecture Type</label>
                  <select name="osType">
                    <option value="l26" selected>Linux 6.x / 5.x / 4.x / 3.x / 2.6 (l26)</option>
                    <option value="win11">Microsoft Windows 11 / 2022 (win11)</option>
                    <option value="win10">Microsoft Windows 10 / 2016 / 2019 (win10)</option>
                    <option value="other">Other / Custom</option>
                  </select>
                </div>
              </div>
            ` : ''}
          </div>

          <!-- Section: Plan Lifecycle & Duration -->
          <div class="form-section">
            <div class="form-section-title">
              <span class="form-section-icon">${ico("clock")}</span> Default VPS Plan Duration / Expiry Period
            </div>
            <div class="form-grid">
              <div class="field">
                <label style="display:flex;align-items:center;justify-content:space-between">
                  <span>Default Expiry Period for Deployed VPS</span>
                  <span class="small muted">Auto-suspends upon expiry</span>
                </label>
                <select name="default_duration_days" id="tmplDefaultDurationSelect">
                  <option value="0" ${(!template?.default_duration_days || template?.default_duration_days === 0) ? 'selected' : ''}>Lifetime / No Expiry (Never expires)</option>
                  <option value="7" ${template?.default_duration_days === 7 ? 'selected' : ''}>7 Days (Trial Plan)</option>
                  <option value="15" ${template?.default_duration_days === 15 ? 'selected' : ''}>15 Days</option>
                  <option value="30" ${template?.default_duration_days === 30 ? 'selected' : ''}>30 Days (1 Month)</option>
                  <option value="60" ${template?.default_duration_days === 60 ? 'selected' : ''}>60 Days (2 Months)</option>
                  <option value="90" ${template?.default_duration_days === 90 ? 'selected' : ''}>90 Days (3 Months)</option>
                  <option value="180" ${template?.default_duration_days === 180 ? 'selected' : ''}>180 Days (6 Months)</option>
                  <option value="365" ${template?.default_duration_days === 365 ? 'selected' : ''}>365 Days (1 Year)</option>
                  <option value="custom" ${[0, 7, 15, 30, 60, 90, 180, 365].indexOf(template?.default_duration_days) === -1 && template?.default_duration_days > 0 ? 'selected' : ''}>Custom Duration (Days)...</option>
                </select>
              </div>
              <div class="field" id="tmplCustomDurationWrap" style="${[0, 7, 15, 30, 60, 90, 180, 365].indexOf(template?.default_duration_days) === -1 && template?.default_duration_days > 0 ? '' : 'display:none'}">
                <label>Custom Duration in Days</label>
                <input type="number" id="tmplCustomDays" min="1" max="3650" value="${template?.default_duration_days || ''}" placeholder="Enter days (e.g. 45)">
              </div>
            </div>
          </div>

          <!-- Section 3: Compute & Memory -->
          <div class="form-section">
            <div class="form-section-title">
              <span class="form-section-icon">${ico("cpu")}</span> Compute (CPU) & Memory (RAM)
            </div>
            <div class="form-grid-4">
              <div class="field">
                <label>CPU Cores *</label>
                <input type="number" name="cores" min="1" max="128" required value="${template?.cores || 2}">
              </div>
              <div class="field">
                <label>CPU Sockets *</label>
                <input type="number" name="sockets" min="1" max="8" required value="${template?.sockets || 1}">
              </div>
              <div class="field">
                <label>CPU Model</label>
                <input type="text" name="cpu" list="tmplCpuModelsList" value="${esc(template?.cpu || 'host')}" placeholder="host">
                <datalist id="tmplCpuModelsList">
                  ${(opts.cpuModels || []).map(c => `<option value="${esc(typeof c === 'object' ? c.name : c)}">${esc(typeof c === 'object' ? (c.desc || c.name) : c)}</option>`).join('')}
                </datalist>
              </div>
              <div class="field">
                <label>RAM (MB) *</label>
                <input type="number" name="memory" min="256" step="256" required value="${template?.memory || 2048}">
              </div>
            </div>
            <div class="form-grid">
              <div class="field">
                <label>${isLxc ? 'Swap Memory (MB)' : 'Memory Ballooning (MB)'}</label>
                <input type="number" name="${isLxc ? 'swap' : 'balloon'}" min="0" value="${isLxc ? (template?.swap ?? 512) : (template?.balloon ?? 0)}">
              </div>
              <div class="field" style="justify-content:flex-end">
                <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:12px;font-size:13px">
                  <input type="checkbox" name="numa" ${template?.numa ? 'checked' : ''}> Enable NUMA Architecture
                </label>
              </div>
            </div>
          </div>

          <!-- Section 4: Storage & Virtual Disks -->
          <div class="form-section">
            <div class="form-section-title">
              <span class="form-section-icon">${ico("server")}</span> Storage & Virtual Disks (Live Proxmox Datastores)
            </div>
            <div class="form-grid">
              <div class="field">
                <label>Disk Size (GB) *</label>
                <input type="number" name="disk_size" min="5" max="50000" required value="${template?.disk_size || (isLxc ? 20 : 30)}">
              </div>
              <div class="field">
                <label>Storage Pool Datastore *</label>
                <select name="storage">${storageHtml}</select>
              </div>
            </div>
            ${!isLxc ? `
              <div class="form-grid-3">
                <div class="field">
                  <label>Disk Bus Interface</label>
                  <select name="disk_bus">
                    <option value="scsi" ${(template?.disk_bus || 'scsi') === 'scsi' ? 'selected' : ''}>SCSI (Fastest VirtIO-SCSI)</option>
                    <option value="virtio" ${template?.disk_bus === 'virtio' ? 'selected' : ''}>VirtIO Block</option>
                    <option value="sata" ${template?.disk_bus === 'sata' ? 'selected' : ''}>SATA</option>
                    <option value="ide" ${template?.disk_bus === 'ide' ? 'selected' : ''}>IDE</option>
                  </select>
                </div>

    // Form Submit
    const specsForm = $("#templateSpecsForm");
    if (specsForm) {
      specsForm.onsubmit = async (e) => {
        e.preventDefault();
        const submitBtn = $("#templateSubmitBtn");
        submitBtn.disabled = true;
        submitBtn.innerHTML = `${ico("spinner")} Saving...`;

        const fd = new FormData(specsForm);
        let chosenBridge = fd.get("bridge");
        if (chosenBridge === "__custom__") {
          chosenBridge = fd.get("custom_bridge") || "vmbr0";
        }

        const chosenOsMode = currentOsMode || fd.get("os_mode") || "fixed";
        let chosenSource = fd.get("template_source");
        if (chosenOsMode === "custom") {
          chosenSource = chosenSource || "custom";
        }

        let defDurationDaysVal = fd.get("default_duration_days");
        if (defDurationDaysVal === "custom") {
          defDurationDaysVal = Number($("#tmplCustomDays")?.value || 0);
        } else {
          defDurationDaysVal = Number(defDurationDaysVal || 0);
        }

        const payload = {
          name: fd.get("name"),
          type: currentType,
          node_id: Number(fd.get("node_id")),
          default_duration_days: defDurationDaysVal,
          description: fd.get("description") || "",
          template_source: chosenSource,
          os_mode: chosenOsMode,
          cores: Number(fd.get("cores")),
          sockets: Number(fd.get("sockets") || 1),
          cpu: fd.get("cpu") || "host",
          numa: fd.get("numa") ? 1 : 0,
          memory: Number(fd.get("memory")),
          swap: Number(fd.get("swap") || 0),
          balloon: Number(fd.get("balloon") || 0),
          disk_size: Number(fd.get("disk_size")),
          storage: fd.get("storage"),
          disk_bus: fd.get("disk_bus") || "scsi",
          scsihw: fd.get("scsihw") || "virtio-scsi-single",
          disk_cache: fd.get("disk_cache") || "none",
          discard: fd.get("discard") ? 1 : 0,
          ssd: fd.get("ssd") ? 1 : 0,
          iothread: fd.get("iothread") ? 1 : 0,
          machine: fd.get("machine") || "q35",
          bios: fd.get("bios") || "seabios",
          vga: fd.get("vga") || "std",
          bridge: chosenBridge,
          net_model: fd.get("net_model") || "virtio",
          netif_name: fd.get("netif_name") || "eth0",
          vlan: fd.get("vlan") ? Number(fd.get("vlan")) : null,
          rate_limit: fd.get("rate_limit") ? Number(fd.get("rate_limit")) : null,
          firewall: fd.get("firewall") ? 1 : 0,
          gateway: fd.get("gateway") || "",
          cidr: fd.get("cidr") || "24",
          nameservers: fd.get("nameservers") || "",
          search_domain: fd.get("search_domain") || "",
          unprivileged: fd.get("unprivileged") ? 1 : 0,
          nesting: fd.get("nesting") ? 1 : 0,
          keyctl: fd.get("keyctl") ? 1 : 0,
          fuse: fd.get("fuse") ? 1 : 0,
          qemu_agent: fd.get("qemu_agent") ? 1 : 0,
          onboot: fd.get("onboot") ? 1 : 0,
          start_after_create: fd.get("start_after_create") ? 1 : 0,
          ci_user: fd.get("ci_user") || "root",
          ci_upgrade: fd.get("ci_upgrade") ? 1 : 0,
          ip6_type: fd.get("ip6_type") || "disabled",
          ips: fd.get("ips") || ""
        };

        try {
          if (isEdit) {
            await api(`/admin/templates/${template.id}`, {
              method: "PUT",
              body: JSON.stringify(payload)
            });
            toast("Template updated successfully!");
          } else {
            await api("/admin/templates", {
              method: "POST",
              body: JSON.stringify(payload)
            });
            toast("Template created successfully!");
          }
          closeModal();
          await renderPage();
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `${ico("check")} ${isEdit ? 'Save Changes' : 'Create Template'}`;
          toast(err.message, "error");
        }
      };
    }

    // Add IPs Button
    const addIpsBtn = $("#addIpsBtn");
    if (addIpsBtn) {
      addIpsBtn.onclick = async () => {
        const raw = $("#newIpsInput").value.trim();
        if (!raw) return toast("Please enter at least one IP address.", "error");
        const cidr = $("#newIpsCidr").value.trim() || template.cidr || "24";
        const gateway = $("#newIpsGateway").value.trim() || template.gateway || "";

        addIpsBtn.disabled = true;
        addIpsBtn.innerHTML = `${ico("spinner")} Adding...`;

        try {
          const res = await api(`/admin/templates/${template.id}/ips`, {
            method: "POST",
            body: JSON.stringify({ ips: raw, cidr, gateway })
          });
          toast(res.message || "IPs added successfully!");
          templateModal(template.id, "ips");
        } catch (err) {
          addIpsBtn.disabled = false;
          addIpsBtn.innerHTML = `${ico("plus", "sm")} Add to Pool`;
          toast(err.message, "error");
        }
      };
    }

    // Release IP button
    $$("[data-release-ip]").forEach(b => {
      b.onclick = async () => {
        const ipId = Number(b.dataset.releaseIp);
        try {
          const res = await api(`/admin/templates/${template.id}/ips/${ipId}/release`, { method: "POST", body: "{}" });
          toast(res.message || "IP released back to pool.");
          templateModal(template.id, "ips");
        } catch (err) { toast(err.message, "error"); }
      };
    });

    // Delete IP button
    $$("[data-delete-ip]").forEach(b => {
      b.onclick = async () => {
        const ipId = Number(b.dataset.deleteIp);
        if (!confirm("Are you sure you want to remove this IP from the template pool?")) return;
        try {
          const res = await api(`/admin/templates/${template.id}/ips/${ipId}`, { method: "DELETE" });
          toast(res.message || "IP removed.");
          templateModal(template.id, "ips");
        } catch (err) { toast(err.message, "error"); }
      };
    });
  }

  renderModalContent();
}

async function deployTemplateModal(templateId) {

      deployOsOptionsHtml += '<optgroup label="Downloaded Local Templates (Instant Deployment)">';

        const val = t.volid;

            <span class="tag" style="background:rgba(234,179,8,0.15);color:#facc15;border:1px solid rgba(234,179,8,0.3);font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;display:inline-flex;align-items:center;gap:4px">

    <!-- IP Allocation Banner -->
    ${nextIp ? `
      <div style="background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:18px">

          Gateway: <b>${esc(nextIp.gateway || template.gateway || 'None')}</b> · This IP will be permanently bound to this VPS and marked as <b>USED</b> preventing duplicate assignments.

        <div style="font-weight:700;color:#f87171;display:flex;align-items:center;gap:8px">

      <div class="field" style="${isCustomOs ? 'background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.3);border-radius:10px;padding:14px;margin-bottom:18px' : 'margin-bottom:18px'}">
        <label style="display:flex;align-items:center;justify-content:space-between;${isCustomOs ? 'color:#c7d2fe;font-weight:700' : ''}">

          </div>
        </div>
      </div>

      <div class="field">
        <label>SSH Public Key (optional)</label>
        <textarea name="sshKey" rows="2" placeholder="ssh-rsa AAAA... (optional)" style="font-family:'Space Grotesk',monospace;font-size:12px"></textarea>

  showModal(html, "modal-deploy");

  // Wire Duration dropdown change (Custom Days toggle)

  if (deployDurSel) {
    deployDurSel.onchange = () => {
      const wrap = $("#deployCustomDurationWrap");
      if (wrap) {
        wrap.style.display = deployDurSel.value === "custom" ? "block" : "none";
        if (deployDurSel.value === "custom") {
          const inp = $("#deployCustomDays");
          if (inp) inp.focus();
        }
      }
    };
  }

  const genBtn = $("#deployGenPassBtn");
  if (genBtn) {
    genBtn.onclick = () => {
      const passInp = $("#deployPasswordInput");
      if (passInp) passInp.value = `At!${Math.random().toString(36).slice(2, 8)}#${Math.floor(10 + Math.random() * 90)}`;
    };
  }

  const deployForm = $("#deployTemplateForm");
  if (deployForm) {
    deployForm.onsubmit = async (e) => {
      e.preventDefault();
      const submitBtn = $("#deploySubmitBtn");
      submitBtn.disabled = true;
      submitBtn.innerHTML = `${ico("spinner")} Provisioning (Downloading OS if needed)...`;

      const fd = new FormData(deployForm);
      const chosenSource = fd.get("templateSource") || template.template_source;
      let deployDaysVal = fd.get("duration_days");
      if (deployDaysVal === "custom") {
        deployDaysVal = Number($("#deployCustomDays")?.value || 0);
      } else {
        deployDaysVal = Number(deployDaysVal || 0);
      }

      const payload = {
        userId: Number(fd.get("userId")),
        name: fd.get("name"),
        vmid: Number(fd.get("vmid")),
        templateSource: chosenSource,
        password: fd.get("password"),
        sshKey: fd.get("sshKey"),
        ciUser: fd.get("ciUser"),
        start: !!fd.get("start"),
        duration_days: deployDaysVal
      };

      try {
        const res = await api(`/admin/templates/${templateId}/deploy`, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        toast(res.message || "VPS deployed successfully!");
        closeModal();
        if (res.id) {
          openServer(res.id);
        } else {
          await renderPage();
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `${ico("zap")} Deploy ${template.type.toUpperCase()} VPS`;
        toast(err.message, "error");
      }
    };
  }
}

async function deleteTemplate(id) {
  const confirmed = await modalConfirm({
    title: "Delete VM Template",
    message: "Are you sure you want to permanently delete this VM template and its dedicated IP pool?",
    details: "This will remove the template configuration and its IP pool from the panel database. Any existing virtual servers in Proxmox will NOT be destroyed.",
    type: "danger",
    confirmText: "Delete Template"
  });
  if (!confirmed) return;

  try {
    const res = await api(`/admin/templates/${id}`, { method: "DELETE" });
    toast(res.message || "Template deleted successfully!");
    await renderPage();
  } catch (err) {
    toast(err.message, "error");
  }
}


async function assignPage(c) {
  const [u, n, d] = await Promise.all([api("/admin/users"), api("/admin/nodes"), api("/dashboard")]);

async function assignModal() {
  try {
    showModal(`
      <div style="padding:48px 24px;text-align:center">
        <div style="width:52px;height:52px;border-radius:14px;background:rgba(99,102,241,0.14);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px">
          ${ico("refresh", "spin lg")}
        </div>
        <h3 style="margin:0 0 6px;color:#fff;font-size:17px;font-weight:700">Scanning Proxmox Cluster…</h3>
        <p class="muted small" style="margin:0">Loading available cluster nodes and registered users…</p>
      </div>
    `);
    const [u, n] = await Promise.all([api("/admin/users"), api("/admin/nodes")]);
    const enabledNodes = n.nodes.filter(x => x.enabled);
    if (!enabledNodes.length) {
      toast("No enabled Proxmox nodes found. Please add or enable a node first.", "error");
      return;
    }
    showModal(`<div class="modal-head"><h3>Assign existing VPS</h3><button class="close" data-close>×</button></div><form id="assignForm"><div class="field"><label>Panel user</label><select name="userId" required>${u.users.filter(x => x.active).map(x => `<option value="${x.id}">${esc(x.username)} (${esc(x.email)})</option>`).join("")}</select></div><div class="field"><label>Proxmox node</label><select name="nodeId" id="assignNodeSelect" required>${enabledNodes.map(x => `<option value="${x.id}">${esc(x.name)} · ${esc(x.host)}</option>`).join("")}</select></div><div id="discoveredVmsWrap" class="small muted" style="margin-bottom:12px"></div><div class="form-grid"><div class="field"><label>VMID</label><input name="vmid" id="assignVmid" type="number" min="100" required></div><div class="field"><label>Type</label><select name="type" id="assignType"><option value="qemu">KVM / QEMU</option><option value="lxc">LXC</option></select></div></div><div class="field"><label>Display name</label><input name="name" id="assignName" required></div><button class="btn primary" style="width:100%;margin-top:10px">Verify and assign</button></form>`);
    const loadResources = async () => {
      const selNodeId = $("#assignNodeSelect")?.value;
      const wrap = $("#discoveredVmsWrap");
      if (!selNodeId || !wrap) return;
      wrap.textContent = "Scanning node for available VMs/containers…";
      try {
        const r = await api(`/admin/proxmox/nodes/${selNodeId}/resources`);
        if (r.resources && r.resources.length) {
          wrap.innerHTML = `<label style="display:block;margin-bottom:6px;color:#aaa">Detected on node (click to select):</label><div style="display:flex;gap:6px;flex-wrap:wrap">${r.resources.map(vm => `<button type="button" class="btn small" style="padding:4px 8px;font-size:11px" data-pick-vmid="${vm.vmid}" data-pick-type="${vm.type}" data-pick-name="${esc(vm.name || ('VM ' + vm.vmid))}">${vm.type.toUpperCase()} ${vm.vmid} (${esc(vm.name || 'unnamed')})</button>`).join("")}</div>`;
          wrap.querySelectorAll("[data-pick-vmid]").forEach(btn => {
            btn.onclick = () => {
              if ($("#assignVmid")) $("#assignVmid").value = btn.dataset.pickVmid;
              if ($("#assignType")) $("#assignType").value = btn.dataset.pickType;
              if ($("#assignName")) $("#assignName").value = btn.dataset.pickName;
            };
          });
        } else {
          wrap.textContent = "No VMs/containers detected on this node (or token lacks cluster audit permissions). You can enter the VMID manually below.";
        }
      } catch (e) {
        wrap.textContent = "Could not auto-list VMs: " + e.message + ". You can enter VMID manually below.";
      }
    };
    const nodeSel = $("#assignNodeSelect");
    if (nodeSel) { nodeSel.onchange = loadResources; loadResources(); }
    $("#assignForm").onsubmit = async e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(e.target));
      d.userId = Number(d.userId);
      d.nodeId = Number(d.nodeId);
      d.vmid = Number(d.vmid);
      try {
        await api("/admin/servers/assign", { method: "POST", body: JSON.stringify(d) });
        $("#modalRoot").innerHTML = "";
        toast("VPS assigned successfully.");
        state.page = "servers";
        await renderPage();
      } catch (err) { toast(err.message, "error"); }
    };
  } catch (e) { toast(e.message, "error"); }
}

async function unassign(id, name, vmid) {
  const s = (state.servers || []).find(x => x.id === id);
  const sName = name || (s ? s.name : `VPS #${id}`);
  const sVmid = vmid || (s ? s.vmid : "");
  const label = sVmid ? `"${sName}" (VMID ${sVmid})` : `"${sName}"`;
  const ok = await modalConfirm({
    title: "Remove VPS Assignment",
    subtitle: label,
    message: `Are you sure you want to remove user assignment for ${label}?`,
    details: [
      "The VPS will be unlinked from the user in this panel.",
      "The Proxmox VE VM/container will NOT be deleted or stopped.",
      'You can re-assign it at any time from the "Assign VPS" page.'
    ],
    confirmText: "Remove Assignment",
    type: "warning",
    icon: "ban"
  });
  if (!ok) return;
  try {
    const res = await api(`/admin/servers/${id}/assignment`, { method: "DELETE", body: "{}" });
    toast(`Assignment removed for ${label}.`);
    if (state.page === "vps") {
      state.page = "servers";
    }
    await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

      state.servers = d.servers;
      s = (state.servers || []).find(x => x.id == id);
    } catch {}
  }
  const sName = name || (s ? s.name : `VPS #${id}`);
  const sVmid = vmid || (s ? s.vmid : id);
  const sType = type || (s ? s.type : "qemu");
  const sNode = nodeName || (s ? (s.pve_node || s.node_name) : "Proxmox Node");
  const sUser = s ? (s.username || "Unassigned") : "Unassigned";

  showModal(`
    <div class="modal-head">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:42px;height:42px;border-radius:10px;background:rgba(239,68,68,0.15);color:var(--red);display:flex;align-items:center;justify-content:center">
          ${ico("trash", "md")}
        </div>
        <div>
          <h3 style="margin:0;font-size:18px;color:#fff">Destroy Virtual Machine</h3>
          <p class="muted small" style="margin:3px 0 0">Instance: <b>${esc(sName)}</b> (VMID ${sVmid}) · Proxmox Node: <b>${esc(sNode)}</b></p>
        </div>
      </div>
      <button type="button" class="close" data-close>&times;</button>
    </div>

    <div style="background:rgba(239,68,68,0.08);border:1.5px solid rgba(239,68,68,0.35);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-start">
      <div style="color:var(--red);flex-shrink:0;margin-top:2px">${ico("alert", "lg")}</div>
      <div>
        <div style="font-weight:700;color:#fff;font-size:14px;margin-bottom:4px">DANGER: Permanent Destruction Warning</div>
        <div class="small muted" style="color:#fca5a5;line-height:1.5;font-size:12.5px">
          This operation will permanently destroy <b>${esc(sName)}</b> (VMID <b>${sVmid}</b>) on Proxmox VE cluster node <b>${esc(sNode)}</b>. All virtual disk volumes, operating system files, user data, and snapshots will be permanently wiped from physical storage. Dedicated IP addresses will be released back to the template pool. <b>This action cannot be undone.</b>
        </div>
      </div>
    </div>

    <div style="background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:18px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:12px;font-size:12.5px">
        <div><span class="muted">VMID:</span><br><b style="color:#fff;font-family:'Space Grotesk',monospace;font-size:14px">${sVmid}</b></div>
        <div><span class="muted">Guest Type:</span><br><span class="tag" style="border-color:${sType === 'qemu' ? 'rgba(99,102,241,0.3)' : 'rgba(56,189,248,0.3)'};color:${sType === 'qemu' ? 'var(--accent)' : 'var(--blue)'};font-weight:700">${esc(sType.toUpperCase())}</span></div>
        <div><span class="muted">Proxmox Node:</span><br><b style="color:#fff">${esc(sNode)}</b></div>
        <div><span class="muted">Assigned Owner:</span><br><b style="color:#fff">${esc(sUser)}</b></div>
      </div>
    </div>

    <div style="background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px 18px;margin-bottom:18px">
      <div style="font-weight:700;font-size:13px;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:8px">
        ${ico("gear", "sm")} Proxmox VE Destruction Options
      </div>
      <label style="display:flex;align-items:flex-start;gap:12px;cursor:pointer;margin-bottom:12px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);transition:background 0.2s">
        <input type="checkbox" id="destroyPurgeCheck" checked style="margin-top:3px;accent-color:var(--red);cursor:pointer;width:18px;height:18px">
        <div>
          <div style="font-weight:600;color:#fff;font-size:13.5px">Purge from job configurations</div>
          <div class="muted small" style="margin-top:2px;font-size:12px;line-height:1.4">Remove this guest instance from backup jobs, replication schedules, and High Availability (HA) cluster resources in Proxmox VE.</div>
        </div>
      </label>
      <label style="display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);transition:background 0.2s">
        <input type="checkbox" id="destroyDisksCheck" checked style="margin-top:3px;accent-color:var(--red);cursor:pointer;width:18px;height:18px">
        <div>
          <div style="font-weight:600;color:#fff;font-size:13.5px">Destroy unreferenced disks owned by guest</div>
          <div class="muted small" style="margin-top:2px;font-size:12px;line-height:1.4">Purge and destroy unreferenced virtual disks and orphaned storage volumes owned by this guest from underlying storage pools.</div>
        </div>
      </label>
    </div>

    <div style="margin-bottom:22px">
      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:#fff">
        To confirm destruction, please enter the VMID <code style="background:rgba(239,68,68,0.18);color:#ef4444;padding:2px 8px;border-radius:4px;font-weight:700;font-size:13px">${sVmid}</code> below:
      </label>
      <input type="text" id="confirmDeleteVmidInput" placeholder="Enter VMID ${sVmid} to confirm..." autocomplete="off" style="width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;color:#fff;font-size:14px;font-family:'Space Grotesk',monospace">
      <div id="confirmDeleteHint" class="muted small" style="margin-top:6px;font-size:12px">
        Type "${sVmid}" to enable the destroy button.
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;align-items:center;gap:12px">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="button" class="btn danger" id="btnExecuteVpsDestroy" disabled style="opacity:0.45;cursor:not-allowed;font-weight:700;transition:all 0.2s">
        ${ico("trash")} Destroy Virtual Machine & Disks
      </button>
    </div>
  `);

  const input = $("#confirmDeleteVmidInput");
  const btn = $("#btnExecuteVpsDestroy");
  const hint = $("#confirmDeleteHint");
  const purgeCheck = $("#destroyPurgeCheck");
  const disksCheck = $("#destroyDisksCheck");

  if (!input || !btn) return;

  function checkMatch() {
    const val = input.value.trim();
    if (val === String(sVmid)) {
      btn.disabled = false;
      btn.style.opacity = "1";
      btn.style.cursor = "pointer";
      btn.style.boxShadow = "0 0 15px rgba(239,68,68,0.4)";
      hint.innerHTML = `<span style="color:var(--green);font-weight:600">${ico("check", "sm")} VMID verified. Ready to destroy permanently.</span>`;
    } else {
      btn.disabled = true;
      btn.style.opacity = "0.45";
      btn.style.cursor = "not-allowed";
      btn.style.boxShadow = "none";
      hint.innerHTML = `Type "${sVmid}" to enable the destroy button.`;
    }
  }

  input.addEventListener("input", checkMatch);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !btn.disabled) {
      e.preventDefault();
      btn.click();
    }
  });

  btn.addEventListener("click", async () => {
    if (btn.disabled) return;
    const purge = purgeCheck ? purgeCheck.checked : true;
    const destroyDisks = disksCheck ? disksCheck.checked : true;

    btn.disabled = true;
    btn.style.opacity = "0.7";
    btn.style.cursor = "wait";
    btn.innerHTML = `${ico("refresh", "sm spin")} Destroying on Proxmox VE…`;
    input.disabled = true;
    if (purgeCheck) purgeCheck.disabled = true;
    if (disksCheck) disksCheck.disabled = true;

    try {
      const res = await api(`/servers/${id}`, {
        method: "DELETE",
        body: JSON.stringify({
          purge: purge ? 1 : 0,
          "destroy-unreferenced-disks": destroyDisks ? 1 : 0,
          destroy_unreferenced_disks: destroyDisks ? 1 : 0,
          confirm_vmid: sVmid
        })
      });

      toast(`VPS #${sVmid} (${sName}) was destroyed and deleted successfully.`, "success");
      closeModal();

      if (state.page === "vps" && state.currentServerId == id) {
        state.page = "servers";
      }
      await renderPage();
    } catch (err) {
      toast(err.message || "Failed to destroy VPS.", "error");
      btn.disabled = false;
      btn.style.opacity = "1";
      btn.style.cursor = "pointer";
      btn.innerHTML = `${ico("trash")} Destroy Virtual Machine & Disks`;
      input.disabled = false;
      if (purgeCheck) purgeCheck.disabled = false;
      if (disksCheck) disksCheck.disabled = false;
    }
  });

  setTimeout(() => { if (input) input.focus(); }, 100);
}

}

  const allRadio = $("#scopeModeAll");
  const customRadio = $("#scopeModeCustom");
  const cardAll = $("#scopeCardAll");
  const cardCustom = $("#scopeCardCustom");
  const customWrap = $("#customScopesWrap");
  const countBadge = $("#scopeCountBadge");

  function updateScopeMode(isCustom) {
    if (isCustom) {
      customRadio.checked = true;
      cardCustom.classList.add("active");
      cardAll.classList.remove("active");
      customWrap.style.display = "block";
    } else {
      allRadio.checked = true;
      cardAll.classList.add("active");
      cardCustom.classList.remove("active");
      customWrap.style.display = "none";
    }
  }

  if (allRadio && customRadio) {
    allRadio.onchange = () => updateScopeMode(false);
    customRadio.onchange = () => updateScopeMode(true);
    cardAll.onclick = (e) => { if (e.target !== allRadio) updateScopeMode(false); };
    cardCustom.onclick = (e) => { if (e.target !== customRadio) updateScopeMode(true); };
  }

  // Scope checkboxes interaction
  function updateScopeCount() {
    const total = API_SCOPES_DATA.length;
    const chks = $$(".scope-chk");
    let checked = 0;
    chks.forEach(chk => {
      const card = chk.closest(".scope-item-card");
      if (chk.checked) {
        checked++;
        card?.classList.add("checked");
      } else {
        card?.classList.remove("checked");
      }
    });
    if (countBadge) countBadge.textContent = `${checked} of ${total} selected`;
  }

  $$(".scope-chk").forEach(chk => {
    chk.onchange = () => updateScopeCount();
  });

  const selectAllBtn = $("#selectAllScopesBtn");
  const clearAllBtn = $("#clearAllScopesBtn");
  if (selectAllBtn) {
    selectAllBtn.onclick = () => {
      $$(".scope-chk").forEach(c => { c.checked = true; });
      updateScopeCount();
    };
  }
  if (clearAllBtn) {
    clearAllBtn.onclick = () => {
      $$(".scope-chk").forEach(c => { c.checked = false; });
      updateScopeCount();
    };
  }

  // Handle Form Submission
  const form = $("#createApiKeyForm");
  if (form) {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const name = fd.get("name").trim();
      if (!name) return toast("Key name is required.", "error");

      let scopes = "*";
      if (customRadio.checked) {
        const checked = Array.from($$(".scope-chk:checked")).map(el => el.value);
        if (checked.length === 0) return toast("Please select at least one scope or choose Full Access.", "error");
        scopes = checked.join(",");
      }

      const allowedIps = (fd.get("allowed_ips") || "").trim();
      const rateLimit = Number(fd.get("rate_limit")) || 120;
      const expiresInDays = fd.get("expires_in_days") ? Number(fd.get("expires_in_days")) : null;

      try {
        const res = await api("/admin/api-keys", {
          method: "POST",
          body: JSON.stringify({
            name,
            scopes,
            allowed_ips: allowedIps,
            rate_limit: rateLimit,
            expires_in_days: expiresInDays
          })
        });

        toast("API Key generated successfully!");
        closeModal();
        renderPage();
        showKeyRevealModal(res.raw_key, res.key);
      } catch (err) {
        toast(err.message, "error");
      }
    };
  }
}

  const curlExample = `curl -X GET "${origin}/api/dashboard" \\\n  -H "Authorization: Bearer ${rawKey}"`;
  const pythonExample = `import requests\n\nheaders = {"Authorization": "Bearer ${rawKey}"}\nresponse = requests.get("${origin}/api/dashboard", headers=headers)\nprint(response.json())`;
  const nodeExample = `const res = await fetch("${origin}/api/dashboard", {\n  headers: { "Authorization": "Bearer ${rawKey}" }\n});\nconst data = await res.json();\nconsole.log(data);`;

  showModal(`
