function modalConfirm({
  title = "Confirm Action",
  subtitle = "",
  message = "Are you sure you want to proceed?",
  details = null,
  confirmText = "Confirm",
  cancelText = "Cancel",
  type = "warning",
  icon = null
} = {}) {
  return new Promise(resolve => {
    const root = $("#confirmRoot");
    if (!root) {
      resolve(window.confirm(message));
      return;
    }

    const defaultIcons = {
      danger: "alert",
      warning: "alert",
      info: "lightbulb",
      primary: "zap",
      success: "check"
    };
    const iconName = icon || defaultIcons[type] || "alert";
    const iconSvg = ico(iconName, "lg");
    const btnClass = type === "danger" ? "danger" : "primary";
    const actionIco = type === "danger" ? "trash" : (icon || "check");

    let detailsHtml = "";
    if (details) {
      if (Array.isArray(details)) {
        detailsHtml = `<div class="confirm-details-box ${esc(type)}">
          <ul class="confirm-bullets">
            ${details.map(d => `<li>${esc(d)}</li>`).join("")}
          </ul>
        </div>`;
      } else {
        detailsHtml = `<div class="confirm-details-box ${esc(type)}">
          <div style="font-family:'Space Grotesk',monospace;word-break:break-all">${esc(details)}</div>
        </div>`;
      }
    }

    root.innerHTML = `<div class="confirm-backdrop" data-confirm-backdrop>
      <div class="confirm-modal confirm-type-${esc(type)}" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="confirm-header">
          <div class="confirm-icon-badge ${esc(type)}">
            ${iconSvg}
          </div>
          <div class="confirm-titles">
            <h3 id="confirmTitle" class="confirm-title">${esc(title)}</h3>
            ${subtitle ? `<p class="confirm-subtitle">${esc(subtitle)}</p>` : ""}
          </div>
          <button class="confirm-close-btn" data-confirm-btn="cancel" aria-label="Close dialog">
            <svg class="svg-ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div class="confirm-body">
          <div class="confirm-msg">${esc(message).replace(/\n/g, "<br>")}</div>
          ${detailsHtml}
        </div>
        <div class="confirm-actions">
          <button type="button" class="btn ghost" data-confirm-btn="cancel">${esc(cancelText)}</button>
          <button type="button" class="btn ${btnClass}" data-confirm-btn="ok" id="confirmOkBtn">
            ${ico(actionIco, "sm")} ${esc(confirmText)}
          </button>
        </div>
      </div>
    </div>`;

    function cleanup(result) {
      window.removeEventListener("keydown", onKeyDown);
      root.innerHTML = "";
      resolve(result);
    }

    function onKeyDown(e) {
      if (e.key === "Escape") {
        e.preventDefault();
        cleanup(false);
      } else if (e.key === "Enter") {
        e.preventDefault();
        cleanup(true);
      }
    }

    window.addEventListener("keydown", onKeyDown);

    const okBtn = root.querySelector('[data-confirm-btn="ok"]');
    const cancelBtns = root.querySelectorAll('[data-confirm-btn="cancel"]');
    const backdrop = root.querySelector("[data-confirm-backdrop]");

    if (okBtn) {
      okBtn.onclick = () => cleanup(true);
      setTimeout(() => okBtn.focus(), 40);
    }

    cancelBtns.forEach(btn => {
      btn.onclick = () => cleanup(false);
    });

    if (backdrop) {
      backdrop.onclick = e => {
        if (e.target === backdrop) cleanup(false);
      };
    }
  });
}

function modalPrompt({
  title = "Enter Information",
  subtitle = "",
  message = "",
  inputLabel = "",
  placeholder = "",
  defaultValue = "",
  confirmText = "Submit",
  cancelText = "Cancel",
  type = "primary",
  icon = "edit",
  validator = null
} = {}) {
  return new Promise(resolve => {
    const root = $("#confirmRoot");
    if (!root) {
      resolve(window.prompt(message, defaultValue));
      return;
    }

    const iconSvg = ico(icon || "edit", "lg");
    const btnClass = type === "danger" ? "danger" : "primary";

    root.innerHTML = `<div class="confirm-backdrop" data-confirm-backdrop>
      <div class="confirm-modal confirm-type-${esc(type)}" role="dialog" aria-modal="true" aria-labelledby="promptTitle">
        <div class="confirm-header">
          <div class="confirm-icon-badge ${esc(type)}">
            ${iconSvg}
          </div>
          <div class="confirm-titles">
            <h3 id="promptTitle" class="confirm-title">${esc(title)}</h3>
            ${subtitle ? `<p class="confirm-subtitle">${esc(subtitle)}</p>` : ""}
          </div>
          <button class="confirm-close-btn" data-confirm-btn="cancel" aria-label="Close dialog">
            <svg class="svg-ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <form id="confirmPromptForm" class="confirm-body" onsubmit="return false;">
          ${message ? `<div class="confirm-msg">${esc(message).replace(/\n/g, "<br>")}</div>` : ""}
          <div class="confirm-input-wrap">
            ${inputLabel ? `<label for="confirmPromptInput">${esc(inputLabel)}</label>` : ""}
            <input type="text" id="confirmPromptInput" class="confirm-input" placeholder="${esc(placeholder)}" value="${esc(defaultValue)}" autocomplete="off" spellcheck="false" />
            <div id="confirmPromptError" class="confirm-error hidden"></div>
          </div>
          <div class="confirm-actions">
            <button type="button" class="btn ghost" data-confirm-btn="cancel">${esc(cancelText)}</button>
            <button type="submit" class="btn ${btnClass}" data-confirm-btn="ok" id="confirmPromptOkBtn">
              ${ico(icon || "check", "sm")} ${esc(confirmText)}
            </button>
          </div>
        </form>
      </div>
    </div>`;

    const input = root.querySelector("#confirmPromptInput");
    const errorEl = root.querySelector("#confirmPromptError");
    const form = root.querySelector("#confirmPromptForm");
    const cancelBtns = root.querySelectorAll('[data-confirm-btn="cancel"]');
    const backdrop = root.querySelector("[data-confirm-backdrop]");

    function cleanup(result) {
      window.removeEventListener("keydown", onKeyDown);
      root.innerHTML = "";
      resolve(result);
    }

    function submitValue() {
      const val = (input ? input.value : "").trim();
      if (validator) {
        const err = validator(val);
        if (err) {
          if (errorEl) {
            errorEl.textContent = err;
            errorEl.classList.remove("hidden");
          }
          if (input) input.focus();
          return;
        }
      }
      cleanup(val);
    }

    function onKeyDown(e) {
      if (e.key === "Escape") {
        e.preventDefault();
        cleanup(null);
      }
    }

    window.addEventListener("keydown", onKeyDown);

    if (form) {
      form.onsubmit = e => {
        e.preventDefault();
        submitValue();
      };
    }

    cancelBtns.forEach(btn => {
      btn.onclick = () => cleanup(null);
    });

    if (backdrop) {
      backdrop.onclick = e => {
        if (e.target === backdrop) cleanup(null);
      };
    }

    if (input) {
      setTimeout(() => {
        input.focus();
        input.select();
      }, 50);
      input.oninput = () => {
        if (errorEl) errorEl.classList.add("hidden");
      };
    }
  });
}

            storage: fd.get("storage"),
            userId: Number(fd.get("userId"))
          })
        });
        $("#modalRoot").innerHTML = "";
        toast(res.message || `Virtual server cloned successfully as "${res.name}" (VMID ${res.vmid})!`);
        state.currentServerId = res.id;
        state.page = "vps";
        state.vpsTab = "specs";
        await renderPage();
      } catch (err) {
        if (submitBtn) submitBtn.disabled = false;
        if (progressNotice) progressNotice.classList.add("hidden");
        toast(err.message, "error");
      }
    };
  } catch (err) {
    showModal(`<div class="modal-head"><h3>Clone Error</h3><button class="close" data-close>×</button></div><div class="empty" style="color:var(--red)">${esc(err.message)}</div>`);
  }
}

async function openXtermConsole(id) {
  const s = (state.servers || []).find(x => x.id === id) || { id, name: 'VPS', vmid: id, type: 'vps' };
  const typeLabel = (s.type || 'vps').toUpperCase();
  const vmidLabel = s.vmid || id;

  showModal(`
    <div class="terminal-modal-header">
      <div class="terminal-modal-title">
        <h3>${ico("monitor")} <span>${esc(s.name)}</span></h3>
        <span class="tag" style="border-color:rgba(99,102,241,0.3)">${typeLabel}</span>
        <span class="tag">VMID ${vmidLabel}</span>
        <span class="terminal-status-badge connecting" id="termStatusBadge">
          <i class="terminal-status-dot"></i>
          <span id="termStatusText">Connecting…</span>
        </span>
      </div>
      <div class="terminal-modal-actions">
        <button id="btnTermCtrlC" title="Send Ctrl+C interrupt signal">${ico("code", "sm")} Ctrl+C</button>
        <button id="btnTermCad" title="Send Ctrl+Alt+Del signal">${ico("refresh", "sm")} Ctrl+Alt+Del</button>
        <button id="btnTermClear" title="Clear terminal screen">${ico("trash", "sm")} Clear</button>
        <button id="btnTermReconnect" title="Reconnect console session">${ico("zap", "sm")} Reconnect</button>
        <button id="btnTermFullscreen" title="Toggle Fullscreen">${ico("external", "sm")} <span id="btnFullscreenText">Fullscreen</span></button>
        <button class="btn-close-term" data-close title="Close Terminal">✕</button>
      </div>
    </div>
    <div class="terminal-screen-container" id="terminalScreenContainer">
      <div id="terminalMount" style="width:100%;height:100%;"></div>
      <div class="terminal-overlay-banner" id="termOverlayBanner">
        <div class="spinner" style="width:28px;height:28px;border-width:3px"></div>
        <div style="font-weight:600;font-size:14px;color:#fff" id="termOverlayTitle">Establishing direct Proxmox TTY connection…</div>
        <div class="muted small" id="termOverlaySub">Authenticating with hypervisor token bridge…</div>
      </div>
    </div>
  `, "modal-terminal");

  const modalEl = $("#modalRoot .modal-terminal");
  const overlayBanner = $("#termOverlayBanner");
  const overlayTitle = $("#termOverlayTitle");
  const overlaySub = $("#termOverlaySub");
  const statusBadge = $("#termStatusBadge");
  const statusText = $("#termStatusText");

  let term = null;
  let fitAddon = null;
  let ws = null;
  let resizeObserver = null;
  let keepAliveInterval = null;

  const setStatus = (st, text) => {
    if (!statusBadge || !statusText) return;
    statusBadge.className = `terminal-status-badge ${st}`;
    statusText.textContent = text;
  };

  const cleanupSession = () => {
    if (keepAliveInterval) { clearInterval(keepAliveInterval); keepAliveInterval = null; }
    if (resizeObserver) { resizeObserver.disconnect(); resizeObserver = null; }
    if (ws) {
      try {
        ws.onopen = null;
        ws.onmessage = null;
        ws.onclose = null;
        ws.onerror = null;
        ws.close();
      } catch (e) {}
      ws = null;
    }
    if (term) {
      try { term.dispose(); } catch (e) {}
      term = null;
    }
  };

  window._activeConsoleCleanup = cleanupSession;

  // Fullscreen button
  const fsBtn = $("#btnTermFullscreen");
  if (fsBtn) {
    fsBtn.onclick = () => {
      if (!modalEl) return;
      modalEl.classList.toggle("is-fullscreen");
      const isFs = modalEl.classList.contains("is-fullscreen");
      const fsText = $("#btnFullscreenText");
      if (fsText) fsText.textContent = isFs ? "Exit Fullscreen" : "Fullscreen";
      setTimeout(() => {
        if (fitAddon && term) {
          fitAddon.fit();
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
          }
        }
      }, 150);
    };
  }

  // Ctrl+C button
  const ctrlCBtn = $("#btnTermCtrlC");
  if (ctrlCBtn) {
    ctrlCBtn.onclick = () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "input", data: "\x03" }));
        if (term) term.focus();
      }
    };
  }

  // Ctrl+Alt+Del button
  const cadBtn = $("#btnTermCad");
  if (cadBtn) {
    cadBtn.onclick = () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "input", data: "\x1b[3~" }));
        if (term) term.focus();
        toast("Sent Ctrl+Alt+Del signal.");
      }
    };
  }

  // Clear button
  const clearBtn = $("#btnTermClear");
  if (clearBtn) {
    clearBtn.onclick = () => {
      if (term) {
        term.clear();
        term.focus();
      }
    };
  }

  // Reconnect button
  const reconnectBtn = $("#btnTermReconnect");
  if (reconnectBtn) {
    reconnectBtn.onclick = () => {
      cleanupSession();
      initConnection();
    };
  }

  async function initConnection() {
    setStatus("connecting", "Connecting…");
    if (overlayBanner) {
      overlayBanner.style.display = "flex";
      if (overlayTitle) overlayTitle.textContent = "Connecting to Proxmox terminal bridge…";
      if (overlaySub) overlaySub.textContent = "Setting up secure xterm session…";
    }

    try {
      if (typeof window.Terminal === "undefined" || !window.FitAddon?.FitAddon) {
        await loadScript("/xterm/lib/xterm.js");
        await loadScript("/xterm-addon-fit/lib/xterm-addon-fit.js");
      }

      const res = await api(`/servers/${id}/termproxy`, { method: "POST" });
      if (!res.ok || !res.sessionId) {
        throw new Error(res.error || "Failed to initialize Proxmox terminal session.");
      }

      const mountEl = document.getElementById("terminalMount");
      if (!mountEl) return;
      mountEl.innerHTML = "";

      term = new window.Terminal({
        cursorBlink: true,
        cursorStyle: "bar",
        fontSize: 13,
        lineHeight: 1.25,
        fontFamily: "'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace",
        theme: {
          background: "#050811",
          foreground: "#e2e8f0",
          cursor: "#38bdf8",
          selectionBackground: "rgba(99, 102, 241, 0.4)",
          black: "#050811",
          red: "#ef4444",
          green: "#22c55e",
          yellow: "#eab308",
          blue: "#38bdf8",
          magenta: "#a855f7",
          cyan: "#06b6d4",
          white: "#f8fafc",
          brightBlack: "#475569",
          brightRed: "#f87171",
          brightGreen: "#4ade80",
          brightYellow: "#facc15",
          brightBlue: "#60a5fa",
          brightMagenta: "#c084fc",
          brightCyan: "#22d3ee",
          brightWhite: "#ffffff"
        },
        convertEol: true,
        scrollback: 5000
      });

      fitAddon = new window.FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(mountEl);
      fitAddon.fit();

      const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${wsProto}//${location.host}/ws/console?session=${encodeURIComponent(res.sessionId)}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        fitAddon.fit();
        ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));

        keepAliveInterval = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "ping" }));
          }
        }, 15000);
      };

      ws.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === "status") {
            if (msg.status === "connected") {
              setStatus("connected", "Live / Connected");
              if (overlayBanner) overlayBanner.style.display = "none";
              term.focus();
              fitAddon.fit();
              ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
            } else if (msg.status === "disconnected") {
              setStatus("disconnected", "Disconnected");
            }
          } else if (msg.type === "data" && typeof msg.data === "string") {
            if (overlayBanner && overlayBanner.style.display !== "none") {
              overlayBanner.style.display = "none";
            }
            term.write(msg.data);
          } else if (msg.type === "error") {
            setStatus("disconnected", "Error");
            term.write(`\r\n\x1b[1;31m[Proxmox Terminal Error] ${msg.message}\x1b[0m\r\n`);
          }
        } catch {
          term.write(evt.data);
        }
      };

      ws.onerror = (err) => {
        setStatus("disconnected", "Bridge Error");
        if (overlayBanner) {
          overlayBanner.style.display = "flex";
          if (overlayTitle) overlayTitle.textContent = "Terminal Connection Failed";
          if (overlaySub) overlaySub.textContent = "Unable to connect to Proxmox terminal bridge.";
        }
      };

      ws.onclose = (evt) => {
        setStatus("disconnected", "Disconnected");
      };

      term.onData((data) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "input", data }));
        }
      });

      term.onResize((size) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "resize", cols: size.cols, rows: size.rows }));
        }
      });

      if (window.ResizeObserver) {
        resizeObserver = new ResizeObserver(() => {
          if (fitAddon && term) {
            fitAddon.fit();
          }
        });
        resizeObserver.observe(mountEl);
      }

    } catch (err) {
      setStatus("disconnected", "Connection Error");
      if (overlayBanner) {
        overlayBanner.style.display = "flex";
        if (overlayTitle) overlayTitle.textContent = "Unable to Launch Console";
        if (overlaySub) overlaySub.textContent = err.message || "Failed to start termproxy.";
      }
      toast(err.message, "error");
    }
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const existing = document.querySelector(`script[src="${src}"]`);
      if (existing) return resolve();
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  initConnection();
}

async function consoleModal(id) {

  try {
    const [st, cfg] = await Promise.all([
      api(`/servers/${id}/status`),
      api(`/servers/${id}/config`)
    ]);
    const status = st.status || {}, cData = cfg.config || {};
    // Fetch nodes if not already in window
    let node = (window._atyroNodes || []).find(n => n.name === (s.pve_node || s.node_name));
    if (!node) {
      try {
        const nodesData = await api("/admin/nodes");
        window._atyroNodes = nodesData.nodes;
        node = (window._atyroNodes || []).find(n => n.name === (s.pve_node || s.node_name)) || (window._atyroNodes && window._atyroNodes[0]) || null;
      } catch {}
    }
    if (!node) node = null;

    let ipAddress = "";
    if (status.nics) {
      for (const nic of Object.values(status.nics)) {
        if (nic.ip && !nic.ip.startsWith("127.") && !nic.ip.startsWith("fe80")) {
          ipAddress = nic.ip.split("/")[0]; break;
        }
      }

    if (!ipAddress && cData.ipconfig0) {
      const m = cData.ipconfig0.match(/ip=([0-9.]+)/);
      if (m && m[1] && m[1] !== "dhcp") ipAddress = m[1];
    }
    if (!ipAddress && cData.net0) {
      const m = cData.net0.match(/ip=([0-9.]+)/);
      if (m && m[1] && m[1] !== "dhcp") ipAddress = m[1];
    }
    const sshUser = cData.ciuser || "root";
    const sshHost = ipAddress || `<server-ip>`;
    const sshCmd = `ssh ${sshUser}@${sshHost}`;

    showModal(`<div class="modal-head"><div><h3>${ico("monitor")} Remote Console & Access</h3><p class="muted small" style="margin:2px 0 0">Server: <b>${esc(s.name)}</b> (VMID ${s.vmid} · ${esc(s.type.toUpperCase())})</p></div><button class="close" data-close>×</button></div><div style="display:flex;flex-direction:column;gap:16px"><div class="panel" style="background:var(--panel2);margin:0"><div class="panel-title"><h4>${ico("key")} Quick SSH Terminal Connection</h4></div><p class="muted small" style="margin-bottom:8px">Connect directly from your local terminal or SSH client:</p><div style="display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;gap:10px"><code id="sshCmdText" style="flex:1;font-family:'Space Grotesk',monospace;color:#86efac;font-size:13px;user-select:all">${esc(sshCmd)}</code><button class="btn small primary" id="copySshBtn" style="padding:5px 12px">${ico("clipboard")} Copy</button></div></div><div class="panel" style="background:var(--panel2);margin:0"><div class="panel-title"><h4>${ico("monitor")} Proxmox VE Web Console (xterm.js)</h4><span class="tag" style="background:rgba(34,197,94,0.12);color:#86efac;border-color:rgba(34,197,94,0.3)">Direct Interactive Shell</span></div><p class="muted small" style="margin-bottom:12px">Launch full interactive terminal console directly inside the panel (zero Proxmox authentication required):</p><div style="display:flex;gap:10px;align-items:center"><button class="btn primary" id="openProxmoxWebConsoleBtn" style="padding:10px 18px;font-weight:700">${ico("monitor")} Open Vps Terminal</button></div></div><div class="panel" style="background:var(--panel2);margin:0"><div class="panel-title"><h4>${ico("logs")} Network & Hardware Details</h4></div><div class="spec-row"><span class="k">Active IP Address</span><span class="v" style="font-family:'Space Grotesk',monospace">${ipAddress ? `<b style="color:var(--green)">${ipAddress}</b>` : '<span class="muted">DHCP / Guest agent reporting…</span>'}</span></div><div class="spec-row"><span class="k">SSH User</span><span class="v" style="font-family:'Space Grotesk',monospace"><b>${esc(sshUser)}</b></span></div><div class="spec-row"><span class="k">SSH Port</span><span class="v" style="font-family:'Space Grotesk',monospace"><b>22</b></span></div><div class="spec-row"><span class="k">Virtual Bridge</span><span class="v" style="font-family:'Space Grotesk',monospace">${cData.net0 ? (cData.net0.match(/bridge=([^,]+)/)?.[1] || 'vmbr0') : 'vmbr0'}</span></div><div class="spec-row"><span class="k">MAC Address</span><span class="v" style="font-family:'Space Grotesk',monospace">${cData.net0 ? (cData.net0.match(/(?:virtio|hwaddr|macaddr)=([A-Fa-f0-9:]+)/)?.[1] || '—') : '—'}</span></div></div></div>`);

    const copyBtn = $("#copySshBtn");
    if (copyBtn) {
      copyBtn.onclick = () => {
        try {
          navigator.clipboard.writeText(sshCmd);
          toast("SSH command copied to clipboard!");
        } catch {
          toast("Copy failed, please select and copy manually.", "error");
        }
      };
    }
    const openBtn = $("#openProxmoxWebConsoleBtn");
    if (openBtn) {
      openBtn.onclick = () => {
        openXtermConsole(id);
      };
    }
  } catch (err) {
    showModal(`<div class="modal-head"><h3>Access Error</h3><button class="close" data-close>×</button></div><div class="empty" style="color:var(--red)">${esc(err.message)}</div>`);
  }
}

async function tasksPage(c) {
  if (state.user.role !== "admin") {
    c.innerHTML = '<div class="panel"><div class="empty">Administrator role required to view cluster tasks.</div></div>';

  }
  c.innerHTML = '<div class="empty">Loading Proxmox VE cluster tasks & background jobs…</div>';
  try {
    const d = await api("/admin/tasks");
    const tasks = d.tasks || [];

    const countOk = tasks.filter(t => t.status === "OK").length;
    const countRunning = tasks.filter(t => !t.endtime || t.status === "RUNNING").length;
    const countError = tasks.filter(t => t.status && t.status !== "OK" && t.status !== "RUNNING").length;

    c.innerHTML = `<div class="page-head"><div><h1>${ico("clock")} Proxmox Cluster Tasks</h1><p>Real-time log of hypervisor background jobs, VM cloning, backups, restores, and power tasks.</p></div><div style="display:flex;gap:8px"><button class="btn ghost" data-action="refresh">${ico("refresh")} Refresh Tasks</button></div></div><div class="grid stats" style="margin-bottom:20px"><div class="stat"><div class="stat-top">Total Tasks Logged <span class="stat-icon">${ico("clock")}</span></div><div class="stat-value">${tasks.length}</div></div><div class="stat"><div class="stat-top">Running Jobs <span class="stat-icon" style="color:var(--blue)">${ico("zap")}</span></div><div class="stat-value" style="color:var(--blue)">${countRunning}</div></div><div class="stat"><div class="stat-top">Successful (OK) <span class="stat-icon" style="color:var(--green)">${ico("check")}</span></div><div class="stat-value" style="color:var(--green)">${countOk}</div></div><div class="stat"><div class="stat-top">Errors / Warnings <span class="stat-icon" style="color:var(--red)">${ico("alert")}</span></div><div class="stat-value" style="color:${countError > 0 ? 'var(--red)' : 'var(--muted)'}">${countError}</div></div></div><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px"><div style="display:flex;align-items:center;gap:10px;flex:1;min-width:260px"><input type="text" id="taskSearchInput" value="${esc(state.taskSearchQuery)}" placeholder="Filter tasks by UPID, type, node, or user…" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:#fff;font-size:13px;width:100%"></div><div id="taskFilterChips" style="display:flex;gap:6px;flex-wrap:wrap"><button class="preset-chip ${state.taskFilterType === 'all' ? 'active' : ''}" data-task-filter="all">All (${tasks.length})</button><button class="preset-chip ${state.taskFilterType === 'running' ? 'active' : ''}" data-task-filter="running">${ico("zap", "sm")} Running (${countRunning})</button><button class="preset-chip ${state.taskFilterType === 'vzdump' ? 'active' : ''}" data-task-filter="vzdump">${ico("backup", "sm")} Backups</button><button class="preset-chip ${state.taskFilterType === 'clone' ? 'active' : ''}" data-task-filter="clone">${ico("clone", "sm")} Clones</button><button class="preset-chip ${state.taskFilterType === 'error' ? 'active' : ''}" data-task-filter="error">${ico("alert", "sm")} Errors</button></div></div><div class="panel table-wrap" id="tasksTableContainer">${renderTasksTable(filterTasks(tasks))}</div>`;

    setupTaskFilterEvents(tasks);
  } catch (err) {
    c.innerHTML = `<div class="panel"><div class="empty" style="color:var(--red)">Error loading cluster tasks: ${esc(err.message)}</div></div>`;
    toast(err.message, "error");
  }
}

function filterTasks(tasks) {
  return tasks.filter(t => {
    const isRunning = !t.endtime || t.status === "RUNNING";
    const isError = t.status && t.status !== "OK" && t.status !== "RUNNING";
    const type = (t.type || "").toLowerCase();

    if (state.taskFilterType === "running" && !isRunning) return false;
    if (state.taskFilterType === "error" && !isError) return false;
    if (state.taskFilterType === "vzdump" && !type.includes("vzdump")) return false;
    if (state.taskFilterType === "clone" && !type.includes("clone")) return false;

    if (state.taskSearchQuery) {
      const q = state.taskSearchQuery.toLowerCase();
      const matchType = type.includes(q);
      const matchUser = (t.user || "").toLowerCase().includes(q);
      const matchNode = (t.node || t.node_name || "").toLowerCase().includes(q);
      const matchUpid = (t.upid || "").toLowerCase().includes(q);
      const matchId = String(t.id || "").includes(q);
      if (!matchType && !matchUser && !matchNode && !matchUpid && !matchId) return false;
    }
    return true;
  });
}

function renderTasksTable(tasks) {
  if (!tasks.length) return '<div class="empty">No Proxmox cluster tasks matching filter.</div>';
  return `<table><thead><tr><th>ACTION / OPERATION</th><th>TARGET (VMID)</th><th>NODE</th><th>STATUS</th><th>INITIATED BY</th><th>START TIME</th><th>DURATION</th><th>UPID</th></tr></thead><tbody>${tasks.map(t => {
    const isRunning = !t.endtime || t.status === "RUNNING";
    const isOk = t.status === "OK";
    const durationSec = t.endtime && t.starttime ? Math.max(0, t.endtime - t.starttime) : null;
    const durationStr = isRunning ? '<span style="color:var(--blue)">Running…</span>' : (durationSec != null ? `${durationSec}s` : '—');

    let typeBadge = `${ico("gear", "sm")} ${esc(t.type || "task")}`;
    if (t.type === "qmclone" || t.type === "vzclone") typeBadge = `${ico("clone", "sm")} Clone ${t.type === 'qmclone' ? 'VM' : 'LXC'}`;
    else if (t.type === "vzdump") typeBadge = `${ico("backup", "sm")} Backup (VZDump)`;
    else if (t.type === "qmstart" || t.type === "vzstart") typeBadge = `${ico("play", "sm")} Start ${t.type === 'qmstart' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmstop" || t.type === "vzstop") typeBadge = `${ico("stop", "sm")} Stop ${t.type === 'qmstop' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmreboot" || t.type === "vzreboot") typeBadge = `${ico("refresh", "sm")} Reboot ${t.type === 'qmreboot' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmcreate" || t.type === "vzcreate") typeBadge = `${ico("zap", "sm")} Create ${t.type === 'qmcreate' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmconfig" || t.type === "vzconfig") typeBadge = `${ico("edit", "sm")} Config ${t.type === 'qmconfig' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmsnapshot" || t.type === "vzsnapshot") typeBadge = `${ico("camera", "sm")} Snapshot`;
    else if (t.type === "qmrollback" || t.type === "vzrollback") typeBadge = `${ico("restore", "sm")} Rollback`;
    else if (t.type === "aptupdate") typeBadge = `${ico("refresh", "sm")} APT Update`;

    return `<tr><td><b>${typeBadge}</b><div class="small muted" style="font-family:'Space Grotesk',monospace">${esc(t.type)}</div></td><td>${t.id ? `<span class="tag">VMID <b>${esc(t.id)}</b></span>` : '<span class="muted">—</span>'}</td><td><b>${esc(t.node || t.node_name || "—")}</b></td><td>${isRunning ? `<span class="badge" style="background:rgba(56,189,248,0.1);color:var(--blue);border-color:rgba(56,189,248,0.3)">${ico("statusDot", "sm")} RUNNING</span>` : (isOk ? `<span class="badge running">${ico("check", "sm")} OK</span>` : `<span class="badge stopped">${ico("alert", "sm")} ${esc(t.status || 'Error')}</span>`)}</td><td><span class="small" style="font-family:'Space Grotesk',monospace;color:#ccc">${esc(t.user || "root@pam")}</span></td><td style="font-size:12px;color:#bbb">${t.starttime ? new Date(t.starttime * 1000).toLocaleString() : '—'}</td><td style="font-family:'Space Grotesk',monospace;font-size:12px">${durationStr}</td><td><button class="btn small ghost" style="font-family:'Space Grotesk',monospace;font-size:10px;padding:3px 7px" title="${esc(t.upid)}" onclick="navigator.clipboard.writeText('${esc(t.upid)}');toast('UPID copied to clipboard!')">${ico("clipboard", "sm")} Copy UPID</button></td></tr>`;
  }).join("")}</tbody></table>`;
}

function setupTaskFilterEvents(allTasks) {
  const searchInput = $("#taskSearchInput");
  const chips = $("#taskFilterChips");
  const container = $("#tasksTableContainer");
  const apply = () => {
    const filtered = filterTasks(allTasks);
    if (container) container.innerHTML = renderTasksTable(filtered);
  };
  if (searchInput) {
    searchInput.oninput = () => {
      state.taskSearchQuery = searchInput.value.trim();
      apply();
    };
  }
  if (chips) {
    chips.querySelectorAll("[data-task-filter]").forEach(btn => {
      btn.onclick = () => {
        state.taskFilterType = btn.dataset.taskFilter;
        chips.querySelectorAll("[data-task-filter]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        apply();
      };
    });
  }
}

async function deleteUser(id) {
  const u = (window._atyroUsers || []).find(x => x.id === id);
  const name = u ? u.username : `User #${id}`;
  const ok = await modalConfirm({
    title: "Delete Panel User",
    subtitle: `Target: ${name}`,
    message: `Are you sure you want to permanently delete user account "${name}"?`,
    details: [
      "The user will be immediately logged out and cannot log in again.",
      "All panel server assignments for this user will be removed.",
      "Proxmox VE virtual machines/containers will NOT be destroyed."
    ],
    confirmText: "Delete User",
    type: "danger",
    icon: "trash"
  });
  if (!ok) return;
  try {
    await api(`/admin/users/${id}`, { method: "DELETE", body: "{}" });

    await renderPage();
  } catch (e) { toast(e.message, "error"); }

async function nodeDashboardPage(c) {

  }
  c.innerHTML = '<div class="empty">Loading comprehensive Proxmox node details…</div>';
  try {

    const node = d.node, pveNode = d.pveNode, ver = d.version || {}, st = d.status || null, cluster = d.clusterInfo || {};
    const net = d.network || [], vms = d.vms || [], summary = d.vmSummary || {}, storage = d.storage || [];
    const isOnline = cluster.status === "online" || !st || st.status === "online";
    const hostCpuPct = st && st.cpu != null ? (st.cpu * 100).toFixed(1) : null;
    const cpuSockets = st?.cpuinfo?.sockets || 1;
    const cpuCores = st?.cpuinfo?.cpus || st?.cpuinfo?.cores || summary.allocatedCpu || 1;

    const swapTotal = st?.swap?.total || 0;
    const swapUsed = st?.swap?.used || 0;
    const diskTotal = st?.rootfs?.total || summary.allocatedDisk || 0;
    const diskUsed = st?.rootfs?.used || 0;
    const diskFree = st?.rootfs?.free || Math.max(0, diskTotal - diskUsed);
    const diskPct = diskTotal > 0 && st?.rootfs?.used ? ((diskUsed / diskTotal) * 100).toFixed(1) : null;

    c.innerHTML = `<div style="margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><button class="btn ghost small" data-action="back-nodes">${ico("arrowLeft")} Back to Proxmox nodes</button><div class="actions"><button class="btn ghost" data-action="node-refresh">${ico("refresh")} Refresh</button><button class="btn" data-action="test-node" data-id="${id}">Test API</button><button class="btn" data-action="edit-node" data-id="${id}">Edit Node</button></div></div><div class="vps-head"><div class="vps-title-wrap"><div class="vps-title"><h1>${esc(node.name)}</h1><span class="badge ${isOnline ? 'running' : 'stopped'}">${ico("statusDot", "sm")} ${isOnline ? 'Online' : 'Offline'}</span></div><div class="vps-badges"><span class="badge">PVE Node: <b>${esc(pveNode)}</b></span><span class="badge">Proxmox VE ${esc(ver.version || '9.x')} (rel ${esc(ver.release || '9.x')})</span><span class="badge">Host: ${esc(node.host)}:${node.port}</span><span class="badge">Hosted VMs: <b>${vms.length}</b></span>${st?.uptime ? `<span class="badge">${ico("clock", "sm")} Uptime: ${formatUptime(st.uptime)}</span>` : ''}</div></div></div><div class="metric-grid"><div class="metric-card"><div class="metric-top"><span>CPU UTILIZATION</span><span style="color:var(--accent)">${hostCpuPct != null ? hostCpuPct + '%' : summary.allocatedCpu + ' vCPUs'}</span></div><div class="metric-val">${hostCpuPct != null ? hostCpuPct + '%' : summary.allocatedCpu + ' Cores'}</div><div class="metric-sub">${st?.cpuinfo ? `${cpuCores} Cores · ${cpuSockets} Sockets` : `${summary.allocatedCpu} vCPUs provisioned`}</div><div class="progress"><div class="progress-bar" style="width:${hostCpuPct != null ? Math.min(100, Math.max(2, hostCpuPct)) : 100}%"></div></div><div class="small muted" style="margin-top:8px">Load avg: <b>${loadAvg}</b></div></div><div class="metric-card"><div class="metric-top"><span>HOST MEMORY (RAM)</span><span>${memPct != null ? memPct + '%' : formatBytes(summary.allocatedMem)}</span></div><div class="metric-val">${memPct != null ? formatBytes(memUsed) : formatBytes(summary.allocatedMem)}</div><div class="metric-sub">${memPct != null ? `of ${formatBytes(memTotal)} (${formatBytes(memFree)} free)` : `Allocated across ${summary.total} VMs`}</div><div class="progress"><div class="progress-bar green" style="width:${memPct != null ? Math.min(100, Math.max(2, memPct)) : 100}%"></div></div><div class="small muted" style="margin-top:8px">${swapTotal > 0 ? `Swap: ${formatBytes(swapUsed)} / ${formatBytes(swapTotal)}` : `RAM allocation: ${formatBytes(summary.allocatedMem)}`}</div></div><div class="metric-card"><div class="metric-top"><span>STORAGE / ROOT DISK</span><span>${diskPct != null ? diskPct + '%' : formatBytes(summary.allocatedDisk)}</span></div><div class="metric-val">${diskPct != null ? formatBytes(diskUsed) : formatBytes(summary.allocatedDisk)}</div><div class="metric-sub">${diskPct != null ? `of ${formatBytes(diskTotal)} (${formatBytes(diskFree)} free)` : `Total virtual disk allocated`}</div><div class="progress"><div class="progress-bar blue" style="width:${diskPct != null ? Math.min(100, Math.max(2, diskPct)) : 100}%"></div></div><div class="small muted" style="margin-top:8px">${st?.rootfs ? `Root filesystem: ${formatBytes(diskTotal)}` : `Provisioned disks: ${formatBytes(summary.allocatedDisk)}`}</div></div><div class="metric-card"><div class="metric-top"><span>HOSTED VIRTUAL MACHINES</span><span style="color:var(--green)">${summary.running} Running</span></div><div class="metric-val">${summary.total} VMs / LXC</div><div class="metric-sub"><span style="color:var(--green)">${ico("statusDot", "sm")} ${summary.running} running</span> &nbsp; <span style="color:var(--red)">${ico("statusDot", "sm")} ${summary.stopped} stopped</span></div><div class="progress"><div class="progress-bar purple" style="width:${summary.total > 0 ? Math.round((summary.running / summary.total) * 100) : 0}%"></div></div><div class="small muted" style="margin-top:8px">Active Interfaces: <b>${activeNics} of ${net.length} NICs</b></div></div></div>${d.statusSysAuditRequired ? `<div class="notice" style="margin-bottom:20px;border-color:rgba(234,179,8,0.2);background:rgba(234,179,8,0.05);color:#fbbf24;border-radius:12px;padding:16px"><div style="font-weight:700;font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:7px"><span>${ico("lightbulb", "sm", "color:var(--yellow)")}</span> Proxmox Host Hardware Sensor Metrics (Host CPU %, Memory Gauge, Kernel)</div><div style="line-height:1.6">Node information, Proxmox version, Network adapters (${net.length} NICs), and all ${vms.length} hosted VMs with vCPU/RAM/Disk metrics are successfully loaded.<br>To also stream real-time host-level physical CPU/Memory hardware sensors, add <b>Sys.Audit</b> or <b>PVEAuditor</b> permission to this API token in Proxmox VE:<br><b>Datacenter -> Permissions -> Add -> API Token Permission</b> (Path: <code>/</code>, Token: <code>${esc(node.token_id)}</code>, Role: <code>Sys.Audit</code> or <code>PVEAuditor</code>).</div></div>` : ''}<div class="tab-nav"><button class="tab-btn ${state.nodeTab === 'overview' ? 'active' : ''}" data-action="node-tab" data-tab="overview">${ico("monitor")} System & Hardware Specs</button><button class="tab-btn ${state.nodeTab === 'vms' ? 'active' : ''}" data-action="node-tab" data-tab="vms">${ico("box")} Hosted Virtual Machines (${vms.length})</button><button class="tab-btn ${state.nodeTab === 'network' ? 'active' : ''}" data-action="node-tab" data-tab="network">${ico("network")} Network Interfaces (${net.length})</button><button class="tab-btn ${state.nodeTab === 'storage' ? 'active' : ''}" data-action="node-tab" data-tab="storage">${ico("backup")} Storage Pools (${storage.length})</button></div><div id="nodeTabContent">${renderNodeTabContent(d)}</div>`;
  } catch (err) {
    c.innerHTML = `<div class="panel"><div class="empty">Error loading Proxmox node details: ${esc(err.message)} <br><br><button class="btn" data-action="back-nodes">${ico("arrowLeft")} Back to nodes</button></div></div>`;

  }

s="v" style="font-family:'Space Grotesk',monospace">${esc(node.token_id)}</span></div><div class="spec-row"><span class="k">SSL Fingerprint</span><span class="v" style="font-size:10px;font-family:'Space Grotesk',monospace;max-width:200px;word-break:break-all">${esc(cluster.ssl_fingerprint || "Verified via Proxmox cluster")}</span></div><div class="spec-row"><span class="k">TLS Verification</span><span class="v">${node.tls_verify ? '<span style="color:var(--green)">Enabled (Strict)</span>' : '<span style="color:var(--yellow)">Disabled (Self-signed)</span>'}</span></div><div class="spec-row"><span class="k">Panel Node Status</span><span class="v">${node.enabled ? '<span style="color:var(--green)">Enabled</span>' : '<span style="color:var(--red)">Disabled</span>'}</span></div><div class="spec-row"><span class="k">Total Network Adapters</span><span class="v">${net.length} NICs detected</span></div><div class="spec-row"><span class="k">Added to Panel</span><span class="v">${esc(node.created_at)}</span></div></div></div>`;
}

function nodeModal() {
  showModal(`<div class="modal-head"><h3>Connect Proxmox node</h3><button class="close" data-close>×</button></div><form id="createNode"><div class="field"><label>Display name</label><input name="name" placeholder="pve-01" required></div><div class="form-grid"><div class="field"><label>Hostname / IP</label><input name="host" placeholder="pve.example.com" required></div><div class="field"><label>API port</label><input name="port" type="number" value="8006" required></div></div><div class="field"><label>API token ID</label><input name="tokenId" placeholder="panel@pve!atyro" required></div><div class="field"><label>API token secret</label><input name="tokenSecret" type="password" required placeholder="Enter API token secret"></div><div class="field"><label>TLS certificate verification</label><select name="tlsVerify"><option value="true">Verify certificate (recommended)</option><option value="false">Skip verification (testing only)</option></select></div><button class="btn primary" style="width:100%;margin-top:10px">Test and save node</button></form><div class="notice">${ico("lightbulb", "sm", "color:var(--yellow)")} Create a dedicated Proxmox API token with required permissions (PVEVMAdmin). In Proxmox, uncheck 'Privilege Separation' or grant ACL permissions under Datacenter -> Permissions.</div>`);
  $("#createNode").onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    d.tlsVerify = d.tlsVerify === "true";
    try {
      const r = await api("/admin/nodes", { method: "POST", body: JSON.stringify(d) });
      $("#modalRoot").innerHTML = "";
      toast(r.message, r.warning ? "warning" : "success");
      await renderPage();
    } catch (err) { toast(err.message, "error"); }
  };
}

function editNodeModal(id) {
  const n = (window._atyroNodes || []).find(x => x.id === id);
  if (!n) return toast("Node not found.", "error");
  showModal(`<div class="modal-head"><h3>Edit Proxmox node</h3><button class="close" data-close>×</button></div><form id="editNode"><div class="field"><label>Display name</label><input name="name" value="${esc(n.name)}" required></div><div class="form-grid"><div class="field"><label>Hostname / IP</label><input name="host" value="${esc(n.host)}" required></div><div class="field"><label>API port</label><input name="port" type="number" value="${n.port || 8006}" required></div></div><div class="field"><label>API token ID</label><input name="tokenId" value="${esc(n.token_id)}" required></div><div class="field"><label>API token secret <span class="muted small">(leave blank to keep current secret)</span></label><input name="tokenSecret" type="password" placeholder="********************"></div><div class="form-grid"><div class="field"><label>TLS certificate verification</label><select name="tlsVerify"><option value="true" ${n.tls_verify ? "selected" : ""}>Verify certificate (recommended)</option><option value="false" ${!n.tls_verify ? "selected" : ""}>Skip verification (testing only)</option></select></div><div class="field"><label>Status</label><select name="enabled"><option value="true" ${n.enabled ? "selected" : ""}>Enabled</option><option value="false" ${!n.enabled ? "selected" : ""}>Disabled</option></select></div></div><button class="btn primary" style="width:100%;margin-top:10px">Verify and save changes</button></form>`);
  $("#editNode").onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    d.port = Number(d.port);
    d.tlsVerify = d.tlsVerify === "true";
    d.enabled = d.enabled === "true";
    if (!d.tokenSecret || !d.tokenSecret.trim()) { delete d.tokenSecret; }
    try {
      const r = await api(`/admin/nodes/${id}`, { method: "PATCH", body: JSON.stringify(d) });
      $("#modalRoot").innerHTML = "";
      toast(r.message || "Node updated successfully.", r.warning ? "warning" : "success");
      await renderPage();
    } catch (err) { toast(err.message, "error"); }
  };
}

async function deleteNode(id) {
  const n = (window._atyroNodes || []).find(x => x.id === id);
  const name = n ? n.name : `#${id}`;
  const ok = await modalConfirm({
    title: "Delete Proxmox Node",
    subtitle: `Node: ${name}`,
    message: `Are you sure you want to disconnect and delete Proxmox node "${name}" from this panel?`,
    details: [
      "The connection settings and API tokens will be removed from this panel.",
      "The Proxmox VE hypervisor itself and its running VMs will not be affected."
    ],
    confirmText: "Delete Node",
    type: "danger",
    icon: "trash"
  });
  if (!ok) return;
  try {
    const r = await api(`/admin/nodes/${id}`, { method: "DELETE", body: "{}" });
    toast(r.message || "Node deleted successfully.");
    await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function testNode(id) {
  try {
    const d = await api(`/admin/nodes/${id}/test`, { method: "POST", body: "{}" });
    if (d.warning) {
      toast(`Connected · Proxmox ${d.version?.version || "API OK"} — ${d.warning}`, "warning");
    } else {
      toast(`Connected · Proxmox ${d.version?.version || "API OK"}`);
    }
  } catch (e) { toast(e.message, "error"); }
}

async function toggleNode(id, enabled) {
  try {
    await api(`/admin/nodes/${id}`, { method: "PATCH", body: JSON.stringify({ enabled: !enabled }) });
    toast("Node updated.");
    await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function createVpsPage(c, targetNodeId) {
  if (state.user.role !== "admin") {
    c.innerHTML = '<div class="panel"><div class="empty">Access restricted: Administrator role required to deploy virtual servers.</div></div>';
    return;
  }
  c.innerHTML = '<div class="empty">Loading Proxmox templates, ISOs, and node resources…</div>';
  try {
    const nodeParam = targetNodeId || state.createVpsState.nodeId || "";
    const url = "/admin/servers/create/options" + (nodeParam ? `?nodeId=${nodeParam}` : "");
    const d = await api(url);
    state.createVpsState.cachedData = d;
    if (d.node) state.createVpsState.nodeId = d.node.id;
    if (!d.nodes || !d.nodes.length) {
      c.innerHTML = '<div class="panel"><div class="empty">No enabled Proxmox nodes found. Please add or enable a Proxmox node first.<br><br><button class="btn primary" data-page="nodes">Manage Proxmox nodes</button></div></div>';
      return;
    }
    renderCreateVpsForm(c, d);
  } catch (err) {
    c.innerHTML = `<div class="panel"><div class="empty">Error loading deployment options: ${esc(err.message)}<br><br><button class="btn ghost" data-action="create-vps">${ico("refresh")} Try again</button></div></div>`;
    toast(err.message, "error");
  }
}

function renderCreateVpsForm(c, d) {
  const isQemu = state.createVpsState.type === "qemu";
  const isLxc = state.createVpsState.type === "lxc";
  const isTemplate = state.createVpsState.source === "template";
  const isIso = isQemu && state.createVpsState.source === "iso";

  const currentNodeId = d.selectedNodeId || (d.node && d.node.id) || (d.nodes && d.nodes[0] ? d.nodes[0].id : state.createVpsState.nodeId);
  const currentNode = (d.nodes || []).find(n => n.id === currentNodeId) || d.nodes?.[0] || {};

  // 1. Template options
  let templateOptionsHtml = "";
  if (isQemu) {
    if (d.qemuTemplates && d.qemuTemplates.length) {
      templateOptionsHtml = d.qemuTemplates.map((t, idx) => {
        const diskStr = t.disk ? ` · ${formatBytes(t.disk)}` : "";
        return `<option value="${esc(t.vmid)}" ${idx === 0 ? "selected" : ""}>${esc(t.name)} (VMID ${t.vmid})${diskStr} · QEMU Cloud-Init</option>`;
      }).join("");
    } else {
      templateOptionsHtml = '<option value="1003">Ubuntu-24.04 (VMID 1003) · QEMU Cloud-Init</option><option value="4001">Debian-12 (VMID 4001) · QEMU Cloud-Init</option>';

  } else {
    const locals = (d.lxcTemplates || []).filter(t => t.isLocal || (typeof t.volid === "string" && t.volid.startsWith("local:")));
    const onlines = (d.lxcTemplates || []).filter(t => !locals.includes(t));
    let lHtml = "";
    if (locals.length > 0) {
      lHtml += '<optgroup label="Downloaded Local Templates (Instant Deployment ~2s)">';
      lHtml += locals.map((t, idx) => {
        const val = t.volid || t.template || t.package;
        const label = t.name || t.headline || t.package || val;
        const sz = t.size ? ` (${formatBytes(t.size)})` : "";
        return `<option value="${esc(val)}" ${idx === 0 ? "selected" : ""}>${esc(label)}${sz} [Local Fast]</option>`;
      }).join("");
      lHtml += '</optgroup>';
    }
    if (onlines.length > 0) {
      lHtml += '<optgroup label="Proxmox Official Appliance Repository">';
      lHtml += onlines.map((t, idx) => {
        const val = t.volid || t.template || t.package;
        const label = t.name || t.headline || t.package || val;
        const sec = t.section ? ` [${t.section}]` : "";
        return `<option value="${esc(val)}" ${locals.length === 0 && idx === 0 ? "selected" : ""}>${esc(label)}${sec}</option>`;
      }).join("");
      lHtml += '</optgroup>';
    }
    templateOptionsHtml = lHtml || '<option value="ubuntu-24.04-standard_24.04-2_amd64.tar.zst">Ubuntu 24.04 LTS (standard)</option><option value="debian-12-standard_12.7-1_amd64.tar.zst">Debian 12 Bookworm (standard)</option>';
  }

  // 2. ISO options
  const isoItems = (d.isoList && d.isoList.length ? d.isoList : (d.isos || []));
  let isoOptionsHtml = "";
  if (isoItems.length) {
    isoOptionsHtml = isoItems.map((iso, idx) => {
      const volid = typeof iso === "object" ? iso.volid : iso;
      const name = typeof iso === "object" ? (iso.name || iso.volid) : iso;
      const sizeStr = typeof iso === "object" && iso.size ? ` (${formatBytes(iso.size)})` : "";
      return `<option value="${esc(volid)}" ${idx === 0 ? "selected" : ""}>${esc(name)}${sizeStr}</option>`;
    }).join("");
    isoOptionsHtml += '<option value="__custom__">Custom ISO Volume ID…</option>';
  } else {
    isoOptionsHtml = '<option value="__custom__">Enter custom ISO path (e.g. local:iso/os.iso)</option>';
  }

  // 3. Storage Pools
  const storagesList = (d.storages && d.storages.length ? d.storages : ["nvme-storage", "local-lvm"]);
  const storagesHtml = storagesList.map((s, idx) => {
    const name = typeof s === "object" ? (s.storage || s.name || "storage") : s;
    const isSelected = name === "nvme-storage" || (idx === 0 && !storagesList.some(x => (typeof x === "object" ? x.storage : x) === "nvme-storage"));
    const availStr = typeof s === "object" && s.avail ? ` — ${formatBytes(s.avail)} free (${s.type || 'storage'})` : "";
    return `<option value="${esc(name)}" ${isSelected ? "selected" : ""}>${esc(name)}${esc(availStr)}</option>`;
  }).join("");

  // 4. Bridges
  const bridgesList = (d.bridges && d.bridges.length ? d.bridges : [{ iface: "vmbr0", cidr: "", gateway: "", ports: "", active: true }]);
  const bridgesHtml = bridgesList.map((b, idx) => {
    const iface = typeof b === "object" ? b.iface : b;
    const isSelected = idx === 0;
    let desc = [];
    if (typeof b === "object") {
      if (b.cidr) desc.push(b.cidr);
      if (b.ports) desc.push(`Port: ${b.ports}`);
      if (b.gateway) desc.push(`GW: ${b.gateway}`);
      if (b.active) desc.push("Active");
    }
    const descStr = desc.length ? ` — [${desc.join(" · ")}]` : "";
    return `<option value="${esc(iface)}" ${isSelected ? "selected" : ""}>${esc(iface)}${esc(descStr)}</option>`;
  }).join("");

  // 5. Users & Nodes
  const usersHtml = (d.users || []).map((u, idx) => `<option value="${u.id}" ${u.role === "admin" ? "selected" : (idx === 0 ? "selected" : "")}>${esc(u.username)} (${esc(u.email)}) [${esc(u.role)}]</option>`).join("");
  const nodesHtml = (d.nodes || []).map(n => `<option value="${n.id}" ${n.id === currentNodeId ? "selected" : ""}>${esc(n.name)} · ${esc(n.host)}</option>`).join("");

  c.innerHTML = `
    <div class="page-head">
      <div>
        <h1>${ico("zap")} Deploy Virtual Server</h1>
        <p>Deploy a new KVM Virtual Machine or LXC Linux Container with complete A-to-Z Proxmox VE hardware, network, DNS and OS configuration.</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" data-page="servers">Virtual servers</button>
        <button class="btn ghost" id="createVpsRefreshBtn">${ico("refresh")} Refresh</button>
      </div>
    </div>

    ${d.nodeStats ? `
      <div style="background:linear-gradient(135deg, rgba(99,102,241,0.08), rgba(168,85,247,0.04));border:1px solid rgba(99,102,241,0.22);border-radius:12px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="color:var(--accent);display:inline-flex">${ico("nodes", "lg")}</span>
          <div>
            <div style="font-weight:700;font-size:14px;color:white;display:flex;align-items:center;gap:8px">
              Proxmox Node: <code>${esc(d.pveNode || currentNode.name)}</code>
              <span class="tag" style="background:rgba(34,197,94,0.15);color:#4ade80;border-color:rgba(34,197,94,0.3)">Online</span>
              ${d.nodeStats.pveVersion ? `<span class="tag" style="background:rgba(255,255,255,0.06);color:#bbb">${esc(d.nodeStats.pveVersion.split('/')[1] || d.nodeStats.pveVersion)}</span>` : ''}
            </div>
            <div class="small muted" style="margin-top:3px">
              ${d.nodeStats.cpuModel ? `${esc(d.nodeStats.cpuModel)} (${d.nodeStats.cpus || 0} cores)` : `Host: ${esc(currentNode.host || '')}`}
            </div>
          </div>
        </div>
        <div style="display:flex;gap:18px;align-items:center;font-size:12px;flex-wrap:wrap">
          ${d.nodeStats.memoryTotal ? `<div><span class="muted">Free RAM:</span> <b style="color:#eee">${formatBytes(d.nodeStats.memoryFree)}</b> / ${formatBytes(d.nodeStats.memoryTotal)}</div>` : ''}
          <div><span class="muted">Next VMID:</span> <b class="tag" style="background:rgba(99,102,241,0.15);color:var(--accent);border-color:rgba(99,102,241,0.3);font-size:12px">#${d.nextVmid || 106}</b></div>
        </div>
      </div>
    ` : ''}

    ${d.datastorePermissionRequired ? `
      <div class="notice" style="border-color:rgba(234,179,8,0.2);background:rgba(234,179,8,0.05);color:#fbbf24;margin-top:0;margin-bottom:20px;border-radius:12px;padding:14px;font-size:12px">
        <b>${ico("lightbulb", "sm", "color:var(--yellow)")} Proxmox Datastore Permission Notice:</b> To clone templates or allocate virtual disks on storage pools, API token <code>${esc(currentNode.name)}</code> requires the <code>PVEDatastoreUser</code> or <code>Administrator</code> role on path <code>/</code> in Proxmox VE (Datacenter -> Permissions).
      </div>
    ` : ''}

    <form id="createVpsForm" style="display:flex;flex-direction:column;gap:18px;max-width:980px">
      <!-- 1. Virtualization Type & Provisioning Source -->
      <div class="panel">
        <div class="panel-title"><h3>1. Virtualization Type & Provisioning Source</h3></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px">
          <div id="selectTypeQemu" style="cursor:pointer;padding:18px;border-radius:12px;border:2px solid ${isQemu ? 'var(--accent)' : 'var(--line)'};background:${isQemu ? 'rgba(99,102,241,0.08)' : 'var(--panel2)'};transition:all .2s;box-shadow:${isQemu ? '0 0 16px rgba(99,102,241,0.15)' : 'none'}">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
              <span style="color:var(--accent);display:inline-flex">${ico("kvm", "lg")}</span>

          </div>
        ` : ''}
      </div>

      <!-- 2. Proxmox Target, Ownership & Identity -->
      <div class="panel">
        <div class="panel-title"><h3>2. Proxmox Target, Ownership & Identity</h3></div>
        <div class="form-grid">
          <div class="field">
            <label>Target Proxmox Node</label>
            <select name="nodeId" id="createNodeSelect" required>${nodesHtml}</select>

          <div class="field">
            <label>Assign to Panel User</label>
            <select name="userId" required>${usersHtml}</select>

        <div class="form-grid">
