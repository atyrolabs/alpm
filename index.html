async function openXtermConsole(id) {
  const s = (state.servers || []).find(x => x.id === id) || { id, name: 'VPS', vmid: id, type: 'vps' };
  const typeLabel = (s.type || 'vps').toUpperCase();
  const vmidLabel = s.vmid || id;

  showModal(`
    <div class="terminal-modal-header">
      <div class="terminal-modal-title">
        <h3>${ico("monitor")} <span>${esc(s.name)}</span></h3>
        <span class="tag" style="border-color:rgba(99,102,241,0.3)">${typeLabel}</span>
        <span class="tag">VMID ${vmidLabel}</span>
        <span class="terminal-status-badge connecting" id="termStatusBadge">
          <i class="terminal-status-dot"></i>
          <span id="termStatusText">Connecting…</span>
        </span>
      </div>
      <div class="terminal-modal-actions">
        <button id="btnTermCopy" title="Copy all terminal output or selection to clipboard">${ico("clipboard", "sm")} Copy Text</button>
        <button id="btnTermPaste" title="Paste text from clipboard into terminal">${ico("clipboard", "sm")} Paste</button>
        <button id="btnTermEnter" title="Send Enter / Return to console">${ico("cornerDownLeft", "sm")} Enter</button>
        <button id="btnTermCtrlC" title="Send Ctrl+C interrupt signal">${ico("code", "sm")} Ctrl+C</button>
        <button id="btnTermCad" title="Send Ctrl+Alt+Del signal">${ico("refresh", "sm")} Ctrl+Alt+Del</button>
        <button id="btnTermClear" title="Clear terminal screen">${ico("trash", "sm")} Clear</button>
        <button id="btnTermReconnect" title="Reconnect console session">${ico("zap", "sm")} Reconnect</button>
        <button id="btnTermFullscreen" title="Toggle Fullscreen">${ico("external", "sm")} <span id="btnFullscreenText">Fullscreen</span></button>
        <button class="btn-close-term" data-close title="Close Terminal">✕</button>
      </div>
    </div>
    <div class="terminal-screen-container" id="terminalScreenContainer">
      <div id="terminalMount" style="width:100%;height:100%;position:relative;overflow:hidden"></div>
      <div class="terminal-overlay-banner" id="termOverlayBanner">
        <div class="spinner" style="width:28px;height:28px;border-width:3px"></div>
        <div style="font-weight:600;font-size:14px;color:#fff" id="termOverlayTitle">Establishing direct Proxmox TTY connection…</div>
        <div class="muted small" id="termOverlaySub">Authenticating with hypervisor token bridge…</div>
      </div>
    </div>
  `, "modal-terminal");

  const modalEl = $("#modalRoot .modal-terminal");
  const overlayBanner = $("#termOverlayBanner");
  const overlayTitle = $("#termOverlayTitle");
  const overlaySub = $("#termOverlaySub");
  const statusBadge = $("#termStatusBadge");
  const statusText = $("#termStatusText");

  let term = null;
  let fitAddon = null;
  let ws = null;
  let resizeObserver = null;
  let domObserver = null;
  let keepAliveInterval = null;
  let handleWindowKeyDown = null;

  const focusTerminal = () => {
    if (!term) return;
    try { term.focus(); } catch (_) {}
    const ta = term.textarea || (modalEl ? modalEl.querySelector(".xterm-helper-textarea") : null) || document.querySelector(".xterm-helper-textarea");
    if (ta) {
      try {
        ta.focus({ preventScroll: true });
      } catch (_) {
        try { ta.focus(); } catch (e) {}
      }
    }
  };

  const setStatus = (st, text) => {
    if (!statusBadge || !statusText) return;
    statusBadge.className = `terminal-status-badge ${st}`;
    statusText.textContent = text;
  };

  const cleanupSession = () => {
    if (handleWindowKeyDown) {
      try { window.removeEventListener("keydown", handleWindowKeyDown, true); } catch (_) {}
      handleWindowKeyDown = null;
    }
    if (keepAliveInterval) { clearInterval(keepAliveInterval); keepAliveInterval = null; }
    if (resizeObserver) { resizeObserver.disconnect(); resizeObserver = null; }
    if (domObserver) { try { domObserver.disconnect(); } catch (e) {} domObserver = null; }
    if (ws) {
      try {
        ws.onopen = null;
        ws.onmessage = null;
        ws.onclose = null;
        ws.onerror = null;
        ws.close();
      } catch (e) {}
      ws = null;
    }
    if (term) {
      try { term.dispose(); } catch (e) {}
      term = null;
    }
  };

  window._activeConsoleCleanup = cleanupSession;

  function getTerminalCleanText(t) {
    if (!t || !t.buffer || !t.buffer.active) return "";
    const b = t.buffer.active;
    const lines = [];
    for (let i = 0; i < b.length; i++) {
      const line = b.getLine(i);
      if (line) lines.push(line.translateToString(true));
    }
    while (lines.length > 0 && lines[lines.length - 1].trim() === "") lines.pop();
    return lines.join("\n");
  }

  function copyTextToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta);
  }

  // Copy Output button
  const copyBtn = $("#btnTermCopy");
  if (copyBtn) {
    copyBtn.onclick = () => {
      if (!term) return;
      let text = term.getSelection();
      if (!text || text.trim().length === 0) {
        text = getTerminalCleanText(term);
      }
      if (text && text.trim().length > 0) {
        copyTextToClipboard(text);
        toast(`Copied ${text.length} characters of terminal output!`);
      } else {
        toast("No terminal text to copy yet.", "warning");
      }
      try { copyBtn.blur(); } catch (_) {}
      focusTerminal();
    };
  }

  // Paste button
  const pasteBtn = $("#btnTermPaste");
  if (pasteBtn) {
    pasteBtn.onclick = async () => {
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text && term) {
            term.paste(text);
          }
        } else {
          toast("Please use Ctrl+V to paste.", "warning");
        }
      } catch (err) {
        toast("Clipboard access blocked by browser. Please use Ctrl+V.", "warning");
      }
      try { pasteBtn.blur(); } catch (_) {}
      focusTerminal();
    };
  }

  // Enter button
  const enterBtn = $("#btnTermEnter");
  if (enterBtn) {
    enterBtn.onclick = () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "input", data: "\r" }));
      }
      try { enterBtn.blur(); } catch (_) {}
      focusTerminal();
    };
  }

  // Fullscreen button
  const fsBtn = $("#btnTermFullscreen");
  if (fsBtn) {
    fsBtn.onclick = () => {
      if (!modalEl) return;
      modalEl.classList.toggle("is-fullscreen");
      const isFs = modalEl.classList.contains("is-fullscreen");
      const fsText = $("#btnFullscreenText");
      if (fsText) fsText.textContent = isFs ? "Exit Fullscreen" : "Fullscreen";
      setTimeout(() => {
        if (fitAddon && term) {
          fitAddon.fit();
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
          }
        }
        focusTerminal();
      }, 150);
      try { fsBtn.blur(); } catch (_) {}
      focusTerminal();
    };
  }

  // Ctrl+C button
  const ctrlCBtn = $("#btnTermCtrlC");
  if (ctrlCBtn) {
    ctrlCBtn.onclick = () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "input", data: "\x03" }));
      }
      try { ctrlCBtn.blur(); } catch (_) {}
      focusTerminal();
    };
  }

  // Ctrl+Alt+Del button
  const cadBtn = $("#btnTermCad");
  if (cadBtn) {
    cadBtn.onclick = () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "input", data: "\x1b[3~" }));
        toast("Sent Ctrl+Alt+Del signal.");
      }
      try { cadBtn.blur(); } catch (_) {}
      focusTerminal();
    };
  }

  // Clear button
  const clearBtn = $("#btnTermClear");
  if (clearBtn) {
    clearBtn.onclick = () => {
      if (term) {
        term.clear();
      }
      try { clearBtn.blur(); } catch (_) {}
      focusTerminal();
    };
  }

  // Reconnect button
  const reconnectBtn = $("#btnTermReconnect");
  if (reconnectBtn) {
    reconnectBtn.onclick = () => {
      cleanupSession();
      initConnection();
    };
  }

  async function initConnection() {
    setStatus("connecting", "Connecting…");
    if (overlayBanner) {
      overlayBanner.style.display = "flex";
      if (overlayTitle) overlayTitle.textContent = "Connecting to Proxmox terminal bridge…";
      if (overlaySub) overlaySub.textContent = "Setting up secure xterm session…";
    }

    try {
      const { Term: TerminalCtor, Fit: FitAddonCtor } = await ensureXtermAvailable();

      const res = await api(`/servers/${id}/termproxy`, { method: "POST" });
      if (!res.ok || !res.sessionId) {
        throw new Error(res.error || "Failed to initialize Proxmox terminal session.");
      }

      const mountEl = document.getElementById("terminalMount");
      if (!mountEl) return;
      mountEl.innerHTML = "";

      term = new TerminalCtor({
        cursorBlink: true,
        cursorStyle: "bar",
        fontSize: 13,
        lineHeight: 1.25,
        fontFamily: "'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace",
        theme: {
          background: "#050811",
          foreground: "#e2e8f0",
          cursor: "#38bdf8",
          selectionBackground: "rgba(99, 102, 241, 0.45)",
          black: "#050811",
          red: "#ef4444",
          green: "#22c55e",
          yellow: "#eab308",
          blue: "#38bdf8",
          magenta: "#a855f7",
          cyan: "#06b6d4",
          white: "#f8fafc",
          brightBlack: "#475569",
          brightRed: "#f87171",
          brightGreen: "#4ade80",
          brightYellow: "#facc15",
          brightBlue: "#60a5fa",
          brightMagenta: "#c084fc",
          brightCyan: "#22d3ee",
          brightWhite: "#ffffff"
        },
        convertEol: true,
        scrollback: 5000
      });

      fitAddon = new FitAddonCtor();
      term.loadAddon(fitAddon);
      term.open(mountEl);
      fitAddon.fit();

      // Keyboard handler: Ctrl+C copies selection if text selected, else sends interrupt; Ctrl+V pastes;
      // Prevents xterm 5.3.0 duplicate keypress emission for lowercase letters, numbers, and symbols
      term.attachCustomKeyEventHandler((e) => {
        if ((e.ctrlKey || e.metaKey) && (e.key === "c" || e.key === "C") && e.type === "keydown") {
          const sel = term.getSelection();
          if (sel && sel.length > 0) {
            copyTextToClipboard(sel);
            toast("Selected text copied to clipboard!");
            return false;
          }
          return true;
        }
        if ((e.ctrlKey || e.metaKey) && (e.key === "v" || e.key === "V")) {
          // Allow native browser paste event to fire onto xterm helper textarea naturally without duplicate WS dispatch.
          // Returning false tells xterm NOT to process keydown as the terminal control code (^V / 0x16)
          return false;
        }
        // In xterm 5.3.0, _keyDown emits keys with keyCode >= 48 (numbers, lowercase letters, symbols)
        // but skips uppercase A-Z (65-90) and Space (32), which rely on keypress.
        // Therefore, allow keypress ONLY for uppercase A-Z (65-90) and Space (32 / " "), blocking duplicates for the rest.
        if (e.type === "keypress") {
          const code = e.charCode || e.keyCode || (e.key && e.key.charCodeAt(0));
          if (code === 32 || e.key === " " || (code >= 65 && code <= 90)) {
            return true;
          }
          return false;
        }
        return true;
      });

      // Natural click-to-focus for terminal: NO preventDefault, so mouse selection & clicks work natively
      const handleTerminalFocus = (e) => {
        if (e && e.target && (e.target.closest("button") || e.target.closest("a") || (e.target.tagName === "INPUT" && !e.target.classList.contains("xterm-helper-textarea")))) {
          return;
        }
        focusTerminal();
      };

      mountEl.addEventListener("click", handleTerminalFocus);
      const containerEl = document.getElementById("terminalScreenContainer");
      if (containerEl) {
        containerEl.addEventListener("click", handleTerminalFocus);
      }
      if (modalEl) {
        modalEl.addEventListener("click", handleTerminalFocus);
      }

      // Universal keyboard focus manager: ensures all keyboard input flows naturally into xterm.js
      handleWindowKeyDown = (e) => {
        if (!term || !document.getElementById("modalRoot") || !modalEl) return;
        const target = e.target;
        // Don't intercept if user is typing in a form input outside the terminal
        if (target && (target.tagName === "INPUT" || (target.tagName === "TEXTAREA" && !modalEl.contains(target)) || target.tagName === "SELECT")) {
          return;
        }

        // If focus was on a toolbar button inside modal, blur it so Space/Enter won't trigger the button
        if (target && target.tagName === "BUTTON" && modalEl.contains(target)) {
          try { target.blur(); } catch (_) {}
        }

        // Ensure terminal textarea has focus so xterm captures the key naturally
        focusTerminal();
      };
      window.addEventListener("keydown", handleWindowKeyDown, true);

      // Lightweight Terminal Sanitizer: Keeps char-measure element invisible with zero glitch
      let isSanitizing = false;
      const sanitizeTerminalDOM = () => {
        if (isSanitizing) return;
        isSanitizing = true;
        try {
          mountEl.querySelectorAll(".xterm-char-measure-element, [class*='char-measure']").forEach(el => {
            el.style.setProperty("display", "none", "important");
            el.style.setProperty("visibility", "hidden", "important");
            el.style.setProperty("position", "absolute", "important");
            el.style.setProperty("top", "-9999px", "important");
            el.style.setProperty("left", "-9999px", "important");
            el.style.setProperty("z-index", "-9999", "important");
            el.style.setProperty("pointer-events", "none", "important");
          });
        } catch (_) {}
        finally {
          isSanitizing = false;
        }
      };

      sanitizeTerminalDOM();
      term.onRender(() => sanitizeTerminalDOM());

      focusTerminal();
      setTimeout(focusTerminal, 50);
      setTimeout(focusTerminal, 150);
      setTimeout(focusTerminal, 300);

      if (window.MutationObserver) {
        if (domObserver) { try { domObserver.disconnect(); } catch (_) {} }
        domObserver = new MutationObserver((mutations) => {
          let hasNewNode = false;
          for (let m of mutations) {
            if (m.addedNodes && m.addedNodes.length > 0) { hasNewNode = true; break; }
          }
          if (hasNewNode) sanitizeTerminalDOM();
        });
        domObserver.observe(mountEl, { childList: true, subtree: true });
      }

      let lastCols = 0;
      let lastRows = 0;
      const sendResize = (cols, rows) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const c = Math.max(10, Math.min(500, Number(cols) || 80));
        const r = Math.max(5, Math.min(200, Number(rows) || 24));
        if (c === lastCols && r === lastRows) return;
        lastCols = c;
        lastRows = r;
        ws.send(JSON.stringify({ type: "resize", cols: c, rows: r }));
      };

      const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${wsProto}//${location.host}/ws/console?session=${encodeURIComponent(res.sessionId)}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        fitAddon.fit();
        sendResize(term.cols, term.rows);

        keepAliveInterval = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "ping" }));
          }
        }, 15000);
      };

      ws.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === "status") {
            if (msg.status === "connected") {
              setStatus("connected", "Live / Connected");
              if (overlayBanner) overlayBanner.style.display = "none";
              fitAddon.fit();
              sendResize(term.cols, term.rows);
              focusTerminal();
              setTimeout(focusTerminal, 100);
              setTimeout(focusTerminal, 300);
            } else if (msg.status === "disconnected") {
              setStatus("disconnected", "Disconnected");
            }
          } else if (msg.type === "data" && typeof msg.data === "string") {
            if (overlayBanner && overlayBanner.style.display !== "none") {
              overlayBanner.style.display = "none";
            }
            term.write(msg.data);
          } else if (msg.type === "error") {
            setStatus("disconnected", "Error");
            term.write(`\r\n\x1b[1;31m[Proxmox Terminal Error] ${msg.message}\x1b[0m\r\n`);
          }
        } catch {
          term.write(evt.data);
        }
      };

      ws.onerror = (err) => {
        setStatus("disconnected", "Bridge Error");
        if (overlayBanner) {
          overlayBanner.style.display = "flex";
          if (overlayTitle) overlayTitle.textContent = "Terminal Connection Failed";
          if (overlaySub) overlaySub.textContent = "Unable to connect to Proxmox terminal bridge.";
        }
      };

      ws.onclose = (evt) => {
        setStatus("disconnected", "Disconnected");
      };

      let lastInputData = null;
      let lastInputTime = 0;
      term.onData((data) => {
        if (!data) return;
        const now = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
        const elapsed = now - lastInputTime;

        // Drop duplicate echoes or rapid double-dispatch events:
        // Multi-character string (pasted text): duplicate within 300ms is a duplicate paste echo
        // Single character: duplicate within 40ms is a browser event bounce (held-key auto-repeat is >50ms)
        if (data === lastInputData) {
          if (data.length > 1 && elapsed < 300) {
            return;
          }
          if (data.length === 1 && elapsed < 40) {
            return;
          }
        }

        lastInputData = data;
        lastInputTime = now;
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "input", data }));
        }
      });

      term.onResize((size) => {
        sendResize(size.cols, size.rows);
      });

      if (window.ResizeObserver) {
        resizeObserver = new ResizeObserver(() => {
          if (fitAddon && term) {
            fitAddon.fit();
          }
        });
        resizeObserver.observe(mountEl);
      }

    } catch (err) {
      setStatus("disconnected", "Connection Error");
      if (overlayBanner) {
        overlayBanner.style.display = "flex";
        if (overlayTitle) overlayTitle.textContent = "Unable to Launch Console";
        if (overlaySub) overlaySub.textContent = err.message || "Failed to start termproxy.";
      }
      toast(err.message, "error");
    }
  }

  function getTerminalCtor() {
    if (typeof window.Terminal === "function") return window.Terminal;
    if (window.Terminal && typeof window.Terminal.Terminal === "function") return window.Terminal.Terminal;
    if (window.Terminal && typeof window.Terminal.default === "function") return window.Terminal.default;
    return null;
  }

  function getFitAddonCtor() {
    if (window.FitAddon && typeof window.FitAddon.FitAddon === "function") return window.FitAddon.FitAddon;
    if (typeof window.FitAddon === "function") return window.FitAddon;
    if (window.FitAddon && typeof window.FitAddon.default === "function") return window.FitAddon.default;
    return null;
  }

  function injectScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.async = false;
      s.setAttribute("data-cfasync", "false");
      s.onload = () => resolve();
      s.onerror = (e) => reject(new Error(`Failed to load: ${src}`));
      document.head.appendChild(s);
    });
  }

  async function ensureXtermAvailable() {
    let Term = getTerminalCtor();
    let Fit = getFitAddonCtor();
    if (Term && Fit) return { Term, Fit };

    // Wait up to 2 seconds if scripts are already downloading
    for (let i = 0; i < 20; i++) {
      await new Promise(r => setTimeout(r, 100));
      Term = getTerminalCtor();
      Fit = getFitAddonCtor();
      if (Term && Fit) return { Term, Fit };
    }

    // Try dynamic load from local routes
    try {
      await injectScript(`/xterm/lib/xterm.js?_t=${Date.now()}`);
      await injectScript(`/xterm-addon-fit/lib/xterm-addon-fit.js?_t=${Date.now()}`);
    } catch (e) {
      console.warn("[xterm] Local load failed, attempting CDN fallback:", e);
    }

    Term = getTerminalCtor();
    Fit = getFitAddonCtor();
    if (Term && Fit) return { Term, Fit };

    // CDN fallback (jsdelivr)
    try {
      await injectScript("https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js");
      await injectScript("https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js");
    } catch (e) {
      console.error("[xterm] CDN load failed:", e);
    }

    Term = getTerminalCtor();
    Fit = getFitAddonCtor();
    if (Term && Fit) return { Term, Fit };

    throw new Error("Terminal engine (xterm.js) could not be loaded. Please disable Cloudflare Rocket Loader or check network connection.");
  }

  initConnection();
}

      api(`/servers/${id}/status`),
      api(`/servers/${id}/config`)
    ]);
    const status = st.status || {}, cData = cfg.config || {};
    // Fetch nodes if not already in window

    }
    const sshUser = cData.ciuser || "root";
    const sshHost = ipAddress || `<server-ip>`;
    const sshCmd = `ssh ${sshUser}@${sshHost}`;

 / Guest agent reporting…</span>'}</span></div><div class="spec-row"><span class="k">SSH User</span><span class="v" style="font-family:'Space Grotesk',monospace"><b>${esc(sshUser)}</b></span></div><div class="spec-row"><span class="k">SSH Port</span><span class="v" style="font-family:'Space Grotesk',monospace"><b>22</b></span></div><div class="spec-row"><span class="k">Virtual Bridge</span><span class="v" style="font-family:'Space Grotesk',monospace">${cData.net0 ? (cData.net0.match(/bridge=([^,]+)/)?.[1] || 'vmbr0') : 'vmbr0'}</span></div><div class="spec-row"><span class="k">MAC Address</span><span class="v" style="font-family:'Space Grotesk',monospace">${cData.net0 ? (cData.net0.match(/(?:virtio|hwaddr|macaddr)=([A-Fa-f0-9:]+)/)?.[1] || '—') : '—'}</span></div></div></div>`);

state.taskFilterType === 'running' ? 'active' : ''}" data-task-filter="running">${ico("zap", "sm")} Running (${countRunning})</button><button class="preset-chip ${state.taskFilterType === 'vzdump' ? 'active' : ''}" data-task-filter="vzdump">${ico("backup", "sm")} Backups</button><button class="preset-chip ${state.taskFilterType === 'clone' ? 'active' : ''}" data-task-filter="clone">${ico("clone", "sm")} Clones</button><button class="preset-chip ${state.taskFilterType === 'error' ? 'active' : ''}" data-task-filter="error">${ico("alert", "sm")} Errors</button></div></div><div class="panel table-wrap" id="tasksTableContainer">${renderTasksTable(filterTasks(tasks))}</div>`;

  } catch (err) {

    toast(err.message, "error");
  }
}

function filterTasks(tasks) {
  return tasks.filter(t => {
    const isRunning = !t.endtime || t.status === "RUNNING";
    const isError = t.status && t.status !== "OK" && t.status !== "RUNNING";
    const type = (t.type || "").toLowerCase();

    if (state.taskFilterType === "running" && !isRunning) return false;
    if (state.taskFilterType === "error" && !isError) return false;
    if (state.taskFilterType === "vzdump" && !type.includes("vzdump")) return false;
    if (state.taskFilterType === "clone" && !type.includes("clone")) return false;

    if (state.taskSearchQuery) {
      const q = state.taskSearchQuery.toLowerCase();
      const matchType = type.includes(q);
      const matchUser = (t.user || "").toLowerCase().includes(q);
      const matchNode = (t.node || t.node_name || "").toLowerCase().includes(q);
      const matchUpid = (t.upid || "").toLowerCase().includes(q);
      const matchId = String(t.id || "").includes(q);
      if (!matchType && !matchUser && !matchNode && !matchUpid && !matchId) return false;
    }
    return true;
  });
}

function renderTasksTable(tasks) {
  if (!tasks.length) return '<div class="empty">No Proxmox cluster tasks matching filter.</div>';
  return `<table><thead><tr><th>ACTION / OPERATION</th><th>TARGET (VMID)</th><th>NODE</th><th>STATUS</th><th>INITIATED BY</th><th>START TIME</th><th>DURATION</th><th>UPID</th></tr></thead><tbody>${tasks.map(t => {
    const isRunning = !t.endtime || t.status === "RUNNING";
    const isOk = t.status === "OK";
    const durationSec = t.endtime && t.starttime ? Math.max(0, t.endtime - t.starttime) : null;
    const durationStr = isRunning ? '<span style="color:var(--blue)">Running…</span>' : (durationSec != null ? `${durationSec}s` : '—');

    let typeBadge = `${ico("gear", "sm")} ${esc(t.type || "task")}`;
    if (t.type === "qmclone" || t.type === "vzclone") typeBadge = `${ico("clone", "sm")} Clone ${t.type === 'qmclone' ? 'VM' : 'LXC'}`;
    else if (t.type === "vzdump") typeBadge = `${ico("backup", "sm")} Backup (VZDump)`;
    else if (t.type === "qmstart" || t.type === "vzstart") typeBadge = `${ico("play", "sm")} Start ${t.type === 'qmstart' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmstop" || t.type === "vzstop") typeBadge = `${ico("stop", "sm")} Stop ${t.type === 'qmstop' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmreboot" || t.type === "vzreboot") typeBadge = `${ico("refresh", "sm")} Reboot ${t.type === 'qmreboot' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmcreate" || t.type === "vzcreate") typeBadge = `${ico("zap", "sm")} Create ${t.type === 'qmcreate' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmconfig" || t.type === "vzconfig") typeBadge = `${ico("edit", "sm")} Config ${t.type === 'qmconfig' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmsnapshot" || t.type === "vzsnapshot") typeBadge = `${ico("camera", "sm")} Snapshot`;
    else if (t.type === "qmrollback" || t.type === "vzrollback") typeBadge = `${ico("restore", "sm")} Rollback`;
    else if (t.type === "aptupdate") typeBadge = `${ico("refresh", "sm")} APT Update`;

    return `<tr><td><b>${typeBadge}</b><div class="small muted" style="font-family:'Space Grotesk',monospace">${esc(t.type)}</div></td><td>${t.id ? `<span class="tag">VMID <b>${esc(t.id)}</b></span>` : '<span class="muted">—</span>'}</td><td><b>${esc(t.node || t.node_name || "—")}</b></td><td>${isRunning ? `<span class="badge" style="background:rgba(56,189,248,0.1);color:var(--blue);border-color:rgba(56,189,248,0.3)">${ico("statusDot", "sm")} RUNNING</span>` : (isOk ? `<span class="badge running">${ico("check", "sm")} OK</span>` : `<span class="badge stopped">${ico("alert", "sm")} ${esc(t.status || 'Error')}</span>`)}</td><td><span class="small" style="font-family:'Space Grotesk',monospace;color:#ccc">${esc(t.user || "root@pam")}</span></td><td style="font-size:12px;color:#bbb">${t.starttime ? new Date(t.starttime * 1000).toLocaleString() : '—'}</td><td style="font-family:'Space Grotesk',monospace;font-size:12px">${durationStr}</td><td><button class="btn small ghost" style="font-family:'Space Grotesk',monospace;font-size:10px;padding:3px 7px" title="${esc(t.upid)}" onclick="navigator.clipboard.writeText('${esc(t.upid)}');toast('UPID copied to clipboard!')">${ico("clipboard", "sm")} Copy UPID</button></td></tr>`;
  }).join("")}</tbody></table>`;
}

function setupTaskFilterEvents(allTasks) {
  const searchInput = $("#taskSearchInput");
  const chips = $("#taskFilterChips");
  const container = $("#tasksTableContainer");
  const apply = () => {
    const filtered = filterTasks(allTasks);
    if (container) container.innerHTML = renderTasksTable(filtered);
  };
  if (searchInput) {
    searchInput.oninput = () => {
      state.taskSearchQuery = searchInput.value.trim();
      apply();
    };
  }
  if (chips) {
    chips.querySelectorAll("[data-task-filter]").forEach(btn => {
      btn.onclick = () => {
        state.taskFilterType = btn.dataset.taskFilter;
        chips.querySelectorAll("[data-task-filter]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        apply();
      };
    });
  }
}

      try {
        await api(`/admin/users/${id}`, {
          method: "PATCH",
          body: JSON.stringify(payload)
        });
        $("#modalRoot").innerHTML = "";
        toast(`User "${payload.username}" updated successfully!`, "success");
        await renderPage();
      } catch (err) {
        toast(err.message, "error");
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `${ico("check")} Save Changes`;
        }
      }
    };
  }
}

s="v" style="font-family:'Space Grotesk',monospace">${esc(node.token_id)}</span></div><div class="spec-row"><span class="k">SSL Fingerprint</span><span class="v" style="font-size:10px;font-family:'Space Grotesk',monospace;max-width:200px;word-break:break-all">${esc(cluster.ssl_fingerprint || "Verified via Proxmox cluster")}</span></div><div class="spec-row"><span class="k">TLS Verification</span><span class="v">${node.tls_verify ? '<span style="color:var(--green)">Enabled (Strict)</span>' : '<span style="color:var(--yellow)">Disabled (Self-signed)</span>'}</span></div><div class="spec-row"><span class="k">Panel Node Status</span><span class="v">${node.enabled ? '<span style="color:var(--green)">Enabled</span>' : '<span style="color:var(--red)">Disabled</span>'}</span></div><div class="spec-row"><span class="k">Total Network Adapters</span><span class="v">${net.length} NICs detected</span></div><div class="spec-row"><span class="k">Added to Panel</span><span class="v">${esc(node.created_at)}</span></div></div></div>`;

function nodeModal() {
  showModal(`<div class="modal-head"><h3>Connect Proxmox node</h3><button class="close" data-close>×</button></div><form id="createNode"><div class="field"><label>Display name</label><input name="name" placeholder="pve-01" required></div><div class="form-grid"><div class="field"><label>Hostname / IP</label><input name="host" placeholder="pve.example.com" required></div><div class="field"><label>API port</label><input name="port" type="number" value="8006" required></div></div><div class="field"><label>API token ID</label><input name="tokenId" placeholder="panel@pve!atyro" required></div><div class="field"><label>API token secret</label><div style="position:relative"><input name="tokenSecret" id="nodeTokenSecret" type="password" required placeholder="Enter API token secret" style="padding-right:45px"><button type="button" class="btn ghost toggle-pwd-btn" data-target="nodeTokenSecret" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:6px 8px;border:none;background:transparent;color:var(--muted)" title="Show/Hide">${ico("eye", "sm")}</button></div></div><div class="field"><label>TLS certificate verification</label><select name="tlsVerify"><option value="true">Verify certificate (recommended)</option><option value="false">Skip verification (testing only)</option></select></div><button class="btn primary" style="width:100%;margin-top:10px">Test and save node</button></form><div class="notice">${ico("lightbulb", "sm", "color:var(--yellow)")} Create a dedicated Proxmox API token with required permissions (PVEVMAdmin). In Proxmox, uncheck 'Privilege Separation' or grant ACL permissions under Datacenter -> Permissions.</div>`);
  $("#createNode").onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    d.tlsVerify = d.tlsVerify === "true";
    try {
      const r = await api("/admin/nodes", { method: "POST", body: JSON.stringify(d) });
      $("#modalRoot").innerHTML = "";
      toast(r.message, r.warning ? "warning" : "success");
      await renderPage();
    } catch (err) { toast(err.message, "error"); }
  };
}

function editNodeModal(id) {
  const n = (window._atyroNodes || []).find(x => x.id === id);
  if (!n) return toast("Node not found.", "error");
  showModal(`<div class="modal-head"><h3>Edit Proxmox node</h3><button class="close" data-close>×</button></div><form id="editNode"><div class="field"><label>Display name</label><input name="name" value="${esc(n.name)}" required></div><div class="form-grid"><div class="field"><label>Hostname / IP</label><input name="host" value="${esc(n.host)}" required></div><div class="field"><label>API port</label><input name="port" type="number" value="${n.port || 8006}" required></div></div><div class="field"><label>API token ID</label><input name="tokenId" value="${esc(n.token_id)}" required></div><div class="field"><label>API token secret <span class="muted small">(leave blank to keep current secret)</span></label><div style="position:relative"><input name="tokenSecret" id="editNodeTokenSecret" type="password" placeholder="********************" style="padding-right:45px"><button type="button" class="btn ghost toggle-pwd-btn" data-target="editNodeTokenSecret" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:6px 8px;border:none;background:transparent;color:var(--muted)" title="Show/Hide">${ico("eye", "sm")}</button></div></div><div class="form-grid"><div class="field"><label>TLS certificate verification</label><select name="tlsVerify"><option value="true" ${n.tls_verify ? "selected" : ""}>Verify certificate (recommended)</option><option value="false" ${!n.tls_verify ? "selected" : ""}>Skip verification (testing only)</option></select></div><div class="field"><label>Status</label><select name="enabled"><option value="true" ${n.enabled ? "selected" : ""}>Enabled</option><option value="false" ${!n.enabled ? "selected" : ""}>Disabled</option></select></div></div><button class="btn primary" style="width:100%;margin-top:10px">Verify and save changes</button></form>`);
  $("#editNode").onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    d.port = Number(d.port);
    d.tlsVerify = d.tlsVerify === "true";
    d.enabled = d.enabled === "true";
    if (!d.tokenSecret || !d.tokenSecret.trim()) { delete d.tokenSecret; }
    try {
      const r = await api(`/admin/nodes/${id}`, { method: "PATCH", body: JSON.stringify(d) });
      $("#modalRoot").innerHTML = "";
      toast(r.message || "Node updated successfully.", r.warning ? "warning" : "success");
      await renderPage();
    } catch (err) { toast(err.message, "error"); }
  };
}

async function deleteNode(id) {
  const n = (window._atyroNodes || []).find(x => x.id === id);
  const name = n ? n.name : `#${id}`;
  const ok = await modalConfirm({
    title: "Delete Proxmox Node",
    subtitle: `Node: ${name}`,
    message: `Are you sure you want to disconnect and delete Proxmox node "${name}" from this panel?`,
    details: [
      "The connection settings and API tokens will be removed from this panel.",
      "The Proxmox VE hypervisor itself and its running VMs will not be affected."
    ],
    confirmText: "Delete Node",
    type: "danger",
    icon: "trash"
  });
  if (!ok) return;
  try {
    const r = await api(`/admin/nodes/${id}`, { method: "DELETE", body: "{}" });
    toast(r.message || "Node deleted successfully.");
    await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function testNode(id) {
  try {
    const d = await api(`/admin/nodes/${id}/test`, { method: "POST", body: "{}" });
    const targetNode = (window._atyroNodes || []).find(x => x.id === id);
    if (targetNode) {
      unmarkNodeDismissed(targetNode.name);
      removeDynamicNodeAlert(targetNode.name, id);
    }
    if (d.warning) {
      toast(`Connected · Proxmox ${d.version?.version || "API OK"} — ${d.warning}`, "warning");
    } else {
      toast(`Connected · Proxmox ${d.version?.version || "API OK"}`);
    }
    renderDynamicNodeAlerts();
  } catch (e) { toast(e.message, "error"); }
}

async function toggleNode(id, enabled) {
  try {
    await api(`/admin/nodes/${id}`, { method: "PATCH", body: JSON.stringify({ enabled: !enabled }) });
    toast("Node updated.");
    await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function createVpsPage(c, targetNodeId) {
  if (state.user.role !== "admin") {
    c.innerHTML = '<div class="panel"><div class="empty">Access restricted: Administrator role required to deploy virtual servers.</div></div>';
    return;
  }
  c.innerHTML = '<div class="empty">Loading Proxmox templates, ISOs, and node resources…</div>';
  try {
    const nodeParam = targetNodeId || state.createVpsState.nodeId || "";
    const url = "/admin/servers/create/options" + (nodeParam ? `?nodeId=${nodeParam}` : "");
    const d = await api(url);
    state.createVpsState.cachedData = d;
    if (d.node) state.createVpsState.nodeId = d.node.id;
    if (!d.nodes || !d.nodes.length) {
      c.innerHTML = '<div class="panel"><div class="empty">No enabled Proxmox nodes found. Please add or enable a Proxmox node first.<br><br><button class="btn primary" data-page="nodes">Manage Proxmox nodes</button></div></div>';
      return;
    }
    renderCreateVpsForm(c, d);
  } catch (err) {
    c.innerHTML = `<div class="panel"><div class="empty">Error loading deployment options: ${esc(err.message)}<br><br><button class="btn ghost" data-action="create-vps">${ico("refresh")} Try again</button></div></div>`;
    toast(err.message, "error");
  }
}

function renderCreateVpsForm(c, d) {
  const isQemu = state.createVpsState.type === "qemu";

  const isTemplate = state.createVpsState.source === "template";
  const isIso = isQemu && state.createVpsState.source === "iso";

  const currentNodeId = d.selectedNodeId || (d.node && d.node.id) || (d.nodes && d.nodes[0] ? d.nodes[0].id : state.createVpsState.nodeId);
  const currentNode = (d.nodes || []).find(n => n.id === currentNodeId) || d.nodes?.[0] || {};

  // 1. Template options
  let templateOptionsHtml = "";
  if (isQemu) {
    if (d.qemuTemplates && d.qemuTemplates.length) {

        const val = t.volid || t.template || t.package;
        const label = t.name || t.headline || t.package || val;
        const sz = t.size ? ` (${formatBytes(t.size)})` : "";
        return `<option value="${esc(val)}" ${idx === 0 ? "selected" : ""}>${esc(label)}${sz} [Local Fast]</option>`;

    if (onlines.length > 0) {
      lHtml += '<optgroup label="Proxmox Official Appliance Repository">';

        const val = t.volid || t.template || t.package;

      }).join("");

  // 2. ISO options
  const isoItems = (d.isoList && d.isoList.length ? d.isoList : (d.isos || []));
  let isoOptionsHtml = "";
  if (isoItems.length) {
    isoOptionsHtml = isoItems.map((iso, idx) => {

      return `<option value="${esc(volid)}" ${idx === 0 ? "selected" : ""}>${esc(name)}${sizeStr}</option>`;

  // 3. Storage Pools: Filtered by virtualization type (images for QEMU, rootdir for LXC)
  let rawStorages = [];

    rawStorages = (d.vmStorages && d.vmStorages.length) ? d.vmStorages : (d.storages || []).filter(s => (s.content || "").includes("images"));

      <div style="display:flex;align-items:center;gap:12px">

        </div>

    ${d.nodeStats ? `
      <div style="background:linear-gradient(135deg, rgba(99,102,241,0.08), rgba(168,85,247,0.04));border:1px solid rgba(99,102,241,0.22);border-radius:12px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px">
