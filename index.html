<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>ALPM — VPS Control Panel</title>
<meta name="description" content="Next-Generation Proxmox VE VPS Cloud Management Platform" id="metaDescription">
<!-- Open Graph / Social SEO -->
<meta property="og:type" content="website">
<meta property="og:title" content="ALPM — VPS Control Panel" id="ogTitle">
<meta property="og:description" content="Next-Generation Proxmox VE VPS Cloud Management Platform" id="ogDescription">
<meta property="og:image" content="" id="ogImage">
<link rel="icon" type="image/png" href="https://i.imgur.com/G93UzrB.png" id="siteFaviconLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/xterm/css/xterm.css?v=5.3.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>
:root {
  /* Convoy-inspired Palette */
  --bg: #0a0a0a;
  --panel: #111111;
  --panel2: #161616;
  --panel-hover: #1a1a1a;
  --line: rgba(255, 255, 255, 0.06);
  --line-strong: rgba(255, 255, 255, 0.12);
  --muted: #888888;
  --text: #ededed;
  --text-dim: #b0b0b0;
  --accent: #6366f1; /* Indigo */
  --accent-hover: #818cf8;
  --accent-glow: rgba(99, 102, 241, 0.25);
  --green: #22c55e;
  --green-glow: rgba(34, 197, 94, 0.25);
  --red: #ef4444;
  --red-glow: rgba(239, 68, 68, 0.25);
  --yellow: #eab308;
  --blue: #38bdf8;
  --purple: #a855f7;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-heading: 'Space Grotesk', sans-serif;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
p, h1, h2, h3, h4, h5, h6, span, a, label, li { overflow-wrap: break-word; }
img, svg, video, canvas { max-width: 100%; height: auto; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--font-body);
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* Global Code and Pre Formatting */
pre, code {
  font-family: 'Space Grotesk', monospace;
  overflow-wrap: anywhere;
  word-break: break-all;
}
pre {
  white-space: pre-wrap;
  max-width: 100%;
  background: #0d0d0d;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  overflow-x: auto;
}

/* Custom Sleek Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: 0; }
a { color: inherit; text-decoration: none; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* Shell Layout */
html, body {
  overflow-x: hidden;
  width: 100%;
  max-width: 100vw;
  -webkit-text-size-adjust: 100%;
}
.app {
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
  max-width: 100vw;
  width: 100%;
  min-width: 0;
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 260px;
  background: #0d0d0d;
  border-right: 1px solid var(--line);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  z-index: 50;
  transition: transform var(--transition);
}
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(8px);
  z-index: 45;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition);
}
.sidebar-backdrop.open {
  display: block;
  opacity: 1;
  pointer-events: auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 12px 28px;
  font: 700 20px var(--font-heading);
  letter-spacing: -0.03em;
}
.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 18px;
  box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
  flex-shrink: 0;
}
.brand-logo-img {
  width: 38px;
  height: 38px;
  border-radius: 0;
  object-fit: contain;
  border: none !important;
  background: transparent !important;
  box-shadow: none !important;
  outline: none !important;
  flex-shrink: 0;
  display: block;
}
.nav-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  color: #555;
  font-weight: 700;
  padding: 16px 12px 8px;
  text-transform: uppercase;
}
.nav button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--muted);
  text-align: left;
  margin: 2px 0;
  font-weight: 500;
  font-size: 13.5px;
  transition: all var(--transition);
}
.nav button:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
}
.nav button.active {
  background: rgba(99, 102, 241, 0.1);
  color: var(--accent);
  font-weight: 600;
  box-shadow: inset 3px 0 var(--accent);
}
.svg-ico {
  display: inline-block;
  vertical-align: -0.16em;
  width: 1.1em;
  height: 1.1em;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.svg-ico.sm {
  width: 0.9em;
  height: 0.9em;
  vertical-align: -0.12em;
}
.svg-ico.lg {
  width: 1.35em;
  height: 1.35em;
  vertical-align: -0.22em;
}
.svg-ico.xl {
  width: 1.8em;
  height: 1.8em;
  vertical-align: -0.28em;
}
.svg-ico.spin {
  animation: svg-spin 1s linear infinite;
}
@keyframes svg-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Button & Global Loading System */
.btn-loading-spinner {
  display: none !important;
}

#globalProgressBar {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  width: 0%;
  background: linear-gradient(90deg, #6366f1, #a855f7, #38bdf8);
  box-shadow: 0 0 12px rgba(99, 102, 241, 0.85), 0 0 5px rgba(56, 189, 248, 0.8);
  z-index: 9999999;
  pointer-events: none;
  opacity: 0;
  transition: width 0.25s ease, opacity 0.3s ease;
}

@keyframes pulse-width {
  0% { width: 15%; transform: translateX(0); }
  50% { width: 75%; transform: translateX(25%); }
  100% { width: 95%; transform: translateX(5%); }
}
.nav .ico {
  width: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  opacity: 0.9;
}
.nav .ico .svg-ico {
  width: 16px;
  height: 16px;
}
.stat-icon .svg-ico {
  width: 1.15em;
  height: 1.15em;
}
.btn .svg-ico {
  margin-right: 3px;
}
.btn.small .svg-ico {
  margin-right: 2px;
}
.side-bottom {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding: 16px 8px 0;
}
.user-mini {
  display: flex;
  gap: 11px;
  align-items: center;
  min-width: 0;
}
#sidebarUsername {
  max-width: 130px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: block;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--panel2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  font-weight: 800;
  color: var(--accent);
  font-size: 14px;
  flex-shrink: 0;
  overflow: hidden;
}
.avatar.user-avatar-img, img.avatar {
  object-fit: cover;
  display: block;
}

/* User Profile Page Styles */
.profile-hero {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  display: flex;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}
.profile-avatar-large {
  width: 84px;
  height: 84px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 32px;
  object-fit: cover;
  border: 2px solid var(--line-strong);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  flex-shrink: 0;
  overflow: hidden;
}
.profile-hero-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  min-width: 220px;
}
.profile-hero-info h2 {
  font: 700 24px var(--font-heading);
  margin: 0;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.profile-hero-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 4px;
  font-size: 12.5px;
  color: var(--muted);
}
.profile-hero-badges {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.profile-stat-badge {
  background: var(--panel2);
  border: 1px solid var(--line);
  padding: 10px 16px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.profile-stat-badge span:first-child {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  font-weight: 600;
}
.profile-stat-badge span:last-child {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
}
.profile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
  gap: 24px;
}
.main {
  margin-left: 260px;
  min-height: 100vh;
  width: calc(100% - 260px);
  min-width: 0;
  max-width: 100%;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 72px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  position: sticky;
  top: 0;
  background: rgba(10, 10, 10, 0.85);
  backdrop-filter: blur(16px);
  z-index: 30;
  gap: 16px;
  min-width: 0;
}
.crumb {
  font: 600 16px var(--font-heading);
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  max-width: min(560px, 55vw);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.top-right {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
.pill {
  border: 1px solid var(--line);
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  color: var(--muted);
  font-size: 12px;
  background: rgba(255, 255, 255, 0.02);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.content {
  padding: 32px 32px 64px;
  max-width: 1600px;
  width: 100%;
  margin: 0 auto;
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.page-head h1 {
  font: 700 28px var(--font-heading);
  margin: 0 0 6px;
  letter-spacing: -0.03em;
}
.page-head p {
  color: var(--muted);
  margin: 0;
  font-size: 14px;
}

/* Grids & Cards */
.grid { display: grid; gap: 16px; }
.stats {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-bottom: 24px;
}
.stat, .panel, .server-card, .spec-box, .chart-box, .metric-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
}
.stat {
  padding: 22px;
  position: relative;
  overflow: hidden;
}
.stat::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 100px;
  height: 100px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.06) 0%, transparent 70%);
  pointer-events: none;
}
.stat-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
}
.stat-value {
  font: 700 32px var(--font-heading);
  margin-top: 10px;
  color: #fff;
  letter-spacing: -0.04em;
}
.stat-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: rgba(99, 102, 241, 0.1);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-size: 17px;
  border: 1px solid rgba(99, 102, 241, 0.2);
}
.two-col { grid-template-columns: 1.5fr 1fr; }
.panel {
  padding: 24px;
  margin-bottom: 20px;
}
.panel-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.panel-title h3 {
  font: 700 17px var(--font-heading);
  margin: 0;
  letter-spacing: -0.02em;
}
.panel-title h4 {
  font: 700 15px var(--font-heading);
  margin: 0;
  letter-spacing: -0.02em;
}

/* Server Cards */
.server-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.server-card {
  padding: 22px;
  display: flex;
  flex-direction: column;
}
.server-card:hover {
  transform: translateY(-2px);
  border-color: rgba(99, 102, 241, 0.3);
  box-shadow: var(--shadow-md), 0 0 0 1px rgba(99, 102, 241, 0.1);
}
.server-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  min-width: 0;
}
.server-top > div:first-child {
  min-width: 0;
  flex: 1;
}
.server-name {
  font-weight: 700;
  font-size: 16px;
  color: #fff;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
  word-break: break-word;
  max-width: 100%;
}
.server-id {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  min-width: 0;
}
.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.03);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  flex-shrink: 0;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #555;
  flex-shrink: 0;
}
.dot.running {
  background: var(--green);
  box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
  animation: dotPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}
.dot.stopped {
  background: var(--red);
  box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
}
.dot.suspended {
  background: #f59e0b !important;
  box-shadow: 0 0 8px rgba(245, 158, 11, 0.6) !important;
  animation: none !important;
}
.server-card.is-suspended {
  border-color: rgba(245, 158, 11, 0.35) !important;
  background: linear-gradient(180deg, rgba(245, 158, 11, 0.04) 0%, rgba(20, 20, 24, 0.95) 100%) !important;
}
@keyframes dotPulse {
  0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
  70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}
.server-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 18px 0;
}
.tag {
  font-size: 11px;
  color: var(--text-dim);
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.02);
  padding: 4px 9px;
  border-radius: 6px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  background: var(--panel2);
  color: var(--text);
  font-weight: 600;
  font-size: 12.5px;
  border: 1px solid var(--line);
  transition: all var(--transition);
  white-space: nowrap;
  user-select: none;
}
.btn:hover {
  background: var(--panel-hover);
  border-color: var(--line-strong);
  color: #fff;
  transform: translateY(-1px);
}
.btn:active {
  transform: scale(0.97);
}
.btn.primary {
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  color: #fff;
  border-color: transparent;
  font-weight: 700;
  box-shadow: 0 2px 12px rgba(99, 102, 241, 0.3);
}
.btn.primary:hover {
  background: linear-gradient(135deg, var(--accent-hover), #6366f1);
  box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
}
.btn.danger {
  background: rgba(239, 68, 68, 0.1);
  color: #fca5a5;
  border-color: rgba(239, 68, 68, 0.2);
}
.btn.danger:hover {
  background: rgba(239, 68, 68, 0.2);
  border-color: rgba(239, 68, 68, 0.4);
  color: #fff;
}
.btn.success {
  background: rgba(34, 197, 94, 0.1);
  color: #86efac;
  border-color: rgba(34, 197, 94, 0.2);
}
.btn.success:hover {
  background: rgba(34, 197, 94, 0.2);
  border-color: rgba(34, 197, 94, 0.4);
  color: #fff;
}
.btn.ghost {
  background: transparent;
  border-color: var(--line);
}
.btn.ghost:hover {
  background: rgba(255, 255, 255, 0.04);
  border-color: var(--line-strong);
}
.btn.small {
  padding: 6px 12px;
  font-size: 11.5px;
  border-radius: 6px;
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

/* Tables */
.table-wrap {
  overflow-x: auto !important;
  border-radius: var(--radius-sm);
  max-width: 100% !important;
  width: 100% !important;
  box-sizing: border-box !important;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x pan-y;
  overscroll-behavior-x: contain;
  position: relative;
  scrollbar-width: thin;
  scrollbar-color: rgba(99, 102, 241, 0.35) rgba(255, 255, 255, 0.02);
}
.table-wrap::-webkit-scrollbar {
  height: 5px;
}
.table-wrap::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.02);
  border-radius: 4px;
}
.table-wrap::-webkit-scrollbar-thumb {
  background: rgba(99, 102, 241, 0.35);
  border-radius: 4px;
}
.table-wrap::-webkit-scrollbar-thumb:hover {
  background: var(--accent);
}
table {
  border-collapse: collapse;
  width: 100%;
  min-width: 600px;
}
th, td {
  text-align: left;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
  overflow-wrap: break-word;
  word-break: break-word;
}
th {
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  background: rgba(255, 255, 255, 0.01);
  white-space: nowrap;
}
td { color: var(--text-dim); }
td code, td pre {
  word-break: break-all;
  overflow-wrap: anywhere;
}
tbody tr {
  transition: background var(--transition);
}
tbody tr:hover {
  background: rgba(255, 255, 255, 0.02);
}

/* Fields & Forms */
.field {
  display: flex;

/* Modern API Key Modal UI/UX */

}
.scope-mode-card {

/* --- Proxmox xterm.js Web Terminal Modal --- */

.terminal-screen-container {

}
.terminal-screen-container .xterm-viewport {

}

/* --- Embedded xterm.js Core & Anti-Glitch Styles --- */
.xterm {
  cursor: text;
  position: relative;
  user-select: none;
  -ms-user-select: none;
  -webkit-user-select: none;
}
.xterm.focus,
.xterm:focus {
  outline: none;
}
.xterm .xterm-helpers,
.terminal-screen-container .xterm-helpers,
#terminalMount .xterm-helpers {
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;
  z-index: 5 !important;
  pointer-events: none !important;
}
.terminal-screen-container textarea,
.terminal-screen-container .xterm-helper-textarea,
.xterm .xterm-helper-textarea,
.xterm textarea,
textarea.xterm-helper-textarea,
.xterm-helper-textarea,
#terminalMount textarea {
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;
  width: 1px !important;
  height: 1px !important;
  opacity: 0.001 !important;
  filter: opacity(0.001) !important;
  padding: 0 !important;
  margin: 0 !important;
  border: none !important;
  outline: none !important;
  box-shadow: none !important;
  background: transparent !important;
  color: transparent !important;
  caret-color: transparent !important;
  resize: none !important;
  overflow: hidden !important;
  white-space: pre !important;
  pointer-events: none !important;
  z-index: 1 !important;
}
.terminal-screen-container .xterm-char-measure-element,
.xterm .xterm-char-measure-element,
.xterm-char-measure-element,
[class*="char-measure"],
[class*="xterm-char"],
#terminalMount .xterm-char-measure-element,
#terminalMount span.xterm-char-measure-element {
  display: inline-block !important;
  visibility: hidden !important;
  position: absolute !important;
  top: -9999px !important;
  left: -9999px !important;
  line-height: normal !important;
  opacity: 0 !important;
  filter: opacity(0) !important;
  color: transparent !important;
  pointer-events: none !important;
  user-select: none !important;
  z-index: -9999 !important;
}
.xterm .composition-view {
  background: #000;
  color: #FFF;
  display: none;
  position: absolute;
  white-space: nowrap;
  z-index: 1;
}
.xterm .composition-view.active {
  display: block;
}
.xterm .xterm-viewport {
  background-color: #000;
  overflow-y: scroll;
  cursor: default;
  position: absolute;
  right: 0;
  left: 0;
  top: 0;
  bottom: 0;
}
.xterm .xterm-screen {
  position: relative;
}
.xterm .xterm-screen canvas {
  position: absolute;
  left: 0;
  top: 0;
}
.xterm .xterm-scroll-area {
  visibility: hidden;
}
.xterm.enable-mouse-events {
  cursor: default;
}
.xterm.xterm-cursor-pointer,
.xterm .xterm-cursor-pointer {
  cursor: pointer;
}
.xterm.column-select.focus {
  cursor: crosshair;
}
.xterm .xterm-accessibility,
.xterm .xterm-message {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  right: 0;
  z-index: 10;
  color: transparent;
  pointer-events: none;
}
.xterm .live-region {
  position: absolute;
  left: -9999px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}
.xterm-dim {
  opacity: 1 !important;
}
.xterm-underline-1 { text-decoration: underline; }
.xterm-underline-2 { text-decoration: double underline; }
.xterm-underline-3 { text-decoration: wavy underline; }
.xterm-underline-4 { text-decoration: dotted underline; }
.xterm-underline-5 { text-decoration: dashed underline; }
.xterm-overline { text-decoration: overline; }
.xterm-overline.xterm-underline-1 { text-decoration: overline underline; }
.xterm-overline.xterm-underline-2 { text-decoration: overline double underline; }
.xterm-overline.xterm-underline-3 { text-decoration: overline wavy underline; }
.xterm-overline.xterm-underline-4 { text-decoration: overline dotted underline; }
.xterm-overline.xterm-underline-5 { text-decoration: overline dashed underline; }
.xterm-strikethrough { text-decoration: line-through; }
.terminal-overlay-banner {
  position: absolute;
  inset: 0;

/* Dynamic Confirmation & Prompt Dialogs */
.confirm-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: grid;
  place-items: center;
  z-index: 2000;
  padding: 16px;
  animation: confirmFadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}
.confirm-modal {
  width: min(490px, calc(100vw - 32px));
  max-width: min(490px, calc(100vw - 32px));
  box-sizing: border-box;
  background: #141416;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: 0 24px 50px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.05);
  animation: confirmPop 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  overflow: hidden;
  overflow-wrap: break-word;
}
.confirm-modal::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), #818cf8);
}
.confirm-modal.confirm-type-danger::before {
  background: linear-gradient(90deg, #ef4444, #f87171);
}
.confirm-modal.confirm-type-warning::before {
  background: linear-gradient(90deg, #eab308, #facc15);
}
.confirm-modal.confirm-type-success::before {
  background: linear-gradient(90deg, #22c55e, #4ade80);
}
.confirm-header {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.confirm-icon-badge {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  background: rgba(99, 102, 241, 0.12);
  color: var(--accent);
  border: 1px solid rgba(99, 102, 241, 0.25);
  box-shadow: 0 0 20px rgba(99, 102, 241, 0.12);
}
.confirm-icon-badge .svg-ico {
  width: 22px;
  height: 22px;
}
.confirm-icon-badge.danger {
  background: rgba(239, 68, 68, 0.14);
  color: var(--red);
  border-color: rgba(239, 68, 68, 0.3);
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.15);
}
.confirm-icon-badge.warning {
  background: rgba(234, 179, 8, 0.14);
  color: var(--yellow);
  border-color: rgba(234, 179, 8, 0.3);
  box-shadow: 0 0 20px rgba(234, 179, 8, 0.15);
}
.confirm-icon-badge.success {
  background: rgba(34, 197, 94, 0.14);
  color: var(--green);
  border-color: rgba(34, 197, 94, 0.3);

}
.confirm-titles {
  flex: 1;
  min-width: 0;
}
.confirm-title {
  margin: 0;
  font: 700 18px var(--font-heading);
  color: #fff;
  letter-spacing: -0.01em;
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.confirm-subtitle {
  margin: 3px 0 0;
  font-size: 12px;
  color: var(--muted);
  overflow-wrap: anywhere;
  word-break: break-word;
}
.confirm-close-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  padding: 4px;
  cursor: pointer;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  flex-shrink: 0;
}
.confirm-close-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
}
.confirm-body {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--text-dim);
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.confirm-msg {
  color: #d8d8d8;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.confirm-details-box {
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 12px;
  color: var(--muted);
  overflow-wrap: anywhere;
  word-break: break-word;
  max-width: 100%;
  box-sizing: border-box;
}
.confirm-details-box.danger {
  border-color: rgba(239, 68, 68, 0.3);
  background: rgba(239, 68, 68, 0.06);
  color: #fca5a5;
}
.confirm-details-box.warning {
  border-color: rgba(234, 179, 8, 0.3);
  background: rgba(234, 179, 8, 0.06);
  color: #fde047;
}
.confirm-bullets {
  margin: 4px 0 0 16px;
  padding: 0;
  list-style-type: disc;
}
.confirm-bullets li {
  margin-bottom: 5px;
  font-family: var(--font-body);
  line-height: 1.45;
}
.confirm-bullets li:last-child {
  margin-bottom: 0;
}
.confirm-input-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.confirm-input-wrap label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
}
.confirm-input {
  background: #0a0a0c;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  color: var(--text);
  font-size: 13.5px;
  outline: none;
  width: 100%;
  transition: all var(--transition);
  font-family: 'Space Grotesk', var(--font-body);
}
.confirm-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
}
.confirm-error {
  font-size: 11.5px;
  color: var(--red);
  font-weight: 500;
  margin-top: 2px;
}
.confirm-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.confirm-actions .btn {
  padding: 9px 18px;
  font-size: 12.5px;
  font-weight: 600;
}
@keyframes confirmFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes confirmPop {
  from { transform: scale(0.93) translateY(8px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

/* Toasts */
#toastRoot {
  position: fixed;
  right: 24px;
  bottom: 24px;
  display: flex;
  flex-direction: column-reverse;
  gap: 10px;
  z-index: 9999;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  background: rgba(20, 20, 20, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid var(--line-strong);
  border-left: 4px solid var(--accent);
  padding: 14px 20px;
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-lg);
  animation: toastSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  max-width: min(440px, calc(100vw - 32px));
  box-sizing: border-box;
  line-height: 1.4;
  position: relative;
  overflow: hidden;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.toast::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  height: 2px;
  background: var(--accent);
  animation: toastProgress 4s linear forwards;
}
.toast.error {
  border-left-color: var(--red);
  background: rgba(30, 15, 15, 0.96);
  border-color: rgba(239, 68, 68, 0.3);
}
.toast.error::after { background: var(--red); animation-duration: 8s; }
.toast.warning {
  border-left-color: var(--yellow);
  background: rgba(30, 25, 15, 0.96);
  border-color: rgba(234, 179, 8, 0.3);
}
.toast.warning::after { background: var(--yellow); }
.toast-close {
  background: transparent;
  color: var(--muted);
  padding: 0;
  font-size: 18px;
  line-height: 1;
  margin-left: auto;
  cursor: pointer;
}
.toast-close:hover { color: #fff; }
@keyframes toastSlideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes toastProgress {
  from { width: 100%; }
  to { width: 0%; }
}

/* Skeleton Loaders */
.skeleton {
  background: linear-gradient(90deg, var(--panel2) 25%, var(--panel-hover) 50%, var(--panel2) 75%);
  background-size: 200% 100%;
  animation: skeletonShimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}
@keyframes skeletonShimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-text {
  height: 14px;
  margin-bottom: 8px;
  width: 100%;
}
.skeleton-text.short { width: 60%; }
.skeleton-text.medium { width: 80%; }
.skeleton-title {
  height: 24px;
  margin-bottom: 12px;
  width: 40%;
}
.skeleton-card {
  height: 180px;
  margin-bottom: 16px;
}
.skeleton-stat {
  height: 120px;
  margin-bottom: 16px;
}
.skeleton-table-row {
  height: 48px;
  margin-bottom: 8px;
}

/* Login Screen */
.empty { padding: 48px; text-align: center; color: var(--muted); }
.login-wrap {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(ellipse at 50% 0%, rgba(99, 102, 241, 0.08) 0%, var(--bg) 60%);
}
.login-card {
  width: min(420px, calc(100vw - 32px));
  max-width: min(420px, calc(100vw - 32px));
  box-sizing: border-box;
  padding: 40px 36px;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(99, 102, 241, 0.05);
  overflow: hidden;
  word-break: break-word;
}
.login-card .brand { padding: 0 0 28px; }
.login-card h1 {
  font: 700 28px var(--font-heading);
  margin: 0 0 8px;
  letter-spacing: -0.03em;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.login-card > p, .login-desc {
  color: var(--muted);
  margin: 0 0 28px;
  font-size: 14px;
  overflow-wrap: anywhere;
  word-break: break-word;
  line-height: 1.5;
  max-height: 120px;
  overflow-y: auto;
}
.login-card .btn { width: 100%; padding: 14px; font-size: 14px; }
.notice {
  padding: 14px 18px;
  border: 1px solid rgba(234, 179, 8, 0.2);
  background: rgba(234, 179, 8, 0.05);
  color: #fbbf24;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  margin-top: 20px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  word-break: break-word;
  box-sizing: border-box;
}
.bar {
  height: 7px;
  border-radius: 99px;
  background: var(--panel2);
  overflow: hidden;
  margin-top: 8px;
}
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.resource { margin: 16px 0; }
.resource-head { display: flex; justify-content: space-between; font-size: 12.5px; }
.mobile-menu { display: none; }

/* VPS Dashboard Details & Tabs */
.vps-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.vps-title-wrap { display: flex; flex-direction: column; gap: 10px; }
.vps-title { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.vps-title h1 {
  font: 700 32px var(--font-heading);
  margin: 0;
  letter-spacing: -0.04em;
}
.vps-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge {
  padding: 5px 12px;
  border-radius: 7px;
  font-size: 11.5px;
  font-weight: 600;
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--text-dim);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.badge.running {
  background: rgba(34, 197, 94, 0.1);
  border-color: rgba(34, 197, 94, 0.3);
  color: var(--green);
}
.badge.stopped {
  background: rgba(239, 68, 68, 0.1);
  border-color: rgba(239, 68, 68, 0.3);
  color: var(--red);
}
.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.metric-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  display: flex;
  flex-direction: column;
}
.metric-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.04em;
}
.metric-val {
  font: 700 28px var(--font-heading);
  margin: 10px 0 4px;
  color: #fff;
  letter-spacing: -0.03em;
}
.metric-sub { font-size: 12px; color: var(--muted); }
.progress {
  height: 7px;
  border-radius: 6px;
  background: var(--panel2);
  overflow: hidden;
  margin-top: 14px;
}
.progress-bar {
  height: 100%;
  border-radius: 6px;
  background: var(--accent);
  transition: width 0.4s ease;
}
.progress-bar.green { background: var(--green); }
.progress-bar.blue { background: var(--blue); }
.progress-bar.purple { background: var(--purple); }

.tab-nav {
  display: flex;
  gap: 6px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
  overflow-x: auto;
}
.tab-btn {
  padding: 12px 20px;
  background: transparent;
  color: var(--muted);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  font-weight: 600;
  font-size: 13px;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: all var(--transition);
}
.tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.02); }
.tab-btn.active {
  color: #fff;
  border-color: var(--accent);
  background: var(--panel);
}

.spec-cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.spec-box {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
}
.spec-box h4 {
  margin: 0 0 18px;
  font: 700 15px var(--font-heading);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: -0.02em;
}
.spec-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  font-size: 13px;
  min-width: 0;
}
.spec-row:last-child { border-bottom: 0; }
.spec-row .k {
  color: var(--muted);
  flex-shrink: 0;
  max-width: 48%;
  overflow-wrap: break-word;
}
.spec-row .v {
  font-weight: 600;
  color: var(--text);
  text-align: right;
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.chart-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.chart-box {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
}
.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.chart-header h4 {
  margin: 0;
  font: 600 14px var(--font-heading);
}

/* ==========================================================================
   COMPREHENSIVE MULTI-DEVICE & MOBILE RESPONSIVENESS SYSTEM (UI/UX)
   ========================================================================== */

/* 1. Large Tablets & Small Desktops (<= 1100px) */
@media (max-width: 1100px) {
  .metric-grid { grid-template-columns: repeat(2, 1fr); }
  .spec-cards { grid-template-columns: 1fr; }
  .chart-grid { grid-template-columns: 1fr; }
}

/* 2. Standard Tablets & Netbooks (<= 1000px) */
@media (max-width: 1000px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr; }
  .server-grid { grid-template-columns: 1fr; }
}

/* 3. Small Tablets & Mobile Devices (<= 768px) */
@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%);
    width: 280px;
    box-shadow: 10px 0 40px rgba(0, 0, 0, 0.85);
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .sidebar-close-btn {
    display: inline-flex !important;
  }
  .main {
    margin-left: 0 !important;
    width: 100% !important;
    max-width: 100vw;
  }
  .topbar {
    padding: 0 16px;
    height: 64px;
  }
  .topbar .crumb {
    margin-right: auto;
    margin-left: 10px;
    font-size: 14px;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .top-right {
    gap: 10px;
  }
  .mobile-menu {
    display: inline-flex !important;
    width: 38px;
    height: 38px;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .content {
    padding: 20px 14px 48px;
    max-width: 100%;
    box-sizing: border-box;
  }
  .page-head {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 20px;
  }
  .page-head h1 {
    font-size: 24px;
    letter-spacing: -0.02em;
    overflow-wrap: break-word;
    word-break: break-word;
    max-width: 100%;
    margin: 0 0 4px;
  }
  .page-head p {
    font-size: 13px;
    line-height: 1.5;
  }
  .page-head > div:last-child {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .stats {
    gap: 12px;
  }
  .stat {
    padding: 16px;
  }
  .stat-value {
    font-size: 24px;
  }
  .form-grid,
  .form-grid-3,
  .form-grid-4 {
    grid-template-columns: 1fr !important;
    gap: 12px !important;
  }
  .metric-grid {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  /* Forms iOS Safari zoom prevention */
  input:not([type="checkbox"]):not([type="radio"]),
  select,
  textarea {
    font-size: 16px !important;
  }

  /* Tab Bar smooth momentum scroll */
  .tab-nav {
    gap: 4px;
    padding-bottom: 4px;
    margin-bottom: 18px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
    scrollbar-width: thin;
    scrollbar-color: rgba(99, 102, 241, 0.35) transparent;
  }
  .tab-nav::-webkit-scrollbar {
    height: 3px;
  }
  .tab-nav::-webkit-scrollbar-thumb {
    background: rgba(99, 102, 241, 0.4);
    border-radius: 3px;
  }
  .tab-btn {
    padding: 10px 14px;
    font-size: 12.5px;
    flex-shrink: 0;
  }

  /* Responsive Modals */
  .modal-backdrop {
    padding: 12px 8px;
  }
  .modal {
    width: 100% !important;
    max-width: calc(100vw - 16px) !important;
    max-height: 92vh !important;
    padding: 20px 16px !important;
    border-radius: 14px !important;
    box-sizing: border-box !important;
  }
  .modal.modal-large,
  .modal.modal-deploy {
    width: 100% !important;
    max-width: calc(100vw - 16px) !important;
    padding: 20px 16px !important;
  }
  .modal.modal-terminal {
    width: 100vw !important;
    max-width: 100vw !important;
    height: 100vh !important;
    max-height: 100vh !important;
    border-radius: 0 !important;
    border: none !important;
    position: fixed;
    inset: 0;
  }
  .modal-head {
    gap: 10px;
    margin-bottom: 18px;
  }
  .modal-head h3 {
    font-size: 18px !important;
  }

  /* VPS Management Header on Mobile */
  .vps-head {
    margin-bottom: 20px;
    gap: 14px;
  }
  .vps-title h1 {
    font-size: 24px;
  }
  .vps-head .actions {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .vps-head .actions .btn {
    flex: 1 1 calc(50% - 8px);
    justify-content: center;
    padding: 8px 12px;
    font-size: 12px;
  }
}

/* 4. Standard Mobile Phones (<= 640px) */
@media (max-width: 640px) {
  .topbar {
    padding: 0 12px;
    height: 58px;
  }
  .pill#infraPill .pill-text {
    display: none !important;
  }
  .pill#infraPill {
    padding: 4px 8px !important;
  }
  .server-card {
    padding: 16px;
  }
  .server-name {

  }

  .server-card .actions {

  .server-card .actions .btn {

  .node-alert-card {

/* 5. Compact Mobile Phones (<= 480px) */
@media (max-width: 480px) {
  .topbar .crumb {
    max-width: 90px;
    font-size: 13px;
  }
  .pill#infraPill {
    display: none !important;
  }
  .top-right {
    gap: 8px;
  }
  .live-status-pill {

  }
  .stat {
    padding: 12px;
  }
  .stat-value {
    font-size: 20px;
    margin-top: 6px;
  }
  .stat-top {

  .stat-icon {
    width: 30px;
    height: 30px;

  }
  .vps-head .actions .btn {

  }
  .login-card {
    padding: 28px 20px;
  }
  .login-card h1 {
    font-size: 22px;
  }
  .page-head h1 {
    font-size: 20px;
  }
  .btn {
    padding: 8px 12px;
  }
  .btn.small {
    padding: 6px 10px;
    font-size: 11px;
  }

/* 6. Ultra-Compact Phones (<= 360px) */
@media (max-width: 360px) {
  .stats {
    grid-template-columns: 1fr !important;
  }
  .topbar .crumb {
    display: none;
  }
  .content {
    padding: 16px 10px 40px;
  }
}

/* Live Status Indicator Pill */
.live-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 11px;
  border-radius: 20px;

function toast(message, type = "success") {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  const icon = type === "error" ? ico("alert", "", "color:var(--red)") : type === "warning" ? ico("zap", "", "color:var(--yellow)") : ico("check", "", "color:var(--green)");
  el.innerHTML = `<span style="font-size:15px">${icon}</span><span style="flex:1">${esc(message)}</span><button type="button" class="toast-close" title="Dismiss">×</button>`;
  el.querySelector(".toast-close").onclick = () => el.remove();
  $("#toastRoot").append(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, type === "error" ? 8000 : 4000);
}

const DISMISSED_NODES_KEY = "atyro_dismissed_nodes";

function getDismissedNodesMap() {
  try {
    return JSON.parse(localStorage.getItem(DISMISSED_NODES_KEY) || "{}");
  } catch (e) {
    return {};
  }
}

function isNodeAlertDismissed(nodeName) {
  if (!nodeName) return false;
  const map = getDismissedNodesMap();
  return !!map[String(nodeName).toLowerCase()];
}

function dismissNodeAlert(nodeName, permanent = true) {
  if (!nodeName) return;
  const key = String(nodeName).toLowerCase();
  window._offlineNodes.delete(key);
  if (permanent) {
    const map = getDismissedNodesMap();
    map[key] = { dismissedAt: Date.now(), nodeName: String(nodeName) };
    try {
      localStorage.setItem(DISMISSED_NODES_KEY, JSON.stringify(map));
    } catch (e) {}
    toast(`Proxmox Node "${nodeName}" alert dismissed & muted. You will not receive further repeated alerts.`, "info");
  }
  renderDynamicNodeAlerts();
}

function unmarkNodeDismissed(nodeName) {
  if (!nodeName) return;
  const key = String(nodeName).toLowerCase();
  const map = getDismissedNodesMap();
  if (map[key]) {
    delete map[key];
    try {
      localStorage.setItem(DISMISSED_NODES_KEY, JSON.stringify(map));
    } catch (e) {}
  }
}

window._offlineNodes = new Map(); // nodeKey -> { id, name, host, reason, message }
window.dismissNodeAlert = dismissNodeAlert;
window.unmarkNodeDismissed = unmarkNodeDismissed;
window.isNodeAlertDismissed = isNodeAlertDismissed;

function showDynamicNodeAlert(nodeName, reason = "timeout", host = "", nodeId = null) {
  if (!nodeName) nodeName = "Proxmox Node";
  if (isNodeAlertDismissed(nodeName)) return; // Muted by user
  const key = String(nodeId || nodeName).toLowerCase();
  window._offlineNodes.set(key, { id: nodeId, name: nodeName, host: host || "", reason: reason || "timeout" });
  renderDynamicNodeAlerts();
}

function removeDynamicNodeAlert(nodeName, nodeId = null) {
  const key = String(nodeId || nodeName).toLowerCase();
  window._offlineNodes.delete(key);
  if (nodeName) unmarkNodeDismissed(nodeName);
  renderDynamicNodeAlerts();
}

function renderDynamicNodeAlerts() {
  const container = $("#nodeAlertContainer");
  if (!container) return;

  if (window._offlineNodes.size === 0) {
    container.style.display = "none";
    container.innerHTML = "";
    return;
  }

  container.style.display = "block";
  const alertsHtml = Array.from(window._offlineNodes.values()).map(n => {
    const isTimeout = n.reason === "timeout";
    const safeNodeId = n.id ? String(n.id) : "";
    return `
      <div class="node-alert-card notice-danger" data-node-key="${esc(n.name)}">
        <div class="node-alert-icon-box">
          ${ico("alert")}
        </div>
        <div class="node-alert-content">
          <div class="node-alert-title">
            <span>Proxmox Node <b>${esc(n.name)}</b> is ${isTimeout ? 'Timed Out' : 'Offline / Unreachable'}</span>
            <span class="badge" style="background:rgba(239,68,68,0.2);color:#ef4444;font-size:10px;padding:2px 7px;font-weight:700">
              ${isTimeout ? 'CONNECTION TIMEOUT (15s)' : 'NODE DOWN'}
            </span>
          </div>
          <div class="node-alert-desc">
            The Proxmox VE node <b>${esc(n.name)}</b> ${n.host ? `(<code>${esc(n.host)}</code>)` : ''} did not respond within the connection threshold. Operations or VM metrics on this node are temporarily paused.
          </div>
        </div>
        <div class="node-alert-actions">
          <button type="button" class="btn small" data-action="retry-node" data-node-name="${esc(n.name)}" data-node-id="${safeNodeId}" style="background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:#fff;display:inline-flex;align-items:center;gap:6px" onclick="retryNodeCheck('${esc(n.name)}', ${n.id ? n.id : 'null'})">
            ${ico("refresh", "sm")} Retry Node
          </button>
          <button type="button" class="btn ghost small" data-action="dismiss-node-alert" data-node-name="${esc(n.name)}" style="padding:4px 10px;color:#fca5a5;border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.1);display:inline-flex;align-items:center;gap:5px;border-radius:6px" title="Dismiss and mute warnings" onclick="dismissNodeAlert('${esc(n.name)}')">
            ✕ Dismiss & Mute
          </button>
        </div>
      </div>
    `;
  }).join("");

  container.innerHTML = `<div class="node-alerts-list">${alertsHtml}</div>`;
}

async function retryNodeCheck(nodeName, nodeId) {
  const retryBtns = document.querySelectorAll(`[data-action="retry-node"][data-node-name="${CSS.escape ? CSS.escape(nodeName) : nodeName}"]`);
  retryBtns.forEach(btn => {
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-small" style="display:inline-block;width:12px;height:12px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite;margin-right:4px"></span> Checking...`;
  });
  toast(`Checking connection to Proxmox Node "${nodeName}"...`, "warning");
  try {
    let success = false;
    if (nodeId) {
      const res = await api(`/admin/nodes/${nodeId}/test`, { method: "POST" });
      if (res && res.ok) success = true;
    } else {
      const res = await api("/nodes/health");
      const found = res?.nodes?.find(x => x.name.toLowerCase() === nodeName.toLowerCase());
      if (found && found.status === "online") success = true;
    }
    if (success) {
      unmarkNodeDismissed(nodeName);
      removeDynamicNodeAlert(nodeName, nodeId);
      toast(`✓ Proxmox Node "${nodeName}" connection restored!`, "success");
      renderPage();
      return;
    }
    toast(`Node "${nodeName}" is still unreachable.`, "error");
  } catch (e) {
    toast(`Node "${nodeName}" is still unreachable: ${e.message}`, "error");
  } finally {
    retryBtns.forEach(btn => {
      btn.disabled = false;
      btn.innerHTML = `${ico("refresh", "sm")} Retry Node`;
    });
  }
}
window.retryNodeCheck = retryNodeCheck;

// Event delegation for node alert buttons
document.addEventListener("click", (e) => {
  const retryBtn = e.target.closest && e.target.closest('[data-action="retry-node"]');
  if (retryBtn) {
    e.preventDefault();
    const nodeName = retryBtn.getAttribute("data-node-name");
    const nodeIdStr = retryBtn.getAttribute("data-node-id");
    const nodeId = nodeIdStr ? parseInt(nodeIdStr, 10) : null;
    retryNodeCheck(nodeName, nodeId);
    return;
  }
  const dismissBtn = e.target.closest && e.target.closest('[data-action="dismiss-node-alert"]');
  if (dismissBtn) {
    e.preventDefault();
    const nodeName = dismissBtn.getAttribute("data-node-name");
    dismissNodeAlert(nodeName, true);
    return;
  }
});

// Universal Password Visibility Toggle System
function togglePasswordVisibility(targetInput, toggleBtn) {
  if (!targetInput) return;
  const isPassword = targetInput.type === "password";
  targetInput.type = isPassword ? "text" : "password";
  if (toggleBtn) {
    const isSmall = toggleBtn.classList.contains("sm") || 
                    toggleBtn.classList.contains("small") || 
                    (toggleBtn.dataset && toggleBtn.dataset.size === "sm") ||
                    (toggleBtn.getAttribute("style") && toggleBtn.getAttribute("style").includes("font-size:13px")) ||
                    toggleBtn.innerHTML.includes("class=\"svg-ico sm\"");
    toggleBtn.innerHTML = ico(isPassword ? "eyeOff" : "eye", isSmall ? "sm" : "");
    toggleBtn.title = isPassword ? "Hide password" : "Show password";
    toggleBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
  }
}

function revealPasswordInput(targetInput, toggleBtn) {
  if (!targetInput) return;
  targetInput.type = "text";
  if (toggleBtn) {
    const isSmall = toggleBtn.classList.contains("sm") || 
                    toggleBtn.classList.contains("small") || 
                    (toggleBtn.dataset && toggleBtn.dataset.size === "sm") ||
                    (toggleBtn.getAttribute("style") && toggleBtn.getAttribute("style").includes("font-size:13px")) ||
                    toggleBtn.innerHTML.includes("class=\"svg-ico sm\"");
    toggleBtn.innerHTML = ico("eyeOff", isSmall ? "sm" : "");

let _topLoaderActiveCount = 0;
let _topLoaderTimer = null;

function startTopLoader() {
  _topLoaderActiveCount++;
  const bar = document.getElementById("globalProgressBar");
  if (!bar) return;
  bar.style.transition = "width 0.3s cubic-bezier(0.1, 0.7, 0.1, 1), opacity 0.15s ease";
  bar.style.opacity = "1";
  const current = parseFloat(bar.style.width) || 0;
  if (current === 0 || bar.style.width === "") {
    bar.style.width = "35%";
  }
  clearInterval(_topLoaderTimer);
  _topLoaderTimer = setInterval(() => {
    const w = parseFloat(bar.style.width) || 35;
    if (w < 88) {
      bar.style.width = (w + Math.random() * 5 + 2).toFixed(1) + "%";
    }
  }, 350);
}

function finishTopLoader() {
  _topLoaderActiveCount = Math.max(0, _topLoaderActiveCount - 1);
  if (_topLoaderActiveCount > 0) return;
  clearInterval(_topLoaderTimer);
  const bar = document.getElementById("globalProgressBar");
  if (!bar) return;
  bar.style.transition = "width 0.2s ease-out, opacity 0.35s ease-out 0.2s";
  bar.style.width = "100%";
  bar.style.opacity = "0";
  setTimeout(() => {
    if (_topLoaderActiveCount === 0) {
      bar.style.transition = "none";
      bar.style.width = "0%";
    }
  }, 550);
}

function setElementLoading(el, isLoading) {
  // Completely disabled per user request: NO loading spinners inside buttons or sidebar
  if (!el || !(el instanceof HTMLElement)) return;
  el.classList.remove("is-btn-loading");
  el.style.pointerEvents = "";
  if (el._origDisabled !== undefined) {
    el.disabled = Boolean(el._origDisabled);
    delete el._origDisabled;
  }
  const sp = el.querySelector(".btn-loading-spinner");
  if (sp) sp.remove();
  const svgs = el.querySelectorAll("svg.svg-ico");
  svgs.forEach(s => s.style.display = "");
  if (el._origHtml !== undefined) {
    el.innerHTML = el._origHtml;
    delete el._origHtml;
  }
}

async function api(url, opts = {}) {
  startTopLoader();
  try {
    const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
    if (state.csrf && opts.method && opts.method !== "GET") headers["x-csrf-token"] = state.csrf;
    const r = await fetch("/api" + url, { credentials: "same-origin", ...opts, headers });
    let data = {};
    try { data = await r.json(); } catch {}
    if (!r.ok) {
      if (r.status === 401 && url !== "/auth/login") {
        state.user = null;
        renderLogin();
      }
      if (data && (data.is_node_down || data.node_name)) {
        if (!isNodeAlertDismissed(data.node_name)) {
          showDynamicNodeAlert(data.node_name, data.reason, data.node_host, data.node_id);
        }
      }
      const err = new Error(data.error || `Request failed (${r.status})`);
      if (data && data.is_node_down) {
        err.isNodeDown = true;
        err.nodeName = data.node_name;
        err.nodeHost = data.node_host;
        err.reason = data.reason;
      }
      throw err;
    }
    return data;
  } finally {
    finishTopLoader();
  }
}

function formatDate(str) {
  if (!str) return "—";
  try {
    const d = new Date(str);
    return isNaN(d) ? str : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  } catch {
    return str;
  }
}

function formatTimeAgo(dateStr) {
  if (!dateStr) return "Never";
  try {
    const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
    if (diff < 60) return "Just now";
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  } catch {
    return dateStr;
  }
}

async function copyToClipboard(text, msg = "Copied to clipboard!", btnEl = null) {
  if (!text) return false;
  let copied = false;

  // 1. Modern Clipboard API (works on HTTPS or localhost)
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      copied = true;
    } catch (e) {
      copied = false;
    }
  }

  // 2. Reliable Fallback (in-viewport dummy element, works on HTTP, mobile & older browsers)
  if (!copied) {
    copied = fallbackCopyText(text);
  }

  if (copied) {
    toast(msg);
    if (btnEl) {
      const origHtml = btnEl.innerHTML;
      const origStyle = btnEl.getAttribute("style") || "";
      btnEl.innerHTML = `${ico("check", "sm")} Copied!`;
      btnEl.style.background = "rgba(34, 197, 94, 0.2)";
      btnEl.style.borderColor = "var(--green)";
      btnEl.style.color = "var(--green)";
      setTimeout(() => {
        btnEl.innerHTML = origHtml;
        btnEl.setAttribute("style", origStyle);
      }, 2000);
    }
  } else {
    // If browser strictly blocked both programmatic methods, show fallback prompt
    try {
      window.prompt("Press Ctrl+C (or Cmd+C) to copy:", text);
      copied = true;
    } catch {}
  }

  return copied;
}

function fallbackCopyText(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    // Position fixed at top-left with tiny visible opacity (NOT -9999px which Chrome blocks)
    ta.style.position = "fixed";
    ta.style.top = "0";
    ta.style.left = "0";
    ta.style.width = "2em";
    ta.style.height = "2em";
    ta.style.padding = "0";
    ta.style.border = "none";
    ta.style.outline = "none";
    ta.style.boxShadow = "none";
    ta.style.background = "transparent";
    ta.style.opacity = "0.01";
    ta.style.zIndex = "99999";
    document.body.appendChild(ta);
    ta.focus({ preventScroll: true });
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const success = document.execCommand("copy");
    document.body.removeChild(ta);
    return success;
  } catch (err) {
    return false;
  }
}
window.copyToClipboard = copyToClipboard;
window.fallbackCopyText = fallbackCopyText;

function applySiteBackground(type, url, opacity, blur) {
  let container = $("#siteCustomBg");
  if (!container) {
    container = document.createElement("div");
    container.id = "siteCustomBg";
    container.className = "site-bg-container";
    container.setAttribute("aria-hidden", "true");
    container.innerHTML = '<div id="siteBgMediaWrap" class="site-bg-media-wrap"></div><div id="siteBgOverlay" class="site-bg-overlay"></div>';
    document.body.prepend(container);
  }

  const mediaWrap = $("#siteBgMediaWrap") || container.querySelector(".site-bg-media-wrap");
  const overlay = $("#siteBgOverlay") || container.querySelector(".site-bg-overlay");
  const numOpacity = (opacity !== undefined && opacity !== null && opacity !== "") ? Math.min(100, Math.max(0, Number(opacity))) : 55;
  const numBlur = (blur !== undefined && blur !== null && blur !== "") ? Math.min(30, Math.max(0, Number(blur))) : 0;

  if (overlay) {
    overlay.style.backgroundColor = `rgba(10, 10, 10, ${numOpacity / 100})`;
    overlay.style.backdropFilter = numBlur > 0 ? `blur(${numBlur}px)` : "none";
    overlay.style.webkitBackdropFilter = numBlur > 0 ? `blur(${numBlur}px)` : "none";
  }

  const trimmedUrl = (url || "").trim();
  const effectiveType = (type === "image" || type === "video") && trimmedUrl ? type : "none";

  if (effectiveType === "none") {
    document.body.classList.remove("has-custom-bg");
    container.classList.remove("active");
    if (mediaWrap) mediaWrap.innerHTML = "";
    return;
  }

  document.body.classList.add("has-custom-bg");
  container.classList.add("active");

  if (!mediaWrap) return;

  if (effectiveType === "image") {
    const currentImg = mediaWrap.querySelector("img");
    if (currentImg && currentImg.getAttribute("src") === trimmedUrl) return;
    mediaWrap.innerHTML = `<img src="${esc(trimmedUrl)}" class="site-bg-media" alt="Background" onerror="console.warn('Custom background image failed to load.');">`;
  } else if (effectiveType === "video") {
    let vid = mediaWrap.querySelector("video");
    const currentSrc = vid ? (vid.getAttribute("data-src") || vid.currentSrc || vid.src) : "";
    if (vid && currentSrc === trimmedUrl) {
      if (vid.paused) vid.play().catch(() => {});
      return;
    }
    mediaWrap.innerHTML = `
      <video class="site-bg-media" autoplay loop muted playsinline preload="auto" referrerpolicy="no-referrer" data-src="${esc(trimmedUrl)}">
        <source src="${esc(trimmedUrl)}" type="video/mp4">
        <source src="${esc(trimmedUrl)}" type="video/webm">
      </video>
    `;
    vid = mediaWrap.querySelector("video");
    if (vid) {
      vid.muted = true;
      vid.defaultMuted = true;
      vid.volume = 0;
      vid.play().catch(e => {
        console.warn("Background video autoplay blocked:", e);
      });
      const resumeOnGesture = () => {
        if (vid && vid.paused) vid.play().catch(() => {});
        document.removeEventListener("click", resumeOnGesture);
        document.removeEventListener("keydown", resumeOnGesture);
      };
      document.addEventListener("click", resumeOnGesture, { once: true });
      document.addEventListener("keydown", resumeOnGesture, { once: true });
    }
  }
}

          submitBtn.disabled = false;
          submitBtn.innerHTML = `${ico("plus")} Register Account`;
        }
      }
    };
  }
}

let _2faCountdownTimer = null;
let _2faResendTimer = null;

function renderTwoFactorChallenge(data) {
  if (_2faCountdownTimer) clearInterval(_2faCountdownTimer);
  if (_2faResendTimer) clearInterval(_2faResendTimer);

  let currentExpires = data.expiresIn || 300;
  let currentCooldown = data.resendCooldown || 60;
  let activeChallengeToken = data.challengeToken;
  let isBackupMode = false;

  $("#root").innerHTML = `
    <section class="login-wrap">
      <div class="login-card" style="max-width:min(440px, calc(100vw - 32px))">
        ${renderBrandLogo()}
        <div style="text-align:center;margin:4px 0 16px">
          <div style="display:inline-flex;align-items:center;gap:7px;background:rgba(88,101,242,0.12);border:1px solid rgba(88,101,242,0.3);border-radius:20px;padding:5px 14px;color:#5865F2;font-size:12.5px;font-weight:600">
            ${ico("discord")} @${esc(data.discordUsername || 'Discord')} (${esc(data.maskedDiscord)})
          </div>
        </div>
        <h1 style="font-size:22px;text-align:center">Two-Factor Authentication</h1>
        <p class="login-desc" id="twoFactorSubtext" style="text-align:center;margin-bottom:14px">
          Enter the 6-digit verification code sent to your Discord via Direct Message.
        </p>

        <form id="twoFactorForm">
          <div id="otpInputWrap">
            <div class="field" style="margin-bottom:6px">
              <label style="text-align:center;display:block">6-DIGIT VERIFICATION CODE</label>
              <input type="text" id="twoFactorOtpInput" name="code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" style="text-align:center;font-size:26px;font-weight:700;letter-spacing:10px;font-family:monospace;padding:10px 12px" autofocus required>
            </div>
          </div>

          <div id="backupInputWrap" style="display:none">
            <div class="field" style="margin-bottom:6px">
              <label style="text-align:center;display:block">12-CHARACTER BACKUP RECOVERY CODE</label>
              <input type="text" id="twoFactorBackupInput" name="backup_code" maxlength="14" placeholder="XXXX-XXXX-XXXX" style="text-align:center;font-size:17px;font-weight:700;letter-spacing:2px;font-family:monospace;text-transform:uppercase;padding:10px 12px">
              <span class="small muted" style="display:block;text-align:center;margin-top:4px">Entering a backup code will permanently consume it.</span>
            </div>
          </div>

          <div id="twoFactorTimerBox" style="font-size:12px;color:var(--muted);text-align:center;margin:8px 0 14px">
            Code expires in <span id="twoFactorCountdown" style="color:var(--accent);font-weight:700">05:00</span>
          </div>

          <button class="btn primary" id="twoFactorSubmitBtn" type="submit" style="width:100%">${ico("shield")} Verify & Sign In</button>
          
          <button type="button" class="btn ghost small" id="twoFactorResendBtn" disabled style="width:100%;margin-top:8px">
            ${ico("restore", "sm")} Resend Code (<span id="resendCountdown">${currentCooldown}</span>s)
          </button>
        </form>

        <div style="text-align:center;margin-top:14px">
          <a href="javascript:void(0)" id="toggleBackupModeLink" style="font-size:12.5px;color:var(--muted);text-decoration:none">
            ${ico("key", "sm")} Use Backup Recovery Code
          </a>
        </div>

        <div style="text-align:center;margin-top:10px">
          <a href="javascript:void(0)" id="returnToLoginLink" style="font-size:12px;color:var(--muted);text-decoration:none">
            ← Return to Sign In
          </a>
        </div>

        <div class="notice">${ico("lock")} Encrypted End-to-End · Discord Bot Delivery & Audit Logged</div>
      </div>
    </section>
  `;

  const countdownEl = $("#twoFactorCountdown");
  const resendBtn = $("#twoFactorResendBtn");
  const resendCountdownEl = $("#resendCountdown");
  const otpInput = $("#twoFactorOtpInput");
  const backupInput = $("#twoFactorBackupInput");
  const otpWrap = $("#otpInputWrap");
  const backupWrap = $("#backupInputWrap");
  const timerBox = $("#twoFactorTimerBox");
  const subtext = $("#twoFactorSubtext");
  const toggleBackupLink = $("#toggleBackupModeLink");
  const returnLink = $("#returnToLoginLink");
  const form = $("#twoFactorForm");
  const submitBtn = $("#twoFactorSubmitBtn");

  // Timer: Expiration (5 min)
  _2faCountdownTimer = setInterval(() => {
    currentExpires--;
    if (currentExpires <= 0) {
      clearInterval(_2faCountdownTimer);
      if (countdownEl) countdownEl.textContent = "Expired";
      if (submitBtn) submitBtn.disabled = true;
      toast("Verification code expired. Please request a new code.", "error");
    } else if (countdownEl) {
      const mins = Math.floor(currentExpires / 60).toString().padStart(2, "0");
      const secs = (currentExpires % 60).toString().padStart(2, "0");
      countdownEl.textContent = `${mins}:${secs}`;
    }
  }, 1000);

  // Timer: Resend Cooldown (60s)
  _2faResendTimer = setInterval(() => {
    currentCooldown--;
    if (currentCooldown <= 0) {
      clearInterval(_2faResendTimer);
      if (resendBtn) {
        resendBtn.disabled = false;
        resendBtn.innerHTML = `${ico("restore", "sm")} Resend Code`;
      }
    } else if (resendCountdownEl) {
      resendCountdownEl.textContent = currentCooldown;
    }
  }, 1000);

  // Toggle Backup Code Mode
  if (toggleBackupLink) {
    toggleBackupLink.onclick = () => {
      isBackupMode = !isBackupMode;
      if (isBackupMode) {
        otpWrap.style.display = "none";
        backupWrap.style.display = "block";
        timerBox.style.display = "none";
        if (resendBtn) resendBtn.style.display = "none";
        subtext.textContent = "Enter one of your 12-character emergency backup recovery codes.";
        toggleBackupLink.innerHTML = `${ico("shield", "sm")} Use 6-Digit Discord Code`;
        backupInput.focus();
        otpInput.required = false;
        backupInput.required = true;
      } else {
        otpWrap.style.display = "block";
        backupWrap.style.display = "none";
        timerBox.style.display = "block";
        if (resendBtn) resendBtn.style.display = "inline-flex";
        subtext.textContent = "Enter the 6-digit verification code sent to your Discord via Direct Message.";
        toggleBackupLink.innerHTML = `${ico("key", "sm")} Use Backup Recovery Code`;
        otpInput.focus();
        otpInput.required = true;
        backupInput.required = false;
      }
    };
  }

  // Resend Button Handler
  if (resendBtn) {
    resendBtn.onclick = async () => {
      resendBtn.disabled = true;
      resendBtn.innerHTML = `${ico("spinner", "spin sm")} Sending code…`;
      try {
        const res = await api("/auth/2fa/resend", {
          method: "POST",
          body: JSON.stringify({ challengeToken: activeChallengeToken })
        });
        toast(res.message || "A new 6-digit code has been delivered to your Discord.", "success");
        currentCooldown = res.resendCooldown || 60;
        currentExpires = res.expiresIn || 300;
        if (submitBtn) submitBtn.disabled = false;
        resendBtn.disabled = true;
        resendBtn.innerHTML = `${ico("restore", "sm")} Resend Code (<span id="resendCountdown">${currentCooldown}</span>s)`;

        clearInterval(_2faResendTimer);
        _2faResendTimer = setInterval(() => {
          currentCooldown--;
          if (currentCooldown <= 0) {
            clearInterval(_2faResendTimer);
            if (resendBtn) {
              resendBtn.disabled = false;
              resendBtn.innerHTML = `${ico("restore", "sm")} Resend Code`;
            }
          } else {
            const el = $("#resendCountdown");
            if (el) el.textContent = currentCooldown;
          }
        }, 1000);
      } catch (err) {
        toast(err.message, "error");
        resendBtn.disabled = false;
        resendBtn.innerHTML = `${ico("restore", "sm")} Resend Code`;
      }
    };
  }

  // Return to Login
  if (returnLink) {
    returnLink.onclick = () => {
      clearInterval(_2faCountdownTimer);
      clearInterval(_2faResendTimer);
      renderLogin();
    };
  }

  // Auto-submit 6 digits
  if (otpInput) {
    otpInput.oninput = () => {
      otpInput.value = otpInput.value.replace(/[^0-9]/g, "");
      if (otpInput.value.length === 6) {
        form.requestSubmit();
      }
    };
  }

  // Verify Code Form Submit
  if (form) {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const codeVal = isBackupMode ? backupInput.value.trim() : otpInput.value.trim();
      if (!codeVal) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `${ico("spinner", "spin sm")} Verifying…`;

      try {
        const res = await api("/auth/2fa/verify", {
          method: "POST",
          body: JSON.stringify({
            challengeToken: activeChallengeToken,
            code: codeVal,
            isBackupCode: isBackupMode
          })
        });

        clearInterval(_2faCountdownTimer);
        clearInterval(_2faResendTimer);

        if (res.usedBackupCode) {
          toast("Signed in using backup recovery code! This code has been burned.", "warning");
        } else {
          toast("Two-factor verification successful!", "success");
        }

        state.user = res.user;
        state.csrf = res.csrfToken;
        await loadDashboard();
      } catch (err) {
        toast(err.message, "error");
        submitBtn.disabled = false;
        submitBtn.innerHTML = `${ico("shield")} Verify & Sign In`;
        if (isBackupMode) {
          backupInput.select();
        } else {
          otpInput.value = "";
          otpInput.focus();
        }
      }
    };
  }
}

async function handleRootClick(e) {
  if (e.target.closest("#logoutBtn")) return;
  const nav = e.target.closest("[data-page]");
  if (nav) {
    $("#sidebar")?.classList.remove("open");
    $("#sidebarBackdrop")?.classList.remove("open");
    startTopLoader();
    try {
      if (state.page === "vps" && nav.dataset.page !== "vps" && liveSocket && state.currentServerId) {
        liveSocket.emit("unsubscribe_vps", { id: state.currentServerId });
      }
      state.page = nav.dataset.page;
      // Reset form states on navigation
      if (state.page === "create-vps") state.createVpsState = { type: "qemu", source: "template", ip4Type: "dhcp", ip6Type: "disabled", nodeId: null, cachedData: null };
      if (state.page === "vps") state.editVpsState = { ip4Type: "dhcp", ip6Type: "auto" };
      await renderPage();
    } finally {
      finishTopLoader();
    }
    return;
  }
  const toggleTableKeyBtn = e.target.closest(".btn-toggle-table-key");
  if (toggleTableKeyBtn) {
    const wrap = toggleTableKeyBtn.closest(".api-key-box") || toggleTableKeyBtn.parentElement;
    if (wrap) {
      const inp = wrap.querySelector(".table-key-input") || wrap.querySelector("input");
      if (inp) {
        const isMasked = inp.type === "password";
        inp.type = isMasked ? "text" : "password";
        toggleTableKeyBtn.innerHTML = isMasked ? ico("eyeOff", "sm") : ico("eye", "sm");
        toggleTableKeyBtn.title = isMasked ? "Hide API Key" : "Show API Key";
        inp.style.width = isMasked ? "320px" : "145px";
      }
    }
    return;
  }
  const copyBtn = e.target.closest("[data-copy]");
  if (copyBtn) {
    const text = copyBtn.dataset.copy;
    const msg = copyBtn.dataset.copyMsg || "Copied to clipboard!";
    return copyToClipboard(text, msg, copyBtn);
  }
  const act = e.target.closest("[data-action]");
  if (act) {
    const action = act.dataset.action, id = Number(act.dataset.id);
    startTopLoader();
    try {
      if (action === "create-vps") { state.page = "create-vps"; return await renderPage(); }
      if (action === "server") return await openServer(id);
      if (action === "back-servers") {
        if (liveSocket && state.currentServerId) {
          liveSocket.emit("unsubscribe_vps", { id: state.currentServerId });
        }
        state.page = "servers";
        return await renderPage();
      }
      if (action === "view-node") return await openNode(id);
      if (action === "back-nodes") { state.page = "nodes"; return await renderPage(); }
      if (action === "node-refresh") return await renderPage();
      if (action === "node-tab") { state.nodeTab = act.dataset.tab; return await renderPage(); }
      if (action === "vps-refresh") return await renderPage();
      if (action === "vps-tab") { state.vpsTab = act.dataset.tab; return await renderPage(); }
      if (action === "snapshot-rollback") return await rollbackSnapshot(id, act.dataset.snap);
      if (action === "reinstall-vps") return await reinstallModal(id);
      if (action === "edit-vps") return await openEditVps(id);
      if (action === "clone-vps") return await cloneModal(id);
      if (action === "console-vps") return await consoleModal(id);
      if (action === "create-backup") return await createBackupModal(id);
      if (action === "restore-backup") return await restoreBackup(id, act.dataset.volid);
      if (action === "delete-backup") return await deleteBackup(id, act.dataset.volid);
      if (action === "power") { await serverAction(id, act.dataset.power); if (state.page === "vps") await renderPage(); return; }
      if (action === "snapshot") { await createSnapshot(id); if (state.page === "vps") await renderPage(); return; }
      if (action === "add-user") return await userModal();
      if (action === "edit-user") return await editUserModal(id);
      if (action === "add-node") return await nodeModal();
      if (action === "edit-node") return await editNodeModal(id);
      if (action === "delete-node") return await deleteNode(id);
      if (action === "assign") return await assignModal();
      if (action === "refresh") return await renderPage();
      if (action === "toggle-user") return await toggleUser(id, act.dataset.active === "1");
      if (action === "reset-2fa-user") return await resetUser2faModal(id);
      if (action === "delete-user") return await deleteUser(id);
      if (action === "test-node") return await testNode(id);
      if (action === "toggle-node") return await toggleNode(id, act.dataset.enabled === "1");
      if (action === "unassign") return await unassign(id, act.dataset.name, act.dataset.vmid);
      if (action === "delete-vps") return await deleteVpsModal(id, act.dataset.name, act.dataset.vmid, act.dataset.node, act.dataset.type);
      if (action === "renew-vps") return await renewVpsModal(id, act.dataset.name);
      if (action === "suspend-vps") return await suspendVps(id, act.dataset.name);
      if (action === "unsuspend-vps") return await unsuspendVps(id, act.dataset.name);
      if (action === "create-template") return await templateModal();
      if (action === "edit-template") return await templateModal(id);
      if (action === "deploy-template") return await deployTemplateModal(id);
      if (action === "delete-template") return await deleteTemplate(id);
      if (action === "create-api-key") return await createApiKeyModal();
      if (action === "edit-api-key") return await editApiKeyModal(id);
      if (action === "toggle-api-key") return await toggleApiKey(id);
      if (action === "delete-api-key") return await deleteApiKey(id);
      if (action === "regen-api-key") return await regenerateApiKey(id);
      if (action === "api-docs") return await openApiDocsModal();
    } finally {
      finishTopLoader();
    }
    return;
  }
}

  $$(".nav button").forEach(b => {
    const p = b.dataset.page;

    else if (state.page === "users") await usersPage(c);
    else if (state.page === "api-keys") await apiKeysPage(c);
    else if (state.page === "nodes") await nodesPage(c);
    else if (state.page === "node-details") await nodeDashboardPage(c);
    else if (state.page === "create-vps") await createVpsPage(c);
    else if (state.page === "assign") await assignPage(c);
    else if (state.page === "tasks") await tasksPage(c);
    else if (state.page === "logs") await logsPage(c);

          <p class="muted small" style="max-width:540px;margin:0 auto 20px;line-height:1.6">

function formatExpiryBadge(s) {
  if (!s || !s.expires_at) {
    return `<span class="tag" style="background:rgba(255,255,255,0.04);color:var(--muted);border-color:rgba(255,255,255,0.08);font-size:11px">${ico("clock", "sm")} Lifetime</span>`;
  }
  const expTime = new Date(s.expires_at).getTime();
  if (isNaN(expTime)) return "";
  const now = Date.now();
  const diffMs = expTime - now;
  const daysLeft = Math.ceil(diffMs / 86400000);

  if (diffMs <= 0 || s.is_expired) {
    return `<span class="tag" style="background:rgba(239,68,68,0.15);color:#f87171;border-color:rgba(239,68,68,0.35);font-weight:700;font-size:11px">${ico("alertCircle", "sm")} EXPIRED</span>`;
  }
  if (daysLeft <= 3) {
    const hoursLeft = Math.max(1, Math.ceil(diffMs / 3600000));
    return `<span class="tag" style="background:rgba(234,179,8,0.15);color:#facc15;border-color:rgba(234,179,8,0.35);font-weight:700;font-size:11px">${ico("clock", "sm")} Expires in ${daysLeft <= 1 ? `${hoursLeft}h` : `${daysLeft}d`}</span>`;
  }
  if (daysLeft <= 7) {
    return `<span class="tag" style="background:rgba(245,158,11,0.12);color:#fbbf24;border-color:rgba(245,158,11,0.25);font-size:11px">${ico("clock", "sm")} ${daysLeft}d left</span>`;
  }
  return `<span class="tag" style="background:rgba(34,197,94,0.08);color:#86efac;border-color:rgba(34,197,94,0.2);font-size:11px">${ico("clock", "sm")} ${daysLeft}d left</span>`;
}
