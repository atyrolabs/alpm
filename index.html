          <p class="muted small" style="margin:2px 0 0">${esc(keyInfo.name)} (${esc(keyInfo.key_prefix)})</p>
        </div>
      </div>
      <button class="btn ghost small" data-close>✕</button>
    </div>

    <div style="padding:20px;display:flex;flex-direction:column;gap:18px">
      <div class="notice" style="border-color:rgba(234,179,8,0.3);background:rgba(234,179,8,0.06);color:#fbbf24;border-radius:10px;padding:14px;margin:0">
        <b>${ico("alert", "sm", "color:var(--yellow)")} Please copy your secret API key immediately!</b>
        <div style="font-size:12px;margin-top:4px;color:#fde68a">
          For security reasons, this secret token will <b>NEVER be displayed again</b>. If you lose it, you will need to regenerate a new one.
        </div>
      </div>

      <div class="field">
        <label>Secret API Key Token</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="password" id="revealedSecretKey" value="${esc(rawKey)}" readonly style="font-family:'Space Grotesk',monospace;font-size:13px;letter-spacing:1px;background:#0d0d0d;border:1px solid #303030;color:#38bdf8;flex:1">
          <button type="button" class="btn ghost" id="toggleRevealKeyBtn" style="padding:8px 12px" title="Show/Hide">${ico("eye")}</button>
          <button type="button" class="btn primary" id="copySecretKeyBtn" style="padding:8px 16px;white-space:nowrap">${ico("copy")} Copy Key</button>
        </div>
      </div>

      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <label style="margin:0;font-size:12px;color:#aaa">Ready-to-Run Quick Start Example</label>
          <div style="display:flex;gap:6px">
            <button class="btn small active" id="tabCurlBtn" style="padding:3px 8px;font-size:11px">cURL</button>
            <button class="btn small ghost" id="tabPyBtn" style="padding:3px 8px;font-size:11px">Python</button>
            <button class="btn small ghost" id="tabNodeBtn" style="padding:3px 8px;font-size:11px">Node.js</button>
          </div>
        </div>
        <div style="position:relative">
          <pre id="quickCodeSnippet" style="background:#09090b;border:1px solid #27272a;border-radius:8px;padding:12px;font-family:'Space Grotesk',monospace;font-size:11.5px;color:#e2e8f0;overflow-x:auto;margin:0;white-space:pre-wrap;word-break:break-all">${esc(curlExample)}</pre>
          <button class="btn small ghost" id="copyCodeSnippetBtn" style="position:absolute;right:8px;top:8px;padding:3px 8px;font-size:10px">${ico("copy", "sm")} Copy Code</button>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;margin-top:6px">
        <button type="button" class="btn primary" data-close>I Have Saved My Key</button>
      </div>
    </div>
  `, "modal-large");

  // Reveal toggle
  let isRevealed = false;
  const keyInput = $("#revealedSecretKey");
  const toggleBtn = $("#toggleRevealKeyBtn");
  if (toggleBtn && keyInput) {
    toggleBtn.onclick = () => {
      isRevealed = !isRevealed;
      keyInput.type = isRevealed ? "text" : "password";
      toggleBtn.innerHTML = isRevealed ? ico("eyeOff") : ico("eye");
    };
  }

  // Copy Key
  const copyBtn = $("#copySecretKeyBtn");
  if (copyBtn && keyInput) {
    copyBtn.onclick = () => {
      keyInput.focus();
      keyInput.select();
      keyInput.setSelectionRange(0, keyInput.value.length);
      copyToClipboard(rawKey, "Secret API key copied to clipboard!", copyBtn);
    };
  }
  if (keyInput) {
    keyInput.onclick = () => {
      keyInput.select();
      keyInput.setSelectionRange(0, keyInput.value.length);
    };
  }

  // Snippet tabs
  let currentSnippet = curlExample;
  const pre = $("#quickCodeSnippet");
  const curlTab = $("#tabCurlBtn");
  const pyTab = $("#tabPyBtn");
  const nodeTab = $("#tabNodeBtn");
  const copyCodeBtn = $("#copyCodeSnippetBtn");

  const setSnippet = (snippet, activeBtn) => {

  if (curlTab) curlTab.onclick = () => setSnippet(curlExample, curlTab);
  if (pyTab) pyTab.onclick = () => setSnippet(pythonExample, pyTab);
  if (nodeTab) nodeTab.onclick = () => setSnippet(nodeExample, nodeTab);
  if (copyCodeBtn) copyCodeBtn.onclick = () => copyToClipboard(currentSnippet, "Snippet copied to clipboard!", copyCodeBtn);
}

      <div class="field">
        <label style="display:flex;align-items:center;justify-content:space-between">

        <div class="scope-mode-grid">

            <div class="scope-mode-icon">${ico("sliders")}</div>
            <div class="scope-mode-info">
              <div class="scope-mode-title">
                Granular Scopes
                <span class="badge" style="background:rgba(99,102,241,0.15);color:var(--accent);font-size:10px;padding:1px 6px">CUSTOM</span>
              </div>

              </span>
              <span id="editScopeCountBadge" class="badge" style="background:rgba(99,102,241,0.15);color:var(--accent);font-size:11px">

            <div style="display:flex;align-items:center;gap:6px">

            ${API_SCOPES_DATA.map(s => {

                    <div class="scope-item-code">${s.id}</div>

              `;
            }).join("")}

      <div class="field">
        <label style="display:flex;align-items:center;justify-content:space-between">

          <span class="small muted">Optional Security</span>
        </label>
        <textarea name="allowed_ips" rows="2" placeholder="e.g. 192.168.1.100, 10.0.0.0/24 (leave blank to allow all IPs)" style="background:#09090b;border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:10px;color:white;width:100%;font-size:12px;font-family:'Space Grotesk',monospace;resize:vertical">${esc(k.allowed_ips || "")}</textarea>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="field" style="margin:0">
          <label style="display:flex;align-items:center;gap:6px">${ico("zap", "sm", "color:var(--yellow)")} Rate Limit (req/min)</label>
          <select name="rate_limit" style="background:#09090b;border:1px solid rgba(255,255,255,0.12)">
            <option value="60" ${k.rate_limit === 60 ? "selected" : ""}>60 req/min (Normal Scripts)</option>
            <option value="120" ${k.rate_limit === 120 ? "selected" : ""}>120 req/min (Standard)</option>
            <option value="300" ${k.rate_limit === 300 ? "selected" : ""}>300 req/min (High Throughput / WHMCS)</option>
            <option value="600" ${k.rate_limit === 600 ? "selected" : ""}>600 req/min (Burst Integrations)</option>
            <option value="1200" ${k.rate_limit === 1200 ? "selected" : ""}>1200 req/min (Enterprise High-Load)</option>
          </select>
        </div>

        <div class="field" style="margin:0">
          <label style="display:flex;align-items:center;gap:6px">${ico("clock", "sm", "color:#38bdf8")} Expiration Date</label>
          <input type="date" name="expires_at" value="${k.expires_at ? k.expires_at.split(' ')[0] : ''}" style="background:#09090b;border:1px solid rgba(255,255,255,0.12)">
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.08)">
        <button type="button" class="btn ghost" data-close style="padding:10px 18px">Cancel</button>
        <button type="submit" class="btn primary" style="padding:10px 22px;font-weight:700">Save Changes</button>
      </div>
    </form>
  `, "modal-large");

  const editAllRadio = $("#editScopeAll");
  const editCustomRadio = $("#editScopeCustom");
  const editCardAll = $("#editScopeCardAll");
  const editCardCustom = $("#editScopeCardCustom");
  const editWrap = $("#editCustomScopesWrap");
  const editCountBadge = $("#editScopeCountBadge");

  function updateEditScopeMode(isCustom) {
    if (isCustom) {
      editCustomRadio.checked = true;
      editCardCustom.classList.add("active");
      editCardAll.classList.remove("active");
      editWrap.style.display = "block";
    } else {
      editAllRadio.checked = true;
      editCardAll.classList.add("active");
      editCardCustom.classList.remove("active");
      editWrap.style.display = "none";
    }
  }

  if (editAllRadio && editCustomRadio) {
    editAllRadio.onchange = () => updateEditScopeMode(false);
    editCustomRadio.onchange = () => updateEditScopeMode(true);
    editCardAll.onclick = (e) => { if (e.target !== editAllRadio) updateEditScopeMode(false); };
    editCardCustom.onclick = (e) => { if (e.target !== editCustomRadio) updateEditScopeMode(true); };
  }

  function updateEditScopeCount() {
    const total = API_SCOPES_DATA.length;
    const chks = $$(".edit-scope-chk");
    let checked = 0;
    chks.forEach(chk => {
      const card = chk.closest(".scope-item-card");
      if (chk.checked) {
        checked++;
        card?.classList.add("checked");
      } else {
        card?.classList.remove("checked");
      }
    });
    if (editCountBadge) editCountBadge.textContent = `${checked} of ${total} selected`;
  }

  $$(".edit-scope-chk").forEach(chk => {
    chk.onchange = () => updateEditScopeCount();
  });

  const editSelectAll = $("#editSelectAllScopesBtn");
  const editClearAll = $("#editClearAllScopesBtn");
  if (editSelectAll) {
    editSelectAll.onclick = () => {
      $$(".edit-scope-chk").forEach(c => { c.checked = true; });
      updateEditScopeCount();
    };
  }
  if (editClearAll) {
    editClearAll.onclick = () => {
      $$(".edit-scope-chk").forEach(c => { c.checked = false; });
      updateEditScopeCount();
    };
  }

  const editSecretInput = $("#editKeySecretInput");
  const toggleEditSecret = $("#toggleEditKeySecret");
  if (editSecretInput && toggleEditSecret) {
    let rev = false;
    toggleEditSecret.onclick = () => {
      rev = !rev;
      editSecretInput.type = rev ? "text" : "password";
      toggleEditSecret.innerHTML = rev ? ico("eyeOff", "sm") : ico("eye", "sm");
    };
  }

  const form = $("#editApiKeyForm");
  if (form) {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const name = fd.get("name").trim();
      if (!name) return toast("Name is required.", "error");

      let scopes = "*";
      if (editCustom.checked) {
        const checked = Array.from($$(".edit-scope-chk:checked")).map(el => el.value);
        if (checked.length === 0) return toast("Please select at least one scope.", "error");
        scopes = checked.join(",");
      }

      const allowedIps = (fd.get("allowed_ips") || "").trim();
      const rateLimit = Number(fd.get("rate_limit")) || 120;
      const expiresAt = fd.get("expires_at") ? fd.get("expires_at") : null;

      try {
        await api(`/admin/api-keys/${id}`, {
          method: "PUT",
          body: JSON.stringify({ name, scopes, allowed_ips: allowedIps, rate_limit: rateLimit, expires_at: expiresAt })
        });
        toast("API Key updated successfully!");
        closeModal();
        renderPage();
      } catch (err) {
        toast(err.message, "error");
      }
    };
  }
}

async function toggleApiKey(id) {
  try {
    const res = await api(`/admin/api-keys/${id}/toggle`, { method: "POST", body: "{}" });
    toast(res.message);
    renderPage();
  } catch (err) {
    toast(err.message, "error");
  }
}

async function deleteApiKey(id) {
  const k = (window._atyroApiKeys || []).find(x => x.id === id);
  const name = k ? k.name : `#${id}`;
  if (!confirm(`Are you sure you want to permanently delete and revoke API key "${name}"?\n\nAny script or integration using this key will immediately lose access.`)) {
    return;
  }
  try {
    const res = await api(`/admin/api-keys/${id}`, { method: "DELETE" });
    toast(res.message);
    renderPage();
  } catch (err) {
    toast(err.message, "error");
  }
}

async function regenerateApiKey(id) {
  const k = (window._atyroApiKeys || []).find(x => x.id === id);
  const name = k ? k.name : `#${id}`;
  if (!confirm(`Regenerate secret token for API key "${name}"?\n\nThe current token will be REVOKED IMMEDIATELY, and a new token will be generated.`)) {
    return;
  }
  try {
    const res = await api(`/admin/api-keys/${id}/regenerate`, { method: "POST", body: "{}" });
    toast("Secret token regenerated successfully!");
    renderPage();
    showKeyRevealModal(res.raw_key, { name: k ? k.name : "API Key", key_prefix: res.key_prefix });
  } catch (err) {
    toast(err.message, "error");
  }
}

                const matched = (state.servers || []).find(x => x.id === s.id || (Number(x.vmid) === Number(s.vmid)));
                const st = (s.status && s.status !== "unknown") ? s.status : (matched?.status || s.status || "stopped");
                const isRun = st === "running";
                const borderClr = isRun ? "rgba(34,197,94,0.3)" : "rgba(239,68,68,0.3)";
                const textClr = isRun ? "var(--green)" : "var(--red)";
                return `
                <div style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px">
                  <div style="display:flex;align-items:center;gap:10px;min-width:0">
                    <span style="color:${s.type === 'qemu' ? 'var(--accent)' : 'var(--blue)'}">${ico(s.type === 'qemu' ? 'kvm' : 'lxc')}</span>
                    <div style="min-width:0">
                      <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</div>
                      <div class="small muted">VMID ${s.vmid} • Node ${esc(s.node)}</div>
                    </div>
                  </div>
                  <div style="display:flex;align-items:center;gap:8px">
                    <span class="tag small profile-status-badge-${s.id}" style="border-color:${borderClr};color:${textClr};text-transform:capitalize">
                      ${ico("statusDot", "sm")} ${esc(st)}
                    </span>
                    <button type="button" class="btn small ghost" data-action="server" data-id="${s.id}">Manage ${ico("arrowRight", "sm")}</button>
                  </div>
                </div>
              `;}).join('')}
            </div>
          ` : `
            <div class="empty" style="padding:24px;border:1px dashed var(--line);border-radius:10px;background:var(--panel2)">
              <div style="color:var(--muted);margin-bottom:6px">${ico("box", "lg")}</div>
              <div style="font-size:13px;font-weight:600">No Virtual Servers Assigned</div>
              <div class="small muted" style="margin-top:4px">No VPS resources are linked to this user yet.</div>
            </div>
          `}
        </div>

      </div>

      <!-- RIGHT COLUMN: PASSWORD & SECURITY -->
      <div style="display:flex;flex-direction:column;gap:24px">
        
        <!-- CARD 4: CHANGE PASSWORD -->
        <div class="settings-card">
          <div class="settings-card-header">
            <div class="settings-card-icon" style="color:var(--yellow);background:rgba(234,179,8,0.1);border-color:rgba(234,179,8,0.2)">${ico("lock", "lg")}</div>
            <div class="settings-card-title">
              <h3>Change Password</h3>
              <p>Update your authentication password to maintain high account security</p>
            </div>
          </div>

          <div style="background:rgba(234,179,8,0.06);border:1px solid rgba(234,179,8,0.2);border-radius:10px;padding:12px 14px;margin-bottom:18px;display:flex;align-items:flex-start;gap:10px">
            <span style="color:var(--yellow);margin-top:2px">${ico("lightbulb", "sm")}</span>
            <div class="small" style="color:rgba(255,255,255,0.85);line-height:1.5">
              To update your password, your <b>Current Password</b> is required for verification. If you only want to change your username, email, or avatar, leave the password fields blank.
            </div>
          </div>

          <div class="field" style="margin-bottom:16px">
            <label>Current Password</label>
            <div style="position:relative;display:flex;align-items:center">
              <input type="password" id="profile_current_password" placeholder="Enter your current password" autocomplete="current-password" style="padding-right:42px">
              <button type="button" class="btn ghost toggle-pwd-btn" data-target="profile_current_password" style="position:absolute;right:4px;padding:6px 8px;border:none;background:transparent;color:var(--muted)" title="Show/Hide Password">
                ${ico("eye", "sm")}
              </button>
            </div>
            <span class="small muted">Required only when changing to a new password.</span>
          </div>

          <div class="field" style="margin-bottom:16px">
            <label style="display:flex;justify-content:space-between;align-items:center">
              <span>New Password</span>
              <button type="button" class="btn ghost small" id="generateProfilePwdBtn" style="padding:2px 8px;font-size:11px" title="Generate strong random password">
                ${ico("dice", "sm")} Generate Strong
              </button>
            </label>
            <div style="position:relative;display:flex;align-items:center">
              <input type="password" id="profile_new_password" placeholder="Enter new strong password (min 6 characters)" autocomplete="new-password" style="padding-right:42px">
              <button type="button" class="btn ghost toggle-pwd-btn" data-target="profile_new_password" style="position:absolute;right:4px;padding:6px 8px;border:none;background:transparent;color:var(--muted)" title="Show/Hide Password">
                ${ico("eye", "sm")}
              </button>
            </div>
            <span class="small muted">Use at least 8+ characters with a mixture of letters, numbers, and symbols.</span>
          </div>

          <div class="field" style="margin-bottom:12px">
            <label>Confirm New Password</label>
            <div style="position:relative;display:flex;align-items:center">
              <input type="password" id="profile_confirm_password" placeholder="Confirm your new password" autocomplete="new-password" style="padding-right:42px">
              <button type="button" class="btn ghost toggle-pwd-btn" data-target="profile_confirm_password" style="position:absolute;right:4px;padding:6px 8px;border:none;background:transparent;color:var(--muted)" title="Show/Hide Password">
                ${ico("eye", "sm")}
              </button>
            </div>
            <span class="small muted" id="pwdMatchNote">Must match new password exactly.</span>
          </div>
        </div>

        <!-- CARD: DISCORD & TWO-FACTOR AUTHENTICATION (2FA) -->
        <div class="settings-card" id="profile2faCard">
          <div class="settings-card-header">
            <div class="settings-card-icon" style="color:#5865F2;background:rgba(88,101,242,0.1);border-color:rgba(88,101,242,0.25)">
              ${ico("discord", "lg")}
            </div>
            <div class="settings-card-title">
              <h3>Discord Two-Factor Authentication (2FA)</h3>
              <p>Bot DM one-time passwords, OAuth2 account linking & single-use backup recovery codes</p>
            </div>
          </div>

          <!-- Section 1: Discord Account Linking Status -->
          <div style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
              <div style="display:flex;align-items:center;gap:12px">
                ${renderDiscordAvatar(u, 44)}
                <div>
                  <div style="font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px">
                    ${u.discord_id ? `@${esc(u.discord_username || 'DiscordUser')}` : 'Discord Not Connected'}
                    ${u.discord_id ? `<span class="tag small" style="border-color:rgba(88,101,242,0.3);color:#5865F2;font-size:11px">Linked</span>` : ''}
                  </div>
                  <div class="small muted">
                    ${u.discord_id ? `Snowflake ID: <code>${esc(u.discord_id)}</code>` : 'Link Discord to receive login OTPs and recover your account.'}
                  </div>
                </div>
              </div>

              <div>
                ${u.discord_id ? `
                  <button type="button" class="btn ghost small danger" id="profileUnlinkDiscordBtn" ${u.two_factor_enabled ? 'title="Disable 2FA first before unlinking Discord"' : ''}>
                    ${ico("ban", "sm")} Unlink Discord
                  </button>
                ` : `
                  <div style="display:flex;gap:6px">
                    <button type="button" class="btn primary small" id="profileConnectDiscordOAuthBtn" style="background:#5865F2;border-color:#5865F2">
                      ${ico("discord", "sm")} Connect Discord
                    </button>
                    <button type="button" class="btn ghost small" id="profileLinkWithCodeBtn" title="Pair using 6-character code">
                      ${ico("link", "sm")} Bot Code
                    </button>
                  </div>
                `}
              </div>
            </div>
          </div>

          <!-- Section 2: Two-Factor Authentication Status & Controls -->
          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)">
              <div>
                <div style="font-weight:600;font-size:13px">Two-Factor Authentication (2FA)</div>
                <div class="small muted">Require a 6-digit OTP code sent via Discord DM on sign-in</div>
              </div>
              <div>
                ${u.two_factor_enabled 
                  ? `<span class="badge" style="background:rgba(34,197,94,0.15);color:var(--green);border-color:rgba(34,197,94,0.3);font-size:12px;padding:4px 10px">${ico("shield", "sm")} Active</span>` 
                  : `<span class="badge" style="background:rgba(255,255,255,0.05);color:var(--muted);border-color:var(--line);font-size:12px;padding:4px 10px">Disabled</span>`}
              </div>
            </div>

            ${u.two_factor_enabled ? `
              <div style="background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.2);border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
                <div class="small" style="line-height:1.5">
                  <div style="font-weight:600;color:var(--green);display:flex;align-items:center;gap:6px">
                    ${ico("check", "sm")} Discord DM OTP Active
                  </div>
                  <div class="muted">Backup Recovery Codes: <b>${u.two_factor_backup_codes_count !== undefined ? u.two_factor_backup_codes_count : '—'} / 10 remaining</b></div>
                </div>
                <div style="display:flex;gap:8px">
                  <button type="button" class="btn ghost small" id="profileRegenBackupBtn" title="Regenerate 10 new emergency backup codes">
                    ${ico("restore", "sm")} Backup Codes
                  </button>
                  <button type="button" class="btn ghost small danger" id="profileDisable2faBtn">
                    Disable 2FA
                  </button>
                </div>
              </div>
            ` : `
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px">
                <span class="small muted">${u.discord_id ? 'Protect your account with Discord Bot verification.' : 'Connect your Discord account above to enable 2FA.'}</span>
                <button type="button" class="btn primary small" id="profileEnable2faBtn" ${!u.discord_id ? 'disabled' : ''}>
                  ${ico("shield", "sm")} Enable Discord 2FA
                </button>
              </div>
            `}
          </div>
        </div>

        <!-- CARD 5: SECURITY OVERVIEW & SESSION -->
        <div class="settings-card">
          <div class="settings-card-header">
            <div class="settings-card-icon">${ico("shield", "lg")}</div>
            <div class="settings-card-title">
              <h3>Security & Session</h3>
              <p>Active session parameters and protection mechanisms</p>
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:12px">
            <div class="resource">
              <div class="resource-head">
                <span>Session Protection</span>
                <span style="color:var(--green);font-weight:600;font-size:12px">${ico("check", "sm")} HTTP-only Cookie</span>
              </div>
            </div>
            <div class="resource">
              <div class="resource-head">
                <span>CSRF Token Verification</span>
                <span style="color:var(--green);font-weight:600;font-size:12px">${ico("check", "sm")} Active (Same-Site)</span>
              </div>
            </div>
            <div class="resource">
              <div class="resource-head">
                <span>WebSocket Stream</span>
                <span style="color:var(--green);font-weight:600;font-size:12px">${ico("statusDot", "sm")} Connected</span>
              </div>
            </div>
          </div>

          <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end">
            <button type="button" class="btn ghost danger" id="profileLogoutBtn">
              ${ico("logout")} End Active Session
            </button>
          </div>
        </div>

      </div>

    </div>
  `;

  initProfileControllers();
}

function initProfileControllers() {
  const inpUsername = $("#profile_username_input");
  const inpEmail = $("#profile_email_input");
  const inpAvatarUrl = $("#profile_avatar_url_input");
  const inpCurrentPwd = $("#profile_current_password");
  const inpNewPwd = $("#profile_new_password");
  const inpConfirmPwd = $("#profile_confirm_password");
  const clearAvatarBtn = $("#clearAvatarBtn");
  const avatarThumbBox = $("#avatarThumbBox");
  const avatarStatusText = $("#avatarStatusText");
  const avatarUrlPreview = $("#avatarUrlPreview");
  const heroAvatar = $("#profileHeroAvatar");
  const saveBtn = $("#saveProfileBtn");

  // Sync avatar previews
  const updateAvatarPreview = (url) => {
    const trimmed = (url || "").trim();
    const username = inpUsername?.value?.trim() || state.user?.username || "U";
    const initial = username[0].toUpperCase();

    if (trimmed) {
      if (avatarThumbBox) {
        avatarThumbBox.innerHTML = `<img src="${esc(trimmed)}" alt="Avatar" style="width:100%;height:100%;object-fit:cover" onerror="this.outerHTML='<span class=\\'brand-mark\\' style=\\'width:48px;height:48px;font-size:18px\\'>${esc(initial)}</span>'">`;
      }
      if (heroAvatar) {
        heroAvatar.innerHTML = `<img src="${esc(trimmed)}" class="profile-avatar-large" alt="Avatar" onerror="this.outerHTML='<span class=\\'profile-avatar-large\\'>${esc(initial)}</span>'">`;
      }
      if (avatarStatusText) avatarStatusText.textContent = "Custom Avatar Set";
      if (avatarUrlPreview) avatarUrlPreview.textContent = trimmed;
      if (clearAvatarBtn) clearAvatarBtn.style.display = "inline-flex";
    } else {
      if (avatarThumbBox) {
        avatarThumbBox.innerHTML = `<span class="brand-mark" style="width:48px;height:48px;font-size:18px">${esc(initial)}</span>`;
      }
      if (heroAvatar) {
        heroAvatar.innerHTML = `<span>${esc(initial)}</span>`;
      }
      if (avatarStatusText) avatarStatusText.textContent = "Default Monogram Active";
      if (avatarUrlPreview) avatarUrlPreview.textContent = "Shows user initial monogram letter when empty.";
      if (clearAvatarBtn) clearAvatarBtn.style.display = "none";
    }
  };

  // URL Input listener
  if (inpAvatarUrl) {
    inpAvatarUrl.addEventListener("input", () => {
      updateAvatarPreview(inpAvatarUrl.value);
    });
  }

  // Clear avatar button
  if (clearAvatarBtn) {
    clearAvatarBtn.onclick = () => {
      if (inpAvatarUrl) inpAvatarUrl.value = "";
      updateAvatarPreview("");
      toast("Custom avatar cleared. Monogram restored.", "info");
    };
  }

  // Avatar mode tabs (URL vs Upload)
  $$("#avatarModeTabs .image-mode-btn").forEach(btn => {
    btn.onclick = () => {
      $$("#avatarModeTabs .image-mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const mode = btn.dataset.mode;
      const urlBox = $("#mode_avatar_url");
      const uploadBox = $("#mode_avatar_upload");
      if (urlBox) urlBox.style.display = mode === "url" ? "block" : "none";
      if (uploadBox) uploadBox.style.display = mode === "upload" ? "block" : "none";
    };
  });

  // Dropzone and file upload
  const dropzone = $("#dropzone_avatar");
  const fileInp = $("#file_avatar_input");

  const handleAvatarUpload = async (file) => {
    if (!file) return;
    if (!file.type.match(/^image\/(png|jpeg|jpg|webp|svg\+xml)$/i)) {
      return toast("Please upload a PNG, JPG, WEBP, or SVG image file.", "error");
    }
    if (file.size > 5 * 1024 * 1024) {
      return toast("Image size exceeds maximum limit of 5MB.", "error");
    }

    const origText = dropzone?.querySelector(".dropzone-text")?.textContent;
    if (dropzone) {
      dropzone.classList.add("uploading");
      const dt = dropzone.querySelector(".dropzone-text");
      if (dt) dt.innerHTML = `${ico("spinner", "spin sm")} Uploading avatar…`;
    }

    try {
      const reader = new FileReader();
      const base64Promise = new Promise((resolve, reject) => {
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
      });
      reader.readAsDataURL(file);
      const dataUrl = await base64Promise;

      const res = await api("/user/avatar/upload", {
        method: "POST",
        body: JSON.stringify({ data: dataUrl })
      });

      if (!res.url) throw new Error("Upload did not return image URL");

      if (inpAvatarUrl) inpAvatarUrl.value = res.url;
      updateAvatarPreview(res.url);

      // Update state and active DOM elements immediately
      state.user.avatar_url = res.url;
      updateDomAvatars(res.url);

      toast("Avatar uploaded and updated successfully!", "success");
    } catch (err) {
      toast(err.message || "Avatar upload failed.", "error");
    } finally {
      if (dropzone) {
        dropzone.classList.remove("uploading");
        const dt = dropzone.querySelector(".dropzone-text");
        if (dt && origText) dt.textContent = origText;
      }
    }
  };

  if (dropzone && fileInp) {
    dropzone.onclick = () => fileInp.click();
    fileInp.onchange = (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) handleAvatarUpload(file);
    };
    dropzone.ondragover = (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    };
    dropzone.ondragleave = () => dropzone.classList.remove("dragover");
    dropzone.ondrop = (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) handleAvatarUpload(file);
    };
  }

  // Password Generator
  const genBtn = $("#generateProfilePwdBtn");
  if (genBtn) {
    genBtn.onclick = () => {
      const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*+?";
      let pwd = "";
      const randArr = new Uint32Array(16);
      window.crypto.getRandomValues(randArr);
      for (let i = 0; i < 16; i++) {
        pwd += chars[randArr[i] % chars.length];
      }
      if (inpNewPwd) {
        inpNewPwd.value = pwd;
        inpNewPwd.type = "text";
      }
      if (inpConfirmPwd) {
        inpConfirmPwd.value = pwd;
        inpConfirmPwd.type = "text";
      }
      $$(".toggle-pwd-btn[data-target='profile_new_password'], .toggle-pwd-btn[data-target='profile_confirm_password']").forEach(b => {
        b.innerHTML = ico("eyeOff", "sm");
      });
      toast("Generated strong random password!", "info");
    };
  }

  // End Session button in Card 5
  const logoutBtn = $("#profileLogoutBtn");
  if (logoutBtn) {
    logoutBtn.onclick = logout;
  }

  // Helper to update topbar and sidebar avatars in real time
  function updateDomAvatars(avatarUrl) {
    const topbarAvatarBtn = $("#topbarAvatarBtn");
    if (topbarAvatarBtn) {
      topbarAvatarBtn.innerHTML = renderUserAvatar({ ...state.user, avatar_url: avatarUrl }, "avatar");
    }
    const sideAvatar = $(".sidebar .user-mini .avatar");
    if (sideAvatar) {
      sideAvatar.outerHTML = renderUserAvatar({ ...state.user, avatar_url: avatarUrl }, "avatar");
    }
    const sideUsername = $("#sidebarUsername");
    if (sideUsername && inpUsername?.value) {
      sideUsername.textContent = inpUsername.value.trim();
    }
  }

  // Save Profile Changes
  if (saveBtn) {
    saveBtn.onclick = async () => {
      const username = inpUsername?.value?.trim() || "";
      const email = inpEmail?.value?.trim() || "";
      const avatar_url = inpAvatarUrl?.value?.trim() || "";
      const current_password = inpCurrentPwd?.value || "";
      const new_password = inpNewPwd?.value || "";
      const confirm_password = inpConfirmPwd?.value || "";

      if (!username || username.length < 3 || username.length > 32) {
        return toast("Username must be between 3 and 32 characters.", "error");
      }
      if (!email || !email.includes("@")) {
        return toast("Please provide a valid email address.", "error");
      }

      // Password change validation
      if (new_password || confirm_password || current_password) {
        if (!current_password) {
          inpCurrentPwd?.focus();
          return toast("Please enter your Current Password to authorize a password change.", "error");
        }
        if (!new_password || new_password.length < 6) {
          inpNewPwd?.focus();
          return toast("New password must be at least 6 characters long.", "error");
        }
        if (new_password !== confirm_password) {
          inpConfirmPwd?.focus();
          return toast("New password and Confirm password do not match.", "error");
        }
      }

      saveBtn.disabled = true;
      const origHtml = saveBtn.innerHTML;
      saveBtn.innerHTML = `${ico("spinner", "spin sm")} Saving Changes…`;

      try {
        const payload = {
          username,
          email,
          avatar_url
        };
        if (new_password && current_password) {
          payload.current_password = current_password;
          payload.new_password = new_password;
        }

        const res = await api("/user/profile", {
          method: "PATCH",
          body: JSON.stringify(payload)
        });

        state.user = res.user;

        // Clear password fields
        if (inpCurrentPwd) inpCurrentPwd.value = "";
        if (inpNewPwd) {
          inpNewPwd.value = "";
          inpNewPwd.type = "password";
        }
        if (inpConfirmPwd) {
          inpConfirmPwd.value = "";
          inpConfirmPwd.type = "password";
        }
        $$(".toggle-pwd-btn").forEach(b => {
          b.innerHTML = ico("eye", "sm");
        });

        // Update DOM elements in sidebar, topbar, and hero
        updateDomAvatars(res.user.avatar_url);
        const heroU = $("#heroUsername");
        if (heroU) heroU.textContent = res.user.username;
        const heroE = $("#heroEmail");
        if (heroE) heroE.textContent = res.user.email || "No email registered";

        toast("Profile settings saved successfully!", "success");
      } catch (err) {
        toast(err.message, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = origHtml;
      }
    };
  }

  // --- DISCORD & 2FA CONTROLLER BINDINGS ---
  const oauthBtn = $("#profileConnectDiscordOAuthBtn");
  if (oauthBtn) {
    oauthBtn.onclick = async () => {
      try {
        oauthBtn.disabled = true;
        oauthBtn.innerHTML = `${ico("spinner", "spin sm")} Connecting…`;
        const res = await api("/auth/discord/connect");
        if (res.url) {
          window.location.href = res.url;
        } else {
          toast("Unable to generate Discord authorization link.", "error");
          oauthBtn.disabled = false;
          oauthBtn.innerHTML = `${ico("discord", "sm")} Connect Discord`;
        }
      } catch (err) {
        toast(err.message, "error");
        oauthBtn.disabled = false;
        oauthBtn.innerHTML = `${ico("discord", "sm")} Connect Discord`;
      }
    };
  }

  const codeBtn = $("#profileLinkWithCodeBtn");
  if (codeBtn) {
    codeBtn.onclick = () => openLinkCodeModal();
  }

  const unlinkBtn = $("#profileUnlinkDiscordBtn");
  if (unlinkBtn) {
    unlinkBtn.onclick = async () => {
      if (state.user?.two_factor_enabled) {
        return toast("Please disable Two-Factor Authentication first before unlinking Discord.", "warning");
      }
      const ok = await modalConfirm({
        title: "Unlink Discord Account",
        message: "Are you sure you want to disconnect your Discord account from this panel profile?",
        details: [
          "Discord bot notifications will no longer be delivered.",
          "Password recovery via Discord OTP will be disabled until re-linked."
        ],
        confirmText: "Unlink Discord",
        type: "warning",
        icon: "ban"
      });
      if (!ok) return;

      try {
        await api("/auth/discord/unlink", { method: "POST" });
        toast("Discord account unlinked successfully.", "success");
        await profilePage($("#main"));
      } catch (err) {
        toast(err.message, "error");
      }
    };
  }

  const enable2faBtn = $("#profileEnable2faBtn");
  if (enable2faBtn) {
    enable2faBtn.onclick = () => openEnable2faModal();
  }

  const regenBackupBtn = $("#profileRegenBackupBtn");
  if (regenBackupBtn) {
    regenBackupBtn.onclick = () => openRegenerateBackupCodesModal();
  }

  const disable2faBtn = $("#profileDisable2faBtn");
  if (disable2faBtn) {
    disable2faBtn.onclick = () => openDisable2faModal();
  }

  // Check URL query parameters for Discord callback results
  const urlParams = new URLSearchParams(window.location.search || window.location.hash.split("?")[1] || "");
  if (urlParams.get("discord_success") === "linked") {
    toast("Discord account linked successfully!", "success");
    history.replaceState(null, "", window.location.pathname + "#profile");
  } else if (urlParams.get("discord_error")) {
    const errCode = urlParams.get("discord_error");
    const msg = errCode === "already_linked"
      ? "This Discord account is already bound to another panel user."
      : decodeURIComponent(errCode);
    toast("Discord Link Failed: " + msg, "error");
    history.replaceState(null, "", window.location.pathname + "#profile");
  }
}

        </div>
      </div>

      <form id="enable2faForm">
        <div class="field">
          <label style="text-align:center;display:block">ENTER 6-DIGIT TEST CODE</label>
          <input type="text" id="enable2faCodeInput" maxlength="6" inputmode="numeric" placeholder="000000" style="text-align:center;font-size:24px;font-weight:700;letter-spacing:8px;font-family:monospace;padding:10px" required autofocus>
          <span class="small muted" style="display:block;text-align:center;margin-top:6px">Confirms that your Discord account can reliably receive OTP messages from our bot.</span>
        </div>

        <div style="display:flex;gap:10px;margin-top:16px">
          <button type="submit" class="btn primary" id="enable2faSubmitBtn" style="flex:1">${ico("shield")} Confirm & Activate 2FA</button>
          <button type="button" class="btn ghost" data-close>Cancel</button>
        </div>
      </form>
    </div>
  `);

  try {
    const startRes = await api("/auth/2fa/setup/start", { method: "POST" });
    const loadBox = $("#enable2faLoading");
    const contentBox = $("#enable2faContent");
    const tagEl = $("#enable2faDiscordTag");
    const simNotice = $("#enable2faSimulatedNotice");
    const simCode = $("#enable2faSimulatedCode");

    if (loadBox) loadBox.style.display = "none";
    if (contentBox) contentBox.style.display = "block";
    if (tagEl) tagEl.textContent = `${startRes.discordUsername ? '@' + startRes.discordUsername + ' ' : ''}(${startRes.maskedDiscord})`;

    const form = $("#enable2faForm");
    const codeInp = $("#enable2faCodeInput");
    const subBtn = $("#enable2faSubmitBtn");

    if (codeInp) {
      codeInp.focus();
      codeInp.oninput = () => {
        codeInp.value = codeInp.value.replace(/[^0-9]/g, "");
        if (codeInp.value.length === 6) form.requestSubmit();
      };
    }

    if (form) {
      form.onsubmit = async (e) => {
        e.preventDefault();
        const code = codeInp?.value?.trim();
        if (!code || code.length !== 6) return toast("Enter full 6-digit code.", "error");

        subBtn.disabled = true;
        subBtn.innerHTML = `${ico("spinner", "spin sm")} Activating…`;

        try {
          const confirmRes = await api("/auth/2fa/setup/confirm", {
            method: "POST",
            body: JSON.stringify({
              challengeToken: startRes.challengeToken,
              code
            })
          });

          toast(confirmRes.message || "2FA activated!", "success");
          state.user = { ...(state.user || {}), two_factor_enabled: true };
          showBackupCodesModal(confirmRes.backupCodes, true);
        } catch (err) {
          toast(err.message, "error");
          subBtn.disabled = false;
          subBtn.innerHTML = `${ico("shield")} Confirm & Activate 2FA`;
          if (codeInp) {
            codeInp.value = "";
            codeInp.focus();
          }
        }
      };
    }
  } catch (err) {
    closeModal();
    toast(err.message, "error");
  }
}

// Modal: Display 10 Backup Recovery Codes with Copy & Download
function showBackupCodesModal(codes = [], isInitial = false) {
  showModal(`
    <div class="modal-head">
      <h3>${ico("key")} Backup Recovery Codes</h3>
      <button class="close" data-close>×</button>
    </div>
    <div>
      <div style="background:rgba(234,179,8,0.08);border:1px solid rgba(234,179,8,0.25);border-radius:10px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px">
        <span style="color:var(--yellow);margin-top:2px">${ico("alert", "sm")}</span>
        <div class="small" style="line-height:1.5">
          ${isInitial 
            ? '<b>Two-Factor Authentication is now active!</b> Save these 10 emergency backup recovery codes in a safe place (such as a password manager).' 
            : '<b>New backup codes generated!</b> All previous backup recovery codes are now invalidated.'}
          <div style="color:rgba(255,255,255,0.7);margin-top:4px">Each code is <b>single-use</b> and allows you to sign in if you temporarily lose access to your Discord account.</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px">
        ${codes.map((c, i) => `
          <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:6px;padding:8px 10px;font-family:monospace;font-size:13.5px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between">
            <span style="color:var(--muted);font-size:11px">${i+1}.</span>
            <span style="color:#fff">${esc(c)}</span>
          </div>
        `).join("")}
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button type="button" class="btn small primary" id="copyBackupCodesBtn" style="flex:1">
          ${ico("copy", "sm")} Copy All Codes
        </button>
        <button type="button" class="btn small ghost" id="downloadBackupCodesBtn" style="flex:1">
          ${ico("upload", "sm")} Download (.txt)
        </button>
        <button type="button" class="btn small" data-close id="doneBackupCodesBtn">
          Done
        </button>
      </div>
    </div>
  `);

  const rawText = codes.join("\n");

  const copyBtn = $("#copyBackupCodesBtn");
  if (copyBtn) {
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(rawText);
      toast("All 10 backup codes copied to clipboard!", "success");
      copyBtn.innerHTML = `${ico("check", "sm")} Copied!`;
      setTimeout(() => {
        if (copyBtn) copyBtn.innerHTML = `${ico("copy", "sm")} Copy All Codes`;
      }, 2000);
    };
  }

  const dlBtn = $("#downloadBackupCodesBtn");
  if (dlBtn) {
    dlBtn.onclick = () => {
      const blob = new Blob([`ALPM PANEL - 2FA BACKUP RECOVERY CODES\nGenerated: ${new Date().toISOString()}\nAccount: ${state.user?.username || 'User'}\n\nEach code can only be used ONCE.\n\n` + rawText + "\n\nStore these in a secure password manager.\n"], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `alpm-2fa-backup-codes-${state.user?.username || 'user'}.txt`;
      a.click();
      toast("Downloaded backup codes file.", "success");
    };
  }

  const doneBtn = $("#doneBackupCodesBtn");
  if (doneBtn) {
    doneBtn.onclick = async () => {
      closeModal();
      await profilePage($("#main"));
    };
  }
}

            </ul>
