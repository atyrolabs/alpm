    const net = d.network || [], vms = d.vms || [], summary = d.vmSummary || {}, storage = d.storage || [];
    const isOnline = cluster.status === "online" || !st || st.status === "online";
    const hostCpuPct = st && st.cpu != null ? (st.cpu * 100).toFixed(1) : null;
    const cpuSockets = st?.cpuinfo?.sockets || 1;
    const cpuCores = st?.cpuinfo?.cpus || st?.cpuinfo?.cores || summary.allocatedCpu || 1;
    const loadAvg = st?.loadavg ? st.loadavg.join(", ") : "—";
    const memTotal = st?.memory?.total || summary.allocatedMem || 0;
    const memUsed = st?.memory?.used || 0;
    const memFree = st?.memory?.free || Math.max(0, memTotal - memUsed);
    const memPct = memTotal > 0 && st?.memory?.used ? ((memUsed / memTotal) * 100).toFixed(1) : null;
    const swapTotal = st?.swap?.total || 0;
    const swapUsed = st?.swap?.used || 0;
    const diskTotal = st?.rootfs?.total || summary.allocatedDisk || 0;
    const diskUsed = st?.rootfs?.used || 0;
    const diskFree = st?.rootfs?.free || Math.max(0, diskTotal - diskUsed);
    const diskPct = diskTotal > 0 && st?.rootfs?.used ? ((diskUsed / diskTotal) * 100).toFixed(1) : null;
    const activeNics = net.filter(x => x.active).length;

    c.innerHTML = `<div style="margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><button class="btn ghost small" data-action="back-nodes">${ico("arrowLeft")} Back to Proxmox nodes</button><div class="actions"><button class="btn ghost" data-action="node-refresh">${ico("refresh")} Refresh</button><button class="btn" data-action="test-node" data-id="${id}">Test API</button><button class="btn" data-action="edit-node" data-id="${id}">Edit Node</button></div></div><div class="vps-head"><div class="vps-title-wrap"><div class="vps-title"><h1>${esc(node.name)}</h1><span class="badge ${isOnline ? 'running' : 'stopped'}">${ico("statusDot", "sm")} ${isOnline ? 'Online' : 'Offline'}</span></div><div class="vps-badges"><span class="badge">PVE Node: <b>${esc(pveNode)}</b></span><span class="badge">Proxmox VE ${esc(ver.version || '9.x')} (rel ${esc(ver.release || '9.x')})</span><span class="badge">Host: ${esc(node.host)}:${node.port}</span><span class="badge">Hosted VMs: <b>${vms.length}</b></span>${st?.uptime ? `<span class="badge">${ico("clock", "sm")} Uptime: ${formatUptime(st.uptime)}</span>` : ''}</div></div></div><div class="metric-grid"><div class="metric-card"><div class="metric-top"><span>CPU UTILIZATION</span><span style="color:var(--accent)">${hostCpuPct != null ? hostCpuPct + '%' : summary.allocatedCpu + ' vCPUs'}</span></div><div class="metric-val">${hostCpuPct != null ? hostCpuPct + '%' : summary.allocatedCpu + ' Cores'}</div><div class="metric-sub">${st?.cpuinfo ? `${cpuCores} Cores · ${cpuSockets} Sockets` : `${summary.allocatedCpu} vCPUs provisioned`}</div><div class="progress"><div class="progress-bar" style="width:${hostCpuPct != null ? Math.min(100, Math.max(2, hostCpuPct)) : 100}%"></div></div><div class="small muted" style="margin-top:8px">Load avg: <b>${loadAvg}</b></div></div><div class="metric-card"><div class="metric-top"><span>HOST MEMORY (RAM)</span><span>${memPct != null ? memPct + '%' : formatBytes(summary.allocatedMem)}</span></div><div class="metric-val">${memPct != null ? formatBytes(memUsed) : formatBytes(summary.allocatedMem)}</div><div class="metric-sub">${memPct != null ? `of ${formatBytes(memTotal)} (${formatBytes(memFree)} free)` : `Allocated across ${summary.total} VMs`}</div><div class="progress"><div class="progress-bar green" style="width:${memPct != null ? Math.min(100, Math.max(2, memPct)) : 100}%"></div></div><div class="small muted" style="margin-top:8px">${swapTotal > 0 ? `Swap: ${formatBytes(swapUsed)} / ${formatBytes(swapTotal)}` : `RAM allocation: ${formatBytes(summary.allocatedMem)}`}</div></div><div class="metric-card"><div class="metric-top"><span>STORAGE / ROOT DISK</span><span>${diskPct != null ? diskPct + '%' : formatBytes(summary.allocatedDisk)}</span></div><div class="metric-val">${diskPct != null ? formatBytes(diskUsed) : formatBytes(summary.allocatedDisk)}</div><div class="metric-sub">${diskPct != null ? `of ${formatBytes(diskTotal)} (${formatBytes(diskFree)} free)` : `Total virtual disk allocated`}</div><div class="progress"><div class="progress-bar blue" style="width:${diskPct != null ? Math.min(100, Math.max(2, diskPct)) : 100}%"></div></div><div class="small muted" style="margin-top:8px">${st?.rootfs ? `Root filesystem: ${formatBytes(diskTotal)}` : `Provisioned disks: ${formatBytes(summary.allocatedDisk)}`}</div></div><div class="metric-card"><div class="metric-top"><span>HOSTED VIRTUAL MACHINES</span><span style="color:var(--green)">${summary.running} Running</span></div><div class="metric-val">${summary.total} VMs / LXC</div><div class="metric-sub"><span style="color:var(--green)">${ico("statusDot", "sm")} ${summary.running} running</span> &nbsp; <span style="color:var(--red)">${ico("statusDot", "sm")} ${summary.stopped} stopped</span></div><div class="progress"><div class="progress-bar purple" style="width:${summary.total > 0 ? Math.round((summary.running / summary.total) * 100) : 0}%"></div></div><div class="small muted" style="margin-top:8px">Active Interfaces: <b>${activeNics} of ${net.length} NICs</b></div></div></div>${d.statusSysAuditRequired ? `<div class="notice" style="margin-bottom:20px;border-color:rgba(234,179,8,0.2);background:rgba(234,179,8,0.05);color:#fbbf24;border-radius:12px;padding:16px"><div style="font-weight:700;font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:7px"><span>${ico("lightbulb", "sm", "color:var(--yellow)")}</span> Proxmox Host Hardware Sensor Metrics (Host CPU %, Memory Gauge, Kernel)</div><div style="line-height:1.6">Node information, Proxmox version, Network adapters (${net.length} NICs), and all ${vms.length} hosted VMs with vCPU/RAM/Disk metrics are successfully loaded.<br>To also stream real-time host-level physical CPU/Memory hardware sensors, add <b>Sys.Audit</b> or <b>PVEAuditor</b> permission to this API token in Proxmox VE:<br><b>Datacenter -> Permissions -> Add -> API Token Permission</b> (Path: <code>/</code>, Token: <code>${esc(node.token_id)}</code>, Role: <code>Sys.Audit</code> or <code>PVEAuditor</code>).</div></div>` : ''}<div class="tab-nav"><button class="tab-btn ${state.nodeTab === 'overview' ? 'active' : ''}" data-action="node-tab" data-tab="overview">${ico("monitor")} System & Hardware Specs</button><button class="tab-btn ${state.nodeTab === 'vms' ? 'active' : ''}" data-action="node-tab" data-tab="vms">${ico("box")} Hosted Virtual Machines (${vms.length})</button><button class="tab-btn ${state.nodeTab === 'network' ? 'active' : ''}" data-action="node-tab" data-tab="network">${ico("network")} Network Interfaces (${net.length})</button><button class="tab-btn ${state.nodeTab === 'storage' ? 'active' : ''}" data-action="node-tab" data-tab="storage">${ico("backup")} Storage Pools (${storage.length})</button></div><div id="nodeTabContent">${renderNodeTabContent(d)}</div>`;
  } catch (err) {
    c.innerHTML = `<div class="panel"><div class="empty">Error loading Proxmox node details: ${esc(err.message)} <br><br><button class="btn" data-action="back-nodes">${ico("arrowLeft")} Back to nodes</button></div></div>`;
    toast(err.message, "error");
  }
}

  }
  if (state.nodeTab === "storage") {
    return `<div class="panel"><div class="panel-title"><div><h3>Proxmox Storage Pools</h3><p class="muted small" style="margin:4px 0 0">Storage configuration for node ${esc(pveNode)}</p></div></div>${storage.length > 0 ? `<div class="table-wrap"><table><thead><tr><th>STORAGE</th><th>TYPE</th><th>CONTENT</th><th>TOTAL</th><th>USED</th><th>FREE</th><th>STATUS</th></tr></thead><tbody>${storage.map(s => `<tr><td><b>${esc(s.storage || s.id)}</b></td><td><span class="tag">${esc(s.type || "dir")}</span></td><td>${esc(s.content || "images, rootdir")}</td><td>${formatBytes(s.total)}</td><td>${formatBytes(s.used)}</td><td>${formatBytes(s.avail)}</td><td>${s.active ? '<span style="color:var(--green)">Active</span>' : 'Inactive'}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Storage pool details require <code>Datastore.Audit</code> or <code>Sys.Audit</code> permission in Proxmox VE.<br><span class="muted small">Virtual disk allocation of ${formatBytes(summary.allocatedDisk)} across all VMs is verified in the VM Breakdown tab.</span></div>`}</div>`;
  }
  return `<div class="spec-cards"><div class="spec-box"><h4>${ico("cpu")} Host System & Architecture</h4><div class="spec-row"><span class="k">Proxmox VE Manager</span><span class="v">${esc(ver.version || "9.2.2")}</span></div><div class="spec-row"><span class="k">Proxmox Release</span><span class="v">${esc(ver.release || "9.2")}</span></div><div class="spec-row"><span class="k">Proxmox Repository ID</span><span class="v" style="font-family:'Space Grotesk',monospace;font-size:11px">${esc(ver.repoid || "—")}</span></div><div class="spec-row"><span class="k">PVE Node Name</span><span class="v"><b>${esc(pveNode)}</b></span></div><div class="spec-row"><span class="k">Linux Kernel Version</span><span class="v">${esc(st?.kversion || "Linux 6.8+ (Proxmox VE kernel)")}</span></div><div class="spec-row"><span class="k">CGroup Engine</span><span class="v">${cluster["cgroup-mode"] ? `cgroup-mode ${cluster["cgroup-mode"]} (unified)` : "cgroup-mode 2 (systemd)"}</span></div><div class="spec-row"><span class="k">CPU Cores (Total Allocated)</span><span class="v">${summary.allocatedCpu} vCPUs across ${summary.total} VMs</span></div><div class="spec-row"><span class="k">Total Memory Provisioned</span><span class="v">${formatBytes(summary.allocatedMem)}</span></div><div class="spec-row"><span class="k">Total Disk Provisioned</span><span class="v">${formatBytes(summary.allocatedDisk)}</span></div><div class="spec-row"><span class="k">Node Uptime</span><span class="v">${st?.uptime ? formatUptime(st.uptime) : "Host Online"}</span></div></div><div class="spec-box"><h4>${ico("lock")} Connection & Security</h4><div class="spec-row"><span class="k">Panel Node Name</span><span class="v">${esc(node.name)}</span></div><div class="spec-row"><span class="k">Proxmox Host Address</span><span class="v">${esc(node.host)}</span></div><div class="spec-row"><span class="k">API Port</span><span class="v">${node.port || 8006}</span></div><div class="spec-row"><span class="k">API Token ID</span><span class="v" style="font-family:'Space Grotesk',monospace">${esc(node.token_id)}</span></div><div class="spec-row"><span class="k">SSL Fingerprint</span><span class="v" style="font-size:10px;font-family:'Space Grotesk',monospace;max-width:200px;word-break:break-all">${esc(cluster.ssl_fingerprint || "Verified via Proxmox cluster")}</span></div><div class="spec-row"><span class="k">TLS Verification</span><span class="v">${node.tls_verify ? '<span style="color:var(--green)">Enabled (Strict)</span>' : '<span style="color:var(--yellow)">Disabled (Self-signed)</span>'}</span></div><div class="spec-row"><span class="k">Panel Node Status</span><span class="v">${node.enabled ? '<span style="color:var(--green)">Enabled</span>' : '<span style="color:var(--red)">Disabled</span>'}</span></div><div class="spec-row"><span class="k">Total Network Adapters</span><span class="v">${net.length} NICs detected</span></div><div class="spec-row"><span class="k">Added to Panel</span><span class="v">${esc(node.created_at)}</span></div></div></div>`;
}

function nodeModal() {
  showModal(`<div class="modal-head"><h3>Connect Proxmox node</h3><button class="close" data-close>×</button></div><form id="createNode"><div class="field"><label>Display name</label><input name="name" placeholder="pve-01" required></div><div class="form-grid"><div class="field"><label>Hostname / IP</label><input name="host" placeholder="pve.example.com" required></div><div class="field"><label>API port</label><input name="port" type="number" value="8006" required></div></div><div class="field"><label>API token ID</label><input name="tokenId" placeholder="panel@pve!atyro" required></div><div class="field"><label>API token secret</label><input name="tokenSecret" type="password" required placeholder="Enter API token secret"></div><div class="field"><label>TLS certificate verification</label><select name="tlsVerify"><option value="true">Verify certificate (recommended)</option><option value="false">Skip verification (testing only)</option></select></div><button class="btn primary" style="width:100%;margin-top:10px">Test and save node</button></form><div class="notice">${ico("lightbulb", "sm", "color:var(--yellow)")} Create a dedicated Proxmox API token with required permissions (PVEVMAdmin). In Proxmox, uncheck 'Privilege Separation' or grant ACL permissions under Datacenter -> Permissions.</div>`);
  $("#createNode").onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    d.tlsVerify = d.tlsVerify === "true";
    try {
      const r = await api("/admin/nodes", { method: "POST", body: JSON.stringify(d) });
      $("#modalRoot").innerHTML = "";
      toast(r.message, r.warning ? "warning" : "success");
      await renderPage();
    } catch (err) { toast(err.message, "error"); }
  };
}

function editNodeModal(id) {
  const n = (window._atyroNodes || []).find(x => x.id === id);
  if (!n) return toast("Node not found.", "error");
  showModal(`<div class="modal-head"><h3>Edit Proxmox node</h3><button class="close" data-close>×</button></div><form id="editNode"><div class="field"><label>Display name</label><input name="name" value="${esc(n.name)}" required></div><div class="form-grid"><div class="field"><label>Hostname / IP</label><input name="host" value="${esc(n.host)}" required></div><div class="field"><label>API port</label><input name="port" type="number" value="${n.port || 8006}" required></div></div><div class="field"><label>API token ID</label><input name="tokenId" value="${esc(n.token_id)}" required></div><div class="field"><label>API token secret <span class="muted small">(leave blank to keep current secret)</span></label><input name="tokenSecret" type="password" placeholder="********************"></div><div class="form-grid"><div class="field"><label>TLS certificate verification</label><select name="tlsVerify"><option value="true" ${n.tls_verify ? "selected" : ""}>Verify certificate (recommended)</option><option value="false" ${!n.tls_verify ? "selected" : ""}>Skip verification (testing only)</option></select></div><div class="field"><label>Status</label><select name="enabled"><option value="true" ${n.enabled ? "selected" : ""}>Enabled</option><option value="false" ${!n.enabled ? "selected" : ""}>Disabled</option></select></div></div><button class="btn primary" style="width:100%;margin-top:10px">Verify and save changes</button></form>`);
  $("#editNode").onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    d.port = Number(d.port);
    d.tlsVerify = d.tlsVerify === "true";
    d.enabled = d.enabled === "true";
    if (!d.tokenSecret || !d.tokenSecret.trim()) { delete d.tokenSecret; }
    try {
      const r = await api(`/admin/nodes/${id}`, { method: "PATCH", body: JSON.stringify(d) });
      $("#modalRoot").innerHTML = "";
      toast(r.message || "Node updated successfully.", r.warning ? "warning" : "success");
      await renderPage();
    } catch (err) { toast(err.message, "error"); }
  };
}

async function deleteNode(id) {
  const n = (window._atyroNodes || []).find(x => x.id === id);
  const name = n ? n.name : `#${id}`;
  const ok = await modalConfirm({
    title: "Delete Proxmox Node",
    subtitle: `Node: ${name}`,
    message: `Are you sure you want to disconnect and delete Proxmox node "${name}" from this panel?`,
    details: [
      "The connection settings and API tokens will be removed from this panel.",
      "The Proxmox VE hypervisor itself and its running VMs will not be affected."
    ],
    confirmText: "Delete Node",
    type: "danger",
    icon: "trash"
  });
  if (!ok) return;
  try {
    const r = await api(`/admin/nodes/${id}`, { method: "DELETE", body: "{}" });
    toast(r.message || "Node deleted successfully.");
    await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function testNode(id) {
  try {
    const d = await api(`/admin/nodes/${id}/test`, { method: "POST", body: "{}" });
    if (d.warning) {
      toast(`Connected · Proxmox ${d.version?.version || "API OK"} — ${d.warning}`, "warning");
    } else {
      toast(`Connected · Proxmox ${d.version?.version || "API OK"}`);
    }
  } catch (e) { toast(e.message, "error"); }
}

async function toggleNode(id, enabled) {
  try {
    await api(`/admin/nodes/${id}`, { method: "PATCH", body: JSON.stringify({ enabled: !enabled }) });
    toast("Node updated.");
    await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function createVpsPage(c, targetNodeId) {
  if (state.user.role !== "admin") {
    c.innerHTML = '<div class="panel"><div class="empty">Access restricted: Administrator role required to deploy virtual servers.</div></div>';
    return;
  }
  c.innerHTML = '<div class="empty">Loading Proxmox templates, ISOs, and node resources…</div>';
  try {
    const nodeParam = targetNodeId || state.createVpsState.nodeId || "";
    const url = "/admin/servers/create/options" + (nodeParam ? `?nodeId=${nodeParam}` : "");
    const d = await api(url);
    state.createVpsState.cachedData = d;
    if (d.node) state.createVpsState.nodeId = d.node.id;
    if (!d.nodes || !d.nodes.length) {
      c.innerHTML = '<div class="panel"><div class="empty">No enabled Proxmox nodes found. Please add or enable a Proxmox node first.<br><br><button class="btn primary" data-page="nodes">Manage Proxmox nodes</button></div></div>';
      return;
    }
    renderCreateVpsForm(c, d);
  } catch (err) {
    c.innerHTML = `<div class="panel"><div class="empty">Error loading deployment options: ${esc(err.message)}<br><br><button class="btn ghost" data-action="create-vps">${ico("refresh")} Try again</button></div></div>`;
    toast(err.message, "error");
  }
}

function renderCreateVpsForm(c, d) {
  const isQemu = state.createVpsState.type === "qemu";
  const isLxc = state.createVpsState.type === "lxc";
  const isTemplate = state.createVpsState.source === "template";
  const isIso = isQemu && state.createVpsState.source === "iso";
  let templateOptionsHtml = "";
  if (isQemu) {
    if (d.qemuTemplates && d.qemuTemplates.length) {
      templateOptionsHtml = d.qemuTemplates.map((t, idx) => `<option value="${esc(t.vmid)}" ${idx === 0 ? "selected" : ""}>${esc(t.name)} (VMID ${t.vmid}) · QEMU Cloud-Init</option>`).join("");
    } else {
      templateOptionsHtml = '<option value="1003">Ubuntu-24.04 (VMID 1003)</option><option value="4001">Debian-12 (VMID 4001)</option>';
    }
  } else {
    if (d.lxcTemplates && d.lxcTemplates.length) {
      templateOptionsHtml = d.lxcTemplates.map((t, idx) => {
        const val = t.template || t.id || t.package;
        const label = t.name || t.headline || t.package || val;
        return `<option value="${esc(val)}" ${idx === 0 ? "selected" : ""}>${esc(label)}</option>`;
      }).join("");
    } else {
      templateOptionsHtml = '<option value="ubuntu-24.04-standard_24.04-2_amd64.tar.zst">Ubuntu 24.04 LTS (standard)</option><option value="debian-12-standard_12.7-1_amd64.tar.zst">Debian 12 Bookworm (standard)</option>';
    }
  }
  let isoOptionsHtml = "";
  if (d.isos && d.isos.length) {
    isoOptionsHtml = d.isos.map((iso, idx) => {
      const volid = typeof iso === "object" ? iso.volid : iso;
      const name = typeof iso === "object" ? (iso.name || iso.volid) : iso;
      const sizeStr = typeof iso === "object" && iso.size ? ` (${formatBytes(iso.size)})` : "";

are virtualization with dedicated kernel, complete Cloud-Init configuration, or bootable ISO installer.</p></div><div id="selectTypeLxc" style="cursor:pointer;padding:18px;border-radius:12px;border:2px solid ${isLxc ? 'var(--accent)' : 'var(--line)'};background:${isLxc ? 'rgba(99,102,241,0.08)' : 'var(--panel2)'};transition:all .2s;box-shadow:${isLxc ? '0 0 16px rgba(99,102,241,0.15)' : 'none'}"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="color:var(--accent);display:inline-flex">${ico("lxc", "lg")}</span><div><b style="font-size:15px;color:white">LXC Linux Container</b> <span class="tag" style="margin-left:8px;background:rgba(99,102,241,0.1);color:var(--accent);border-color:rgba(99,102,241,0.2)">Container</span></div></div><p class="muted small" style="margin:0;line-height:1.4">Lightweight Linux container. Shared host kernel, near-zero overhead, instant boot, and standard OS appliances.</p></div></div>${isQemu ? `<div style="margin-bottom:16px"><label style="display:block;font-size:12px;color:#aaa;margin-bottom:8px">Provisioning Source:</label><div style="display:flex;gap:10px"><button type="button" id="btnSourceTemplate" class="btn ${isTemplate ? 'primary' : 'ghost'}" style="flex:1;padding:11px;font-size:13px">${ico("box", "sm")} OS Template (Cloud-Init Clone)</button><button type="button" id="btnSourceIso" class="btn ${isIso ? 'primary' : 'ghost'}" style="flex:1;padding:11px;font-size:13px">${ico("disc", "sm")} Bootable ISO Installer</button></div></div>` : ''}${(isTemplate || isLxc) ? `<div class="field" id="templateField"><label>Operating System / Template (${isQemu ? 'QEMU Cloud-Init Templates' : 'LXC Appliance Templates'})</label><select name="templateId" id="createTemplateSelect" required>${templateOptionsHtml}</select><span class="small muted" style="margin-top:3px">${isQemu ? 'Cloud-Init will inject user credentials, hostname, network IP, DNS and SSH keys on first boot.' : 'Preconfigured Linux distribution container "width:auto;cursor:pointer"><label for="unprivilegedCheck" style="font-size:12px;color:#ddd;cursor:pointer"><b>Unprivileged container</b> (Recommended for security)</label></div><div style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="nesting" id="nestingCheck" checked style="width:auto;cursor:pointer"><label for="nestingCheck" style="font-size:12px;color:#ddd;cursor:pointer"><b>Enable Nesting</b> (Allows Docker / Systemd inside LXC)</label></div></div>` : ''}</div><div class="panel"><div class="panel-title"><h3>3. Hardware Sizing & Storage Configuration</h3></div><div class="form-grid"><div class="field"><label style="display:flex;justify-content:space-between"><span>vCPU Cores</span><span style="display:flex;gap:4px"><span class="preset-chip quick-core" data-val="1">1C</span><span class="preset-chip quick-core" data-val="2">2C</span><span class="preset-chip quick-core" data-val="4">4C</span><span class="preset-chip quick-core" data-val="8">8C</span></span></label><input name="cores" id="createCoresInput" type="number" min="1" max="64" value="2" required></div><div class="field"><label style="display:flex;justify-content:space-between"><span>Memory (RAM in MB)</span><span style="display:flex;gap:4px"><span class="preset-chip quick-ram" data-val="1024">1GB</span><span class="preset-chip quick-ram" data-val="2048">2GB</span><span class="preset-chip quick-ram" data-val="4096">4GB</span><span class="preset-chip quick-ram" data-val="8192">8GB</span></span></label><input name="memory" id="createMemoryInput" type="number" min="256" step="128" value="2048" required></div></div><div class="form-grid"><div class="field"><label style="display:flex;justify-content:space-between"><span>Disk Size (GB)</span><span style="display:flex;gap:4px"><span class="preset-chip quick-disk" data-val="20">20G</span><span class="preset-chip quick-disk" data-val="30">30G</span><span class="preset-chip quick-disk" data-val="50">50G</span><span class="preset-chip quick-disk" data-val="100">100G</span></span></label><input name="disk" id="createDiskInput" type="number" min="5" max="2000" value="25" required></div><div class="field"><label>Target Storage Pool</label><select name="storage" required>${storagesHtml}</select></div></div>${isLxc ? `<div class="form-grid"><div class="field"><label style="display:flex;justify-content:space-between"><span>Swap Memory (MB)</span><span style="display:flex;gap:4px"><span class="preset-chip quick-swap" data-val="0">0MB</span><span class="preset-chip quick-swap" data-val="512">512M</span><span class="preset-chip quick-swap" data-val="1024">1G</span><span class="preset-chip quick-swap" data-val="2048">2G</span></span></label><input name="swap" id="createSwapInput" type="number" min="0" step="128" value="512"></div><div class="field"><label>CPU Sockets</label><input name="sockets" type="number" min="1" max="4" value="1"></div></div>` : ''}${isQemu ? `<div class="field"><label>CPU Sockets</label><input name="sockets" type="number" min="1" max="4" value="1"></div>` : ''}</div><div class="panel"><div class="panel-title"><div><h3>4. ${isQemu && isTemplate ? `${ico('cloud', 'sm')} Cloud-Init Network & IP Configuration` : `${ico('network', 'sm')} Network Interface & IP Configuration (net0)`}</h3><p class="muted small" style="margin:4px 0 0">${isQemu && isTemplate ? 'Proxmox VE Cloud-Init configures IP addresses and gateways directly into the guest OS.' : 'Configure virtual network adapter, IP addresses, VLAN, and firewall.'}</p></div></div><div class="form-grid"><div class="field"><label>Network Bridge (Virtual Switch)</label><select name="bridge" required>${bridgesHtml}</select></div><div class="field"><label>Interface Name</label><input value="${isLxc ? 'eth0' : 'net0 (virtio)'}" disabled style="opacity:.7"></div></div><div style="margin:14px 0 8px"><label style="display:block;font-size:12px;color:#aaa;margin-bottom:8px">IPv4 Address Assignment:</label><div style="display:flex;gap:10px"><button type="button" id="btnIp4Dhcp" class="btn ${state.createVpsState.ip4Type === 'dhcp' ? 'primary' : 'ghost'}" style="flex:1;padding:9px;font-size:12px">${ico("statusDot", "sm")} DHCP (Automatic)</button><button type="button" id="btnIp4Static" class="btn ${state.createVpsState.ip4Type === 'static' ? 'primary' : 'ghost'}" style="flex:1;padding:9px;font-size:12px">${ico("statusDot", "sm")} Static IPv4 (CIDR / Gateway)</button></div></div><div id="ip4StaticFields" class="${state.createVpsState.ip4Type === 'static' ? '' : 'hidden'} form-grid" style="margin-top:10px;background:var(--bg);padding:14px;border-radius:10px;border:1px solid var(--line)"><div class="field"><label>IPv4 Address / CIDR (e.g. <code>192.168.1.150/24</code>)</label><input name="ip4Address" id="ip4AddressInput" placeholder="192.168.1.150/24"></div><div class="field"><label>IPv4 Gateway (e.g. <code>192.168.1.1</code>)</label><input name="ip4Gateway" id="ip4GatewayInput" placeholder="192.168.1.1"></div></div><div style="margin:16px 0 8px"><div class="field"><label>IPv6 Address Assignment</label><select name="ip6Type" id="createIp6Select"><option value="disabled" ${state.createVpsState.ip6Type === 'disabled' ? 'selected' : ''}>Disabled / None (Standard IPv4 only)</option><option value="auto" ${state.createVpsState.ip6Type === 'auto' ? 'selected' : ''}>SLAAC / Auto-Configuration (ip6=auto)</option><option value="dhcp" ${state.createVpsState.ip6Type === 'dhcp' ? 'selected' : ''}>DHCPv6 (ip6=dhcp)</option><option value="static" ${state.createVpsState.ip6Type === 'static' ? 'selected' : ''}>Static IPv6 (ip6=static)</option></select></div></div><div id="ip6StaticFields" class="${state.createVpsState.ip6Type === 'static' ? '' : 'hidden'} form-grid" style="margin-top:10px;background:var(--bg);padding:14px;border-radius:10px;border:1px solid var(--line)"><div class="field"><label>IPv6 Address / CIDR (e.g. <code>2001:db8::10/64</code>)</label><input name="ip6Address" id="ip6AddressInput" placeholder="2001:db8::10/64"></div><div class="field"><label>IPv6 Gateway (e.g. <code>2001:db8::1</code>)</label><input name="ip6Gateway" id="ip6GatewayInput" placeholder="2001:db8::1"></div></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>VLAN Tag <span class="muted small">(optional)</span></label><input name="vlan" type="number" min="1" max="4094" placeholder="None / untagged"></div><div class="field"><label>MAC Address <span class="muted small">(optional, leave blank for auto)</span></label><input name="mac" placeholder="e.g. BC:24:11:xx:xx:xx"></div></div><div style="margin:8px 0 4px;display:flex;align-items:center;gap:8px"><input type="checkbox" name="firewall" id="netFirewallCheck" checked style="width:auto;cursor:pointer"><label for="netFirewallCheck" style="font-size:12px;color:#ddd;cursor:pointer">Enable Proxmox VE Firewall on network adapter</label></div></div><div class="panel"><div class="panel-title"><div><h3>5. DNS Configuration</h3><p class="muted small" style="margin:4px 0 0">Configure DNS resolvers and search domain (leave blank to inherit from node host / DHCP).</p></div></div><div class="form-grid"><div class="field"><label>DNS Search Domain <span class="muted small">(optional)</span></label><input name="searchDomain" placeholder="e.g. myvps.lan or company.local"></div><div class="field"><label>DNS Nameservers <span class="muted small">(optional, space-separated)</span></label><input name="nameServers" placeholder="e.g. 1.1.1.1 8.8.8.8"></div></div></div>${(isTemplate || isLxc) ? `<div class="panel"><div class="panel-title"><div><h3>6. ${isQemu ? `${ico('cloud', 'sm')} Cloud-Init User Credentials & Access` : `${ico('lock', 'sm')} Container Root Credentials & Access`}</h3><p class="muted small" style="margin:4px 0 0">${isQemu ? 'Injected into the virtual machine by Proxmox Cloud-Init on first boot.' : 'Root user credentials and SSH authentication for the container.'}</p></div></div><div class="form-grid">${isQemu ? `<div class="field"><label>Cloud-Init User (Username)</label><input name="ciUser" value="root" required placeholder="root or ubuntu"><span class="small muted">Default user configured in Cloud-Init.</span></div>` : ''}<div class="field" style="${isLxc ? 'grid-column:span 2' : ''}"><label style="display:flex;justify-content:space-between"><span>Root / User Password (min 8 characters)</span><a href="javascript:void(0)" id="createGenPassBtn" style="color:var(--accent);font-size:11px;font-weight:600">${ico("dice", "sm")} Generate Strong Password</a></label><div style="position:relative"><input name="password" id="createPassInput" type="password" minlength="8" required placeholder="Set strong root password" style="padding-right:45px"><button type="button" id="createTogglePassBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;color:#888;padding:4px 8px;font-size:13px">${ico("eye")}</button></div></div></div><div class="field"><label>SSH Public Key(s) (optional, for passwordless root SSH)</label><textarea name="sshKey" rows="3" placeholder="ssh-ed25519 AAAAC3... or ssh-rsa AAAAB3..." style="background:#0d0d0d;border:1px solid #303030;border-radius:8px;padding:9px;color:white;width:100%;font-size:11px;font-family:'Space Grotesk',monospace;resize:vertical"></textarea></div></div>` : ''}<div class="panel"><div class="panel-title"><h3>7. Deployment Options & Execution</h3></div><div style="display:flex;flex-direction:column;gap:10px;margin-bottom:12px">${isQemu && isTemplate ? `<div style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="ciUpgrade" id="ciUpgradeCheck" style="width:auto;cursor:pointer"><label for="ciUpgradeCheck" style="font-size:13px;color:#eee;cursor:pointer">Upgrade packages on first boot (<code>ciupgrade=1</code>)</label></div>` : ''}${isQemu ? `<div style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="qemuAgent" id="qemuAgentCheck" checked style="width:auto;cursor:pointer"><label for="qemuAgentCheck" style="font-size:13px;color:#eee;cursor:pointer">Enable QEMU Guest Agent (<code>agent=1</code>) for live memory/IP metrics</label></div>` : ''}<div style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="start" id="createStartCheck" checked style="width:auto;cursor:pointer"><label for="createStartCheck" style="font-size:13px;color:#eee;cursor:pointer">${ico("rocket", "sm")} Power on virtual server immediately after creation completes</label></div></div></div><div style="display:flex;gap:12px;align-items:center;margin-top:4px"><button type="submit" class="btn primary" id="createSubmitBtn" style="padding:13px 34px;font-size:14px;font-weight:700">${ico("zap")} Deploy ${isQemu ? 'Virtual Machine' : 'LXC Container'}</button><button type="button" class="btn ghost" data-page="servers" style="padding:13px 20px">Cancel</button></div><div id="createProgressNotice" class="hidden notice" style="border-color:rgba(34,197,94,0.2);background:rgba(34,197,94,0.05);color:#86efac;padding:16px;border-radius:12px"><div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px"><span>${ico("spinner", "spin")}</span> Deployment in progress…</div><div style="font-size:12px;margin-top:6px;line-height:1.5">Proxmox is allocating disk storage, configuring Cloud-Init/container network and DNS settings, and deploying the instance. Please wait 25-50 seconds…</div></div></form>`;

function setupCreateVpsEvents(c, d) {
  const selQemu = $("#selectTypeQemu");
  const selLxc = $("#selectTypeLxc");
  if (selQemu) selQemu.onclick = () => { state.createVpsState.type = "qemu"; renderCreateVpsForm(c, d); };
  if (selLxc) selLxc.onclick = () => { state.createVpsState.type = "lxc"; state.createVpsState.source = "template"; renderCreateVpsForm(c, d); };
  const btnTemplate = $("#btnSourceTemplate");
  const btnIso = $("#btnSourceIso");
  if (btnTemplate) btnTemplate.onclick = () => { state.createVpsState.source = "template"; renderCreateVpsForm(c, d); };
  if (btnIso) btnIso.onclick = () => { state.createVpsState.source = "iso"; renderCreateVpsForm(c, d); };
  const btnIp4Dhcp = $("#btnIp4Dhcp");
  const btnIp4Static = $("#btnIp4Static");
  const ip4StaticFields = $("#ip4StaticFields");
  if (btnIp4Dhcp && btnIp4Static) {
    btnIp4Dhcp.onclick = () => {
      state.createVpsState.ip4Type = "dhcp"; btnIp4Dhcp.className = "btn primary"; btnIp4Static.className = "btn ghost";
      if (ip4StaticFields) ip4StaticFields.classList.add("hidden");
    };
    btnIp4Static.onclick = () => {
      state.createVpsState.ip4Type = "static"; btnIp4Dhcp.className = "btn ghost"; btnIp4Static.className = "btn primary";
      if (ip4StaticFields) { ip4StaticFields.classList.remove("hidden"); const ipInp = $("#ip4AddressInput"); if (ipInp) ipInp.focus(); }
    };
  }
  const ip6Select = $("#createIp6Select");
  const ip6StaticFields = $("#ip6StaticFields");
  if (ip6Select && ip6StaticFields) {
    ip6Select.onchange = () => {
      state.createVpsState.ip6Type = ip6Select.value;
      if (ip6Select.value === "static") { ip6StaticFields.classList.remove("hidden"); const ip6Inp = $("#ip6AddressInput"); if (ip6Inp) ip6Inp.focus(); }
      else { ip6StaticFields.classList.add("hidden"); }
    };
  }
  const isoSelect = $("#createIsoSelect");
  const customIsoField = $("#customIsoField");
  const customIsoInput = $("#createCustomIsoInput");
  if (isoSelect && customIsoField) {
    isoSelect.onchange = () => {
      if (isoSelect.value === "__custom__") {
        customIsoField.classList.remove("hidden");
        if (customIsoInput) customIsoInput.focus();
      } else {
        customIsoField.classList.add("hidden");
        if (customIsoInput) customIsoInput.value = isoSelect.value;
      }
    };
  }
  const nodeSelect = $("#createNodeSelect");
  if (nodeSelect) {
    nodeSelect.onchange = () => {
      state.createVpsState.nodeId = Number(nodeSelect.value);
      createVpsPage(c, state.createVpsState.nodeId);
    };
  }
  const refreshBtn = $("#createVpsRefreshBtn");
  if (refreshBtn) { refreshBtn.onclick = () => createVpsPage(c, state.createVpsState.nodeId); }
  document.querySelectorAll(".quick-core").forEach(a => {
    a.onclick = () => {
      const inp = $("#createCoresInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-core").forEach(c => c.classList.remove("active"));
      a.classList.add("active");
    };
  });
  document.querySelectorAll(".quick-ram").forEach(a => {
    a.onclick = () => {
      const inp = $("#createMemoryInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-ram").forEach(c => c.classList.remove("active"));
      a.classList.add("active");
    };
  });
  document.querySelectorAll(".quick-disk").forEach(a => {
    a.onclick = () => {
      const inp = $("#createDiskInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-disk").forEach(c => c.classList.remove("active"));
      a.classList.add("active");
    };
  });
  document.querySelectorAll(".quick-swap").forEach(a => {
    a.onclick = () => {
      const inp = $("#createSwapInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-swap").forEach(c => c.classList.remove("active"));
      a.classList.add("active");
    };
  });
  const passInput = $("#createPassInput");
  const genBtn = $("#createGenPassBtn");
  const toggleBtn = $("#createTogglePassBtn");
  if (toggleBtn && passInput) { toggleBtn.onclick = () => { passInput.type = passInput.type === "password" ? "text" : "password"; }; }
  if (genBtn && passInput) {
    genBtn.onclick = () => {
      const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*";
      let generated = "";
      for (let i = 0; i < 16; i++) generated += chars.charAt(Math.floor(Math.random() * chars.length));
      passInput.value = generated; passInput.type = "text";
      try { navigator.clipboard.writeText(generated); toast("Strong password generated and copied to clipboard!"); } catch {}
    };
  }
  const form = $("#createVpsForm");
  if (form) {
    form.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(form);
      const isQemu = state.createVpsState.type === "qemu";
      const isIso = isQemu && state.createVpsState.source === "iso";
      const isTemplate = !isIso;
      let isoVal = "";
      if (isIso) {
        const isoSel = fd.get("isoSelect");
        isoVal = (isoSel === "__custom__" || !isoSel) ? (fd.get("customIso") || "").trim() : isoSel;
        if (!isoVal) { toast("Please enter or select a bootable ISO volume ID.", "error"); return; }
      }
      const payload = {
        nodeId: Number(fd.get("nodeId")),
        userId: Number(fd.get("userId")),
        type: state.createVpsState.type,
        source: state.createVpsState.source,
        vmid: Number(fd.get("vmid")),
        name: (fd.get("name") || "").trim(),
        cores: Number(fd.get("cores")),
        sockets: Number(fd.get("sockets") || 1),
        memory: Number(fd.get("memory")),
        swap: Number(fd.get("swap") || 512),
        disk: Number(fd.get("disk")),
        storage: fd.get("storage"),
        bridge: fd.get("bridge"),
        vlan: fd.get("vlan") ? Number(fd.get("vlan")) : null,
        mac: (fd.get("mac") || "").trim(),
        firewall: fd.get("firewall") === "on" || fd.get("firewall") === true,
        ip4Type: state.createVpsState.ip4Type,
        ip4Address: (fd.get("ip4Address") || "").trim(),
        ip4Gateway: (fd.get("ip4Gateway") || "").trim(),
        ip6Type: state.createVpsState.ip6Type,
        ip6Address: (fd.get("ip6Address") || "").trim(),
        ip6Gateway: (fd.get("ip6Gateway") || "").trim(),
        searchDomain: (fd.get("searchDomain") || "").trim(),
        nameServers: (fd.get("nameServers") || "").trim(),
        ciUser: (fd.get("ciUser") || "root").trim(),
        password: (fd.get("password") || "").trim(),
        sshKey: (fd.get("sshKey") || "").trim(),
        unprivileged: fd.get("unprivileged") === "on" || fd.get("unprivileged") === true,
        nesting: fd.get("nesting") === "on" || fd.get("nesting") === true,
        ciUpgrade: fd.get("ciUpgrade") === "on" || fd.get("ciUpgrade") === true,
        qemuAgent: fd.get("qemuAgent") === "on" || fd.get("qemuAgent") === true,
        start: fd.get("start") === "on" || fd.get("start") === true,
        templateId: fd.get("templateId"),
        iso: isoVal,
        osType: fd.get("osType") || "l26"
      };
      if (isTemplate && (!payload.password || payload.password.length < 8)) { toast("Root password must be at least 8 characters.", "error"); return; }
      if (state.createVpsState.ip4Type === "static" && !payload.ip4Address) { toast("Please enter static IPv4 address and CIDR (e.g. 192.168.1.50/24).", "error"); return; }
      if (state.createVpsState.ip6Type === "static") {
        if (!payload.ip6Address) { toast("Please enter static IPv6 address and CIDR (e.g. 2001:db8::50/64).", "error"); return; }
        if (payload.ip6Address.includes(".") && !payload.ip6Address.includes(":")) { toast("Invalid IPv6 Address! You entered an IPv4 address in IPv6 field. Please use IPv4 section above.", "error"); return; }
        if (payload.ip6Gateway && payload.ip6Gateway.includes(".") && !payload.ip6Gateway.includes(":")) { toast("Invalid IPv6 Gateway! You entered an IPv4 gateway in IPv6 Gateway field. Please use IPv4 section above.", "error"); return; }
      }
      const submitBtn = $("#createSubmitBtn");
      const notice = $("#createProgressNotice");
      if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = `${ico("spinner", "spin")} Deploying VPS in Proxmox…`; }
      if (notice) { notice.classList.remove("hidden"); notice.scrollIntoView({ behavior: "smooth" }); }
      toast("Deploying virtual server! This takes 30-50 seconds…");
      try {
        const res = await api("/admin/servers/create", { method: "POST", body: JSON.stringify(payload) });
        toast(res.message || `Virtual server "${res.name}" (VMID ${res.vmid}) created successfully!`);
        state.currentServerId = res.id;
        state.page = "vps";
        state.vpsTab = "specs";
        await renderPage();
      } catch (err) {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = `${ico("zap")} Deploy ${isQemu ? 'Virtual Machine' : 'LXC Container'}`; }
        if (notice) { notice.classList.add("hidden"); }
        toast(err.message, "error");
      }
    };
  }
}

async function assignModal() {
  try {
    const [u, n] = await Promise.all([api("/admin/users"), api("/admin/nodes")]);
    const enabledNodes = n.nodes.filter(x => x.enabled);
    if (!enabledNodes.length) {
      toast("No enabled Proxmox nodes found. Please add or enable a node first.", "error");
      return;
    }
    showModal(`<div class="modal-head"><h3>Assign existing VPS</h3><button class="close" data-close>×</button></div><form id="assignForm"><div class="field"><label>Panel user</label><select name="userId" required>${u.users.filter(x => x.active).map(x => `<option value="${x.id}">${esc(x.username)} (${esc(x.email)})</option>`).join("")}</select></div><div class="field"><label>Proxmox node</label><select name="nodeId" id="assignNodeSelect" required>${enabledNodes.map(x => `<option value="${x.id}">${esc(x.name)} · ${esc(x.host)}</option>`).join("")}</select></div><div id="discoveredVmsWrap" class="small muted" style="margin-bottom:12px"></div><div class="form-grid"><div class="field"><label>VMID</label><input name="vmid" id="assignVmid" type="number" min="100" required></div><div class="field"><label>Type</label><select name="type" id="assignType"><option value="qemu">KVM / QEMU</option><option value="lxc">LXC</option></select></div></div><div class="field"><label>Display name</label><input name="name" id="assignName" required></div><button class="btn primary" style="width:100%;margin-top:10px">Verify and assign</button></form>`);
    const loadResources = async () => {
      const selNodeId = $("#assignNodeSelect")?.value;
      const wrap = $("#discoveredVmsWrap");
      if (!selNodeId || !wrap) return;
      wrap.textContent = "Scanning node for available VMs/containers…";
      try {
        const r = await api(`/admin/proxmox/nodes/${selNodeId}/resources`);
        if (r.resources && r.resources.length) {
          wrap.innerHTML = `<label style="display:block;margin-bottom:6px;color:#aaa">Detected on node (click to select):</label><div style="display:flex;gap:6px;flex-wrap:wrap">${r.resources.map(vm => `<button type="button" class="btn small" style="padding:4px 8px;font-size:11px" data-pick-vmid="${vm.vmid}" data-pick-type="${vm.type}" data-pick-name="${esc(vm.name || ('VM ' + vm.vmid))}">${vm.type.toUpperCase()} ${vm.vmid} (${esc(vm.name || 'unnamed')})</button>`).join("")}</div>`;
          wrap.querySelectorAll("[data-pick-vmid]").forEach(btn => {
            btn.onclick = () => {
              if ($("#assignVmid")) $("#assignVmid").value = btn.dataset.pickVmid;
              if ($("#assignType")) $("#assignType").value = btn.dataset.pickType;
              if ($("#assignName")) $("#assignName").value = btn.dataset.pickName;
            };
          });
        } else {
          wrap.textContent = "No VMs/containers detected on this node (or token lacks cluster audit permissions). You can enter the VMID manually below.";
        }
      } catch (e) {
        wrap.textContent = "Could not auto-list VMs: " + e.message + ". You can enter VMID manually below.";
      }
    };
    const nodeSel = $("#assignNodeSelect");
    if (nodeSel) { nodeSel.onchange = loadResources; loadResources(); }
    $("#assignForm").onsubmit = async e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(e.target));
      d.userId = Number(d.userId);
      d.nodeId = Number(d.nodeId);
      d.vmid = Number(d.vmid);
      try {
        await api("/admin/servers/assign", { method: "POST", body: JSON.stringify(d) });
        $("#modalRoot").innerHTML = "";
        toast("VPS assigned successfully.");
        state.page = "servers";
        await renderPage();
      } catch (err) { toast(err.message, "error"); }
    };
  } catch (e) { toast(e.message, "error"); }
}

async function unassign(id, name, vmid) {
  const s = (state.servers || []).find(x => x.id === id);
  const sName = name || (s ? s.name : `VPS #${id}`);
  const sVmid = vmid || (s ? s.vmid : "");
  const label = sVmid ? `"${sName}" (VMID ${sVmid})` : `"${sName}"`;
  const ok = await modalConfirm({
    title: "Remove VPS Assignment",
    subtitle: label,
    message: `Are you sure you want to remove user assignment for ${label}?`,
    details: [
      "The VPS will be unlinked from the user in this panel.",
      "The Proxmox VE VM/container will NOT be deleted or stopped.",
      'You can re-assign it at any time from the "Assign VPS" page.'
    ],
    confirmText: "Remove Assignment",
    type: "warning",
    icon: "ban"
  });
  if (!ok) return;
  try {
    const res = await api(`/admin/servers/${id}/assignment`, { method: "DELETE", body: "{}" });
    toast(`Assignment removed for ${label}.`);
    if (state.page === "vps") {
      state.page = "servers";
    }
    await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

              <div class="dropzone-icon">${ico("upload", "lg")}</div>
              <div class="dropzone-text">Click or drag & drop social share banner here</div>
              <div class="dropzone-sub">PNG, WEBP, or JPG up to 8MB (1200x630 recommended)</div>

          <!-- Live Social Card Mockup -->

            <div class="social-card-preview" id="mockSocialPreviewCard">
              <div class="social-card-image-box" id="mockSocialBox">
                ${ogImg 
                  ? `<img src="${esc(ogImg)}" id="mockSocialImgEl" alt="Preview">` 
                  : `<div class="social-card-image-placeholder" id="mockSocialPlaceholder">${ico("image", "xl")}<span style="font-weight:600">No OG Preview Image Set</span><span style="font-size:11px;color:#777">1200 × 630 banner</span></div>`}
              </div>
              <div class="social-card-body">
                <div class="social-card-site" id="mockSocialDomain">${esc(window.location.host || 'your-platform.com')}</div>
                <div class="social-card-title" id="mockSocialTitleText">${esc(siteName)} — Cloud & VPS Management Panel</div>
                <div class="social-card-desc" id="mockSocialDescText">${esc(seoDesc || siteDesc)}</div>

  initSettingsControllers();

function initSettingsControllers() {
  const form = $("#settingsForm");
  if (!form) return;

  const inpSiteName = $("#setting_site_name");
  const inpSiteDesc = $("#setting_site_description");
  const inpSiteIcon = $("#setting_site_icon_url");
  const inpSiteFavicon = $("#setting_site_favicon_url");
  const inpOgImage = $("#setting_og_image_url");
  const inpSeoDesc = $("#setting_seo_description");

  // Character counter helper
  const updateCharCounter = () => {
    const el = $("#seoCharCount");
    if (!el || !inpSeoDesc) return;
    const len = inpSeoDesc.value.length;
    el.textContent = `${len} / 160`;
    if (len >= 120 && len <= 160) {
      el.style.color = "var(--green)";
    } else if (len > 160) {
      el.style.color = "var(--yellow)";
    } else {
      el.style.color = "var(--muted)";
    }
  };
  updateCharCounter();

  // Real-time live synchronization
  const syncLivePreviews = () => {
    const name = inpSiteName?.value?.trim() || "Atyro Cloud";
    const desc = inpSiteDesc?.value?.trim() || "High-Performance Cloud & VPS Infrastructure Management";
    const seo = inpSeoDesc?.value?.trim() || desc;
    const icon = inpSiteIcon?.value?.trim() || "";
    const fav = inpSiteFavicon?.value?.trim() || "/favicon.ico";
    const og = inpOgImage?.value?.trim() || "";

    // 1. Sidebar live preview
    const sideNameEl = $("#previewBrandNameText");
    if (sideNameEl) sideNameEl.textContent = name;
    const sideBox = $("#previewSidebarBrand");
    if (sideBox) {
      const initial = (name[0] || "A").toUpperCase();
      if (icon) {
        sideBox.innerHTML = `<img class="brand-logo-img" src="${esc(icon)}" alt="Logo" onerror="this.outerHTML='<span class=\\'brand-mark\\'>${esc(initial)}</span>'"><span>${esc(name)}</span>`;
      } else {
        sideBox.innerHTML = `<span class="brand-mark">${esc(initial)}</span><span>${esc(name)}</span>`;
      }
    }

    // 2. Logo preview row
    const logoThumb = $("#logoThumbBox");
    const logoStatus = $("#logoStatusText");
    const logoUrlPrev = $("#logoUrlPreview");
    if (logoThumb) {
      const initial = (name[0] || "A").toUpperCase();
      if (icon) {
        logoThumb.innerHTML = `<img src="${esc(icon)}" alt="Logo" onerror="this.outerHTML='<span class=\\'brand-mark\\' style=\\'width:32px;height:32px;font-size:14px\\'>${esc(initial)}</span>'">`;
      } else {
        logoThumb.innerHTML = `<span class="brand-mark" style="width:32px;height:32px;font-size:14px">${esc(initial)}</span>`;
      }
    }
    if (logoStatus) logoStatus.textContent = icon ? "Custom Logo Active" : "Default Monogram Active";
    if (logoUrlPrev) logoUrlPrev.textContent = icon ? icon : "Default letter badge is rendered.";

    // 3. Browser tab preview
    const tabFav = $("#mockFaviconImg");
    if (tabFav) tabFav.src = fav;
    const tabTitle = $("#mockTabTitleText");
    if (tabTitle) tabTitle.textContent = `${name} — Cloud & VPS Management Panel`;

    // 4. Social card preview
    const socialTitle = $("#mockSocialTitleText");
    if (socialTitle) socialTitle.textContent = `${name} — Cloud & VPS Management Panel`;
    const socialDesc = $("#mockSocialDescText");
    if (socialDesc) socialDesc.textContent = seo;
    const socialBox = $("#mockSocialBox");
    if (socialBox) {
      if (og) {
        socialBox.innerHTML = `<img src="${esc(og)}" alt="Preview" onerror="this.outerHTML='<div class=\\'social-card-image-placeholder\\'>${ico('alert', 'xl')}<span style=\\'font-weight:600\\'>Image Failed to Load</span></div>'">`;
      } else {
        socialBox.innerHTML = `<div class="social-card-image-placeholder">${ico("image", "xl")}<span style="font-weight:600">No OG Preview Image Set</span><span style="font-size:11px;color:#777">1200 × 630 banner</span></div>`;
      }
    }
  };

  [inpSiteName, inpSiteDesc, inpSiteIcon, inpSiteFavicon, inpOgImage, inpSeoDesc].forEach(inp => {
    if (inp) inp.addEventListener("input", () => {
      updateCharCounter();
      syncLivePreviews();
    });
  });

  // Clear logo button
  const clearLogo = $("#clearLogoBtn");
  if (clearLogo) {
    clearLogo.onclick = () => {
      if (inpSiteIcon) {
        inpSiteIcon.value = "";
        syncLivePreviews();
        clearLogo.remove();
        toast("Custom logo removed. Default monogram active.");
      }
    };
  }

  // Tab switching: URL vs Upload
  $$(".image-mode-tabs").forEach(tabs => {
    const asset = tabs.dataset.asset;
    const btnUrl = tabs.querySelector('[data-mode="url"]');
    const btnUpload = tabs.querySelector('[data-mode="upload"]');
    const panelUrl = $(`#mode_${asset}_url`);
    const panelUpload = $(`#mode_${asset}_upload`);

    if (btnUrl && btnUpload && panelUrl && panelUpload) {
      btnUrl.onclick = () => {
        btnUrl.classList.add("active");
        btnUpload.classList.remove("active");
        panelUrl.style.display = "block";
        panelUpload.style.display = "none";
      };
      btnUpload.onclick = () => {
        btnUpload.classList.add("active");
        btnUrl.classList.remove("active");
        panelUrl.style.display = "none";
        panelUpload.style.display = "block";
      };
    }
  });

  // File Upload Helper
  const handleUpload = async (file, asset) => {
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) {
      toast("Image file is too large. Maximum size is 8MB.", "error");
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => toast("Failed to read image file.", "error");
    reader.onload = async () => {
      const base64Data = reader.result;
      const dropzone = $(`#dropzone_${asset}`);
      const origText = dropzone ? dropzone.innerHTML : "";
      if (dropzone) {
        dropzone.innerHTML = `<div class="dropzone-icon">${ico("spinner", "spin lg")}</div><div class="dropzone-text">Uploading image…</div>`;
      }
      try {
        const res = await api("/admin/settings/upload", {
          method: "POST",
          body: JSON.stringify({ fileData: base64Data, fileName: file.name, assetType: asset })
        });
        toast("Image uploaded successfully!", "success");
        if (asset === "icon" && inpSiteIcon) {
          inpSiteIcon.value = res.url;
        } else if (asset === "favicon" && inpSiteFavicon) {
          inpSiteFavicon.value = res.url;
        } else if (asset === "og" && inpOgImage) {
          inpOgImage.value = res.url;
        }
        syncLivePreviews();
        // Switch back to URL tab to show the path
        const tabBtn = $(`.image-mode-tabs[data-asset="${asset}"] [data-mode="url"]`);
        if (tabBtn) tabBtn.click();
      } catch (err) {
        toast(err.message, "error");
      } finally {
        if (dropzone) dropzone.innerHTML = origText;
      }
    };
    reader.readAsDataURL(file);
  };

  // Wire up dropzones and file inputs
  ["icon", "favicon", "og"].forEach(asset => {
    const dropzone = $(`#dropzone_${asset}`);
    const fileInp = $(`#file_${asset}_input`);

    if (dropzone && fileInp) {
      dropzone.onclick = () => fileInp.click();
      fileInp.onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) handleUpload(file, asset);
      };
      dropzone.ondragover = (e) => {
        e.preventDefault();
        dropzone.classList.add("dragover");
      };
      dropzone.ondragleave = () => dropzone.classList.remove("dragover");
      dropzone.ondrop = (e) => {
        e.preventDefault();
        dropzone.classList.remove("dragover");
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) handleUpload(file, asset);
      };
    }
  });

  // Save Settings Button
  const saveBtn = $("#saveSettingsBtn");
  if (saveBtn) {
    saveBtn.onclick = async () => {
      saveBtn.disabled = true;
      const origHtml = saveBtn.innerHTML;
      saveBtn.innerHTML = `${ico("spinner", "spin sm")} Saving…`;

      const payload = {
        site_name: inpSiteName?.value?.trim() || "Atyro Cloud",
        site_description: inpSiteDesc?.value?.trim() || "",
        site_icon_url: inpSiteIcon?.value?.trim() || "",
        site_favicon_url: inpSiteFavicon?.value?.trim() || "/favicon.ico",
        og_image_url: inpOgImage?.value?.trim() || "",
        seo_description: inpSeoDesc?.value?.trim() || ""
      };

      try {
        const res = await api("/admin/settings", {
          method: "PATCH",
          body: JSON.stringify(payload)
        });
        state.settings = res.settings;
        applySiteSettings(res.settings);
        toast("Platform settings saved and applied successfully!", "success");
      } catch (err) {
        toast(err.message, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = origHtml;
      }
    };
  }

  // Reset to Defaults Button
  const resetBtn = $("#resetSettingsBtn");
  if (resetBtn) {
    resetBtn.onclick = async () => {
      const ok = await modalConfirm({
        title: "Reset Platform Settings",
        message: "Are you sure you want to restore all branding, logos, and SEO metadata to default factory values?",
        confirmText: "Reset to Factory Defaults",
        type: "warning"
      });
      if (!ok) return;

      const defaults = {
        site_name: "Atyro Cloud",
        site_description: "High-Performance Cloud & VPS Infrastructure Management",
        site_icon_url: "",
        site_favicon_url: "/favicon.ico",
        og_image_url: "",
        seo_description: "High-Performance Cloud & VPS Infrastructure Management"
      };

      try {
        const res = await api("/admin/settings", {
          method: "PATCH",
          body: JSON.stringify(defaults)
        });
        state.settings = res.settings;
        applySiteSettings(res.settings);
        toast("Settings reset to defaults successfully", "success");
        await settingsPage($("#content"));
      } catch (err) {
        toast(err.message, "error");
      }
    };
  }
}

// SOCKET.IO REAL-TIME LIVE DATA & METRICS

let liveSocket = null;
function initSocketConnection() {
  if (typeof io === "undefined") {
    console.warn("Socket.io client script not loaded.");
    return;
  }
  if (liveSocket && liveSocket.connected) return;

  try {
    liveSocket = io({
      transports: ["websocket", "polling"],
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000,
      timeout: 10000
    });

    liveSocket.on("connect", () => {
      setLivePillStatus("live");
      if (state.user && state.user.id) {
        liveSocket.emit("auth:sync", state.user);
      }
      if (state.page === "vps" && state.currentServerId) {
        liveSocket.emit("subscribe_vps", { id: state.currentServerId });
      }
    });

    liveSocket.on("disconnect", () => {
      setLivePillStatus("offline");
    });

    liveSocket.on("reconnect_attempt", () => {
      setLivePillStatus("reconnecting");
    });

    liveSocket.on("vps:batch_stats", (batch) => {
      onLiveBatchStats(batch);
    });

    liveSocket.on("vps:stats", (stats) => {
      onLiveSingleStats(stats);
    });

    liveSocket.on("cluster:summary", (summary) => {
      onLiveClusterSummary(summary);
    });

    liveSocket.on("tasks:update", (data) => {
      if (state.page === "tasks" && data && data.tasks) {
        renderLiveTasksTable(data.tasks);
      }
    });

    liveSocket.on("vps:status_changed", (data) => {
      if (data && data.serverId) {
        const pill = $(`#server-status-${data.serverId}`);
        if (pill) {
          pill.innerHTML = `<i class="dot running"></i><span style="color:var(--accent);font-weight:600">Updating…</span>`;
        }
      }
    });

    liveSocket.on("vps:list_changed", async () => {
      try {
        const d = await api("/dashboard");
        state.servers = d.servers;
        if (state.page === "servers") {
          const container = $("#serverCardsContainer");
          if (container) container.innerHTML = serverCards(filterServers(d.servers));
          updateVpsFilterCounts(d.servers);
        } else if (state.page === "overview") {
          await renderPage();
        }
      } catch {}
    });

    liveSocket.on("settings:updated", (data) => {
      if (data && data.settings) {
        applySiteSettings(data.settings);
        if (state.page === "settings") {
          toast("Platform settings updated live", "success");
        }
      }
    });
  } catch (err) {
    console.error("Socket.io init failed:", err);
  }
}

function setLivePillStatus(status) {
  const pill = $("#livePill");
  if (!pill) return;
  pill.classList.remove("offline", "reconnecting");
  const textEl = pill.querySelector(".live-text");
  if (status === "live") {
    if (textEl) textEl.textContent = "LIVE";
    pill.title = "Real-time WebSocket connection active";
  } else if (status === "reconnecting") {
    pill.classList.add("reconnecting");
    if (textEl) textEl.textContent = "SYNCING";
    pill.title = "Reconnecting to live data stream…";
  } else {
    pill.classList.add("offline");
    if (textEl) textEl.textContent = "OFFLINE";
    pill.title = "Disconnected from live server";
  }
}

function updateVpsFilterCounts(servers) {
  const chips = $("#vpsFilterChips");
  if (!chips || !Array.isArray(servers)) return;
  const total = servers.length;
  const running = servers.filter(s => s.status === "running").length;
  const stopped = servers.filter(s => s.status === "stopped").length;
  const qemu = servers.filter(s => s.type === "qemu").length;
  const lxc = servers.filter(s => s.type === "lxc").length;

  const bAll = chips.querySelector('[data-vps-filter="all"]');
  if (bAll) bAll.textContent = `All (${total})`;
  const bRun = chips.querySelector('[data-vps-filter="running"]');
  if (bRun) bRun.innerHTML = `${ico("statusDot", "sm", "color:var(--green)")} Running (${running})`;
  const bStop = chips.querySelector('[data-vps-filter="stopped"]');
  if (bStop) bStop.innerHTML = `${ico("statusDot", "sm", "color:var(--red)")} Stopped (${stopped})`;
  const bKvm = chips.querySelector('[data-vps-filter="qemu"]');
  if (bKvm) bKvm.innerHTML = `${ico("kvm", "sm")} KVM (${qemu})`;
  const bLxc = chips.querySelector('[data-vps-filter="lxc"]');
  if (bLxc) bLxc.innerHTML = `${ico("lxc", "sm")} LXC (${lxc})`;
}

function onLiveBatchStats(batch) {
  if (!Array.isArray(batch)) return;

  // 1. Sync in-memory state.servers
  if (!state.servers) state.servers = [];
  for (const st of batch) {
    const existing = state.servers.find(x => x.id === st.id);
    if (existing) {
      existing.status = st.status;
      existing.uptime = st.uptime;
      existing.cpu = st.cpu;
      existing.mem = st.mem;
      existing.maxmem = st.maxmem;
    }
  }

  // 2. Update each server card in DOM
  for (const st of batch) {
    const isRunning = st.status === "running";
    const isStopped = st.status === "stopped";
    const dotClass = isRunning ? "running" : (isStopped ? "stopped" : "");
    const statusText = isRunning ? "Running" : (isStopped ? "Stopped" : (st.status && st.status !== "unknown" ? esc(st.status) : "Checking…"));
    const statusColor = isRunning ? "var(--green)" : (isStopped ? "var(--red)" : "var(--muted)");

    const pill = $(`#server-status-${st.id}`);
    if (pill) {
      pill.innerHTML = `<i class="dot ${dotClass}"></i><span style="color:${statusColor};font-weight:600;text-transform:capitalize">${statusText}</span>`;
    }

    const card = pill ? pill.closest(".server-card") : $(`#server-card-${st.id}`);
    if (card) {
      const meta = card.querySelector(".server-meta") || $(`#server-meta-${st.id}`);
      if (meta) {
        let uptimeEl = meta.querySelector(".uptime-tag");
        if (isRunning && st.uptime) {
          const upStr = `${ico("clock", "sm")} Up ${formatUptime(st.uptime)}`;
          if (uptimeEl) {
            uptimeEl.innerHTML = upStr;
          } else {
            const span = document.createElement("span");
            span.className = "tag uptime-tag";
            span.style.cssText = "color:var(--green);border-color:rgba(34,197,94,0.3)";
            span.innerHTML = upStr;
            meta.appendChild(span);
          }
        } else if (uptimeEl) {
          uptimeEl.remove();
        }
      }

      const actions = card.querySelector(".actions") || $(`#card-actions-${st.id}`);
      if (actions) {
        const startBtn = actions.querySelector('[data-power="start"]');
        const stopBtn = actions.querySelector('[data-power="stop"]');
        if (isRunning && startBtn) {
          startBtn.outerHTML = `<button class="btn small danger" data-action="power" data-id="${st.id}" data-power="stop">${ico("stop")} Stop</button><button class="btn small" data-action="power" data-id="${st.id}" data-power="reboot">${ico("refresh")} Reboot</button>`;
        } else if (isStopped && stopBtn) {
          const rebootBtn = actions.querySelector('[data-power="reboot"]');
          if (rebootBtn) rebootBtn.remove();
          stopBtn.outerHTML = `<button class="btn small success" data-action="power" data-id="${st.id}" data-power="start">${ico("play")} Start</button>`;
        }
      }
    }
  }

  // 3. Update filter chip counts on servers page
  updateVpsFilterCounts(state.servers);
}

function onLiveSingleStats(stats) {
  if (state.page !== "vps" || Number(state.currentServerId) !== Number(stats.id)) return;

  const isRunning = stats.status === "running";
  const isStopped = stats.status === "stopped";
  const statusText = isRunning ? "Running" : (isStopped ? "Stopped" : (stats.status || "Unknown"));

  // 1. Header Title Badge
  const titleStatus = $("#vpsTitleStatus");
  if (titleStatus) {
    titleStatus.className = `badge ${isRunning ? 'running' : 'stopped'}`;
    titleStatus.innerHTML = `${ico("statusDot", "sm")} ${statusText}`;
  }

  // 2. Header Uptime Badge
  const uptimeBadge = $("#vpsLiveUptime");
  if (uptimeBadge) {
    uptimeBadge.innerHTML = `${ico("clock", "sm")} Up ${formatUptime(stats.uptime)}`;
  }

  // 3. Header Action Buttons (morph Start vs Stop/Shutdown/Reboot/Reset)
  const headerActions = $("#vpsHeaderActions");
  if (headerActions) {
    const startBtn = headerActions.querySelector('[data-power="start"]');
    const stopBtn = headerActions.querySelector('[data-power="stop"]');
    if (isRunning && startBtn) {
      startBtn.outerHTML = `<button class="btn danger" data-action="power" data-id="${stats.id}" data-power="stop">${ico("stop")} Stop</button><button class="btn" data-action="power" data-id="${stats.id}" data-power="shutdown">${ico("pause")} Shutdown</button><button class="btn" data-action="power" data-id="${stats.id}" data-power="reboot">${ico("refresh")} Reboot</button><button class="btn danger" data-action="power" data-id="${stats.id}" data-power="reset">${ico("zap")} Reset</button>`;
    } else if (isStopped && stopBtn) {
      ["shutdown", "reboot", "reset"].forEach(p => {
        const b = headerActions.querySelector(`[data-power="${p}"]`);
        if (b) b.remove();
      });
      stopBtn.outerHTML = `<button class="btn success" data-action="power" data-id="${stats.id}" data-power="start">${ico("play")} Start VPS</button>`;
    }
  }

  // 4. Metric Cards
  const cpuVal = $("#metricCpuVal");
  const cpuTop = $("#metricCpuTop");
  const cpuBar = $("#metricCpuBar");
  if (cpuVal) cpuVal.textContent = `${stats.cpuPct}%`;
  if (cpuTop) {
    cpuTop.textContent = `${stats.cpuPct}%`;
    cpuTop.style.color = parseFloat(stats.cpuPct) > 80 ? "var(--red)" : "var(--accent)";
  }
  if (cpuBar) cpuBar.style.width = `${Math.min(100, Math.max(1, parseFloat(stats.cpuPct)))}%`;

  const ramVal = $("#metricRamVal");
  const ramTop = $("#metricRamTop");
  const ramSub = $("#metricRamSub");
  const ramBar = $("#metricRamBar");
  if (ramVal) ramVal.textContent = formatBytes(stats.mem);
  if (ramTop) ramTop.textContent = `${stats.memPct}%`;
  if (ramSub) ramSub.textContent = `of ${formatBytes(stats.maxmem)} (${formatBytes(stats.freemem)} free)`;
  if (ramBar) ramBar.style.width = `${Math.min(100, Math.max(1, parseFloat(stats.memPct)))}%`;

  const diskVal = $("#metricDiskVal");
  const diskSub = $("#metricDiskSub");
  if (diskVal) diskVal.textContent = formatBytes((stats.diskread || 0) + (stats.diskwrite || 0));
  if (diskSub) diskSub.textContent = `Read: ${formatBytes(stats.diskread || 0)} · Write: ${formatBytes(stats.diskwrite || 0)}`;

  const netVal = $("#metricNetVal");
  const netSub = $("#metricNetSub");
  if (netVal) netVal.textContent = formatBytes((stats.netin || 0) + (stats.netout || 0));
  if (netSub) netSub.textContent = `RX: ${formatBytes(stats.netin || 0)} · TX: ${formatBytes(stats.netout || 0)}`;

  // 5. Hardware Specs Tab Rows
  if (state.vpsTab === "specs") {
    $$("#vpsTabContent .spec-row").forEach(row => {
      const k = row.querySelector(".k")?.textContent?.trim();
      const v = row.querySelector(".v");
      if (!k || !v) return;
      if (k === "Currently Used RAM") v.textContent = formatBytes(stats.mem);
      if (k === "Free / Available RAM") v.textContent = formatBytes(stats.freemem);
      if (k === "Total Provisioned Disk" && stats.diskMax) v.textContent = formatBytes(stats.diskMax);
      if (k === "Total Disk Read") v.textContent = formatBytes(stats.diskread || 0);
      if (k === "Total Disk Written") v.textContent = formatBytes(stats.diskwrite || 0);
      if (k === "Total Received (RX)") v.textContent = formatBytes(stats.netin || 0);
      if (k === "Total Transmitted (TX)") v.textContent = formatBytes(stats.netout || 0);
    });
  }
}

function onLiveClusterSummary(summary) {
  if (!summary) return;
  const tVps = $("#dashTotalVps");
  if (tVps && summary.total != null) tVps.textContent = summary.total;
  const kVps = $("#dashKvmVps");
  if (kVps && summary.qemu != null) kVps.textContent = summary.qemu;
  const lVps = $("#dashLxcVps");
  if (lVps && summary.lxc != null) lVps.textContent = summary.lxc;
}

function renderLiveTasksTable(tasks) {
  if (state.page !== "tasks") return;
  window._atyroTasks = tasks;
  const filtered = filterTasks(tasks);
  const container = $("#tasksTableContainer");
  if (container) {
    container.innerHTML = renderTasksTable(filtered);
  }
}

async function boot() {
  try {
    const s = await fetch("/api/settings").then(r => r.json()).catch(() => null);
    if (s && s.settings) {
      applySiteSettings(s.settings);
    }
  } catch {}
  try {
    const d = await api("/auth/me");
    state.user = d.user;
    state.csrf = d.csrfToken;
    await loadDashboard();
    initSocketConnection();
  } catch {
    try {
      const st = await fetch("/api/setup/status").then(r => r.json()).catch(() => ({ needSetup: false }));
      if (st && st.needSetup) {
        renderSetup();
        return;
      }
    } catch {}
    renderLogin();
  }
}
boot();
</script>
</body>
</html>
