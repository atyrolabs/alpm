<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>ALPM — VPS Control Panel</title>
<meta name="description" content="Next-Generation Proxmox VE VPS Cloud Management Platform" id="metaDescription">
<!-- Open Graph / Social SEO -->
<meta property="og:type" content="website">
<meta property="og:title" content="ALPM — VPS Control Panel" id="ogTitle">
<meta property="og:description" content="Next-Generation Proxmox VE VPS Cloud Management Platform" id="ogDescription">
<meta property="og:image" content="" id="ogImage">
<link rel="icon" type="image/x-icon" href="" id="siteFaviconLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/xterm/css/xterm.css">
<style>
:root {
  /* Convoy-inspired Palette */
  --bg: #0a0a0a;
  --panel: #111111;
  --panel2: #161616;
  --panel-hover: #1a1a1a;
  --line: rgba(255, 255, 255, 0.06);
  --line-strong: rgba(255, 255, 255, 0.12);
  --muted: #888888;
  --text: #ededed;
  --text-dim: #b0b0b0;
  --accent: #6366f1; /* Indigo */
  --accent-hover: #818cf8;
  --accent-glow: rgba(99, 102, 241, 0.25);
  --green: #22c55e;
  --green-glow: rgba(34, 197, 94, 0.25);
  --red: #ef4444;
  --red-glow: rgba(239, 68, 68, 0.25);
  --yellow: #eab308;
  --blue: #38bdf8;
  --purple: #a855f7;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-heading: 'Space Grotesk', sans-serif;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--font-body);
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Custom Sleek Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: 0; }
a { color: inherit; text-decoration: none; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* Shell Layout */
.app { min-height: 100vh; display: flex; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 260px;
  background: #0d0d0d;
  border-right: 1px solid var(--line);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  z-index: 50;
  transition: transform var(--transition);
}
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(8px);
  z-index: 45;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition);
}
.sidebar-backdrop.open {
  display: block;
  opacity: 1;
  pointer-events: auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 12px 28px;
  font: 700 20px var(--font-heading);
  letter-spacing: -0.03em;
}
.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 18px;
  box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
  flex-shrink: 0;
}
.brand-logo-img {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  object-fit: cover;
  border: 1px solid var(--line);
  background: var(--panel2);
  flex-shrink: 0;
  display: block;
}
.nav-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  color: #555;
  font-weight: 700;
  padding: 16px 12px 8px;
  text-transform: uppercase;
}
.nav button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--muted);
  text-align: left;
  margin: 2px 0;
  font-weight: 500;
  font-size: 13.5px;
  transition: all var(--transition);
}
.nav button:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
}
.nav button.active {
  background: rgba(99, 102, 241, 0.1);
  color: var(--accent);
  font-weight: 600;
  box-shadow: inset 3px 0 var(--accent);
}
.svg-ico {
  display: inline-block;
  vertical-align: -0.16em;
  width: 1.1em;
  height: 1.1em;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.svg-ico.sm {
  width: 0.9em;
  height: 0.9em;
  vertical-align: -0.12em;
}
.svg-ico.lg {
  width: 1.35em;
  height: 1.35em;
  vertical-align: -0.22em;
}
.svg-ico.xl {
  width: 1.8em;
  height: 1.8em;
  vertical-align: -0.28em;
}
.svg-ico.spin {
  animation: svg-spin 1s linear infinite;
}
@keyframes svg-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.nav .ico {
  width: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  opacity: 0.9;
}
.nav .ico .svg-ico {
  width: 16px;
  height: 16px;
}
.stat-icon .svg-ico {
  width: 1.15em;
  height: 1.15em;
}
.btn .svg-ico {
  margin-right: 3px;
}
.btn.small .svg-ico {
  margin-right: 2px;
}
.side-bottom {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding: 16px 8px 0;
}
.user-mini {
  display: flex;
  gap: 11px;
  align-items: center;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--panel2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  font-weight: 800;
  color: var(--accent);
  font-size: 14px;
  flex-shrink: 0;
  overflow: hidden;
}
.avatar.user-avatar-img, img.avatar {
  object-fit: cover;
  display: block;
}

/* User Profile Page Styles */
.profile-hero {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  display: flex;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}
.profile-avatar-large {
  width: 84px;
  height: 84px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 32px;
  object-fit: cover;
  border: 2px solid var(--line-strong);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  flex-shrink: 0;
  overflow: hidden;
}
.profile-hero-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  min-width: 220px;
}
.profile-hero-info h2 {
  font: 700 24px var(--font-heading);
  margin: 0;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.profile-hero-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 4px;
  font-size: 12.5px;
  color: var(--muted);
}
.profile-hero-badges {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.profile-stat-badge {
  background: var(--panel2);
  border: 1px solid var(--line);
  padding: 10px 16px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.profile-stat-badge span:first-child {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  font-weight: 600;
}
.profile-stat-badge span:last-child {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
}
.profile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
  gap: 24px;
}
.main {
  margin-left: 260px;
  min-height: 100vh;
  width: calc(100% - 260px);
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 72px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  position: sticky;
  top: 0;
  background: rgba(10, 10, 10, 0.85);
  backdrop-filter: blur(16px);
  z-index: 30;
}
.crumb {
  font: 600 16px var(--font-heading);
  display: flex;
  align-items: center;
  gap: 8px;
}
.top-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.pill {
  border: 1px solid var(--line);
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  color: var(--muted);
  font-size: 12px;
  background: rgba(255, 255, 255, 0.02);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.content {
  padding: 32px 32px 64px;
  max-width: 1600px;
  width: 100%;
  margin: 0 auto;
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.page-head h1 {
  font: 700 28px var(--font-heading);
  margin: 0 0 6px;
  letter-spacing: -0.03em;
}
.page-head p {
  color: var(--muted);
  margin: 0;
  font-size: 14px;
}

/* Grids & Cards */
.grid { display: grid; gap: 16px; }
.stats {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-bottom: 24px;
}
.stat, .panel, .server-card, .spec-box, .chart-box, .metric-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
}
.stat {
  padding: 22px;
  position: relative;
  overflow: hidden;
}
.stat::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 100px;
  height: 100px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.06) 0%, transparent 70%);
  pointer-events: none;
}
.stat-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
}
.stat-value {
  font: 700 32px var(--font-heading);
  margin-top: 10px;
  color: #fff;
  letter-spacing: -0.04em;
}
.stat-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: rgba(99, 102, 241, 0.1);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-size: 17px;
  border: 1px solid rgba(99, 102, 241, 0.2);
}
.two-col { grid-template-columns: 1.5fr 1fr; }
.panel {
  padding: 24px;
  margin-bottom: 20px;
}
.panel-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.panel-title h3 {
  font: 700 17px var(--font-heading);
  margin: 0;
  letter-spacing: -0.02em;
}
.panel-title h4 {
  font: 700 15px var(--font-heading);
  margin: 0;
  letter-spacing: -0.02em;
}

/* Server Cards */
.server-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.server-card {
  padding: 22px;
  display: flex;
  flex-direction: column;
}
.server-card:hover {
  transform: translateY(-2px);
  border-color: rgba(99, 102, 241, 0.3);
  box-shadow: var(--shadow-md), 0 0 0 1px rgba(99, 102, 241, 0.1);
}
.server-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.server-name {
  font-weight: 700;
  font-size: 16px;
  color: #fff;
  letter-spacing: -0.02em;
}
.server-id {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.03);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #555;
  flex-shrink: 0;
}
.dot.running {
  background: var(--green);
  box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
  animation: dotPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}
.dot.stopped {
  background: var(--red);
  box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
}
@keyframes dotPulse {
  0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
  70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}
.server-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 18px 0;
}
.tag {
  font-size: 11px;
  color: var(--text-dim);
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.02);
  padding: 4px 9px;
  border-radius: 6px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  background: var(--panel2);
  color: var(--text);
  font-weight: 600;
  font-size: 12.5px;
  border: 1px solid var(--line);
  transition: all var(--transition);
  white-space: nowrap;
  user-select: none;
}
.btn:hover {
  background: var(--panel-hover);
  border-color: var(--line-strong);
  color: #fff;
  transform: translateY(-1px);
}
.btn:active {
  transform: scale(0.97);
}
.btn.primary {
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  color: #fff;
  border-color: transparent;
  font-weight: 700;
  box-shadow: 0 2px 12px rgba(99, 102, 241, 0.3);
}
.btn.primary:hover {
  background: linear-gradient(135deg, var(--accent-hover), #6366f1);
  box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
}
.btn.danger {
  background: rgba(239, 68, 68, 0.1);
  color: #fca5a5;
  border-color: rgba(239, 68, 68, 0.2);
}
.btn.danger:hover {
  background: rgba(239, 68, 68, 0.2);
  border-color: rgba(239, 68, 68, 0.4);
  color: #fff;
}
.btn.success {
  background: rgba(34, 197, 94, 0.1);
  color: #86efac;
  border-color: rgba(34, 197, 94, 0.2);
}
.btn.success:hover {
  background: rgba(34, 197, 94, 0.2);
  border-color: rgba(34, 197, 94, 0.4);
  color: #fff;
}
.btn.ghost {
  background: transparent;
  border-color: var(--line);
}
.btn.ghost:hover {
  background: rgba(255, 255, 255, 0.04);
  border-color: var(--line-strong);
}
.btn.small {
  padding: 6px 12px;
  font-size: 11.5px;
  border-radius: 6px;
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

/* Tables */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-sm);
}
table {
  border-collapse: collapse;
  width: 100%;
  min-width: 600px;
}
th, td {
  text-align: left;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
}
th {
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  background: rgba(255, 255, 255, 0.01);
}
td { color: var(--text-dim); }
tbody tr {
  transition: background var(--transition);
}
tbody tr:hover {
  background: rgba(255, 255, 255, 0.02);
}

/* Fields & Forms */
.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}
.field label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
}
.field input, .field select, .field textarea {
  background: #0d0d0d;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  color: var(--text);
  font-size: 13.5px;
  outline: none;
  width: 100%;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 16px;
}

/* Preset Chips */
.preset-chip {
  background: var(--panel2);
  border: 1px solid var(--line);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  display: inline-block;
}
.preset-chip:hover, .preset-chip.active {
  background: rgba(99, 102, 241, 0.15);
  border-color: var(--accent);
  color: var(--accent);
}

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(10px);
  display: grid;
  place-items: center;
  z-index: 100;
  padding: 16px;
  animation: fadeIn var(--transition);
}
.modal {
  width: min(560px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #141414;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  padding: 28px;
  box-shadow: var(--shadow-lg);
  animation: modalPop var(--transition);
}
/* --- Proxmox xterm.js Web Terminal Modal --- */
.modal.modal-terminal {
  width: min(1140px, 96vw);
  max-width: 1140px;
  height: 84vh;
  max-height: 84vh;
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
  background: #070a13;
  border: 1px solid rgba(99, 102, 241, 0.28);
  box-shadow: 0 25px 65px rgba(0, 0, 0, 0.9), 0 0 35px rgba(99, 102, 241, 0.15);
  border-radius: var(--radius-lg);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.modal.modal-terminal.is-fullscreen {
  width: 100vw !important;
  max-width: 100vw !important;
  height: 100vh !important;
  max-height: 100vh !important;
  border-radius: 0 !important;
  border: none !important;
}
.terminal-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #0d1322;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  user-select: none;
  flex-wrap: wrap;
  gap: 10px;
}
.terminal-modal-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-heading);
}
.terminal-modal-title h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
}
.terminal-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.03em;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--muted);
  transition: all 0.2s ease;
}
.terminal-status-badge.connected {
  background: rgba(34, 197, 94, 0.12);
  border-color: rgba(34, 197, 94, 0.3);
  color: #86efac;
}
.terminal-status-badge.connecting {
  background: rgba(234, 179, 8, 0.12);
  border-color: rgba(234, 179, 8, 0.3);
  color: #fde047;
}
.terminal-status-badge.disconnected {
  background: rgba(239, 68, 68, 0.12);
  border-color: rgba(239, 68, 68, 0.3);
  color: #fca5a5;
}
.terminal-status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;

}
.terminal-status-badge.connecting .terminal-status-dot {
  animation: pulseDot 1.2s infinite;
}
.terminal-modal-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.terminal-modal-actions button {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;

}
.terminal-modal-actions button:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.2);
  color: #fff;
}
.terminal-modal-actions button.btn-close-term {
  background: rgba(239, 68, 68, 0.1);
  border-color: rgba(239, 68, 68, 0.2);
  color: #fca5a5;
  font-size: 14px;
  padding: 4px 9px;
}
.terminal-modal-actions button.btn-close-term:hover {
  background: rgba(239, 68, 68, 0.25);
  color: #fff;
}
.terminal-screen-container {
  flex: 1;
  position: relative;
  background: #050811;
  padding: 10px 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.terminal-screen-container .xterm {
  height: 100%;
}
.terminal-screen-container .xterm-viewport {
  overflow-y: auto !important;
}
.terminal-overlay-banner {
  position: absolute;
  inset: 0;
  background: rgba(5, 8, 17, 0.9);
  backdrop-filter: blur(4px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  gap: 12px;

}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.modal-head h3 {
  margin: 0;
  font: 700 20px var(--font-heading);
  letter-spacing: -0.02em;
}
.close {
  background: transparent;
  color: var(--muted);
  font-size: 26px;
  padding: 0 4px;
  line-height: 1;
  border-radius: 6px;

}
.close:hover { color: #fff; }
@keyframes modalPop {
  from { transform: scale(0.95); opacity: 0; }

}
@keyframes fadeIn {

}

/* Dynamic Confirmation & Prompt Dialogs */
.confirm-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: grid;
  place-items: center;
  z-index: 2000;
  padding: 16px;
  animation: confirmFadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}
.confirm-modal {
  width: min(490px, 100%);
  background: #141416;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: 0 24px 50px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.05);
  animation: confirmPop 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  overflow: hidden;
}
.confirm-modal::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), #818cf8);
}
.confirm-modal.confirm-type-danger::before {
  background: linear-gradient(90deg, #ef4444, #f87171);
}
.confirm-modal.confirm-type-warning::before {
  background: linear-gradient(90deg, #eab308, #facc15);
}
.confirm-modal.confirm-type-success::before {
  background: linear-gradient(90deg, #22c55e, #4ade80);
}
.confirm-header {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.confirm-icon-badge {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  background: rgba(99, 102, 241, 0.12);
  color: var(--accent);
  border: 1px solid rgba(99, 102, 241, 0.25);
  box-shadow: 0 0 20px rgba(99, 102, 241, 0.12);
}
.confirm-icon-badge .svg-ico {
  width: 22px;
  height: 22px;
}
.confirm-icon-badge.danger {
  background: rgba(239, 68, 68, 0.14);
  color: var(--red);
  border-color: rgba(239, 68, 68, 0.3);
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.15);
}
.confirm-icon-badge.warning {
  background: rgba(234, 179, 8, 0.14);
  color: var(--yellow);
  border-color: rgba(234, 179, 8, 0.3);
  box-shadow: 0 0 20px rgba(234, 179, 8, 0.15);
}
.confirm-icon-badge.success {
  background: rgba(34, 197, 94, 0.14);
  color: var(--green);
  border-color: rgba(34, 197, 94, 0.3);
  box-shadow: 0 0 20px rgba(34, 197, 94, 0.15);
}
.confirm-titles {
  flex: 1;
  min-width: 0;
}
.confirm-title {
  margin: 0;
  font: 700 18px var(--font-heading);
  color: #fff;
  letter-spacing: -0.01em;
}
.confirm-subtitle {
  margin: 3px 0 0;
  font-size: 12px;
  color: var(--muted);
  word-break: break-all;
}
.confirm-close-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  padding: 4px;
  cursor: pointer;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}
.confirm-close-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
}
.confirm-body {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--text-dim);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.confirm-msg {
  color: #d8d8d8;
  word-break: break-word;
}
.confirm-details-box {
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 12px;
  color: var(--muted);
}
.confirm-details-box.danger {
  border-color: rgba(239, 68, 68, 0.3);
  background: rgba(239, 68, 68, 0.06);
  color: #fca5a5;
}
.confirm-details-box.warning {
  border-color: rgba(234, 179, 8, 0.3);
  background: rgba(234, 179, 8, 0.06);
  color: #fde047;
}
.confirm-bullets {
  margin: 4px 0 0 16px;
  padding: 0;
  list-style-type: disc;
}
.confirm-bullets li {
  margin-bottom: 5px;
  font-family: var(--font-body);
  line-height: 1.45;
}
.confirm-bullets li:last-child {
  margin-bottom: 0;
}
.confirm-input-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.confirm-input-wrap label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
}
.confirm-input {
  background: #0a0a0c;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  color: var(--text);
  font-size: 13.5px;
  outline: none;
  width: 100%;
  transition: all var(--transition);
  font-family: 'Space Grotesk', var(--font-body);
}
.confirm-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
}
.confirm-error {
  font-size: 11.5px;
  color: var(--red);
  font-weight: 500;
  margin-top: 2px;
}
.confirm-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.confirm-actions .btn {
  padding: 9px 18px;
  font-size: 12.5px;
  font-weight: 600;
}
@keyframes confirmFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes confirmPop {
  from { transform: scale(0.93) translateY(8px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

/* Toasts */
#toastRoot {
  position: fixed;
  right: 24px;
  bottom: 24px;
  display: flex;
  flex-direction: column-reverse;
  gap: 10px;
  z-index: 9999;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  background: rgba(20, 20, 20, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid var(--line-strong);
  border-left: 4px solid var(--accent);
  padding: 14px 20px;
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-lg);
  animation: toastSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  max-width: min(440px, calc(100vw - 32px));
  line-height: 1.4;
  position: relative;
  overflow: hidden;
}
.toast::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  height: 2px;
  background: var(--accent);
  animation: toastProgress 4s linear forwards;
}
.toast.error {
  border-left-color: var(--red);
  background: rgba(30, 15, 15, 0.96);
  border-color: rgba(239, 68, 68, 0.3);
}
.toast.error::after { background: var(--red); animation-duration: 8s; }
.toast.warning {
  border-left-color: var(--yellow);
  background: rgba(30, 25, 15, 0.96);
  border-color: rgba(234, 179, 8, 0.3);
}
.toast.warning::after { background: var(--yellow); }
.toast-close {
  background: transparent;
  color: var(--muted);
  padding: 0;
  font-size: 18px;
  line-height: 1;
  margin-left: auto;
  cursor: pointer;
}
.toast-close:hover { color: #fff; }
@keyframes toastSlideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes toastProgress {
  from { width: 100%; }
  to { width: 0%; }
}

/* Skeleton Loaders */
.skeleton {
  background: linear-gradient(90deg, var(--panel2) 25%, var(--panel-hover) 50%, var(--panel2) 75%);
  background-size: 200% 100%;
  animation: skeletonShimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}
@keyframes skeletonShimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-text {
  height: 14px;
  margin-bottom: 8px;
  width: 100%;
}
.skeleton-text.short { width: 60%; }
.skeleton-text.medium { width: 80%; }
.skeleton-title {
  height: 24px;
  margin-bottom: 12px;
  width: 40%;
}
.skeleton-card {
  height: 180px;
  margin-bottom: 16px;
}
.skeleton-stat {
  height: 120px;
  margin-bottom: 16px;
}
.skeleton-table-row {
  height: 48px;
  margin-bottom: 8px;
}

/* Login Screen */
.empty { padding: 48px; text-align: center; color: var(--muted); }
.login-wrap {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(ellipse at 50% 0%, rgba(99, 102, 241, 0.08) 0%, var(--bg) 60%);
}
.login-card {
  width: min(420px, 100%);
  padding: 40px 36px;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(99, 102, 241, 0.05);
}
.login-card .brand { padding: 0 0 28px; }
.login-card h1 {
  font: 700 28px var(--font-heading);
  margin: 0 0 8px;
  letter-spacing: -0.03em;
}
.login-card > p { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
.login-card .btn { width: 100%; padding: 14px; font-size: 14px; }
.notice {
  padding: 14px 18px;
  border: 1px solid rgba(234, 179, 8, 0.2);
  background: rgba(234, 179, 8, 0.05);
  color: #fbbf24;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  margin-top: 20px;
  line-height: 1.5;
}
.bar {
  height: 7px;
  border-radius: 99px;
  background: var(--panel2);
  overflow: hidden;
  margin-top: 8px;
}
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.resource { margin: 16px 0; }
.resource-head { display: flex; justify-content: space-between; font-size: 12.5px; }
.mobile-menu { display: none; }

/* VPS Dashboard Details & Tabs */
.vps-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.vps-title-wrap { display: flex; flex-direction: column; gap: 10px; }
.vps-title { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.vps-title h1 {
  font: 700 32px var(--font-heading);
  margin: 0;
  letter-spacing: -0.04em;
}
.vps-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge {
  padding: 5px 12px;
  border-radius: 7px;
  font-size: 11.5px;
  font-weight: 600;
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--text-dim);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.badge.running {
  background: rgba(34, 197, 94, 0.1);
  border-color: rgba(34, 197, 94, 0.3);
  color: var(--green);
}
.badge.stopped {
  background: rgba(239, 68, 68, 0.1);
  border-color: rgba(239, 68, 68, 0.3);
  color: var(--red);
}
.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.metric-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  display: flex;
  flex-direction: column;
}
.metric-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.04em;
}
.metric-val {
  font: 700 28px var(--font-heading);
  margin: 10px 0 4px;
  color: #fff;
  letter-spacing: -0.03em;
}
.metric-sub { font-size: 12px; color: var(--muted); }
.progress {
  height: 7px;
  border-radius: 6px;
  background: var(--panel2);
  overflow: hidden;
  margin-top: 14px;
}
.progress-bar {
  height: 100%;
  border-radius: 6px;
  background: var(--accent);
  transition: width 0.4s ease;
}
.progress-bar.green { background: var(--green); }
.progress-bar.blue { background: var(--blue); }
.progress-bar.purple { background: var(--purple); }

.tab-nav {
  display: flex;
  gap: 6px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
  overflow-x: auto;
}
.tab-btn {
  padding: 12px 20px;
  background: transparent;
  color: var(--muted);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  font-weight: 600;
  font-size: 13px;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: all var(--transition);
}
.tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.02); }
.tab-btn.active {
  color: #fff;
  border-color: var(--accent);
  background: var(--panel);
}

.spec-cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.spec-box {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
}
.spec-box h4 {
  margin: 0 0 18px;
  font: 700 15px var(--font-heading);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: -0.02em;
}
.spec-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  font-size: 13px;
}
.spec-row:last-child { border-bottom: 0; }
.spec-row .k { color: var(--muted); }
.spec-row .v { font-weight: 600; color: var(--text); text-align: right; }

.chart-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.chart-box {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
}
.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.chart-header h4 {
  margin: 0;
  font: 600 14px var(--font-heading);
}

/* Media Queries */
@media(max-width:1100px){
  .metric-grid{grid-template-columns:repeat(2,1fr)}
  .spec-cards{grid-template-columns:1fr}
  .chart-grid{grid-template-columns:1fr}
}
@media(max-width:1000px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
  .server-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
  .sidebar{
    transform:translateX(-100%);
    width:280px;
  }
  .sidebar.open{
    transform:translateX(0);
  }
  .main{
    margin-left:0;
    width:100%;
  }
  .topbar{padding:0 20px}
  .content{padding:24px 16px}
  .mobile-menu{display:inline-flex}
  .topbar .crumb{margin-right:auto;margin-left:12px;font-size:15px}
  .stats{gap:12px}
  .stat{padding:18px}
  .stat-value{font-size:26px}
  .page-head{flex-direction:column}
  .form-grid{grid-template-columns:1fr}
  .metric-grid{grid-template-columns:1fr}

/* Live Status Indicator Pill */
.live-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 11px;
  border-radius: 20px;
  background: rgba(34, 197, 94, 0.08);
  border: 1px solid rgba(34, 197, 94, 0.25);
  color: var(--green);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  transition: all var(--transition);
  user-select: none;
}
.live-status-pill.offline {
  background: rgba(239, 68, 68, 0.08);
  border-color: rgba(239, 68, 68, 0.25);
  color: var(--red);
}
.live-status-pill.reconnecting {
  background: rgba(234, 179, 8, 0.08);
  border-color: rgba(234, 179, 8, 0.25);
  color: var(--yellow);
}
.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px rgba(34, 197, 94, 0.8);
  animation: livePillPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  flex-shrink: 0;
}
.live-status-pill.offline .live-dot {
  background: var(--red);
  box-shadow: none;
  animation: none;
}
.live-status-pill.reconnecting .live-dot {
  background: var(--yellow);
  box-shadow: 0 0 6px rgba(234, 179, 8, 0.8);
  animation: livePillPulse 1s infinite;
}
@keyframes livePillPulse {
  0% { transform: scale(0.9); opacity: 0.8; }
  50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px rgba(34, 197, 94, 1); }
  100% { transform: scale(0.9); opacity: 0.8; }
}

/* Brand Logo Image in Navbar & Login */
.brand-custom-logo {
  height: 32px;
  width: auto;
  max-width: 40px;
  object-fit: contain;
  border-radius: 6px;
}
.brand-name-text {
  font-family: var(--font-heading);
  font-weight: 700;
  letter-spacing: -0.02em;
  font-size: 16px;
  color: #fff;
}

}
.settings-card {

.settings-card-icon .svg-ico {

.settings-card-icon.icon-brand,

function toast(message, type = "success") {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  const icon = type === "error" ? ico("alert", "", "color:var(--red)") : type === "warning" ? ico("zap", "", "color:var(--yellow)") : ico("check", "", "color:var(--green)");
  el.innerHTML = `<span style="font-size:15px">${icon}</span><span style="flex:1">${esc(message)}</span><button type="button" class="toast-close" title="Dismiss">×</button>`;
  el.querySelector(".toast-close").onclick = () => el.remove();
  $("#toastRoot").append(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, type === "error" ? 8000 : 4000);
}

async function api(url, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (state.csrf && opts.method && opts.method !== "GET") headers["x-csrf-token"] = state.csrf;
  const r = await fetch("/api" + url, { credentials: "same-origin", ...opts, headers });
  let data = {};
  try { data = await r.json(); } catch {}
  if (!r.ok) {
    if (r.status === 401 && url !== "/auth/login") {
      state.user = null;
      renderLogin();
    }
    throw new Error(data.error || `Request failed (${r.status})`);
  }
  return data;
}

// --- Login ---
$("#root").addEventListener("submit", async e => {
  if (e.target.id !== "loginForm") return;
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const d = await api("/auth/login", { method: "POST", body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") }) });
    state.user = d.user;
    state.csrf = d.csrfToken;
    await loadDashboard();
  } catch (err) {
    toast(err.message, "error");
  }
});

function renderBrandLogo(customClass = "") {
  const s = state.settings || {};
  const iconUrl = s.site_icon_url;
  const siteName = s.site_name || "ALPM";
  const initial = (siteName.trim()[0] || "A").toUpperCase();
  const iconHtml = iconUrl
    ? `<img class="brand-logo-img" src="${esc(iconUrl)}" alt="${esc(siteName)}" onerror="this.outerHTML='<span class=\\'brand-mark\\'>${esc(initial)}</span>'">`
    : `<span class="brand-mark">${esc(initial)}</span>`;
  return `<div class="brand ${customClass}">${iconHtml}<span>${esc(siteName)}</span></div>`;
}

function renderUserAvatar(user, customClass = "avatar", style = "") {
  const u = user || state.user || {};
  const initial = (u.username?.[0] || "U").toUpperCase();
  const st = style ? ` style="${style}"` : "";
  if (u.avatar_url) {

}

function formatDate(str) {
  if (!str) return "—";
  try {
    const d = new Date(str);
    return isNaN(d) ? str : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  } catch {
    return str;
  }
}

function applySiteBackground(type, url, opacity, blur) {
  let container = $("#siteCustomBg");
  if (!container) {
    container = document.createElement("div");
    container.id = "siteCustomBg";
    container.className = "site-bg-container";
    container.setAttribute("aria-hidden", "true");
    container.innerHTML = '<div id="siteBgMediaWrap" class="site-bg-media-wrap"></div><div id="siteBgOverlay" class="site-bg-overlay"></div>';
    document.body.prepend(container);
  }

  const mediaWrap = $("#siteBgMediaWrap") || container.querySelector(".site-bg-media-wrap");
  const overlay = $("#siteBgOverlay") || container.querySelector(".site-bg-overlay");
  const numOpacity = (opacity !== undefined && opacity !== null && opacity !== "") ? Math.min(100, Math.max(0, Number(opacity))) : 55;
  const numBlur = (blur !== undefined && blur !== null && blur !== "") ? Math.min(30, Math.max(0, Number(blur))) : 0;

  if (overlay) {
    overlay.style.backgroundColor = `rgba(10, 10, 10, ${numOpacity / 100})`;
    overlay.style.backdropFilter = numBlur > 0 ? `blur(${numBlur}px)` : "none";
    overlay.style.webkitBackdropFilter = numBlur > 0 ? `blur(${numBlur}px)` : "none";
  }

  const trimmedUrl = (url || "").trim();
  const effectiveType = (type === "image" || type === "video") && trimmedUrl ? type : "none";

  if (effectiveType === "none") {
    document.body.classList.remove("has-custom-bg");
    container.classList.remove("active");
    if (mediaWrap) mediaWrap.innerHTML = "";
    return;
  }

  document.body.classList.add("has-custom-bg");
  container.classList.add("active");

  if (!mediaWrap) return;

  if (effectiveType === "image") {
    const currentImg = mediaWrap.querySelector("img");
    if (currentImg && currentImg.getAttribute("src") === trimmedUrl) return;
    mediaWrap.innerHTML = `<img src="${esc(trimmedUrl)}" class="site-bg-media" alt="Background" onerror="console.warn('Custom background image failed to load.');">`;
  } else if (effectiveType === "video") {
    let vid = mediaWrap.querySelector("video");
    const currentSrc = vid ? (vid.getAttribute("data-src") || vid.currentSrc || vid.src) : "";
    if (vid && currentSrc === trimmedUrl) {
      if (vid.paused) vid.play().catch(() => {});
      return;
    }
    mediaWrap.innerHTML = `
      <video class="site-bg-media" autoplay loop muted playsinline preload="auto" referrerpolicy="no-referrer" data-src="${esc(trimmedUrl)}">
        <source src="${esc(trimmedUrl)}" type="video/mp4">
        <source src="${esc(trimmedUrl)}" type="video/webm">
      </video>
    `;
    vid = mediaWrap.querySelector("video");
    if (vid) {
      vid.muted = true;
      vid.defaultMuted = true;
      vid.volume = 0;
      vid.play().catch(e => {
        console.warn("Background video autoplay blocked:", e);
      });
      const resumeOnGesture = () => {
        if (vid && vid.paused) vid.play().catch(() => {});
        document.removeEventListener("click", resumeOnGesture);
        document.removeEventListener("keydown", resumeOnGesture);
      };
      document.addEventListener("click", resumeOnGesture, { once: true });
      document.addEventListener("keydown", resumeOnGesture, { once: true });
    }
  }
}

function applySiteSettings(settings) {
  if (!settings) return;
  state.settings = { ...(state.settings || {}), ...settings };
  const s = state.settings;
  const name = s.site_name || "ALPM";
  const desc = s.site_description || "High-Performance Cloud & VPS Infrastructure Management";
  const seoDesc = s.seo_description || desc;
  const ogImg = s.og_image_url || "";
  const fav = s.site_favicon_url || "/favicon.ico";

  // Background Customization
  const bgType = s.site_bg_type || "none";
  const bgUrl = s.site_bg_url || "";
  const bgOpacity = s.site_bg_opacity !== undefined ? s.site_bg_opacity : 55;
  const bgBlur = s.site_bg_blur !== undefined ? s.site_bg_blur : 0;
  applySiteBackground(bgType, bgUrl, bgOpacity, bgBlur);

  // Document Title
  const baseTitle = `${name} — Cloud & VPS Management Panel`;
  if (document.title.includes("—")) {
    const parts = document.title.split("—");
    if (parts.length > 1) {
      document.title = `${name} — ${parts.slice(1).join("—").trim()}`;
    } else {
      document.title = baseTitle;
    }
  } else {
    document.title = baseTitle;
  }

  // Favicon Link
  const favEl = $("#siteFaviconLink") || document.querySelector("link[rel*='icon']");
  if (favEl) favEl.href = fav;

  // Meta Description
  const metaDesc = $("#metaDescription");
  if (metaDesc) metaDesc.content = seoDesc;

  // OG Title & Desc & Image
  const ogTitleEl = $("#ogTitle");
  if (ogTitleEl) ogTitleEl.content = name;
  const ogDescEl = $("#ogDescription");
  if (ogDescEl) ogDescEl.content = seoDesc;
  const ogImgEl = $("#ogImage");
  if (ogImgEl) ogImgEl.content = ogImg;

  // Update rendered brands in DOM
  $$(".sidebar .brand, .login-card .brand, aside .brand, #previewSidebarBrand").forEach(b => {
    if (b.id === "previewSidebarBrand") return; // Handled by settings live preview
    const initial = (name.trim()[0] || "A").toUpperCase();
    const iconUrl = s.site_icon_url;
    const iconHtml = iconUrl
      ? `<img class="brand-logo-img" src="${esc(iconUrl)}" alt="${esc(name)}" onerror="this.outerHTML='<span class=\\'brand-mark\\'>${esc(initial)}</span>'">`
      : `<span class="brand-mark">${esc(initial)}</span>`;
    b.innerHTML = `${iconHtml}<span>${esc(name)}</span>`;
  });
}

async function handleRootClick(e) {
  if (e.target.closest("#logoutBtn")) return;
  const nav = e.target.closest("[data-page]");
  if (nav) {
    if (state.page === "vps" && nav.dataset.page !== "vps" && liveSocket && state.currentServerId) {
      liveSocket.emit("unsubscribe_vps", { id: state.currentServerId });
    }
    state.page = nav.dataset.page;
    // Reset form states on navigation
    if (state.page === "create-vps") state.createVpsState = { type: "qemu", source: "template", ip4Type: "dhcp", ip6Type: "disabled", nodeId: null, cachedData: null };
    if (state.page === "vps") state.editVpsState = { ip4Type: "dhcp", ip6Type: "auto" };
    $("#sidebar")?.classList.remove("open");
    $("#sidebarBackdrop")?.classList.remove("open");
    await renderPage();
    return;
  }
  const act = e.target.closest("[data-action]");
  if (act) {
    const action = act.dataset.action, id = Number(act.dataset.id);
    if (action === "create-vps") { state.page = "create-vps"; return renderPage(); }
    if (action === "server") return openServer(id);
    if (action === "back-servers") {
      if (liveSocket && state.currentServerId) {
        liveSocket.emit("unsubscribe_vps", { id: state.currentServerId });
      }
      state.page = "servers";
      return renderPage();
    }
    if (action === "view-node") return openNode(id);
    if (action === "back-nodes") { state.page = "nodes"; return renderPage(); }
    if (action === "node-refresh") return renderPage();
    if (action === "node-tab") { state.nodeTab = act.dataset.tab; return renderPage(); }
    if (action === "vps-refresh") return renderPage();
    if (action === "vps-tab") { state.vpsTab = act.dataset.tab; return renderPage(); }
    if (action === "snapshot-rollback") return rollbackSnapshot(id, act.dataset.snap);
    if (action === "reinstall-vps") return reinstallModal(id);
    if (action === "edit-vps") return openEditVps(id);
    if (action === "clone-vps") return cloneModal(id);
    if (action === "console-vps") return consoleModal(id);
    if (action === "create-backup") return createBackupModal(id);
    if (action === "restore-backup") return restoreBackup(id, act.dataset.volid);
    if (action === "delete-backup") return deleteBackup(id, act.dataset.volid);
    if (action === "power") { await serverAction(id, act.dataset.power); if (state.page === "vps") await renderPage(); return; }
    if (action === "snapshot") { await createSnapshot(id); if (state.page === "vps") await renderPage(); return; }
    if (action === "add-user") return userModal();
    if (action === "add-node") return nodeModal();
    if (action === "edit-node") return editNodeModal(id);
    if (action === "delete-node") return deleteNode(id);
    if (action === "assign") return assignModal();
    if (action === "refresh") return renderPage();
    if (action === "toggle-user") return toggleUser(id, act.dataset.active === "1");
    if (action === "delete-user") return deleteUser(id);
    if (action === "test-node") return testNode(id);
    if (action === "toggle-node") return toggleNode(id, act.dataset.enabled === "1");
    if (action === "unassign") return unassign(id, act.dataset.name, act.dataset.vmid);
  }
}

async function updateServerStatuses(rows) {
  if (!rows || !rows.length) return;
  // Use Promise.all to fetch statuses in parallel
  const promises = rows.map(async (s) => {
    try {
      const d = await api(`/servers/${s.id}/status`);
      const status = d.status?.status || "unknown";
      s.status = status;
      s.uptime = d.status?.uptime || 0;
      const el = $(`#server-status-${s.id}`);
      if (el) {
        const isRunning = status === "running";
        const isStopped = status === "stopped";
        const dotClass = isRunning ? "running" : (isStopped ? "stopped" : "");
        const statusText = isRunning ? "Running" : (isStopped ? "Stopped" : status);
        const statusColor = isRunning ? "var(--green)" : (isStopped ? "var(--red)" : "var(--muted)");
        el.innerHTML = `<i class="dot ${dotClass}"></i><span style="color:${statusColor};font-weight:600;text-transform:capitalize">${statusText}</span>`;
      }
    } catch {}
  });
  await Promise.all(promises);
}

function filterServers(servers) {
  return servers.filter(s => {
    if (state.vpsFilterType === "running" && s.status !== "running") return false;
    if (state.vpsFilterType === "stopped" && s.status !== "stopped") return false;
    if (state.vpsFilterType === "qemu" && s.type !== "qemu") return false;
    if (state.vpsFilterType === "lxc" && s.type !== "lxc") return false;
    if (state.vpsSearchQuery) {
      const q = state.vpsSearchQuery.toLowerCase();
      const matchName = (s.name || "").toLowerCase().includes(q);
      const matchVmid = String(s.vmid || "").includes(q);
      const matchNode = (s.pve_node || s.node_name || "").toLowerCase().includes(q);
      const matchOwner = (s.username || "").toLowerCase().includes(q);
      if (!matchName && !matchVmid && !matchNode && !matchOwner) return false;
    }
    return true;
  });
}

async function vpsDashboardPage(c) {
  const id = state.currentServerId;
  let s = (state.servers || []).find(x => x.id === id);
  if (!s) {
    try { const d = await api("/dashboard"); state.servers = d.servers; s = (state.servers || []).find(x => x.id === id); } catch {}
  }
  if (!s) {
    c.innerHTML = `<div class="panel"><div class="empty">VPS #${id} not found. <br><br><button class="btn" data-action="back-servers">${ico("arrowLeft")} Back to servers</button></div></div>`;
    return;
  }
  c.innerHTML = '<div class="empty">Loading full VPS details & live metrics…</div>';
  try {
    const [st, cfg, snaps, rrdData] = await Promise.all([
      api(`/servers/${id}/status`),
      api(`/servers/${id}/config`),
      api(`/servers/${id}/snapshots`),
      api(`/servers/${id}/rrd?timeframe=hour`).catch(() => ({ rrd: [] }))
    ]);
    const status = st.status || {}, cData = cfg.config || {}, snapshots = snaps.snapshots || [], rrd = rrdData.rrd || [];
    const isRunning = status.status === "running", isStopped = status.status === "stopped", statusText = isRunning ? "Running" : (isStopped ? "Stopped" : (status.status || "Unknown"));
    const cpuPct = status.cpu != null ? (status.cpu * 100).toFixed(1) : "0.0";
    const cpuCores = status.cpus || cData.cores || 1, cpuSockets = cData.sockets || 1, cpuModel = cData.cpu || "host / default";
    const memUsed = status.mem || 0, memMax = status.maxmem || (cData.memory ? cData.memory * 1024 * 1024 : 1);
    const memPct = memMax > 0 ? ((memUsed / memMax) * 100).toFixed(1) : "0.0";
    const memFree = status.freemem || Math.max(0, memMax - memUsed);
    let diskMax = status.maxdisk || 0;
    let primaryDiskKey = s.type === "lxc" ? "rootfs" : "scsi0", primaryDiskVal = "";
    if (s.type === "lxc") {
      primaryDiskVal = cData.rootfs || "";
    } else {
      for (let i = 0; i < 16; i++) {
        for (const p of ["scsi", "sata", "virtio", "ide"]) {
          const v = cData[`${p}${i}`];
          if (v && typeof v === "string" && !v.includes("media=cdrom") && !v.includes("cloudinit") && !v.includes("none")) {
            primaryDiskKey = `${p}${i}`; primaryDiskVal = v; break;
          }
        }
        if (primaryDiskVal) break;
      }
    }
    if (!diskMax && primaryDiskVal) {
      const m = primaryDiskVal.match(/size=([0-9.]+)([GMKT])/i);
      if (m) {
        const n = parseFloat(m[1]), u = m[2].toUpperCase();
        diskMax = u === "M" ? n * 1024 * 1024 : (u === "T" ? n * 1024 * 1024 * 1024 * 1024 : n * 1024 * 1024 * 1024);
      }
    }
    const diskRead = status.diskread || 0, diskWrite = status.diskwrite || 0;
    const netRx = status.netin || 0, netTx = status.netout || 0, nicName = Object.keys(status.nics || {})[0] || `tap${s.vmid}i0`;

9,68,68,0.3);background:rgba(239,68,68,0.1);color:#fca5a5" title="Remove assignment from user (keeps Proxmox VM safe)">${ico("ban")} Unassign VPS</button>` : ""}${isRunning ? `<button class="btn danger" data-action="power" data-id="${id}" data-power="stop">${ico("stop")} Stop</button><button class="btn" data-action="power" data-id="${id}" data-power="shutdown">${ico("pause")} Shutdown</button><button class="btn" data-action="power" data-id="${id}" data-power="reboot">${ico("refresh")} Reboot</button><button class="btn danger" data-action="power" data-id="${id}" data-power="reset">${ico("zap")} Reset</button>` : `<button class="btn success" data-action="power" data-id="${id}" data-power="start">${ico("play")} Start VPS</button>`}</div></div><div class="metric-grid"><div class="metric-card" id="metricCardCpu"><div class="metric-top"><span>CPU LOAD</span><span id="metricCpuTop" style="color:${cpuPct > 80 ? 'var(--red)' : 'var(--accent)'}">${cpuPct}%</span></div><div class="metric-val" id="metricCpuVal">${cpuPct}%</div><div class="metric-sub" id="metricCpuSub">${cpuCores} vCPU (${cpuSockets} socket · ${esc(cpuModel)})</div><div class="progress"><div class="progress-bar" id="metricCpuBar" style="width:${Math.min(100, Math.max(1, cpuPct))}%"></div></div></div><div class="metric-card" id="metricCardRam"><div class="metric-top"><span>MEMORY (RAM)</span><span id="metricRamTop">${memPct}%</span></div><div class="metric-val" id="metricRamVal">${formatBytes(memUsed)}</div><div class="metric-sub" id="metricRamSub">of ${formatBytes(memMax)} (${formatBytes(memFree)} free)</div><div class="progress"><div class="progress-bar green" id="metricRamBar" style="width:${Math.min(100, Math.max(1, memPct))}%"></div></div></div><div class="metric-card" id="metricCardDisk"><div class="metric-top"><span>STORAGE (DISK I/O)</span><span>${formatBytes(diskMax)}</span></div><div class="metric-val" id="metricDiskVal">${formatBytes(diskRead + diskWrite)}</div><div class="metric-sub" id="metricDiskSub">Read: ${formatBytes(diskRead)} · Write: ${formatBytes(diskWrite)}</div><div class="progress"><div class="progress-bar blue" style="width:100%"></div></div></div><div class="metric-card" id="metricCardNet"><div class="metric-top"><span>NETWORK TRAFFIC</span><span>${nicName}</span></div><div class="metric-val" id="metricNetVal">${formatBytes(netRx + netTx)}</div><div class="metric-sub" id="metricNetSub">RX: ${formatBytes(netRx)} · TX: ${formatBytes(netTx)}</div><div class="progress"><div class="progress-bar purple" style="width:100%"></div></div></div></div><div class="tab-nav"><button class="tab-btn ${state.vpsTab === 'specs' ? 'active' : ''}" data-action="vps-tab" data-tab="specs">${ico("monitor")} Hardware & Specs</button><button class="tab-btn ${state.vpsTab === 'edit' ? 'active' : ''}" data-action="vps-tab" data-tab="edit">${ico("edit")} Edit VPS Specs</button><button class="tab-btn ${state.vpsTab === 'backups' ? 'active' : ''}" data-action="vps-tab" data-tab="backups">${ico("backup")} Backups</button><button class="tab-btn ${state.vpsTab === 'performance' ? 'active' : ''}" data-action="vps-tab" data-tab="performance">${ico("chart")} Performance & Live Graphs</button><button class="tab-btn ${state.vpsTab === 'reinstall' ? 'active' : ''}" data-action="vps-tab" data-tab="reinstall">${ico("disc")} Reinstall OS</button><button class="tab-btn ${state.vpsTab === 'snapshots' ? 'active' : ''}" data-action="vps-tab" data-tab="snapshots">${ico("camera")} Snapshots (${snapshots.length})</button><button class="tab-btn ${state.vpsTab === 'config' ? 'active' : ''}" data-action="vps-tab" data-tab="config">${ico("gear")} Proxmox Raw Config</button></div><div id="vpsTabContent">${renderVpsTabContent(s, status, cData, snapshots, rrd)}</div>`;
  } catch (err) {
    c.innerHTML = `<div class="panel"><div class="empty">Error loading VPS details: ${esc(err.message)} <br><br><button class="btn" data-action="back-servers">Go back</button></div></div>`;

}

function renderVpsTabContent(s, status, cData, snapshots, rrd) {
  if (state.vpsTab === "edit") {
    // Use requestAnimationFrame to wait for DOM
    requestAnimationFrame(() => loadEditVpsTab(s.id));

  }
  if (state.vpsTab === "backups") {
    requestAnimationFrame(() => loadBackupsTab(s.id));
    return `<div class="panel" id="backupsTabWrap"><div class="empty">Loading Proxmox VZDump backups…</div></div>`;
  }
  if (state.vpsTab === "reinstall") {
    requestAnimationFrame(() => loadReinstallTab(s.id));
    return `<div class="panel" id="reinstallTabWrap"><div class="empty">Loading OS templates and reinstallation options…</div></div>`;
  }
  if (state.vpsTab === "performance") {
    const cpuPts = rrd.map(x => (x.cpu || 0) * 100);
    const memPts = rrd.map(x => ((x.mem || 0) / (x.maxmem || 1)) * 100);
    const netRxPts = rrd.map(x => (x.netin || 0) / 1024);
    const diskWrPts = rrd.map(x => (x.diskwrite || 0) / 1024);
    return `<div class="chart-grid"><div class="chart-box"><div class="chart-header"><h4>CPU Load History (%)</h4><span class="small muted">Past hour · Cores: ${status.cpus || cData.cores || 1}</span></div>${sparklineSVG(cpuPts, 480, 110, "#6366f1")}</div><div class="chart-box"><div class="chart-header"><h4>Memory Usage History (%)</h4><span class="small muted">Total: ${formatBytes(status.maxmem)}</span></div>${sparklineSVG(memPts, 480, 110, "#22c55e")}</div><div class="chart-box"><div class="chart-header"><h4>Network Traffic Rate (KB/s)</h4><span class="small muted">RX (Inbound) rate</span></div>${sparklineSVG(netRxPts, 480, 110, "#38bdf8")}</div><div class="chart-box"><div class="chart-header"><h4>Disk Write Throughput (KB/s)</h4><span class="small muted">Storage writes</span></div>${sparklineSVG(diskWrPts, 480, 110, "#a855f7")}</div></div>`;
  }
  if (state.vpsTab === "snapshots") {
    return `<div class="panel"><div class="panel-title"><h3>VPS Snapshots</h3><button class="btn primary small" data-action="snapshot" data-id="${s.id}">${ico("plus")} Create Snapshot</button></div><div class="table-wrap"><table><thead><tr><th>NAME</th><th>DESCRIPTION</th><th>DATE & TIME</th><th>STATUS</th><th>ACTIONS</th></tr></thead><tbody>${snapshots.map(x => `<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.description || "—")}</td><td>${x.snaptime ? new Date(x.snaptime * 1000).toLocaleString() : "—"}</td><td>${x.running ? '<span style="color:var(--green)">Live RAM</span>' : 'Disk only'}</td><td>${x.name !== "current" ? `<button class="btn small" data-action="snapshot-rollback" data-id="${s.id}" data-snap="${esc(x.name)}">Rollback</button>` : '<span class="muted small">—</span>'}</td></tr>`).join("") || '<tr><td colspan="5" class="empty">No snapshots found for this VPS.</td></tr>'}</tbody></table></div></div>`;
  }
  if (state.vpsTab === "config") {
    const entries = Object.entries(cData);
    // Use requestAnimationFrame for the search listener
    requestAnimationFrame(() => {
      const searchInput = $("#configSearchInput");
      if (searchInput) {
        searchInput.oninput = () => {
          const q = searchInput.value.toLowerCase().trim();
          $$(".config-row").forEach(r => {
            const k = r.dataset.key || "";
            r.style.display = k.includes(q) ? "" : "none";
          });
        };
      }
    });
    return `<div class="panel"><div class="panel-title"><div><h3>All Proxmox Configuration Parameters</h3><p class="muted small" style="margin:2px 0 0">${entries.length} raw configuration key-value pairs</p></div><input type="text" id="configSearchInput" placeholder="Filter keys (e.g. net, cpu, scsi)…" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 14px;color:#fff;font-size:12px;width:260px"></div><div class="table-wrap"><table><thead><tr><th>PARAMETER / KEY</th><th>VALUE</th></tr></thead><tbody id="configTableBody">${entries.map(([k, v]) => `<tr class="config-row" data-key="${esc(k.toLowerCase())}"><td style="font-family:'Space Grotesk',monospace;color:var(--accent)">${esc(k)}</td><td style="font-family:'Space Grotesk',monospace;font-weight:600">${esc(typeof v === "object" ? JSON.stringify(v) : v)}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  const primaryDiskKey = s.type === "lxc" ? "rootfs" : "scsi0";
  const blockscsi = status.blockstat?.[primaryDiskKey] || status.blockstat?.scsi0 || status.blockstat?.sata0 || status.blockstat?.virtio0 || {};
  let primaryDiskVal = s.type === "lxc" ? (cData.rootfs || "") : (cData.scsi0 || "");
  return `<div class="spec-cards"><div class="spec-box"><h4>${ico("cpu")} Compute & Architecture</h4><div class="spec-row"><span class="k">CPU Cores</span><span class="v">${status.cpus || cData.cores || 1} vCPU Cores</span></div><div class="spec-row"><span class="k">CPU Sockets</span><span class="v">${cData.sockets || 1} Socket</span></div><div class="spec-row"><span class="k">CPU Type / Flags</span><span class="v">${esc(cData.cpu || "host / default")}</span></div><div class="spec-row"><span class="k">Machine Architecture</span><span class="v">${esc(cData.machine || status["running-machine"] || "pc-q35")}</span></div><div class="spec-row"><span class="k">QEMU Engine Version</span><span class="v">${esc(status["running-qemu"] || "11.0.0")}</span></div><div class="spec-row"><span class="k">NUMA Nodes</span><span class="v">${cData.numa ? "Enabled" : "Disabled"}</span></div><div class="spec-row"><span class="k">Process PID</span><span class="v">${status.pid || "—"}</span></div></div><div class="spec-box"><h4>${ico("ram")} Memory (RAM) Details</h4><div class="spec-row"><span class="k">Total Allocated RAM</span><span class="v">${formatBytes(status.maxmem || (cData.memory * 1024 * 1024))}</span></div><div class="spec-row"><span class="k">Currently Used RAM</span><span class="v">${formatBytes(status.mem)}</span></div><div class="spec-row"><span class="k">Free / Available RAM</span><span class="v">${formatBytes(status.freemem || Math.max(0, (status.maxmem || 0) - (status.mem || 0)))}</span></div><div class="spec-row"><span class="k">Memory Balloon</span><span class="v">${status.balloon ? formatBytes(status.balloon) : (cData.balloon ? formatBytes(cData.balloon * 1024 * 1024) : "Static")}</span></div><div class="spec-row"><span class="k">Host Footprint</span><span class="v">${formatBytes(status.memhost)}</span></div><div class="spec-row"><span class="k">Swap Out</span><span class="v">${status.ballooninfo?.mem_swapped_out ? formatBytes(status.ballooninfo.mem_swapped_out) : "0 B"}</span></div></div><div class="spec-box"><h4>${ico("backup")} Storage & Disks</h4><div class="spec-row"><span class="k">Boot Drive (${esc(primaryDiskKey)})</span><span class="v" style="font-family:'Space Grotesk',monospace;font-size:12px">${esc(primaryDiskVal || "—")}</span></div><div class="spec-row"><span class="k">Disk Controller</span><span class="v">${esc(cData.scsihw || "virtio-scsi-single")}</span></div><div class="spec-row"><span class="k">Boot Sequence</span><span class="v">${esc(cData.boot || "scsi0; net0")}</span></div><div class="spec-row"><span class="k">Total Provisioned Disk</span><span class="v">${status.maxdisk ? formatBytes(status.maxdisk) : "—"}</span></div><div class="spec-row"><span class="k">Total Disk Read</span><span class="v">${formatBytes(status.diskread)}</span></div><div class="spec-row"><span class="k">Total Disk Written</span><span class="v">${formatBytes(status.diskwrite)}</span></div><div class="spec-row"><span class="k">Read Operations (IOPS)</span><span class="v">${blockscsi.rd_operations ? blockscsi.rd_operations.toLocaleString() : "—"}</span></div><div class="spec-row"><span class="k">Write Operations (IOPS)</span><span class="v">${blockscsi.wr_operations ? blockscsi.wr_operations.toLocaleString() : "—"}</span></div></div><div class="spec-box"><h4>${ico("network")} Network & Identity</h4><div class="spec-row"><span class="k">Network Adapter (net0)</span><span class="v" style="font-family:'Space Grotesk',monospace;font-size:12px">${esc(cData.net0 || "—")}</span></div><div class="spec-row"><span class="k">Hardware MAC Address</span><span class="v" style="font-family:'Space Grotesk',monospace">${cData.net0 ? (cData.net0.match(/(?:virtio|hwaddr|macaddr)=([A-Fa-f0-9:]+)/)?.[1] || "—") : "—"}</span></div><div class="spec-row"><span class="k">Virtual Bridge</span><span class="v">${cData.net0 ? (cData.net0.match(/bridge=([^,]+)/)?.[1] || "—") : "—"}</span></div><div class="spec-row"><span class="k">Host Interface</span><span class="v">${Object.keys(status.nics || {}).join(", ") || `tap${s.vmid}i0`}</span></div><div class="spec-row"><span class="k">Total Received (RX)</span><span class="v" style="color:var(--blue)">${formatBytes(status.netin)}</span></div><div class="spec-row"><span class="k">Total Transmitted (TX)</span><span class="v" style="color:var(--accent)">${formatBytes(status.netout)}</span></div><div class="spec-row"><span class="k">Proxmox PVE Node</span><span class="v">${esc(s.pve_node || s.node_name)}</span></div><div class="spec-row"><span class="k">SMBIOS UUID</span><span class="v" style="font-size:11px;font-family:'Space Grotesk',monospace">${esc(cData.smbios1 ? cData.smbios1.replace("uuid=", "") : "—")}</span></div></div></div>`;
}

async function serverAction(id, action) {
  const s = (state.servers || []).find(x => x.id === id) || { id, name: "VPS", vmid: "" };
  const act = String(action).toLowerCase();
  const isDestructive = act === "stop" || act === "reset";
  const actIcons = {
    start: "play",
    stop: "stop",
    shutdown: "stop",
    reboot: "refresh",
    reset: "refresh"
  };
  const actColors = {
    start: "primary",
    shutdown: "warning",
    stop: "danger",
    reboot: "warning",
    reset: "danger"
  };
  const ok = await modalConfirm({
    title: `${action.toUpperCase()} Virtual Machine`,
    subtitle: `Target: ${s.name} (VMID ${s.vmid || id})`,
    message: isDestructive
      ? `Are you sure you want to forcefully ${action} this virtual machine? Any unsaved data in the guest operating system might be lost.`
      : `Are you sure you want to send a ${action} signal to "${s.name}"?`,
    confirmText: `${action.charAt(0).toUpperCase() + action.slice(1)} VPS`,
    type: actColors[act] || "warning",
    icon: actIcons[act] || "zap"
  });
  if (!ok) return;
  try {
    await api(`/servers/${id}/action`, { method: "POST", body: JSON.stringify({ action }) });
    toast(`Power action "${action}" submitted successfully.`);
    if (state.page === "vps") await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function createSnapshot(id) {
  const s = (state.servers || []).find(x => x.id === id) || { id, name: "VPS", vmid: "" };
  const defaultSnapName = `snap-${new Date().toISOString().slice(0, 10).replace(/-/g, "")}`;
  const name = await modalPrompt({
    title: "Create Proxmox Snapshot",
    subtitle: `Target: ${s.name} (VMID ${s.vmid || id})`,
    message: "Capture the current state and disk data of this virtual machine. You can rollback to this snapshot at any time.",
    inputLabel: "Snapshot Identifier / Name",
    placeholder: "e.g. backup-before-upgrade",
    defaultValue: defaultSnapName,
    confirmText: "Create Snapshot",
    icon: "camera",
    validator: (val) => {
      if (!val) return "Snapshot name is required.";
      if (!/^[a-zA-Z0-9_\-]+$/.test(val)) return "Only letters, numbers, hyphens (-) and underscores (_) are allowed.";
      return null;
    }
  });
  if (!name) return;
  try {
    await api(`/servers/${id}/snapshots`, { method: "POST", body: JSON.stringify({ name }) });
    toast("Snapshot task submitted.");
    if (state.page === "vps") await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function rollbackSnapshot(id, name) {
  const s = (state.servers || []).find(x => x.id === id) || { id, name: "VPS", vmid: "" };
  const ok = await modalConfirm({
    title: "Rollback Snapshot",
    subtitle: `Target: ${s.name} (VMID ${s.vmid || id})`,
    message: `Rollback virtual machine to snapshot "${name}"?`,
    details: [
      "Current guest operating system state will be permanently replaced.",
      "Any disk modifications made since this snapshot was created will be lost.",
      "The VM may briefly reboot during the rollback process."
    ],
    confirmText: "Rollback Snapshot",
    type: "danger",
    icon: "restore"
  });
  if (!ok) return;
  try {
    await api(`/servers/${id}/snapshots/${encodeURIComponent(name)}/rollback`, { method: "POST", body: "{}" });
    toast(`Rollback to snapshot "${name}" submitted.`);
    await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function reinstallModal(id) {
  state.currentServerId = id; state.page = "vps"; state.vpsTab = "reinstall";
  // Avoid double render if already on the page
  if (state.page === "vps" && state.vpsTab === "reinstall") {
    await renderPage();
  } else {
    await renderPage();
  }
}

    }
    wrap.innerHTML = `<div class="panel-title"><div><h3>${ico("disc")} Reinstall Operating System (${esc(server.type.toUpperCase())} · VMID ${server.vmid})</h3><p class="muted small" style="margin:4px 0 0">Deploy a clean operating system template. Preserves CPU, RAM, and Network MAC configuration.</p></div></div><div class="notice" style="border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.05);color:#fca5a5;margin-top:0;margin-bottom:20px;border-radius:12px;padding:14px"><b>${ico("alert", "sm", "color:var(--red)")} WARNING: This operation will completely format the primary disk!</b><div style="font-size:12px;margin-top:4px;color:#fca5a5">All existing files, data, and user software on this VPS will be permanently wiped.</div></div>${d.datastorePermissionRequired ? `<div class="notice" style="border-color:rgba(234,179,8,0.2);background:rgba(234,179,8,0.05);color:#fbbf24;margin-top:0;margin-bottom:20px;border-radius:12px;padding:14px;font-size:12px"><b>${ico("lightbulb", "sm", "color:var(--yellow)")} Proxmox Permission Notice:</b> To clone and create new virtual disks, API token <code>${esc(server.node_name)}</code> needs the <code>PVEDatastoreUser</code> or <code>Administrator</code> role on path <code>/</code> in Proxmox VE (Datacenter -> Permissions).</div>` : ''}<form id="reinstallTabForm" style="max-width:650px"><div class="field"><label>Choose Operating System / Distribution Template</label><select name="templateId" id="reinstallTemplateSelect" required>${osOptionsHtml}</select></div><div class="field"><label style="display:flex;justify-content:space-between"><span>New Root Password (min 8 chars)</span><a href="javascript:void(0)" id="genPassTabBtn" style="color:var(--accent);font-size:11px">${ico("dice", "sm")} Generate Strong Password</a></label><div style="position:relative"><input name="password" id="reinstallTabPassword" type="password" minlength="8" required placeholder="Enter new root password" style="padding-right:45px"><button type="button" id="togglePassTabBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;color:#888;padding:4px 8px;font-size:13px">${ico("eye")}</button></div></div><div class="field"><label>Hostname (optional)</label><input name="hostname" value="${esc(server.name)}" placeholder="${esc(server.name)}"></div><div class="field"><label>SSH Public Key (optional, for passwordless root SSH)</label><textarea name="sshKey" rows="2" placeholder="ssh-ed25519 AAAAC3... or ssh-rsa AAAAB3..." style="background:#0d0d0d;border:1px solid #303030;border-radius:8px;padding:9px;color:white;width:100%;font-size:11px;font-family:'Space Grotesk',monospace;resize:vertical"></textarea></div><div style="margin:18px 0;display:flex;align-items:flex-start;gap:9px"><input type="checkbox" id="reinstallTabConfirmCheck" style="margin-top:3px;cursor:pointer"><label for="reinstallTabConfirmCheck" style="font-size:12px;color:#ddd;cursor:pointer;line-height:1.4">I confirm that I want to wipe this VPS and reinstall with the selected operating system.</label></div><button type="submit" class="btn danger" id="reinstallTabSubmitBtn" disabled style="padding:12px 24px;font-weight:700">${ico("alert")} Wipe and Reinstall OS</button></form>`;
    const passInput = $("#reinstallTabPassword"), toggleBtn = $("#togglePassTabBtn"), genBtn = $("#genPassTabBtn"), check = $("#reinstallTabConfirmCheck"), submitBtn = $("#reinstallTabSubmitBtn");
    if (toggleBtn && passInput) toggleBtn.onclick = () => { passInput.type = passInput.type === "password" ? "text" : "password"; };
    if (genBtn && passInput) genBtn.onclick = () => {
      const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*";
      let generated = "";
      for (let i = 0; i < 16; i++) generated += chars.charAt(Math.floor(Math.random() * chars.length));
      passInput.value = generated; passInput.type = "text";
      try { navigator.clipboard.writeText(generated); toast("Generated password copied to clipboard!"); } catch {}
      if (check) check.dispatchEvent(new Event("change"));
    };
    if (check && submitBtn) {
      const validate = () => { submitBtn.disabled = !check.checked || (passInput && passInput.value.length < 8); };
      check.onchange = validate;
      if (passInput) passInput.oninput = validate;
    }
    $("#reinstallTabForm").onsubmit = async e => {
      e.preventDefault();
      if (!check.checked) return toast("Please check the confirmation box.", "error");
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd);
      submitBtn.disabled = true;
      submitBtn.innerHTML = `${ico("spinner", "spin")} Reinstalling OS… Stopping VPS & cloning template…`;
      toast("Reinstallation started! This may take 30-45 seconds…");
      try {
        const res = await api(`/servers/${id}/reinstall`, { method: "POST", body: JSON.stringify(data) });
        toast(res.message || "VPS reinstalled successfully!");
        state.vpsTab = "specs";
        await renderPage();
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `${ico("alert")} Wipe and Reinstall OS`;
        toast(err.message, "error");
      }
    };
  } catch (err) { wrap.innerHTML = `<div class="empty">Error loading reinstallation options: ${esc(err.message)}</div>`; }
}

ton type="submit" class="btn primary" id="editVpsSubmitBtn" style="padding:13px 34px;font-size:14px;font-weight:700">${ico("backup")} Save & Apply Changes</button><button type="button" class="btn ghost" data-action="vps-tab" data-tab="specs" style="padding:13px 20px">Cancel</button></div><div id="editProgressNotice" class="hidden notice" style="border-color:rgba(34,197,94,0.2);background:rgba(34,197,94,0.05);color:#86efac;padding:16px;border-radius:12px"><div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px"><span>${ico("spinner", "spin")}</span> Applying configuration updates to Proxmox VE…</div><div style="font-size:12px;margin-top:6px;line-height:1.5">Sending hardware resize and network commands to node. Please do not close this window (takes approximately 5-15 seconds).</div></div></form>`;

function setupEditVpsEvents(id, d) {
  const isAdmin = state.user.role === "admin";
  if (isAdmin) {
    const btnDhcp = $("#editBtnIp4Dhcp");
    const btnStatic = $("#editBtnIp4Static");
    const ip4Fields = $("#editIp4StaticFields");
    if (btnDhcp && btnStatic) {
      btnDhcp.onclick = () => {
        state.editVpsState.ip4Type = "dhcp"; btnDhcp.className = "btn primary"; btnStatic.className = "btn ghost";
        if (ip4Fields) ip4Fields.classList.add("hidden");
      };
      btnStatic.onclick = () => {
        state.editVpsState.ip4Type = "static"; btnDhcp.className = "btn ghost"; btnStatic.className = "btn primary";
        if (ip4Fields) { ip4Fields.classList.remove("hidden"); const ipInp = $("#editIp4AddressInput"); if (ipInp) ipInp.focus(); }
      };
    }
    const ip6Select = $("#editIp6Select");
    const ip6Fields = $("#editIp6StaticFields");
    if (ip6Select && ip6Fields) {
      ip6Select.onchange = () => {
        state.editVpsState.ip6Type = ip6Select.value;
        if (ip6Select.value === "static") { ip6Fields.classList.remove("hidden"); const ip6Inp = $("#editIp6AddressInput"); if (ip6Inp) ip6Inp.focus(); }
        else { ip6Fields.classList.add("hidden"); }
      };
    }
  }
  document.querySelectorAll(".quick-edit-core").forEach(a => {
    a.onclick = () => {
      const inp = $("#editCoresInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-edit-core").forEach(c => c.classList.remove("active"));
      a.classList.add("active");
    };
  });
  document.querySelectorAll(".quick-edit-ram").forEach(a => {
    a.onclick = () => {
      const inp = $("#editMemoryInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-edit-ram").forEach(c => c.classList.remove("active"));
      a.classList.add("active");
    };
  });
  document.querySelectorAll(".quick-edit-swap").forEach(a => {
    a.onclick = () => {
      const inp = $("#editSwapInput");
      if (inp) inp.value = a.dataset.val;
      document.querySelectorAll(".quick-edit-swap").forEach(c => c.classList.remove("active"));
      a.classList.add("active");
    };
  });
  document.querySelectorAll(".quick-add-disk").forEach(a => {
    a.onclick = () => {
      const addInp = $("#editAddDiskInput");
      const totalInp = $("#editNewTotalDiskInput");
      if (addInp) addInp.value = a.dataset.val;
      if (totalInp) totalInp.value = "";
      document.querySelectorAll(".quick-add-disk").forEach(c => c.classList.remove("active"));
      a.classList.add("active");

  const addDiskInput = $("#editAddDiskInput");

        firewall: isAdmin ? (fd.get("firewall") === "on" || fd.get("firewall") === true) : undefined,
        ip4Type: isAdmin ? state.editVpsState.ip4Type : undefined,
        ip4Address: isAdmin ? (fd.get("ip4Address") || "").trim() : undefined,
        ip4Gateway: isAdmin ? (fd.get("ip4Gateway") || "").trim() : undefined,
        ip6Type: isAdmin ? state.editVpsState.ip6Type : undefined,
        ip6Address: isAdmin ? (fd.get("ip6Address") || "").trim() : undefined,
        ip6Gateway: isAdmin ? (fd.get("ip6Gateway") || "").trim() : undefined,
        searchDomain: (fd.get("searchDomain") || "").trim(),

        ciUser: (fd.get("ciUser") || "").trim(),
        password: (fd.get("password") || "").trim(),
        sshKey: (fd.get("sshKey") || "").trim(),
        nesting: fd.get("nesting") === "on" || fd.get("nesting") === true,
        qemuAgent: fd.get("qemuAgent") === "on" || fd.get("qemuAgent") === true,
        onboot: fd.get("onboot") === "on" || fd.get("onboot") === true,
        startup: (fd.get("startup") || "").trim(),
        boot: (fd.get("boot") || "").trim()
      };
      if (payload.password && payload.password.length < 8) { toast("New root password must be at least 8 characters.", "error"); return; }
      if (isAdmin && payload.ip6Type === "static") {
        if (payload.ip6Address && payload.ip6Address.includes(".") && !payload.ip6Address.includes(":")) {
          toast("Invalid IPv6 Address! You entered an IPv4 address in IPv6 field. Please use IPv4 section above.", "error");
          return;
        }
        if (payload.ip6Gateway && payload.ip6Gateway.includes(".") && !payload.ip6Gateway.includes(":")) {
          toast("Invalid IPv6 Gateway! You entered an IPv4 gateway in IPv6 Gateway field. Please use IPv4 section above.", "error");
          return;
        }

      if (isAdmin && payload.ip4Type === "static" && !payload.ip4Address) {
