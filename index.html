<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Atyro Cloud — VPS Control Panel</title>
<meta name="description" content="Next-Generation Proxmox VE VPS Cloud Management Platform" id="metaDescription">
<!-- Open Graph / Social SEO -->
<meta property="og:type" content="website">
<meta property="og:title" content="Atyro Cloud — VPS Control Panel" id="ogTitle">
<meta property="og:description" content="Next-Generation Proxmox VE VPS Cloud Management Platform" id="ogDescription">
<meta property="og:image" content="" id="ogImage">
<link rel="icon" type="image/x-icon" href="" id="siteFaviconLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Convoy-inspired Palette */
  --bg: #0a0a0a;
  --panel: #111111;
  --panel2: #161616;
  --panel-hover: #1a1a1a;
  --line: rgba(255, 255, 255, 0.06);
  --line-strong: rgba(255, 255, 255, 0.12);
  --muted: #888888;
  --text: #ededed;
  --text-dim: #b0b0b0;
  --accent: #6366f1; /* Indigo */
  --accent-hover: #818cf8;
  --accent-glow: rgba(99, 102, 241, 0.25);
  --green: #22c55e;
  --green-glow: rgba(34, 197, 94, 0.25);
  --red: #ef4444;
  --red-glow: rgba(239, 68, 68, 0.25);
  --yellow: #eab308;
  --blue: #38bdf8;
  --purple: #a855f7;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-heading: 'Space Grotesk', sans-serif;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--font-body);
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Custom Sleek Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: 0; }
a { color: inherit; text-decoration: none; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* Shell Layout */
.app { min-height: 100vh; display: flex; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 260px;
  background: #0d0d0d;
  border-right: 1px solid var(--line);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  z-index: 50;
  transition: transform var(--transition);
}
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(8px);
  z-index: 45;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition);
}
.sidebar-backdrop.open {
  display: block;
  opacity: 1;
  pointer-events: auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 12px 28px;
  font: 700 20px var(--font-heading);
  letter-spacing: -0.03em;
}
.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 18px;
  box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
  flex-shrink: 0;
}
.brand-logo-img {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  object-fit: cover;
  border: 1px solid var(--line);
  background: var(--panel2);
  flex-shrink: 0;
  display: block;
}
.nav-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  color: #555;
  font-weight: 700;
  padding: 16px 12px 8px;
  text-transform: uppercase;
}
.nav button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--muted);
  text-align: left;
  margin: 2px 0;
  font-weight: 500;
  font-size: 13.5px;
  transition: all var(--transition);
}
.nav button:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
}
.nav button.active {
  background: rgba(99, 102, 241, 0.1);
  color: var(--accent);
  font-weight: 600;
  box-shadow: inset 3px 0 var(--accent);
}
.svg-ico {
  display: inline-block;
  vertical-align: -0.16em;
  width: 1.1em;
  height: 1.1em;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.svg-ico.sm {
  width: 0.9em;
  height: 0.9em;
  vertical-align: -0.12em;
}
.svg-ico.lg {
  width: 1.35em;
  height: 1.35em;
  vertical-align: -0.22em;
}
.svg-ico.xl {
  width: 1.8em;
  height: 1.8em;
  vertical-align: -0.28em;
}
.svg-ico.spin {
  animation: svg-spin 1s linear infinite;
}
@keyframes svg-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.nav .ico {
  width: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  opacity: 0.9;
}
.nav .ico .svg-ico {
  width: 16px;
  height: 16px;
}
.stat-icon .svg-ico {
  width: 1.15em;
  height: 1.15em;
}
.btn .svg-ico {
  margin-right: 3px;
}
.btn.small .svg-ico {
  margin-right: 2px;
}
.side-bottom {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding: 16px 8px 0;
}
.user-mini {
  display: flex;
  gap: 11px;
  align-items: center;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--panel2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  font-weight: 800;
  color: var(--accent);
  font-size: 14px;
}
.main {
  margin-left: 260px;
  min-height: 100vh;
  width: calc(100% - 260px);
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 72px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  position: sticky;
  top: 0;
  background: rgba(10, 10, 10, 0.85);
  backdrop-filter: blur(16px);
  z-index: 30;
}
.crumb {
  font: 600 16px var(--font-heading);
  display: flex;
  align-items: center;
  gap: 8px;
}
.top-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.pill {
  border: 1px solid var(--line);
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  color: var(--muted);
  font-size: 12px;
  background: rgba(255, 255, 255, 0.02);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.content {
  padding: 32px 32px 64px;
  max-width: 1600px;
  width: 100%;
  margin: 0 auto;
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.page-head h1 {
  font: 700 28px var(--font-heading);
  margin: 0 0 6px;
  letter-spacing: -0.03em;
}
.page-head p {
  color: var(--muted);
  margin: 0;
  font-size: 14px;
}

/* Grids & Cards */
.grid { display: grid; gap: 16px; }
.stats {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-bottom: 24px;
}
.stat, .panel, .server-card, .spec-box, .chart-box, .metric-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
}
.stat {
  padding: 22px;
  position: relative;
  overflow: hidden;
}
.stat::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 100px;
  height: 100px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.06) 0%, transparent 70%);
  pointer-events: none;
}
.stat-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
}
.stat-value {
  font: 700 32px var(--font-heading);
  margin-top: 10px;
  color: #fff;
  letter-spacing: -0.04em;
}
.stat-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: rgba(99, 102, 241, 0.1);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-size: 17px;
  border: 1px solid rgba(99, 102, 241, 0.2);
}
.two-col { grid-template-columns: 1.5fr 1fr; }
.panel {
  padding: 24px;
  margin-bottom: 20px;
}
.panel-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.panel-title h3 {
  font: 700 17px var(--font-heading);
  margin: 0;
  letter-spacing: -0.02em;
}
.panel-title h4 {
  font: 700 15px var(--font-heading);
  margin: 0;
  letter-spacing: -0.02em;
}

/* Server Cards */
.server-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.server-card {
  padding: 22px;
  display: flex;
  flex-direction: column;
}
.server-card:hover {
  transform: translateY(-2px);
  border-color: rgba(99, 102, 241, 0.3);
  box-shadow: var(--shadow-md), 0 0 0 1px rgba(99, 102, 241, 0.1);
}
.server-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.server-name {
  font-weight: 700;
  font-size: 16px;
  color: #fff;
  letter-spacing: -0.02em;
}
.server-id {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.03);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #555;
  flex-shrink: 0;
}
.dot.running {
  background: var(--green);
  box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
  animation: dotPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}
.dot.stopped {
  background: var(--red);
  box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
}
@keyframes dotPulse {
  0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
  70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}
.server-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 18px 0;
}
.tag {
  font-size: 11px;
  color: var(--text-dim);
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.02);
  padding: 4px 9px;
  border-radius: 6px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  background: var(--panel2);
  color: var(--text);
  font-weight: 600;
  font-size: 12.5px;
  border: 1px solid var(--line);
  transition: all var(--transition);
  white-space: nowrap;
  user-select: none;
}
.btn:hover {
  background: var(--panel-hover);
  border-color: var(--line-strong);
  color: #fff;
  transform: translateY(-1px);
}
.btn:active {
  transform: scale(0.97);
}
.btn.primary {
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  color: #fff;
  border-color: transparent;
  font-weight: 700;
  box-shadow: 0 2px 12px rgba(99, 102, 241, 0.3);
}
.btn.primary:hover {
  background: linear-gradient(135deg, var(--accent-hover), #6366f1);
  box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
}
.btn.danger {
  background: rgba(239, 68, 68, 0.1);
  color: #fca5a5;
  border-color: rgba(239, 68, 68, 0.2);
}
.btn.danger:hover {
  background: rgba(239, 68, 68, 0.2);
  border-color: rgba(239, 68, 68, 0.4);
  color: #fff;
}
.btn.success {
  background: rgba(34, 197, 94, 0.1);
  color: #86efac;
  border-color: rgba(34, 197, 94, 0.2);
}
.btn.success:hover {
  background: rgba(34, 197, 94, 0.2);
  border-color: rgba(34, 197, 94, 0.4);
  color: #fff;
}
.btn.ghost {
  background: transparent;
  border-color: var(--line);
}
.btn.ghost:hover {
  background: rgba(255, 255, 255, 0.04);
  border-color: var(--line-strong);
}
.btn.small {
  padding: 6px 12px;
  font-size: 11.5px;
  border-radius: 6px;
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

/* Tables */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-sm);
}
table {
  border-collapse: collapse;
  width: 100%;
  min-width: 600px;
}
th, td {
  text-align: left;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
}
th {
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  background: rgba(255, 255, 255, 0.01);
}
td { color: var(--text-dim); }
tbody tr {
  transition: background var(--transition);
}
tbody tr:hover {
  background: rgba(255, 255, 255, 0.02);
}

/* Fields & Forms */
.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}
.field label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
}
.field input, .field select, .field textarea {
  background: #0d0d0d;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  color: var(--text);
  font-size: 13.5px;
  outline: none;
  width: 100%;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 16px;
}

/* Preset Chips */
.preset-chip {
  background: var(--panel2);
  border: 1px solid var(--line);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  display: inline-block;
}
.preset-chip:hover, .preset-chip.active {
  background: rgba(99, 102, 241, 0.15);
  border-color: var(--accent);
  color: var(--accent);
}

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(10px);
  display: grid;
  place-items: center;
  z-index: 100;
  padding: 16px;
  animation: fadeIn var(--transition);
}
.modal {
  width: min(560px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #141414;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  padding: 28px;
  box-shadow: var(--shadow-lg);
  animation: modalPop var(--transition);
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.modal-head h3 {
  margin: 0;
  font: 700 20px var(--font-heading);
  letter-spacing: -0.02em;
}
.close {
  background: transparent;
  color: var(--muted);
  font-size: 26px;
  padding: 0 4px;
  line-height: 1;
  border-radius: 6px;
  transition: color var(--transition);
}
.close:hover { color: #fff; }
@keyframes modalPop {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Dynamic Confirmation & Prompt Dialogs */
.confirm-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: grid;
  place-items: center;
  z-index: 2000;
  padding: 16px;
  animation: confirmFadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}
.confirm-modal {
  width: min(490px, 100%);
  background: #141416;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: 0 24px 50px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.05);
  animation: confirmPop 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  overflow: hidden;
}
.confirm-modal::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), #818cf8);
}
.confirm-modal.confirm-type-danger::before {
  background: linear-gradient(90deg, #ef4444, #f87171);
}
.confirm-modal.confirm-type-warning::before {
  background: linear-gradient(90deg, #eab308, #facc15);
}
.confirm-modal.confirm-type-success::before {
  background: linear-gradient(90deg, #22c55e, #4ade80);
}
.confirm-header {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.confirm-icon-badge {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  background: rgba(99, 102, 241, 0.12);
  color: var(--accent);
  border: 1px solid rgba(99, 102, 241, 0.25);
  box-shadow: 0 0 20px rgba(99, 102, 241, 0.12);
}
.confirm-icon-badge .svg-ico {
  width: 22px;
  height: 22px;
}
.confirm-icon-badge.danger {
  background: rgba(239, 68, 68, 0.14);
  color: var(--red);
  border-color: rgba(239, 68, 68, 0.3);
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.15);
}
.confirm-icon-badge.warning {
  background: rgba(234, 179, 8, 0.14);
  color: var(--yellow);
  border-color: rgba(234, 179, 8, 0.3);
  box-shadow: 0 0 20px rgba(234, 179, 8, 0.15);
}
.confirm-icon-badge.success {
  background: rgba(34, 197, 94, 0.14);
  color: var(--green);
  border-color: rgba(34, 197, 94, 0.3);
  box-shadow: 0 0 20px rgba(34, 197, 94, 0.15);
}
.confirm-titles {
  flex: 1;
  min-width: 0;
}
.confirm-title {
  margin: 0;
  font: 700 18px var(--font-heading);
  color: #fff;
  letter-spacing: -0.01em;
}
.confirm-subtitle {
  margin: 3px 0 0;
  font-size: 12px;
  color: var(--muted);
  word-break: break-all;
}
.confirm-close-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  padding: 4px;
  cursor: pointer;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}
.confirm-close-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
}
.confirm-body {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--text-dim);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.confirm-msg {
  color: #d8d8d8;
  word-break: break-word;
}

  position: relative;

}
.toast::after {

  left: 0;
  height: 2px;

  animation: toastProgress 4s linear forwards;
}
.toast.error {
  border-left-color: var(--red);

@keyframes toastSlideUp {

function formatBytes(bytes, decimals = 2) {
  if (!bytes || bytes <= 0 || isNaN(bytes)) return "0 B";
  const k = 1024, dm = decimals < 0 ? 0 : decimals, sizes = ["B", "KB", "MB", "GB", "TB", "PB"];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + " " + sizes[i];
}

function formatUptime(seconds) {
  if (!seconds || seconds <= 0 || isNaN(seconds)) return "Offline";
  const d = Math.floor(seconds / 86400), h = Math.floor((seconds % 86400) / 3600), m = Math.floor((seconds % 3600) / 60), s = Math.floor(seconds % 60);
  let r = [];
  if (d > 0) r.push(`${d}d`);
  if (h > 0 || d > 0) r.push(`${h}h`);
  r.push(`${m}m`);
  if (d === 0 && h === 0) r.push(`${s}s`);
  return r.join(" ");
}

function sparklineSVG(points, width = 480, height = 110, strokeColor = "#6366f1") {
  if (!points || points.length < 2) return '<div class="empty small" style="padding:25px">Collecting performance data points…</div>';
  const max = Math.max(...points, 0.001), min = Math.min(...points, 0), range = (max - min) || 1, step = width / (points.length - 1);
  const pts = points.map((p, i) => `${(i * step).toFixed(1)},${(height - 8 - ((p - min) / range) * (height - 16)).toFixed(1)}`);
  const pathD = "M " + pts.join(" L "), areaD = pathD + ` L ${width},${height} L 0,${height} Z`, gid = "g_" + strokeColor.replace(/[^a-z0-9]/gi, "");
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:${height}px;display:block"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.3"/><stop offset="100%" stop-color="${strokeColor}" stop-opacity="0.0"/></linearGradient></defs><path d="${areaD}" fill="url(#${gid})"/><path d="${pathD}" fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function toast(message, type = "success") {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  const icon = type === "error" ? ico("alert", "", "color:var(--red)") : type === "warning" ? ico("zap", "", "color:var(--yellow)") : ico("check", "", "color:var(--green)");
  el.innerHTML = `<span style="font-size:15px">${icon}</span><span style="flex:1">${esc(message)}</span><button type="button" class="toast-close" title="Dismiss">×</button>`;
  el.querySelector(".toast-close").onclick = () => el.remove();
  $("#toastRoot").append(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, type === "error" ? 8000 : 4000);
}

async function api(url, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (state.csrf && opts.method && opts.method !== "GET") headers["x-csrf-token"] = state.csrf;
  const r = await fetch("/api" + url, { credentials: "same-origin", ...opts, headers });
  let data = {};
  try { data = await r.json(); } catch {}
  if (!r.ok) {
    if (r.status === 401 && url !== "/auth/login") {
      state.user = null;
      renderLogin();
    }
    throw new Error(data.error || `Request failed (${r.status})`);
  }
  return data;
}

// --- Login ---
$("#root").addEventListener("submit", async e => {
  if (e.target.id !== "loginForm") return;
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const d = await api("/auth/login", { method: "POST", body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") }) });
    state.user = d.user;
    state.csrf = d.csrfToken;
    await loadDashboard();
  } catch (err) {
    toast(err.message, "error");
  }
});

function renderBrandLogo(customClass = "") {
  const s = state.settings || {};
  const iconUrl = s.site_icon_url;
  const siteName = s.site_name || "Atyro Cloud";
  const initial = (siteName.trim()[0] || "A").toUpperCase();
  const iconHtml = iconUrl
    ? `<img class="brand-logo-img" src="${esc(iconUrl)}" alt="${esc(siteName)}" onerror="this.outerHTML='<span class=\\'brand-mark\\'>${esc(initial)}</span>'">`
    : `<span class="brand-mark">${esc(initial)}</span>`;
  return `<div class="brand ${customClass}">${iconHtml}<span>${esc(siteName)}</span></div>`;
}

function applySiteSettings(settings) {
  if (!settings) return;
  state.settings = { ...(state.settings || {}), ...settings };
  const s = state.settings;
  const name = s.site_name || "Atyro Cloud";
  const desc = s.site_description || "High-Performance Cloud & VPS Infrastructure Management";
  const seoDesc = s.seo_description || desc;
  const ogImg = s.og_image_url || "";
  const fav = s.site_favicon_url || "/favicon.ico";

  // Document Title
  const baseTitle = `${name} — Cloud & VPS Management Panel`;
  if (document.title.includes("—")) {
    const parts = document.title.split("—");
    if (parts.length > 1) {
      document.title = `${name} — ${parts.slice(1).join("—").trim()}`;
    } else {
      document.title = baseTitle;
    }
  } else {
    document.title = baseTitle;
  }

  // Favicon Link
  const favEl = $("#siteFaviconLink") || document.querySelector("link[rel*='icon']");
  if (favEl) favEl.href = fav;

  // Meta Description
  const metaDesc = $("#metaDescription");
  if (metaDesc) metaDesc.content = seoDesc;

  // OG Title & Desc & Image
  const ogTitleEl = $("#ogTitle");
  if (ogTitleEl) ogTitleEl.content = name;
  const ogDescEl = $("#ogDescription");
  if (ogDescEl) ogDescEl.content = seoDesc;
  const ogImgEl = $("#ogImage");
  if (ogImgEl) ogImgEl.content = ogImg;

  // Update rendered brands in DOM
  $$(".brand").forEach(b => {
    const initial = (name.trim()[0] || "A").toUpperCase();
    const iconUrl = s.site_icon_url;
    const iconHtml = iconUrl
      ? `<img class="brand-logo-img" src="${esc(iconUrl)}" alt="${esc(name)}" onerror="this.outerHTML='<span class=\\'brand-mark\\'>${esc(initial)}</span>'">`
      : `<span class="brand-mark">${esc(initial)}</span>`;
    b.innerHTML = `${iconHtml}<span>${esc(name)}</span>`;
  });
}

      const confirmPass = $("#setupConfirmPassInput").value;

      if (!username || username.length < 3) {

      if (!password || password.length < 8) {

        return;
      }
      if (password !== confirmPass) {
        toast("Passwords do not match. Please verify.", "error");

      btn.disabled = true;

        toast(err.message, "error");

      }
    };
  }
}

async function handleRootClick(e) {
  const nav = e.target.closest("[data-page]");
  if (nav) {
    if (state.page === "vps" && nav.dataset.page !== "vps" && liveSocket && state.currentServerId) {
      liveSocket.emit("unsubscribe_vps", { id: state.currentServerId });
    }
    state.page = nav.dataset.page;
    // Reset form states on navigation
    if (state.page === "create-vps") state.createVpsState = { type: "qemu", source: "template", ip4Type: "dhcp", ip6Type: "disabled", nodeId: null, cachedData: null };
    if (state.page === "vps") state.editVpsState = { ip4Type: "dhcp", ip6Type: "auto" };
    $("#sidebar")?.classList.remove("open");
    $("#sidebarBackdrop")?.classList.remove("open");
    await renderPage();
    return;
  }
  const act = e.target.closest("[data-action]");
  if (act) {
    const action = act.dataset.action, id = Number(act.dataset.id);
    if (action === "create-vps") { state.page = "create-vps"; return renderPage(); }
    if (action === "server") return openServer(id);
    if (action === "back-servers") {
      if (liveSocket && state.currentServerId) {
        liveSocket.emit("unsubscribe_vps", { id: state.currentServerId });
      }
      state.page = "servers";
      return renderPage();
    }
    if (action === "view-node") return openNode(id);
    if (action === "back-nodes") { state.page = "nodes"; return renderPage(); }
    if (action === "node-refresh") return renderPage();
    if (action === "node-tab") { state.nodeTab = act.dataset.tab; return renderPage(); }
    if (action === "vps-refresh") return renderPage();
    if (action === "vps-tab") { state.vpsTab = act.dataset.tab; return renderPage(); }
    if (action === "snapshot-rollback") return rollbackSnapshot(id, act.dataset.snap);
    if (action === "reinstall-vps") return reinstallModal(id);
    if (action === "edit-vps") return openEditVps(id);
    if (action === "clone-vps") return cloneModal(id);
    if (action === "console-vps") return consoleModal(id);
    if (action === "create-backup") return createBackupModal(id);
    if (action === "restore-backup") return restoreBackup(id, act.dataset.volid);
    if (action === "delete-backup") return deleteBackup(id, act.dataset.volid);
    if (action === "power") { await serverAction(id, act.dataset.power); if (state.page === "vps") await renderPage(); return; }
    if (action === "snapshot") { await createSnapshot(id); if (state.page === "vps") await renderPage(); return; }
    if (action === "add-user") return userModal();
    if (action === "add-node") return nodeModal();
    if (action === "edit-node") return editNodeModal(id);
    if (action === "delete-node") return deleteNode(id);
    if (action === "assign") return assignModal();
    if (action === "refresh") return renderPage();
    if (action === "toggle-user") return toggleUser(id, act.dataset.active === "1");
    if (action === "delete-user") return deleteUser(id);
    if (action === "test-node") return testNode(id);
    if (action === "toggle-node") return toggleNode(id, act.dataset.enabled === "1");
    if (action === "unassign") return unassign(id, act.dataset.name, act.dataset.vmid);
  }
}

    else if (state.page === "users") await usersPage(c);
    else if (state.page === "nodes") await nodesPage(c);

  return `<div class="grid server-grid">${rows.map(s => {
    const isRunning = s.status === "running";
    const isStopped = s.status === "stopped";
    const dotClass = isRunning ? "running" : (isStopped ? "stopped" : "");
    const statusText = isRunning ? "Running" : (isStopped ? "Stopped" : (s.status && s.status !== "unknown" ? esc(s.status) : "Checking…"));
    const statusColor = isRunning ? "var(--green)" : (isStopped ? "var(--red)" : "var(--muted)");
    const uptimeStr = isRunning && s.uptime ? `<span class="tag uptime-tag" style="color:var(--green);border-color:rgba(34,197,94,0.3)">${ico("clock", "sm")} Up ${formatUptime(s.uptime)}</span>` : "";

/button>` : `<button class="btn small success" data-action="power" data-id="${s.id}" data-power="start">${ico("play")} Start</button>`}</div></div>`;
  }).join("")}</div>`;
}

async function updateServerStatuses(rows) {
  if (!rows || !rows.length) return;
  // Use Promise.all to fetch statuses in parallel
  const promises = rows.map(async (s) => {
    try {
      const d = await api(`/servers/${s.id}/status`);
      const status = d.status?.status || "unknown";
      s.status = status;
      s.uptime = d.status?.uptime || 0;
      const el = $(`#server-status-${s.id}`);
      if (el) {
        const isRunning = status === "running";
        const isStopped = status === "stopped";
        const dotClass = isRunning ? "running" : (isStopped ? "stopped" : "");
        const statusText = isRunning ? "Running" : (isStopped ? "Stopped" : status);
        const statusColor = isRunning ? "var(--green)" : (isStopped ? "var(--red)" : "var(--muted)");
        el.innerHTML = `<i class="dot ${dotClass}"></i><span style="color:${statusColor};font-weight:600;text-transform:capitalize">${statusText}</span>`;
      }
    } catch {}
  });
  await Promise.all(promises);
}

function filterServers(servers) {
  return servers.filter(s => {
    if (state.vpsFilterType === "running" && s.status !== "running") return false;
    if (state.vpsFilterType === "stopped" && s.status !== "stopped") return false;
    if (state.vpsFilterType === "qemu" && s.type !== "qemu") return false;
    if (state.vpsFilterType === "lxc" && s.type !== "lxc") return false;
    if (state.vpsSearchQuery) {
      const q = state.vpsSearchQuery.toLowerCase();
      const matchName = (s.name || "").toLowerCase().includes(q);
      const matchVmid = String(s.vmid || "").includes(q);
      const matchNode = (s.pve_node || s.node_name || "").toLowerCase().includes(q);
      const matchOwner = (s.username || "").toLowerCase().includes(q);
      if (!matchName && !matchVmid && !matchNode && !matchOwner) return false;
    }
    return true;
  });
}

function setupVpsFilterEvents(allServers) {
  const searchInput = $("#vpsSearchInput");
  const chips = $("#vpsFilterChips");
  const container = $("#serverCardsContainer");
  const apply = () => {
    const filtered = filterServers(allServers);
    if (container) container.innerHTML = serverCards(filtered);
    updateServerStatuses(filtered);
  };
  if (searchInput) {
    searchInput.oninput = () => {
      state.vpsSearchQuery = searchInput.value.trim();
      apply();
    };
  }
  if (chips) {
    chips.querySelectorAll("[data-vps-filter]").forEach(btn => {
      btn.onclick = () => {
        state.vpsFilterType = btn.dataset.vpsFilter;
        chips.querySelectorAll("[data-vps-filter]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        apply();
      };
    });
  }
}

    return;
  }
  c.innerHTML = '<div class="empty">Loading full VPS details & live metrics…</div>';
  try {
    const [st, cfg, snaps, rrdData] = await Promise.all([
      api(`/servers/${id}/status`),
      api(`/servers/${id}/config`),
      api(`/servers/${id}/snapshots`),
      api(`/servers/${id}/rrd?timeframe=hour`).catch(() => ({ rrd: [] }))
    ]);
    const status = st.status || {}, cData = cfg.config || {}, snapshots = snaps.snapshots || [], rrd = rrdData.rrd || [];
    const isRunning = status.status === "running", isStopped = status.status === "stopped", statusText = isRunning ? "Running" : (isStopped ? "Stopped" : (status.status || "Unknown"));
    const cpuPct = status.cpu != null ? (status.cpu * 100).toFixed(1) : "0.0";
    const cpuCores = status.cpus || cData.cores || 1, cpuSockets = cData.sockets || 1, cpuModel = cData.cpu || "host / default";
    const memUsed = status.mem || 0, memMax = status.maxmem || (cData.memory ? cData.memory * 1024 * 1024 : 1);
    const memPct = memMax > 0 ? ((memUsed / memMax) * 100).toFixed(1) : "0.0";
    const memFree = status.freemem || Math.max(0, memMax - memUsed);
    let diskMax = status.maxdisk || 0;
    let primaryDiskKey = s.type === "lxc" ? "rootfs" : "scsi0", primaryDiskVal = "";
    if (s.type === "lxc") {
      primaryDiskVal = cData.rootfs || "";
    } else {
      for (let i = 0; i < 16; i++) {
        for (const p of ["scsi", "sata", "virtio", "ide"]) {
          const v = cData[`${p}${i}`];
          if (v && typeof v === "string" && !v.includes("media=cdrom") && !v.includes("cloudinit") && !v.includes("none")) {
            primaryDiskKey = `${p}${i}`; primaryDiskVal = v; break;
          }
        }
        if (primaryDiskVal) break;
      }
    }
    if (!diskMax && primaryDiskVal) {
      const m = primaryDiskVal.match(/size=([0-9.]+)([GMKT])/i);
      if (m) {
        const n = parseFloat(m[1]), u = m[2].toUpperCase();
        diskMax = u === "M" ? n * 1024 * 1024 : (u === "T" ? n * 1024 * 1024 * 1024 * 1024 : n * 1024 * 1024 * 1024);
      }
    }
    const diskRead = status.diskread || 0, diskWrite = status.diskwrite || 0;
    const netRx = status.netin || 0, netTx = status.netout || 0, nicName = Object.keys(status.nics || {})[0] || `tap${s.vmid}i0`;

    c.innerHTML = `<div style="margin-bottom:18px"><button class="btn ghost small" data-action="back-servers">${ico("arrowLeft")} Back to Virtual servers</button></div><div class="vps-head"><div class="vps-title-wrap"><div class="vps-title"><h1>${esc(s.name)}</h1><span class="badge ${isRunning ? 'running' : 'stopped'}" id="vpsTitleStatus">${ico("statusDot", "sm")} ${statusText}</span></div><div class="vps-badges"><span class="badge" style="color:var(--accent);font-weight:700">${esc(s.type.toUpperCase())}</span><span class="badge">VMID ${s.vmid}</span><span class="badge">Node: ${esc(s.pve_node || s.node_name)}</span><span class="badge" id="vpsLiveUptime">${ico("clock", "sm")} Up ${formatUptime(status.uptime)}</span>${cData.ostype ? `<span class="badge">OS: ${esc(cData.ostype)}</span>` : ""}</div></div><div class="actions" id="vpsHeaderActions"><button class="btn ghost" data-action="vps-refresh" data-id="${id}">${ico("refresh")} Refresh</button><button class="btn" data-action="console-vps" data-id="${id}" style="background:rgba(56,189,248,0.1);color:var(--blue);border:1px solid rgba(56,189,248,0.2);font-weight:600">${ico("monitor")} Console & SSH</button>${state.user.role === "admin" ? `<button class="btn" data-action="clone-vps" data-id="${id}" style="background:rgba(168,85,247,0.1);color:var(--purple);border:1px solid rgba(168,85,247,0.2);font-weight:600">${ico("clone")} Clone VPS</button>` : ""}<button class="btn" data-action="edit-vps" data-id="${id}" style="background:rgba(99,102,241,0.1);color:var(--accent);border:1px solid rgba(99,102,241,0.2);font-weight:600">${ico("edit")} Edit VPS</button><button class="btn danger" data-action="reinstall-vps" data-id="${id}" style="border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.1);color:#fca5a5">${ico("disc")} Reinstall OS</button>${state.user.role === "admin" ? `<button class="btn danger" data-action="unassign" data-id="${id}" data-name="${esc(s.name)}" data-vmid="${s.vmid}" style="border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.1);color:#fca5a5" title="Remove assignment from user (keeps Proxmox VM safe)">${ico("ban")} Unassign VPS</button>` : ""}${isRunning ? `<button class="btn danger" data-action="power" data-id="${id}" data-power="stop">${ico("stop")} Stop</button><button class="btn" data-action="power" data-id="${id}" data-power="shutdown">${ico("pause")} Shutdown</button><button class="btn" data-action="power" data-id="${id}" data-power="reboot">${ico("refresh")} Reboot</button><button class="btn danger" data-action="power" data-id="${id}" data-power="reset">${ico("zap")} Reset</button>` : `<button class="btn success" data-action="power" data-id="${id}" data-power="start">${ico("play")} Start VPS</button>`}</div></div><div class="metric-grid"><div class="metric-card" id="metricCardCpu"><div class="metric-top"><span>CPU LOAD</span><span id="metricCpuTop" style="color:${cpuPct > 80 ? 'var(--red)' : 'var(--accent)'}">${cpuPct}%</span></div><div class="metric-val" id="metricCpuVal">${cpuPct}%</div><div class="metric-sub" id="metricCpuSub">${cpuCores} vCPU (${cpuSockets} socket · ${esc(cpuModel)})</div><div class="progress"><div class="progress-bar" id="metricCpuBar" style="width:${Math.min(100, Math.max(1, cpuPct))}%"></div></div></div><div class="metric-card" id="metricCardRam"><div class="metric-top"><span>MEMORY (RAM)</span><span id="metricRamTop">${memPct}%</span></div><div class="metric-val" id="metricRamVal">${formatBytes(memUsed)}</div><div class="metric-sub" id="metricRamSub">of ${formatBytes(memMax)} (${formatBytes(memFree)} free)</div><div class="progress"><div class="progress-bar green" id="metricRamBar" style="width:${Math.min(100, Math.max(1, memPct))}%"></div></div></div><div class="metric-card" id="metricCardDisk"><div class="metric-top"><span>STORAGE (DISK I/O)</span><span>${formatBytes(diskMax)}</span></div><div class="metric-val" id="metricDiskVal">${formatBytes(diskRead + diskWrite)}</div><div class="metric-sub" id="metricDiskSub">Read: ${formatBytes(diskRead)} · Write: ${formatBytes(diskWrite)}</div><div class="progress"><div class="progress-bar blue" style="width:100%"></div></div></div><div class="metric-card" id="metricCardNet"><div class="metric-top"><span>NETWORK TRAFFIC</span><span>${nicName}</span></div><div class="metric-val" id="metricNetVal">${formatBytes(netRx + netTx)}</div><div class="metric-sub" id="metricNetSub">RX: ${formatBytes(netRx)} · TX: ${formatBytes(netTx)}</div><div class="progress"><div class="progress-bar purple" style="width:100%"></div></div></div></div><div class="tab-nav"><button class="tab-btn ${state.vpsTab === 'specs' ? 'active' : ''}" data-action="vps-tab" data-tab="specs">${ico("monitor")} Hardware & Specs</button><button class="tab-btn ${state.vpsTab === 'edit' ? 'active' : ''}" data-action="vps-tab" data-tab="edit">${ico("edit")} Edit VPS Specs</button><button class="tab-btn ${state.vpsTab === 'backups' ? 'active' : ''}" data-action="vps-tab" data-tab="backups">${ico("backup")} Backups</button><button class="tab-btn ${state.vpsTab === 'performance' ? 'active' : ''}" data-action="vps-tab" data-tab="performance">${ico("chart")} Performance & Live Graphs</button><button class="tab-btn ${state.vpsTab === 'reinstall' ? 'active' : ''}" data-action="vps-tab" data-tab="reinstall">${ico("disc")} Reinstall OS</button><button class="tab-btn ${state.vpsTab === 'snapshots' ? 'active' : ''}" data-action="vps-tab" data-tab="snapshots">${ico("camera")} Snapshots (${snapshots.length})</button><button class="tab-btn ${state.vpsTab === 'config' ? 'active' : ''}" data-action="vps-tab" data-tab="config">${ico("gear")} Proxmox Raw Config</button></div><div id="vpsTabContent">${renderVpsTabContent(s, status, cData, snapshots, rrd)}</div>`;
  } catch (err) {
    c.innerHTML = `<div class="panel"><div class="empty">Error loading VPS details: ${esc(err.message)} <br><br><button class="btn" data-action="back-servers">Go back</button></div></div>`;
    toast(err.message, "error");
  }
}

function renderVpsTabContent(s, status, cData, snapshots, rrd) {
  if (state.vpsTab === "edit") {
    // Use requestAnimationFrame to wait for DOM
    requestAnimationFrame(() => loadEditVpsTab(s.id));
    return `<div class="panel" id="editVpsTabWrap"><div class="empty">Loading current configuration for ${esc(s.name)} (VMID ${s.vmid})…</div></div>`;
  }
  if (state.vpsTab === "backups") {
    requestAnimationFrame(() => loadBackupsTab(s.id));
    return `<div class="panel" id="backupsTabWrap"><div class="empty">Loading Proxmox VZDump backups…</div></div>`;
  }
  if (state.vpsTab === "reinstall") {
    requestAnimationFrame(() => loadReinstallTab(s.id));
    return `<div class="panel" id="reinstallTabWrap"><div class="empty">Loading OS templates and reinstallation options…</div></div>`;
  }
  if (state.vpsTab === "performance") {
    const cpuPts = rrd.map(x => (x.cpu || 0) * 100);
    const memPts = rrd.map(x => ((x.mem || 0) / (x.maxmem || 1)) * 100);
    const netRxPts = rrd.map(x => (x.netin || 0) / 1024);
    const diskWrPts = rrd.map(x => (x.diskwrite || 0) / 1024);
    return `<div class="chart-grid"><div class="chart-box"><div class="chart-header"><h4>CPU Load History (%)</h4><span class="small muted">Past hour · Cores: ${status.cpus || cData.cores || 1}</span></div>${sparklineSVG(cpuPts, 480, 110, "#6366f1")}</div><div class="chart-box"><div class="chart-header"><h4>Memory Usage History (%)</h4><span class="small muted">Total: ${formatBytes(status.maxmem)}</span></div>${sparklineSVG(memPts, 480, 110, "#22c55e")}</div><div class="chart-box"><div class="chart-header"><h4>Network Traffic Rate (KB/s)</h4><span class="small muted">RX (Inbound) rate</span></div>${sparklineSVG(netRxPts, 480, 110, "#38bdf8")}</div><div class="chart-box"><div class="chart-header"><h4>Disk Write Throughput (KB/s)</h4><span class="small muted">Storage writes</span></div>${sparklineSVG(diskWrPts, 480, 110, "#a855f7")}</div></div>`;
  }
  if (state.vpsTab === "snapshots") {
    return `<div class="panel"><div class="panel-title"><h3>VPS Snapshots</h3><button class="btn primary small" data-action="snapshot" data-id="${s.id}">${ico("plus")} Create Snapshot</button></div><div class="table-wrap"><table><thead><tr><th>NAME</th><th>DESCRIPTION</th><th>DATE & TIME</th><th>STATUS</th><th>ACTIONS</th></tr></thead><tbody>${snapshots.map(x => `<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.description || "—")}</td><td>${x.snaptime ? new Date(x.snaptime * 1000).toLocaleString() : "—"}</td><td>${x.running ? '<span style="color:var(--green)">Live RAM</span>' : 'Disk only'}</td><td>${x.name !== "current" ? `<button class="btn small" data-action="snapshot-rollback" data-id="${s.id}" data-snap="${esc(x.name)}">Rollback</button>` : '<span class="muted small">—</span>'}</td></tr>`).join("") || '<tr><td colspan="5" class="empty">No snapshots found for this VPS.</td></tr>'}</tbody></table></div></div>`;
  }
  if (state.vpsTab === "config") {
    const entries = Object.entries(cData);
    // Use requestAnimationFrame for the search listener
    requestAnimationFrame(() => {
      const searchInput = $("#configSearchInput");
      if (searchInput) {
        searchInput.oninput = () => {
          const q = searchInput.value.toLowerCase().trim();
          $$(".config-row").forEach(r => {
            const k = r.dataset.key || "";
            r.style.display = k.includes(q) ? "" : "none";
          });
        };
      }
    });
    return `<div class="panel"><div class="panel-title"><div><h3>All Proxmox Configuration Parameters</h3><p class="muted small" style="margin:2px 0 0">${entries.length} raw configuration key-value pairs</p></div><input type="text" id="configSearchInput" placeholder="Filter keys (e.g. net, cpu, scsi)…" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 14px;color:#fff;font-size:12px;width:260px"></div><div class="table-wrap"><table><thead><tr><th>PARAMETER / KEY</th><th>VALUE</th></tr></thead><tbody id="configTableBody">${entries.map(([k, v]) => `<tr class="config-row" data-key="${esc(k.toLowerCase())}"><td style="font-family:'Space Grotesk',monospace;color:var(--accent)">${esc(k)}</td><td style="font-family:'Space Grotesk',monospace;font-weight:600">${esc(typeof v === "object" ? JSON.stringify(v) : v)}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  const primaryDiskKey = s.type === "lxc" ? "rootfs" : "scsi0";
  const blockscsi = status.blockstat?.[primaryDiskKey] || status.blockstat?.scsi0 || status.blockstat?.sata0 || status.blockstat?.virtio0 || {};
  let primaryDiskVal = s.type === "lxc" ? (cData.rootfs || "") : (cData.scsi0 || "");
  return `<div class="spec-cards"><div class="spec-box"><h4>${ico("cpu")} Compute & Architecture</h4><div class="spec-row"><span class="k">CPU Cores</span><span class="v">${status.cpus || cData.cores || 1} vCPU Cores</span></div><div class="spec-row"><span class="k">CPU Sockets</span><span class="v">${cData.sockets || 1} Socket</span></div><div class="spec-row"><span class="k">CPU Type / Flags</span><span class="v">${esc(cData.cpu || "host / default")}</span></div><div class="spec-row"><span class="k">Machine Architecture</span><span class="v">${esc(cData.machine || status["running-machine"] || "pc-q35")}</span></div><div class="spec-row"><span class="k">QEMU Engine Version</span><span class="v">${esc(status["running-qemu"] || "11.0.0")}</span></div><div class="spec-row"><span class="k">NUMA Nodes</span><span class="v">${cData.numa ? "Enabled" : "Disabled"}</span></div><div class="spec-row"><span class="k">Process PID</span><span class="v">${status.pid || "—"}</span></div></div><div class="spec-box"><h4>${ico("ram")} Memory (RAM) Details</h4><div class="spec-row"><span class="k">Total Allocated RAM</span><span class="v">${formatBytes(status.maxmem || (cData.memory * 1024 * 1024))}</span></div><div class="spec-row"><span class="k">Currently Used RAM</span><span class="v">${formatBytes(status.mem)}</span></div><div class="spec-row"><span class="k">Free / Available RAM</span><span class="v">${formatBytes(status.freemem || Math.max(0, (status.maxmem || 0) - (status.mem || 0)))}</span></div><div class="spec-row"><span class="k">Memory Balloon</span><span class="v">${status.balloon ? formatBytes(status.balloon) : (cData.balloon ? formatBytes(cData.balloon * 1024 * 1024) : "Static")}</span></div><div class="spec-row"><span class="k">Host Footprint</span><span class="v">${formatBytes(status.memhost)}</span></div><div class="spec-row"><span class="k">Swap Out</span><span class="v">${status.ballooninfo?.mem_swapped_out ? formatBytes(status.ballooninfo.mem_swapped_out) : "0 B"}</span></div></div><div class="spec-box"><h4>${ico("backup")} Storage & Disks</h4><div class="spec-row"><span class="k">Boot Drive (${esc(primaryDiskKey)})</span><span class="v" style="font-family:'Space Grotesk',monospace;font-size:12px">${esc(primaryDiskVal || "—")}</span></div><div class="spec-row"><span class="k">Disk Controller</span><span class="v">${esc(cData.scsihw || "virtio-scsi-single")}</span></div><div class="spec-row"><span class="k">Boot Sequence</span><span class="v">${esc(cData.boot || "scsi0; net0")}</span></div><div class="spec-row"><span class="k">Total Provisioned Disk</span><span class="v">${status.maxdisk ? formatBytes(status.maxdisk) : "—"}</span></div><div class="spec-row"><span class="k">Total Disk Read</span><span class="v">${formatBytes(status.diskread)}</span></div><div class="spec-row"><span class="k">Total Disk Written</span><span class="v">${formatBytes(status.diskwrite)}</span></div><div class="spec-row"><span class="k">Read Operations (IOPS)</span><span class="v">${blockscsi.rd_operations ? blockscsi.rd_operations.toLocaleString() : "—"}</span></div><div class="spec-row"><span class="k">Write Operations (IOPS)</span><span class="v">${blockscsi.wr_operations ? blockscsi.wr_operations.toLocaleString() : "—"}</span></div></div><div class="spec-box"><h4>${ico("network")} Network & Identity</h4><div class="spec-row"><span class="k">Network Adapter (net0)</span><span class="v" style="font-family:'Space Grotesk',monospace;font-size:12px">${esc(cData.net0 || "—")}</span></div><div class="spec-row"><span class="k">Hardware MAC Address</span><span class="v" style="font-family:'Space Grotesk',monospace">${cData.net0 ? (cData.net0.match(/(?:virtio|hwaddr|macaddr)=([A-Fa-f0-9:]+)/)?.[1] || "—") : "—"}</span></div><div class="spec-row"><span class="k">Virtual Bridge</span><span class="v">${cData.net0 ? (cData.net0.match(/bridge=([^,]+)/)?.[1] || "—") : "—"}</span></div><div class="spec-row"><span class="k">Host Interface</span><span class="v">${Object.keys(status.nics || {}).join(", ") || `tap${s.vmid}i0`}</span></div><div class="spec-row"><span class="k">Total Received (RX)</span><span class="v" style="color:var(--blue)">${formatBytes(status.netin)}</span></div><div class="spec-row"><span class="k">Total Transmitted (TX)</span><span class="v" style="color:var(--accent)">${formatBytes(status.netout)}</span></div><div class="spec-row"><span class="k">Proxmox PVE Node</span><span class="v">${esc(s.pve_node || s.node_name)}</span></div><div class="spec-row"><span class="k">SMBIOS UUID</span><span class="v" style="font-size:11px;font-family:'Space Grotesk',monospace">${esc(cData.smbios1 ? cData.smbios1.replace("uuid=", "") : "—")}</span></div></div></div>`;
}

async function serverAction(id, action) {
  const s = (state.servers || []).find(x => x.id === id) || { id, name: "VPS", vmid: "" };
  const act = String(action).toLowerCase();
  const isDestructive = act === "stop" || act === "reset";
  const actIcons = {
    start: "play",
    stop: "stop",
    shutdown: "stop",
    reboot: "refresh",
    reset: "refresh"
  };
  const actColors = {
    start: "primary",
    shutdown: "warning",
    stop: "danger",
    reboot: "warning",
    reset: "danger"
  };
  const ok = await modalConfirm({
    title: `${action.toUpperCase()} Virtual Machine`,
    subtitle: `Target: ${s.name} (VMID ${s.vmid || id})`,
    message: isDestructive
      ? `Are you sure you want to forcefully ${action} this virtual machine? Any unsaved data in the guest operating system might be lost.`
      : `Are you sure you want to send a ${action} signal to "${s.name}"?`,
    confirmText: `${action.charAt(0).toUpperCase() + action.slice(1)} VPS`,
    type: actColors[act] || "warning",
    icon: actIcons[act] || "zap"
  });
  if (!ok) return;
  try {
    await api(`/servers/${id}/action`, { method: "POST", body: JSON.stringify({ action }) });
    toast(`Power action "${action}" submitted successfully.`);
    if (state.page === "vps") await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function createSnapshot(id) {
  const s = (state.servers || []).find(x => x.id === id) || { id, name: "VPS", vmid: "" };
  const defaultSnapName = `snap-${new Date().toISOString().slice(0, 10).replace(/-/g, "")}`;
  const name = await modalPrompt({
    title: "Create Proxmox Snapshot",
    subtitle: `Target: ${s.name} (VMID ${s.vmid || id})`,
    message: "Capture the current state and disk data of this virtual machine. You can rollback to this snapshot at any time.",
    inputLabel: "Snapshot Identifier / Name",
    placeholder: "e.g. backup-before-upgrade",
    defaultValue: defaultSnapName,
    confirmText: "Create Snapshot",
    icon: "camera",
    validator: (val) => {
      if (!val) return "Snapshot name is required.";
      if (!/^[a-zA-Z0-9_\-]+$/.test(val)) return "Only letters, numbers, hyphens (-) and underscores (_) are allowed.";
      return null;
    }
  });
  if (!name) return;
  try {
    await api(`/servers/${id}/snapshots`, { method: "POST", body: JSON.stringify({ name }) });
    toast("Snapshot task submitted.");
    if (state.page === "vps") await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function rollbackSnapshot(id, name) {
  const s = (state.servers || []).find(x => x.id === id) || { id, name: "VPS", vmid: "" };
  const ok = await modalConfirm({
    title: "Rollback Snapshot",
    subtitle: `Target: ${s.name} (VMID ${s.vmid || id})`,
    message: `Rollback virtual machine to snapshot "${name}"?`,
    details: [
      "Current guest operating system state will be permanently replaced.",
      "Any disk modifications made since this snapshot was created will be lost.",
      "The VM may briefly reboot during the rollback process."
    ],
    confirmText: "Rollback Snapshot",
    type: "danger",
    icon: "restore"
  });
  if (!ok) return;
  try {
    await api(`/servers/${id}/snapshots/${encodeURIComponent(name)}/rollback`, { method: "POST", body: "{}" });
    toast(`Rollback to snapshot "${name}" submitted.`);
    await renderPage();
  } catch (e) { toast(e.message, "error"); }
}

async function reinstallModal(id) {
  state.currentServerId = id; state.page = "vps"; state.vpsTab = "reinstall";
  // Avoid double render if already on the page
  if (state.page === "vps" && state.vpsTab === "reinstall") {
    await renderPage();
  } else {
    await renderPage();
  }
}

async function loadReinstallTab(id) {
  const wrap = $("#reinstallTabWrap");
  if (!wrap) return;
  try {
    const d = await api(`/servers/${id}/reinstall/options`);
    const server = d.server, templates = d.templates || [];
    let osOptionsHtml = "";
    if (templates.length > 0) {
      osOptionsHtml = templates.map((t, idx) => `<option value="${esc(t.id || t.vmid || t.template)}" ${idx === 0 ? "selected" : ""}>${esc(t.name)} ${t.vmid ? `(VMID ${t.vmid})` : ""}</option>`).join("");
    } else {
      osOptionsHtml = `<option value="1003">Ubuntu 24.04 LTS (Template 1003)</option><option value="4001">Debian 12 (Template 4001)</option>`;
    }
    wrap.innerHTML = `<div class="panel-title"><div><h3>${ico("disc")} Reinstall Operating System (${esc(server.type.toUpperCase())} · VMID ${server.vmid})</h3><p class="muted small" style="margin:4px 0 0">Deploy a clean operating system template. Preserves CPU, RAM, and Network MAC configuration.</p></div></div><div class="notice" style="border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.05);color:#fca5a5;margin-top:0;margin-bottom:20px;border-radius:12px;padding:14px"><b>${ico("alert", "sm", "color:var(--red)")} WARNING: This operation will completely format the primary disk!</b><div style="font-size:12px;margin-top:4px;color:#fca5a5">All existing files, data, and user software on this VPS will be permanently wiped.</div></div>${d.datastorePermissionRequired ? `<div class="notice" style="border-color:rgba(234,179,8,0.2);background:rgba(234,179,8,0.05);color:#fbbf24;margin-top:0;margin-bottom:20px;border-radius:12px;padding:14px;font-size:12px"><b>${ico("lightbulb", "sm", "color:var(--yellow)")} Proxmox Permission Notice:</b> To clone and create new virtual disks, API token <code>${esc(server.node_name)}</code> needs the <code>PVEDatastoreUser</code> or <code>Administrator</code> role on path <code>/</code> in Proxmox VE (Datacenter -> Permissions).</div>` : ''}<form id="reinstallTabForm" style="max-width:650px"><div class="field"><label>Choose Operating System / Distribution Template</label><select name="templateId" id="reinstallTemplateSelect" required>${osOptionsHtml}</select></div><div class="field"><label style="display:flex;justify-content:space-between"><span>New Root Password (min 8 chars)</span><a href="javascript:void(0)" id="genPassTabBtn" style="color:var(--accent);font-size:11px">${ico("dice", "sm")} Generate Strong Password</a></label><div style="position:relative"><input name="password" id="reinstallTabPassword" type="password" minlength="8" required placeholder="Enter new root password" style="padding-right:45px"><button type="button" id="togglePassTabBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;color:#888;padding:4px 8px;font-size:13px">${ico("eye")}</button></div></div><div class="field"><label>Hostname (optional)</label><input name="hostname" value="${esc(server.name)}" placeholder="${esc(server.name)}"></div><div class="field"><label>SSH Public Key (optional, for passwordless root SSH)</label><textarea name="sshKey" rows="2" placeholder="ssh-ed25519 AAAAC3... or ssh-rsa AAAAB3..." style="background:#0d0d0d;border:1px solid #303030;border-radius:8px;padding:9px;color:white;width:100%;font-size:11px;font-family:'Space Grotesk',monospace;resize:vertical"></textarea></div><div style="margin:18px 0;display:flex;align-items:flex-start;gap:9px"><input type="checkbox" id="reinstallTabConfirmCheck" style="margin-top:3px;cursor:pointer"><label for="reinstallTabConfirmCheck" style="font-size:12px;color:#ddd;cursor:pointer;line-height:1.4">I confirm that I want to wipe this VPS and reinstall with the selected operating system.</label></div><button type="submit" class="btn danger" id="reinstallTabSubmitBtn" disabled style="padding:12px 24px;font-weight:700">${ico("alert")} Wipe and Reinstall OS</button></form>`;
    const passInput = $("#reinstallTabPassword"), toggleBtn = $("#togglePassTabBtn"), genBtn = $("#genPassTabBtn"), check = $("#reinstallTabConfirmCheck"), submitBtn = $("#reinstallTabSubmitBtn");
    if (toggleBtn && passInput) toggleBtn.onclick = () => { passInput.type = passInput.type === "password" ? "text" : "password"; };
    if (genBtn && passInput) genBtn.onclick = () => {
      const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*";
      let generated = "";
      for (let i = 0; i < 16; i++) generated += chars.charAt(Math.floor(Math.random() * chars.length));
      passInput.value = generated; passInput.type = "text";
      try { navigator.clipboard.writeText(generated); toast("Generated password copied to clipboard!"); } catch {}
      if (check) check.dispatchEvent(new Event("change"));
    };
    if (check && submitBtn) {
      const validate = () => { submitBtn.disabled = !check.checked || (passInput && passInput.value.length < 8); };
      check.onchange = validate;
      if (passInput) passInput.oninput = validate;
    }
    $("#reinstallTabForm").onsubmit = async e => {
      e.preventDefault();
      if (!check.checked) return toast("Please check the confirmation box.", "error");
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd);
      submitBtn.disabled = true;
      submitBtn.innerHTML = `${ico("spinner", "spin")} Reinstalling OS… Stopping VPS & cloning template…`;
      toast("Reinstallation started! This may take 30-45 seconds…");
      try {
        const res = await api(`/servers/${id}/reinstall`, { method: "POST", body: JSON.stringify(data) });
        toast(res.message || "VPS reinstalled successfully!");
        state.vpsTab = "specs";
        await renderPage();
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `${ico("alert")} Wipe and Reinstall OS`;
        toast(err.message, "error");
      }
    };
  } catch (err) { wrap.innerHTML = `<div class="empty">Error loading reinstallation options: ${esc(err.message)}</div>`; }
}

    setupEditVpsEvents(id, d);
  } catch (err) { wrap.innerHTML = `<div class="empty">Error loading configuration for editing: ${esc(err.message)}</div>`; }

function setupEditVpsEvents(id, d) {
  const btnDhcp = $("#editBtnIp4Dhcp");
  const btnStatic = $("#editBtnIp4Static");
  const ip4Fields = $("#editIp4StaticFields");
  if (btnDhcp && btnStatic) {
    btnDhcp.onclick = () => {
      state.editVpsState.ip4Type = "dhcp"; btnDhcp.className = "btn primary"; btnStatic.className = "btn ghost";
      if (ip4Fields) ip4Fields.classList.add("hidden");
    };
    btnStatic.onclick = () => {
      state.editVpsState.ip4Type = "static"; btnDhcp.className = "btn ghost"; btnStatic.className = "btn primary";
      if (ip4Fields) { ip4Fields.classList.remove("hidden"); const ipInp = $("#editIp4AddressInput"); if (ipInp) ipInp.focus(); }
    };
  }
  const ip6Select = $("#editIp6Select");

        ip6Gateway: (fd.get("ip6Gateway") || "").trim(),
        searchDomain: (fd.get("searchDomain") || "").trim(),
        nameServers: (fd.get("nameServers") || "").trim(),
        ciUser: (fd.get("ciUser") || "").trim(),
        password: (fd.get("password") || "").trim(),

function modalConfirm({
  title = "Confirm Action",
  subtitle = "",
  message = "Are you sure you want to proceed?",
  details = null,
  confirmText = "Confirm",
  cancelText = "Cancel",
  type = "warning",
  icon = null
} = {}) {
  return new Promise(resolve => {
    const root = $("#confirmRoot");
    if (!root) {
      resolve(window.confirm(message));
      return;
    }

    const defaultIcons = {
      danger: "alert",
      warning: "alert",
      info: "lightbulb",
      primary: "zap",
      success: "check"
    };
    const iconName = icon || defaultIcons[type] || "alert";
    const iconSvg = ico(iconName, "lg");
    const btnClass = type === "danger" ? "danger" : "primary";
    const actionIco = type === "danger" ? "trash" : (icon || "check");

    let detailsHtml = "";
    if (details) {
      if (Array.isArray(details)) {
        detailsHtml = `<div class="confirm-details-box ${esc(type)}">
          <ul class="confirm-bullets">
            ${details.map(d => `<li>${esc(d)}</li>`).join("")}
          </ul>
        </div>`;
      } else {
        detailsHtml = `<div class="confirm-details-box ${esc(type)}">
          <div style="font-family:'Space Grotesk',monospace;word-break:break-all">${esc(details)}</div>
        </div>`;
      }
    }

    root.innerHTML = `<div class="confirm-backdrop" data-confirm-backdrop>
      <div class="confirm-modal confirm-type-${esc(type)}" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="confirm-header">
          <div class="confirm-icon-badge ${esc(type)}">
            ${iconSvg}
          </div>
          <div class="confirm-titles">
            <h3 id="confirmTitle" class="confirm-title">${esc(title)}</h3>
            ${subtitle ? `<p class="confirm-subtitle">${esc(subtitle)}</p>` : ""}
          </div>
          <button class="confirm-close-btn" data-confirm-btn="cancel" aria-label="Close dialog">
            <svg class="svg-ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div class="confirm-body">
          <div class="confirm-msg">${esc(message).replace(/\n/g, "<br>")}</div>
          ${detailsHtml}
        </div>
        <div class="confirm-actions">
          <button type="button" class="btn ghost" data-confirm-btn="cancel">${esc(cancelText)}</button>
          <button type="button" class="btn ${btnClass}" data-confirm-btn="ok" id="confirmOkBtn">
            ${ico(actionIco, "sm")} ${esc(confirmText)}
          </button>
        </div>
      </div>
    </div>`;

    function cleanup(result) {
      window.removeEventListener("keydown", onKeyDown);
      root.innerHTML = "";
      resolve(result);
    }

    function onKeyDown(e) {
      if (e.key === "Escape") {
        e.preventDefault();
        cleanup(false);
      } else if (e.key === "Enter") {
        e.preventDefault();
        cleanup(true);
      }
    }

    window.addEventListener("keydown", onKeyDown);

    const okBtn = root.querySelector('[data-confirm-btn="ok"]');
    const cancelBtns = root.querySelectorAll('[data-confirm-btn="cancel"]');
    const backdrop = root.querySelector("[data-confirm-backdrop]");

    if (okBtn) {
      okBtn.onclick = () => cleanup(true);
      setTimeout(() => okBtn.focus(), 40);
    }

    cancelBtns.forEach(btn => {
      btn.onclick = () => cleanup(false);
    });

    if (backdrop) {
      backdrop.onclick = e => {
        if (e.target === backdrop) cleanup(false);
      };
    }
  });
}

function modalPrompt({
  title = "Enter Information",
  subtitle = "",
  message = "",
  inputLabel = "",
  placeholder = "",
  defaultValue = "",
  confirmText = "Submit",
  cancelText = "Cancel",
  type = "primary",
  icon = "edit",
  validator = null
} = {}) {
  return new Promise(resolve => {
    const root = $("#confirmRoot");
    if (!root) {
      resolve(window.prompt(message, defaultValue));
      return;
    }

    const iconSvg = ico(icon || "edit", "lg");
    const btnClass = type === "danger" ? "danger" : "primary";

    root.innerHTML = `<div class="confirm-backdrop" data-confirm-backdrop>
      <div class="confirm-modal confirm-type-${esc(type)}" role="dialog" aria-modal="true" aria-labelledby="promptTitle">
        <div class="confirm-header">
          <div class="confirm-icon-badge ${esc(type)}">
            ${iconSvg}
          </div>
          <div class="confirm-titles">
            <h3 id="promptTitle" class="confirm-title">${esc(title)}</h3>
            ${subtitle ? `<p class="confirm-subtitle">${esc(subtitle)}</p>` : ""}
          </div>
          <button class="confirm-close-btn" data-confirm-btn="cancel" aria-label="Close dialog">
            <svg class="svg-ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <form id="confirmPromptForm" class="confirm-body" onsubmit="return false;">
          ${message ? `<div class="confirm-msg">${esc(message).replace(/\n/g, "<br>")}</div>` : ""}
          <div class="confirm-input-wrap">
            ${inputLabel ? `<label for="confirmPromptInput">${esc(inputLabel)}</label>` : ""}
            <input type="text" id="confirmPromptInput" class="confirm-input" placeholder="${esc(placeholder)}" value="${esc(defaultValue)}" autocomplete="off" spellcheck="false" />
            <div id="confirmPromptError" class="confirm-error hidden"></div>
          </div>
          <div class="confirm-actions">
            <button type="button" class="btn ghost" data-confirm-btn="cancel">${esc(cancelText)}</button>
            <button type="submit" class="btn ${btnClass}" data-confirm-btn="ok" id="confirmPromptOkBtn">
              ${ico(icon || "check", "sm")} ${esc(confirmText)}
            </button>
          </div>
        </form>
      </div>
    </div>`;

    const input = root.querySelector("#confirmPromptInput");
    const errorEl = root.querySelector("#confirmPromptError");
    const form = root.querySelector("#confirmPromptForm");
    const cancelBtns = root.querySelectorAll('[data-confirm-btn="cancel"]');
    const backdrop = root.querySelector("[data-confirm-backdrop]");

    function cleanup(result) {
      window.removeEventListener("keydown", onKeyDown);
      root.innerHTML = "";
      resolve(result);
    }

    function submitValue() {
      const val = (input ? input.value : "").trim();
      if (validator) {
        const err = validator(val);
        if (err) {
          if (errorEl) {
            errorEl.textContent = err;
            errorEl.classList.remove("hidden");
          }
          if (input) input.focus();
          return;
        }
      }
      cleanup(val);
    }

    function onKeyDown(e) {
      if (e.key === "Escape") {
        e.preventDefault();
        cleanup(null);
      }
    }

    window.addEventListener("keydown", onKeyDown);

    if (form) {
      form.onsubmit = e => {
        e.preventDefault();
        submitValue();
      };
    }

    cancelBtns.forEach(btn => {
      btn.onclick = () => cleanup(null);
    });

    if (backdrop) {
      backdrop.onclick = e => {
        if (e.target === backdrop) cleanup(null);
      };
    }

    if (input) {
      setTimeout(() => {
        input.focus();
        input.select();
      }, 50);
      input.oninput = () => {
        if (errorEl) errorEl.classList.add("hidden");
      };
    }
  });
}

  if ($("#confirmRoot") && $("#confirmRoot").innerHTML) return;
  if (e.key === "Escape" && $("#modalRoot").innerHTML) {

});

Guest agent reporting…</span>'}</span></div><div class="spec-row"><span class="k">SSH User</span><span class="v" style="font-family:'Space Grotesk',monospace"><b>${esc(sshUser)}</b></span></div><div class="spec-row"><span class="k">SSH Port</span><span class="v" style="font-family:'Space Grotesk',monospace"><b>22</b></span></div><div class="spec-row"><span class="k">Virtual Bridge</span><span class="v" style="font-family:'Space Grotesk',monospace">${cData.net0 ? (cData.net0.match(/bridge=([^,]+)/)?.[1] || 'vmbr0') : 'vmbr0'}</span></div><div class="spec-row"><span class="k">MAC Address</span><span class="v" style="font-family:'Space Grotesk',monospace">${cData.net0 ? (cData.net0.match(/(?:virtio|hwaddr|macaddr)=([A-Fa-f0-9:]+)/)?.[1] || '—') : '—'}</span></div></div></div>`);

    const copyBtn = $("#copySshBtn");
    if (copyBtn) {
      copyBtn.onclick = () => {
        try {
          navigator.clipboard.writeText(sshCmd);
          toast("SSH command copied to clipboard!");

          toast("Copy failed, please select and copy manually.", "error");
        }
      };
    }

  } catch (err) {
    showModal(`<div class="modal-head"><h3>Access Error</h3><button class="close" data-close>×</button></div><div class="empty" style="color:var(--red)">${esc(err.message)}</div>`);

state.taskFilterType === 'running' ? 'active' : ''}" data-task-filter="running">${ico("zap", "sm")} Running (${countRunning})</button><button class="preset-chip ${state.taskFilterType === 'vzdump' ? 'active' : ''}" data-task-filter="vzdump">${ico("backup", "sm")} Backups</button><button class="preset-chip ${state.taskFilterType === 'clone' ? 'active' : ''}" data-task-filter="clone">${ico("clone", "sm")} Clones</button><button class="preset-chip ${state.taskFilterType === 'error' ? 'active' : ''}" data-task-filter="error">${ico("alert", "sm")} Errors</button></div></div><div class="panel table-wrap" id="tasksTableContainer">${renderTasksTable(filterTasks(tasks))}</div>`;

  }

function filterTasks(tasks) {
  return tasks.filter(t => {
    const isRunning = !t.endtime || t.status === "RUNNING";
    const isError = t.status && t.status !== "OK" && t.status !== "RUNNING";
    const type = (t.type || "").toLowerCase();

    if (state.taskFilterType === "running" && !isRunning) return false;
    if (state.taskFilterType === "error" && !isError) return false;
    if (state.taskFilterType === "vzdump" && !type.includes("vzdump")) return false;
    if (state.taskFilterType === "clone" && !type.includes("clone")) return false;

    if (state.taskSearchQuery) {
      const q = state.taskSearchQuery.toLowerCase();
      const matchType = type.includes(q);
      const matchUser = (t.user || "").toLowerCase().includes(q);
      const matchNode = (t.node || t.node_name || "").toLowerCase().includes(q);
      const matchUpid = (t.upid || "").toLowerCase().includes(q);
      const matchId = String(t.id || "").includes(q);
      if (!matchType && !matchUser && !matchNode && !matchUpid && !matchId) return false;
    }
    return true;
  });
}

function renderTasksTable(tasks) {
  if (!tasks.length) return '<div class="empty">No Proxmox cluster tasks matching filter.</div>';
  return `<table><thead><tr><th>ACTION / OPERATION</th><th>TARGET (VMID)</th><th>NODE</th><th>STATUS</th><th>INITIATED BY</th><th>START TIME</th><th>DURATION</th><th>UPID</th></tr></thead><tbody>${tasks.map(t => {
    const isRunning = !t.endtime || t.status === "RUNNING";
    const isOk = t.status === "OK";
    const durationSec = t.endtime && t.starttime ? Math.max(0, t.endtime - t.starttime) : null;
    const durationStr = isRunning ? '<span style="color:var(--blue)">Running…</span>' : (durationSec != null ? `${durationSec}s` : '—');

    let typeBadge = `${ico("gear", "sm")} ${esc(t.type || "task")}`;
    if (t.type === "qmclone" || t.type === "vzclone") typeBadge = `${ico("clone", "sm")} Clone ${t.type === 'qmclone' ? 'VM' : 'LXC'}`;
    else if (t.type === "vzdump") typeBadge = `${ico("backup", "sm")} Backup (VZDump)`;
    else if (t.type === "qmstart" || t.type === "vzstart") typeBadge = `${ico("play", "sm")} Start ${t.type === 'qmstart' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmstop" || t.type === "vzstop") typeBadge = `${ico("stop", "sm")} Stop ${t.type === 'qmstop' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmreboot" || t.type === "vzreboot") typeBadge = `${ico("refresh", "sm")} Reboot ${t.type === 'qmreboot' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmcreate" || t.type === "vzcreate") typeBadge = `${ico("zap", "sm")} Create ${t.type === 'qmcreate' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmconfig" || t.type === "vzconfig") typeBadge = `${ico("edit", "sm")} Config ${t.type === 'qmconfig' ? 'VM' : 'LXC'}`;
    else if (t.type === "qmsnapshot" || t.type === "vzsnapshot") typeBadge = `${ico("camera", "sm")} Snapshot`;
    else if (t.type === "qmrollback" || t.type === "vzrollback") typeBadge = `${ico("restore", "sm")} Rollback`;
    else if (t.type === "aptupdate") typeBadge = `${ico("refresh", "sm")} APT Update`;

    return `<tr><td><b>${typeBadge}</b><div class="small muted" style="font-family:'Space Grotesk',monospace">${esc(t.type)}</div></td><td>${t.id ? `<span class="tag">VMID <b>${esc(t.id)}</b></span>` : '<span class="muted">—</span>'}</td><td><b>${esc(t.node || t.node_name || "—")}</b></td><td>${isRunning ? `<span class="badge" style="background:rgba(56,189,248,0.1);color:var(--blue);border-color:rgba(56,189,248,0.3)">${ico("statusDot", "sm")} RUNNING</span>` : (isOk ? `<span class="badge running">${ico("check", "sm")} OK</span>` : `<span class="badge stopped">${ico("alert", "sm")} ${esc(t.status || 'Error')}</span>`)}</td><td><span class="small" style="font-family:'Space Grotesk',monospace;color:#ccc">${esc(t.user || "root@pam")}</span></td><td style="font-size:12px;color:#bbb">${t.starttime ? new Date(t.starttime * 1000).toLocaleString() : '—'}</td><td style="font-family:'Space Grotesk',monospace;font-size:12px">${durationStr}</td><td><button class="btn small ghost" style="font-family:'Space Grotesk',monospace;font-size:10px;padding:3px 7px" title="${esc(t.upid)}" onclick="navigator.clipboard.writeText('${esc(t.upid)}');toast('UPID copied to clipboard!')">${ico("clipboard", "sm")} Copy UPID</button></td></tr>`;
  }).join("")}</tbody></table>`;
}

function setupTaskFilterEvents(allTasks) {
  const searchInput = $("#taskSearchInput");
  const chips = $("#taskFilterChips");
  const container = $("#tasksTableContainer");
  const apply = () => {
    const filtered = filterTasks(allTasks);
    if (container) container.innerHTML = renderTasksTable(filtered);
  };
  if (searchInput) {
    searchInput.oninput = () => {
      state.taskSearchQuery = searchInput.value.trim();
      apply();
    };
  }
  if (chips) {
    chips.querySelectorAll("[data-task-filter]").forEach(btn => {
      btn.onclick = () => {
        state.taskFilterType = btn.dataset.taskFilter;
        chips.querySelectorAll("[data-task-filter]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        apply();
      };
    });
  }
}
