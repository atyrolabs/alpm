function initSettingsControllers() {
  const form = $("#settingsForm");
  if (!form) return;

  const inpSiteName = $("#setting_site_name");
  const inpSiteDesc = $("#setting_site_description");
  const inpSiteIcon = $("#setting_site_icon_url");
  const inpSiteFavicon = $("#setting_site_favicon_url");
  const inpOgImage = $("#setting_og_image_url");
  const inpSeoDesc = $("#setting_seo_description");
  const inpSiteBgUrl = $("#setting_site_bg_url");
  const inpSiteBgOpacity = $("#setting_site_bg_opacity");
  const inpSiteBgBlur = $("#setting_site_bg_blur");
  const bgUrlContainer = $("#bgUrlContainer");
  const clearBgBtn = $("#clearBgBtn");
  const testBgBtn = $("#testBgBtn");
  const bgPreviewMedia = $("#bgPreviewMediaWrap");
  const bgPreviewOverlay = $("#bgPreviewOverlay");
  const bgOpacityVal = $("#bgOpacityVal");
  const bgBlurVal = $("#bgBlurVal");
  const bgUrlLabel = $("#bgUrlLabel");
  const bgUrlHelpText = $("#bgUrlHelpText");

  // Character counter helper
  const updateCharCounter = () => {
    const el = $("#seoCharCount");
    if (!el || !inpSeoDesc) return;
    const len = inpSeoDesc.value.length;
    el.textContent = `${len} / 160`;
    if (len >= 120 && len <= 160) {
      el.style.color = "var(--green)";
    } else if (len > 160) {
      el.style.color = "var(--yellow)";
    } else {
      el.style.color = "var(--muted)";
    }
  };
  updateCharCounter();

  // Real-time live synchronization
  const syncLivePreviews = () => {
    const name = inpSiteName?.value?.trim() || "ALPM";
    const desc = inpSiteDesc?.value?.trim() || "High-Performance Cloud & VPS Infrastructure Management";
    const seo = inpSeoDesc?.value?.trim() || desc;
    const icon = inpSiteIcon?.value?.trim() || "";
    const fav = inpSiteFavicon?.value?.trim() || "/favicon.ico";
    const og = inpOgImage?.value?.trim() || "";

    // 1. Sidebar live preview
    const sideNameEl = $("#previewBrandNameText");
    if (sideNameEl) sideNameEl.textContent = name;
    const sideBox = $("#previewSidebarBrand");
    if (sideBox) {
      const initial = (name[0] || "A").toUpperCase();
      if (icon) {
        sideBox.innerHTML = `<img class="brand-logo-img" src="${esc(icon)}" alt="Logo" onerror="this.outerHTML='<span class=\\'brand-mark\\'>${esc(initial)}</span>'"><span>${esc(name)}</span>`;
      } else {
        sideBox.innerHTML = `<span class="brand-mark">${esc(initial)}</span><span>${esc(name)}</span>`;
      }
    }

    // 2. Logo preview row
    const logoThumb = $("#logoThumbBox");
    const logoStatus = $("#logoStatusText");
    const logoUrlPrev = $("#logoUrlPreview");
    if (logoThumb) {
      const initial = (name[0] || "A").toUpperCase();
      if (icon) {
        logoThumb.innerHTML = `<img src="${esc(icon)}" alt="Logo" onerror="this.outerHTML='<span class=\\'brand-mark\\' style=\\'width:32px;height:32px;font-size:14px\\'>${esc(initial)}</span>'">`;
      } else {
        logoThumb.innerHTML = `<span class="brand-mark" style="width:32px;height:32px;font-size:14px">${esc(initial)}</span>`;
      }
    }
    if (logoStatus) logoStatus.textContent = icon ? "Custom Logo Active" : "Default Monogram Active";
    if (logoUrlPrev) logoUrlPrev.textContent = icon ? icon : "Default letter badge is rendered.";

    // 3. Browser tab preview
    const tabFav = $("#mockFaviconImg");
    if (tabFav) tabFav.src = fav;
    const tabTitle = $("#mockTabTitleText");
    if (tabTitle) tabTitle.textContent = `${name} — Cloud & VPS Management Panel`;

    // 4. Social card preview
    const socialTitle = $("#mockSocialTitleText");
    if (socialTitle) socialTitle.textContent = `${name} — Cloud & VPS Management Panel`;
    const socialDesc = $("#mockSocialDescText");
    if (socialDesc) socialDesc.textContent = seo;
    const socialBox = $("#mockSocialBox");
    if (socialBox) {
      if (og) {
        socialBox.innerHTML = `<img src="${esc(og)}" alt="Preview" onerror="this.outerHTML='<div class=\\'social-card-image-placeholder\\'>${ico('alert', 'xl')}<span style=\\'font-weight:600\\'>Image Failed to Load</span></div>'">`;
      } else {
        socialBox.innerHTML = `<div class="social-card-image-placeholder">${ico("image", "xl")}<span style="font-weight:600">No OG Preview Image Set</span><span style="font-size:11px;color:#777">1200 × 630 banner</span></div>`;
      }
    }
  };

  [inpSiteName, inpSiteDesc, inpSiteIcon, inpSiteFavicon, inpOgImage, inpSeoDesc].forEach(inp => {
    if (inp) inp.addEventListener("input", () => {
      updateCharCounter();
      syncLivePreviews();
    });
  });

  // Clear logo button
  const clearLogo = $("#clearLogoBtn");
  if (clearLogo) {
    clearLogo.onclick = () => {
      if (inpSiteIcon) {
        inpSiteIcon.value = "";
        syncLivePreviews();
        clearLogo.remove();
        toast("Custom logo removed. Default monogram active.");
      }
    };
  }

  // Tab switching: URL vs Upload
  $$(".image-mode-tabs").forEach(tabs => {
    const asset = tabs.dataset.asset;
    const btnUrl = tabs.querySelector('[data-mode="url"]');
    const btnUpload = tabs.querySelector('[data-mode="upload"]');
    const panelUrl = $(`#mode_${asset}_url`);
    const panelUpload = $(`#mode_${asset}_upload`);

    if (btnUrl && btnUpload && panelUrl && panelUpload) {
      btnUrl.onclick = () => {
        btnUrl.classList.add("active");
        btnUpload.classList.remove("active");
        panelUrl.style.display = "block";
        panelUpload.style.display = "none";
      };
      btnUpload.onclick = () => {
        btnUpload.classList.add("active");
        btnUrl.classList.remove("active");
        panelUrl.style.display = "none";
        panelUpload.style.display = "block";
      };
    }
  });

  // File Upload Helper
  const handleUpload = async (file, asset) => {
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) {
      toast("Image file is too large. Maximum size is 8MB.", "error");
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => toast("Failed to read image file.", "error");
    reader.onload = async () => {
      const base64Data = reader.result;
      const dropzone = $(`#dropzone_${asset}`);
      const origText = dropzone ? dropzone.innerHTML : "";
      if (dropzone) {
        dropzone.innerHTML = `<div class="dropzone-icon">${ico("spinner", "spin lg")}</div><div class="dropzone-text">Uploading image…</div>`;
      }
      try {
        const res = await api("/admin/settings/upload", {
          method: "POST",
          body: JSON.stringify({ fileData: base64Data, fileName: file.name, assetType: asset })
        });
        toast("Image uploaded successfully!", "success");
        if (asset === "icon" && inpSiteIcon) {
          inpSiteIcon.value = res.url;
        } else if (asset === "favicon" && inpSiteFavicon) {
          inpSiteFavicon.value = res.url;
        } else if (asset === "og" && inpOgImage) {
          inpOgImage.value = res.url;
        }
        syncLivePreviews();
        // Switch back to URL tab to show the path
        const tabBtn = $(`.image-mode-tabs[data-asset="${asset}"] [data-mode="url"]`);
        if (tabBtn) tabBtn.click();
      } catch (err) {
        toast(err.message, "error");
      } finally {
        if (dropzone) dropzone.innerHTML = origText;
      }
    };
    reader.readAsDataURL(file);
  };

  // Wire up dropzones and file inputs
  ["icon", "favicon", "og"].forEach(asset => {
    const dropzone = $(`#dropzone_${asset}`);
    const fileInp = $(`#file_${asset}_input`);

    if (dropzone && fileInp) {
      dropzone.onclick = () => fileInp.click();
      fileInp.onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) handleUpload(file, asset);
      };
      dropzone.ondragover = (e) => {
        e.preventDefault();
        dropzone.classList.add("dragover");
      };
      dropzone.ondragleave = () => dropzone.classList.remove("dragover");
      dropzone.ondrop = (e) => {
        e.preventDefault();
        dropzone.classList.remove("dragover");
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) handleUpload(file, asset);
      };
    }
  });

  // Background Customization Controller
  const syncBgPreview = () => {
    const type = state.settingsCustomBgType || "none";
    const url = inpSiteBgUrl?.value?.trim() || "";
    const opacity = inpSiteBgOpacity ? Number(inpSiteBgOpacity.value) : 55;
    const blur = inpSiteBgBlur ? Number(inpSiteBgBlur.value) : 0;

    if (bgOpacityVal) bgOpacityVal.textContent = `${opacity}%`;
    if (bgBlurVal) bgBlurVal.textContent = `${blur}px`;

    if (bgPreviewOverlay) {
      bgPreviewOverlay.style.backgroundColor = `rgba(10, 10, 10, ${opacity / 100})`;
      bgPreviewOverlay.style.backdropFilter = blur > 0 ? `blur(${blur}px)` : "none";
      bgPreviewOverlay.style.webkitBackdropFilter = blur > 0 ? `blur(${blur}px)` : "none";
    }

    if (!bgPreviewMedia) return;

    if (type === "none" || !url) {
      bgPreviewMedia.innerHTML = "";
      if (clearBgBtn) clearBgBtn.style.display = "none";
      if (bgUrlContainer) bgUrlContainer.style.display = type === "none" ? "none" : "block";
      return;
    }

    if (clearBgBtn) clearBgBtn.style.display = "inline-flex";
    if (bgUrlContainer) bgUrlContainer.style.display = "block";

    if (type === "image") {
      bgPreviewMedia.innerHTML = `<img src="${esc(url)}" class="bg-preview-media" alt="Preview" onerror="console.warn('Preview image load error');">`;
    } else if (type === "video") {
      bgPreviewMedia.innerHTML = `
        <video class="bg-preview-media" autoplay loop muted playsinline preload="auto" referrerpolicy="no-referrer">
          <source src="${esc(url)}" type="video/mp4">
          <source src="${esc(url)}" type="video/webm">
        </video>
      `;
      const pVid = bgPreviewMedia.querySelector("video");
      if (pVid) {
        pVid.muted = true;
        pVid.defaultMuted = true;
        pVid.volume = 0;
        pVid.play().catch(() => {});
      }
    }
  };
  syncBgPreview();

  // Background Mode Selector Tabs
  $$("#bgTypeSelector .bg-type-btn").forEach(btn => {
    btn.onclick = () => {
      $$("#bgTypeSelector .bg-type-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const mode = btn.dataset.bg;
      state.settingsCustomBgType = mode;

      if (mode === "none") {
        if (bgUrlContainer) bgUrlContainer.style.display = "none";
        if (clearBgBtn) clearBgBtn.style.display = "none";
      } else {
        if (bgUrlContainer) bgUrlContainer.style.display = "block";
        if (inpSiteBgUrl && inpSiteBgUrl.value.trim()) {
          if (clearBgBtn) clearBgBtn.style.display = "inline-flex";
        }
        if (mode === "video") {
          if (bgUrlLabel) bgUrlLabel.textContent = "Video Media URL (Direct MP4 / WebM)";
          if (inpSiteBgUrl) inpSiteBgUrl.placeholder = "https://example.com/ambient-loop.mp4";
          if (bgUrlHelpText) bgUrlHelpText.textContent = "Direct URL to a looping video stream (MP4, WebM). Video is automatically muted and plays smoothly in the background.";
        } else {
          if (bgUrlLabel) bgUrlLabel.textContent = "Image Media URL (Direct JPG / PNG / WebP)";
          if (inpSiteBgUrl) inpSiteBgUrl.placeholder = "https://images.unsplash.com/.../wallpaper.jpg";
          if (bgUrlHelpText) bgUrlHelpText.textContent = "Direct high-resolution wallpaper link. Crisp dark or deep-toned wallpapers look best.";
        }
      }
      syncBgPreview();
    };
  });

  // URL Input listener with smart type auto-detection
  if (inpSiteBgUrl) {
    inpSiteBgUrl.addEventListener("input", () => {
      const v = inpSiteBgUrl.value.trim().toLowerCase();
      if (v.includes(".mp4") || v.includes(".webm") || v.includes(".mov")) {
        if (state.settingsCustomBgType !== "video") {
          state.settingsCustomBgType = "video";
          $$("#bgTypeSelector .bg-type-btn").forEach(b => b.classList.toggle("active", b.dataset.bg === "video"));
          if (bgUrlLabel) bgUrlLabel.textContent = "Video Media URL (Direct MP4 / WebM)";
          if (bgUrlHelpText) bgUrlHelpText.textContent = "Direct URL to a looping video stream (MP4, WebM). Video is automatically muted and plays smoothly in the background.";
        }
      } else if (v.includes(".jpg") || v.includes(".png") || v.includes(".webp") || v.includes(".jpeg") || v.includes(".gif")) {
        if (state.settingsCustomBgType !== "image") {
          state.settingsCustomBgType = "image";
          $$("#bgTypeSelector .bg-type-btn").forEach(b => b.classList.toggle("active", b.dataset.bg === "image"));
          if (bgUrlLabel) bgUrlLabel.textContent = "Image Media URL (Direct JPG / PNG / WebP)";
          if (bgUrlHelpText) bgUrlHelpText.textContent = "Direct high-resolution wallpaper link. Crisp dark or deep-toned wallpapers look best.";
        }
      }
      syncBgPreview();
    });
  }

  // Sliders listeners
  if (inpSiteBgOpacity) {
    inpSiteBgOpacity.addEventListener("input", () => {
      syncBgPreview();
      const currentBg = $("#siteBgOverlay");
      if (currentBg) currentBg.style.backgroundColor = `rgba(10, 10, 10, ${inpSiteBgOpacity.value / 100})`;
    });
  }
  if (inpSiteBgBlur) {
    inpSiteBgBlur.addEventListener("input", () => {
      syncBgPreview();
      const currentBg = $("#siteBgOverlay");
      if (currentBg) {
        currentBg.style.backdropFilter = inpSiteBgBlur.value > 0 ? `blur(${inpSiteBgBlur.value}px)` : "none";
        currentBg.style.webkitBackdropFilter = inpSiteBgBlur.value > 0 ? `blur(${inpSiteBgBlur.value}px)` : "none";
      }
    });
  }

  // Presets
  $$("#bgPresetsWrap .preset-bg-chip").forEach(chip => {
    chip.onclick = () => {
      const type = chip.dataset.type;
      const url = chip.dataset.url;
      state.settingsCustomBgType = type;
      $$("#bgTypeSelector .bg-type-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.bg === type);
      });
      if (inpSiteBgUrl) inpSiteBgUrl.value = url;
      if (bgUrlContainer) bgUrlContainer.style.display = "block";
      if (clearBgBtn) clearBgBtn.style.display = "inline-flex";
      syncBgPreview();
      applySiteBackground(type, url, inpSiteBgOpacity?.value || 55, inpSiteBgBlur?.value || 0);
      toast(`Applied preset "${chip.textContent.trim()}" in live preview! Click "Save Changes" to keep.`, "info");
    };
  });

  // Test Live Button
  if (testBgBtn) {
    testBgBtn.onclick = () => {
      const type = state.settingsCustomBgType || "none";
      const url = inpSiteBgUrl?.value?.trim() || "";
      const opacity = inpSiteBgOpacity?.value || 55;
      const blur = inpSiteBgBlur?.value || 0;
      applySiteBackground(type, url, opacity, blur);
      if (type === "none" || !url) {
        toast("Restored default solid dark background.", "info");
      } else {
        toast("Live background preview applied to panel! Click 'Save Changes' to permanently save.", "success");
      }
    };
  }

  // Clear Wallpaper Button
  if (clearBgBtn) {
    clearBgBtn.onclick = () => {
      state.settingsCustomBgType = "none";
      if (inpSiteBgUrl) inpSiteBgUrl.value = "";
      $$("#bgTypeSelector .bg-type-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.bg === "none");
      });
      syncBgPreview();
      applySiteBackground("none", "", 55, 0);
      toast("Custom background removed. Restored default theme.", "info");
    };
  }

  // Save Settings Button
  const saveBtn = $("#saveSettingsBtn");
  if (saveBtn) {
    saveBtn.onclick = async () => {
      saveBtn.disabled = true;
      const origHtml = saveBtn.innerHTML;
      saveBtn.innerHTML = `${ico("spinner", "spin sm")} Saving…`;

      const payload = {
        site_name: inpSiteName?.value?.trim() || "ALPM",
        site_description: inpSiteDesc?.value?.trim() || "",
        site_icon_url: inpSiteIcon?.value?.trim() || "",
        site_favicon_url: inpSiteFavicon?.value?.trim() || "/favicon.ico",
        og_image_url: inpOgImage?.value?.trim() || "",
        seo_description: inpSeoDesc?.value?.trim() || "",
        site_bg_type: state.settingsCustomBgType || "none",
        site_bg_url: inpSiteBgUrl?.value?.trim() || "",
        site_bg_opacity: inpSiteBgOpacity?.value || "55",
        site_bg_blur: inpSiteBgBlur?.value || "0"
      };

      try {
        const res = await api("/admin/settings", {
          method: "PATCH",
          body: JSON.stringify(payload)
        });
        state.settings = res.settings;
        applySiteSettings(res.settings);
        toast("Platform settings saved and applied successfully!", "success");
      } catch (err) {
        toast(err.message, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = origHtml;
      }
    };
  }

  // Reset to Defaults Button
  const resetBtn = $("#resetSettingsBtn");
  if (resetBtn) {
    resetBtn.onclick = async () => {
      const ok = await modalConfirm({
        title: "Reset Platform Settings",
        message: "Are you sure you want to restore all branding, logos, background, and SEO metadata to default factory values?",
        confirmText: "Reset to Factory Defaults",
        type: "warning"
      });
      if (!ok) return;

      const defaults = {
        site_name: "ALPM",
        site_description: "High-Performance Cloud & VPS Infrastructure Management",
        site_icon_url: "",
        site_favicon_url: "/favicon.ico",
        og_image_url: "",
        seo_description: "High-Performance Cloud & VPS Infrastructure Management",
        site_bg_type: "none",
        site_bg_url: "",
        site_bg_opacity: "55",
        site_bg_blur: "0"
      };

      try {
        const res = await api("/admin/settings", {
          method: "PATCH",
          body: JSON.stringify(defaults)
        });
        state.settings = res.settings;
        applySiteSettings(res.settings);
        toast("Settings reset to defaults successfully", "success");
        await settingsPage($("#content"));
      } catch (err) {
        toast(err.message, "error");
      }
    };
  }
}

// ==========================================
// SOCKET.IO REAL-TIME LIVE DATA & METRICS
// ==========================================

let liveSocket = null;
function initSocketConnection() {
  if (typeof io === "undefined") {
    console.warn("Socket.io client script not loaded.");
    return;
  }
  if (liveSocket && liveSocket.connected) return;

  try {
    liveSocket = io({
      transports: ["websocket", "polling"],
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000,
      timeout: 10000
    });

    liveSocket.on("connect", () => {
      setLivePillStatus("live");
      if (state.user && state.user.id) {
        liveSocket.emit("auth:sync", state.user);
      }
      if (state.page === "vps" && state.currentServerId) {
        liveSocket.emit("subscribe_vps", { id: state.currentServerId });
      }
    });

    liveSocket.on("disconnect", () => {
      setLivePillStatus("offline");
    });

    liveSocket.on("reconnect_attempt", () => {
      setLivePillStatus("reconnecting");
    });

    liveSocket.on("vps:batch_stats", (batch) => {
      onLiveBatchStats(batch);
    });

    liveSocket.on("vps:stats", (stats) => {
      onLiveSingleStats(stats);
    });

    liveSocket.on("cluster:summary", (summary) => {
      onLiveClusterSummary(summary);
    });

    liveSocket.on("tasks:update", (data) => {
      if (state.page === "tasks" && data && data.tasks) {
        renderLiveTasksTable(data.tasks);
      }
    });

    liveSocket.on("vps:status_changed", (data) => {
      if (data && data.serverId) {
        const pill = $(`#server-status-${data.serverId}`);
        if (pill) {
          pill.innerHTML = `<i class="dot running"></i><span style="color:var(--accent);font-weight:600">Updating…</span>`;
        }
      }
    });

    liveSocket.on("vps:list_changed", async () => {
      try {
        const d = await api("/dashboard");
        state.servers = d.servers;
        if (state.page === "servers") {
          const container = $("#serverCardsContainer");
          if (container) container.innerHTML = serverCards(filterServers(d.servers));
          updateVpsFilterCounts(d.servers);
        } else if (state.page === "overview") {
          await renderPage();
        }
      } catch {}
    });

    liveSocket.on("settings:updated", (data) => {
      if (data && data.settings) {
        applySiteSettings(data.settings);
        if (state.page === "settings") {
          toast("Platform settings updated live", "success");
        }
      }
    });
  } catch (err) {
    console.error("Socket.io init failed:", err);
  }
}

function setLivePillStatus(status) {
  const pill = $("#livePill");
  if (!pill) return;
  pill.classList.remove("offline", "reconnecting");
  const textEl = pill.querySelector(".live-text");
  if (status === "live") {
    if (textEl) textEl.textContent = "LIVE";
    pill.title = "Real-time WebSocket connection active";
  } else if (status === "reconnecting") {
    pill.classList.add("reconnecting");
    if (textEl) textEl.textContent = "SYNCING";
    pill.title = "Reconnecting to live data stream…";
  } else {
    pill.classList.add("offline");
    if (textEl) textEl.textContent = "OFFLINE";
    pill.title = "Disconnected from live server";
  }
}

function updateVpsFilterCounts(servers) {
  const chips = $("#vpsFilterChips");
  if (!chips || !Array.isArray(servers)) return;
  const total = servers.length;
  const running = servers.filter(s => s.status === "running").length;
  const stopped = servers.filter(s => s.status === "stopped").length;
  const qemu = servers.filter(s => s.type === "qemu").length;
  const lxc = servers.filter(s => s.type === "lxc").length;

  const bAll = chips.querySelector('[data-vps-filter="all"]');
  if (bAll) bAll.textContent = `All (${total})`;
  const bRun = chips.querySelector('[data-vps-filter="running"]');
  if (bRun) bRun.innerHTML = `${ico("statusDot", "sm", "color:var(--green)")} Running (${running})`;
  const bStop = chips.querySelector('[data-vps-filter="stopped"]');
  if (bStop) bStop.innerHTML = `${ico("statusDot", "sm", "color:var(--red)")} Stopped (${stopped})`;
  const bKvm = chips.querySelector('[data-vps-filter="qemu"]');
  if (bKvm) bKvm.innerHTML = `${ico("kvm", "sm")} KVM (${qemu})`;
  const bLxc = chips.querySelector('[data-vps-filter="lxc"]');
  if (bLxc) bLxc.innerHTML = `${ico("lxc", "sm")} LXC (${lxc})`;
}

function onLiveBatchStats(batch) {
  if (!Array.isArray(batch)) return;

  // 1. Sync in-memory state.servers
  if (!state.servers) state.servers = [];
  for (const st of batch) {
    const existing = state.servers.find(x => x.id === st.id);
    if (existing) {
      existing.status = st.status;
      existing.uptime = st.uptime;
      existing.cpu = st.cpu;
      existing.mem = st.mem;
      existing.maxmem = st.maxmem;
    }
  }

  // 2. Update each server card in DOM
  for (const st of batch) {
    const isRunning = st.status === "running";
    const isStopped = st.status === "stopped";
    const dotClass = isRunning ? "running" : (isStopped ? "stopped" : "");
    const statusText = isRunning ? "Running" : (isStopped ? "Stopped" : (st.status && st.status !== "unknown" ? esc(st.status) : "Checking…"));
    const statusColor = isRunning ? "var(--green)" : (isStopped ? "var(--red)" : "var(--muted)");

    const pill = $(`#server-status-${st.id}`);
    if (pill) {
      pill.innerHTML = `<i class="dot ${dotClass}"></i><span style="color:${statusColor};font-weight:600;text-transform:capitalize">${statusText}</span>`;
    }

    const card = pill ? pill.closest(".server-card") : $(`#server-card-${st.id}`);
    if (card) {
      const meta = card.querySelector(".server-meta") || $(`#server-meta-${st.id}`);
      if (meta) {
        let uptimeEl = meta.querySelector(".uptime-tag");
        if (isRunning && st.uptime) {
          const upStr = `${ico("clock", "sm")} Up ${formatUptime(st.uptime)}`;
          if (uptimeEl) {
            uptimeEl.innerHTML = upStr;
          } else {
            const span = document.createElement("span");
            span.className = "tag uptime-tag";
            span.style.cssText = "color:var(--green);border-color:rgba(34,197,94,0.3)";
            span.innerHTML = upStr;
            meta.appendChild(span);
          }
        } else if (uptimeEl) {
          uptimeEl.remove();
        }
      }

      const actions = card.querySelector(".actions") || $(`#card-actions-${st.id}`);
      if (actions) {
        const startBtn = actions.querySelector('[data-power="start"]');
        const stopBtn = actions.querySelector('[data-power="stop"]');
        if (isRunning && startBtn) {
          startBtn.outerHTML = `<button class="btn small danger" data-action="power" data-id="${st.id}" data-power="stop">${ico("stop")} Stop</button><button class="btn small" data-action="power" data-id="${st.id}" data-power="reboot">${ico("refresh")} Reboot</button>`;
        } else if (isStopped && stopBtn) {
          const rebootBtn = actions.querySelector('[data-power="reboot"]');
          if (rebootBtn) rebootBtn.remove();
          stopBtn.outerHTML = `<button class="btn small success" data-action="power" data-id="${st.id}" data-power="start">${ico("play")} Start</button>`;
        }
      }
    }
  }

  // 3. Update filter chip counts on servers page
  updateVpsFilterCounts(state.servers);
}

function onLiveSingleStats(stats) {
  if (state.page !== "vps" || Number(state.currentServerId) !== Number(stats.id)) return;

  const isRunning = stats.status === "running";
  const isStopped = stats.status === "stopped";
  const statusText = isRunning ? "Running" : (isStopped ? "Stopped" : (stats.status || "Unknown"));

  // 1. Header Title Badge
  const titleStatus = $("#vpsTitleStatus");
  if (titleStatus) {
    titleStatus.className = `badge ${isRunning ? 'running' : 'stopped'}`;
    titleStatus.innerHTML = `${ico("statusDot", "sm")} ${statusText}`;
  }

  // 2. Header Uptime Badge
  const uptimeBadge = $("#vpsLiveUptime");
  if (uptimeBadge) {
    uptimeBadge.innerHTML = `${ico("clock", "sm")} Up ${formatUptime(stats.uptime)}`;
  }

  // 3. Header Action Buttons (morph Start vs Stop/Shutdown/Reboot/Reset)
  const headerActions = $("#vpsHeaderActions");
  if (headerActions) {
    const startBtn = headerActions.querySelector('[data-power="start"]');
    const stopBtn = headerActions.querySelector('[data-power="stop"]');
    if (isRunning && startBtn) {
      startBtn.outerHTML = `<button class="btn danger" data-action="power" data-id="${stats.id}" data-power="stop">${ico("stop")} Stop</button><button class="btn" data-action="power" data-id="${stats.id}" data-power="shutdown">${ico("pause")} Shutdown</button><button class="btn" data-action="power" data-id="${stats.id}" data-power="reboot">${ico("refresh")} Reboot</button><button class="btn danger" data-action="power" data-id="${stats.id}" data-power="reset">${ico("zap")} Reset</button>`;
    } else if (isStopped && stopBtn) {
      ["shutdown", "reboot", "reset"].forEach(p => {
        const b = headerActions.querySelector(`[data-power="${p}"]`);
        if (b) b.remove();
      });
      stopBtn.outerHTML = `<button class="btn success" data-action="power" data-id="${stats.id}" data-power="start">${ico("play")} Start VPS</button>`;
    }
  }

  // 4. Metric Cards
  const cpuVal = $("#metricCpuVal");
  const cpuTop = $("#metricCpuTop");
  const cpuBar = $("#metricCpuBar");
  if (cpuVal) cpuVal.textContent = `${stats.cpuPct}%`;
  if (cpuTop) {
    cpuTop.textContent = `${stats.cpuPct}%`;
    cpuTop.style.color = parseFloat(stats.cpuPct) > 80 ? "var(--red)" : "var(--accent)";
  }
  if (cpuBar) cpuBar.style.width = `${Math.min(100, Math.max(1, parseFloat(stats.cpuPct)))}%`;

  const ramVal = $("#metricRamVal");
  const ramTop = $("#metricRamTop");
  const ramSub = $("#metricRamSub");
  const ramBar = $("#metricRamBar");
  if (ramVal) ramVal.textContent = formatBytes(stats.mem);
  if (ramTop) ramTop.textContent = `${stats.memPct}%`;
  if (ramSub) ramSub.textContent = `of ${formatBytes(stats.maxmem)} (${formatBytes(stats.freemem)} free)`;
  if (ramBar) ramBar.style.width = `${Math.min(100, Math.max(1, parseFloat(stats.memPct)))}%`;

  const diskVal = $("#metricDiskVal");
  const diskSub = $("#metricDiskSub");
  if (diskVal) diskVal.textContent = formatBytes((stats.diskread || 0) + (stats.diskwrite || 0));
  if (diskSub) diskSub.textContent = `Read: ${formatBytes(stats.diskread || 0)} · Write: ${formatBytes(stats.diskwrite || 0)}`;

  const netVal = $("#metricNetVal");
  const netSub = $("#metricNetSub");
  if (netVal) netVal.textContent = formatBytes((stats.netin || 0) + (stats.netout || 0));
  if (netSub) netSub.textContent = `RX: ${formatBytes(stats.netin || 0)} · TX: ${formatBytes(stats.netout || 0)}`;

  // 5. Hardware Specs Tab Rows
  if (state.vpsTab === "specs") {
    $$("#vpsTabContent .spec-row").forEach(row => {
      const k = row.querySelector(".k")?.textContent?.trim();
      const v = row.querySelector(".v");
      if (!k || !v) return;
      if (k === "Currently Used RAM") v.textContent = formatBytes(stats.mem);
      if (k === "Free / Available RAM") v.textContent = formatBytes(stats.freemem);
      if (k === "Total Provisioned Disk" && stats.diskMax) v.textContent = formatBytes(stats.diskMax);
      if (k === "Total Disk Read") v.textContent = formatBytes(stats.diskread || 0);
      if (k === "Total Disk Written") v.textContent = formatBytes(stats.diskwrite || 0);
      if (k === "Total Received (RX)") v.textContent = formatBytes(stats.netin || 0);
      if (k === "Total Transmitted (TX)") v.textContent = formatBytes(stats.netout || 0);
    });
  }
}

function onLiveClusterSummary(summary) {
  if (!summary) return;
  const tVps = $("#dashTotalVps");
  if (tVps && summary.total != null) tVps.textContent = summary.total;
  const kVps = $("#dashKvmVps");
  if (kVps && summary.qemu != null) kVps.textContent = summary.qemu;
  const lVps = $("#dashLxcVps");
  if (lVps && summary.lxc != null) lVps.textContent = summary.lxc;
}

function renderLiveTasksTable(tasks) {
  if (state.page !== "tasks") return;
  window._atyroTasks = tasks;
  const filtered = filterTasks(tasks);
  const container = $("#tasksTableContainer");
  if (container) {
    container.innerHTML = renderTasksTable(filtered);
  }
}

async function boot() {
  try {
    const s = await fetch("/api/settings").then(r => r.json()).catch(() => null);
    if (s && s.settings) {
      applySiteSettings(s.settings);
    }
  } catch {}
  try {
    const d = await api("/auth/me");
    state.user = d.user;
    state.csrf = d.csrfToken;
    await loadDashboard();
    initSocketConnection();
  } catch {
    try {
      const st = await fetch("/api/setup/status").then(r => r.json()).catch(() => ({ needSetup: false }));
      if (st && st.needSetup) {
        renderSetup();
        return;
      }
    } catch {}
    renderLogin();
  }
}
boot();
</script>
</body>
</html>
